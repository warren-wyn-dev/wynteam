name: Food -- apply WYN-218 order options, order limit and slip guard

# Applies supabase/migrations_wynos_food_order_options_v1.sql (WYN-218):
# food_quote_order / food_create_order price menu options from the menu and
# save server-resolved option names (add-ons were free and forgeable), one
# buyer can place at most 5 orders per 10 minutes and keep 3 orders waiting
# per store, and food_submit_payment refuses a slip once the store marked the
# payment paid or refunded. Manual dispatch on main only, after the Founder
# approves production. Behaviour test:
# supabase/tests/wynos_food_order_options_test.sh.
#
# SAFETY: replaces three RPCs with the same signatures and adds one internal
# helper. No table or data changes.
# ROLLBACK (Founder, SQL editor): re-run food_quote_order / food_create_order
# from migrations_wynos_food_delivery_zone_v1.sql and food_submit_payment from
# migrations_wynos_merchant_payment_core_v1.sql, then
# drop function internal.food_resolve_menu_options(jsonb, jsonb).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WYN-218 to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-WYN-218'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_food_order_options_v1.sql)
          commit;" >/dev/null
          # Definitions, privileges and counts only; no personal data is read.
          run_sql "select
              (pg_get_functiondef('public.food_create_order(uuid,text,text,text,text,jsonb,double precision,double precision)'::regprocedure) like '%food_resolve_menu_options%') as create_resolves_options,
              (pg_get_functiondef('public.food_quote_order(uuid,jsonb,double precision,double precision)'::regprocedure) like '%food_resolve_menu_options%') as quote_resolves_options,
              (pg_get_functiondef('public.food_create_order(uuid,text,text,text,text,jsonb,double precision,double precision)'::regprocedure) like '%too many orders%') as create_rate_limited,
              (pg_get_functiondef('public.food_submit_payment(uuid,text)'::regprocedure) like '%payment already submitted%') as slip_guarded,
              has_function_privilege('anon', 'public.food_create_order(uuid,text,text,text,text,jsonb,double precision,double precision)', 'execute') as anon_can_order,
              has_function_privilege('anon', 'public.food_submit_payment(uuid,text)', 'execute') as anon_can_submit,
              has_function_privilege('authenticated', 'internal.food_resolve_menu_options(jsonb,jsonb)', 'execute') as resolver_exposed,
              (select count(*) from public.food_menu_items where jsonb_array_length(options) > 0) as menu_items_with_options;" \
            | tee result.json | jq .
          jq -e '.[0].create_resolves_options == true and .[0].quote_resolves_options == true
                 and .[0].create_rate_limited == true and .[0].slip_guarded == true
                 and .[0].anon_can_order == false and .[0].anon_can_submit == false
                 and .[0].resolver_exposed == false' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "WYN-218 order options, order limit and slip guard are installed."
