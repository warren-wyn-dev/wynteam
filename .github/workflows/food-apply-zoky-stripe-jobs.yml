name: Food -- apply ZOKY Stripe jobs (auto refund / Stripe-only)

# Applies ONE of these migrations per run, in one transaction, then verifies:
#   jobs     supabase/migrations/20261023100000_food_stripe_jobs_auto_refund.sql
#            Stripe job queue, auto-refund triggers, worker RPCs, Vault cron key,
#            merchant retry, public boolean RPCs. Stripe-only policy stays OFF.
#   cron     supabase/migrations/20261023100100_food_stripe_jobs_enable_cron.sql
#            Runs food-stripe-refund-worker every minute.
#   activate supabase/migrations/20261023100200_food_stripe_only_activate.sql
#            Stripe-only cut-over (D11: immediate).
# Design: .wyn/docs/architecture/zoky-stripe-only-auto-refund-design.md (section 6).
# Founder approval 2026-10-22 covers implementation only: every step here
# (jobs, cron, activate) needs its own Founder approval and the GitHub
# `production` environment review. Order: deploy food-stripe-refund-worker
# (deploy-edge-functions.yml) -> jobs -> cron -> EDGE/PHASE (ZOKY exception
# workflow) -> activate.
# Test: supabase/tests/food_stripe_auto_refund_test.sh
#
# ROLLBACK: apply supabase/rollbacks/<same file name>_rollback.sql
# (jobs: unschedule cron, policy NULL, drop the 3 triggers; tables kept).
on:
  workflow_dispatch:
    inputs:
      migration:
        description: 'Which step to apply (one per run, in order)'
        required: true
        type: choice
        options: [jobs, cron, activate]
      confirm:
        description: 'Type APPLY-ZOKY-STRIPE-JOBS to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-ZOKY-STRIPE-JOBS'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      STEP: ${{ github.event.inputs.migration }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"
            exit 1
          fi
          case "$STEP" in
            jobs) FILE=20261023100000_food_stripe_jobs_auto_refund.sql ;;
            cron) FILE=20261023100100_food_stripe_jobs_enable_cron.sql ;;
            activate) FILE=20261023100200_food_stripe_only_activate.sql ;;
            *) echo "::error::unknown step"; exit 1 ;;
          esac
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2
              cat "$out" >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          # Preconditions: definitions, extensions and counts only; no personal
          # or financial rows and no secret values are read.
          case "$STEP" in
            jobs)
              run_sql "select
                  (to_regclass('public.food_stripe_payments') is not null
                   and to_regclass('public.food_stripe_accounts') is not null
                   and to_regclass('public.merchant_notifications') is not null
                   and to_regclass('vault.decrypted_secrets') is not null
                   and to_regprocedure('public.merchant_has_store_role(uuid,text[])') is not null
                   and exists (select 1 from information_schema.columns where table_schema='public'
                               and table_name='food_stripe_payments' and column_name='application_fee_satang')
                   and exists (select 1 from information_schema.columns where table_schema='public'
                               and table_name='food_stripe_payments' and column_name='livemode')) as ok;" | tee pre.json | jq .
              jq -e '.[0].ok == true' pre.json >/dev/null \
                || { echo "::error::Stripe payment core / GP v1 / Connect v2 / Vault prerequisites missing"; exit 1; } ;;
            cron)
              run_sql "select
                  (to_regprocedure('internal.food_refund_worker_tick()') is not null
                   and exists (select 1 from pg_extension where extname='pg_cron')
                   and exists (select 1 from pg_extension where extname='pg_net')
                   and exists (select 1 from vault.secrets where name='wynos_project_url')
                   and exists (select 1 from vault.secrets where name='wynos_food_refund_worker_cron_key')) as ok;" | tee pre.json | jq .
              jq -e '.[0].ok == true' pre.json >/dev/null \
                || { echo "::error::Apply the jobs step first (and check pg_cron / pg_net / Vault project URL)"; exit 1; } ;;
            activate)
              run_sql "select
                  (select count(*) from pg_trigger where tgrelid='public.food_orders'::regclass and not tgisinternal
                     and tgname in ('food_orders_payment_guard','food_orders_payment_jobs','food_orders_require_stripe_ready')) = 3
                  and exists (select 1 from cron.job where jobname='wynos-food-stripe-refund-worker' and active) as ok,
                  (select count(*) from public.food_stores where is_published) as published_stores,
                  (select count(*) from public.food_stores s join public.food_stripe_accounts a on a.store_id=s.id
                     where s.is_published and s.stripe_payments_enabled and a.status='ready'
                       and a.details_submitted and a.charges_enabled) as stripe_ready_stores;" | tee pre.json | jq .
              jq -e '.[0].ok == true' pre.json >/dev/null \
                || { echo "::error::Apply the jobs and cron steps first"; exit 1; }
              echo "Published stores without a ready Stripe account stop taking orders at cut-over (D11)." ;;
          esac

          run_sql "begin;
          $(cat "supabase/migrations/$FILE")
          commit;" >/dev/null

          case "$STEP" in
            jobs)
              run_sql "select
                  (select count(*) from pg_class where oid in ('public.food_stripe_jobs'::regclass,'public.food_payment_policy'::regclass) and relrowsecurity) as rls_tables,
                  has_table_privilege('authenticated','public.food_stripe_jobs','select') as members_read_jobs,
                  has_table_privilege('anon','public.food_payment_policy','select') as anon_read_policy,
                  (select count(*) from pg_trigger where tgrelid='public.food_orders'::regclass and not tgisinternal
                     and tgname in ('food_orders_payment_guard','food_orders_payment_jobs','food_orders_require_stripe_ready')) as triggers,
                  has_function_privilege('authenticated','public.food_claim_stripe_jobs(integer)','execute') as members_claim,
                  has_function_privilege('authenticated','public.food_complete_stripe_job(uuid,text,text,text,boolean)','execute') as members_complete,
                  has_function_privilege('service_role','public.food_claim_stripe_jobs(integer)','execute') as service_claim,
                  has_function_privilege('anon','public.merchant_retry_stripe_refund(uuid)','execute') as anon_retry,
                  has_function_privilege('anon','public.food_store_payment_options(uuid[])','execute') as anon_options,
                  (select count(*) from vault.secrets where name='wynos_food_refund_worker_cron_key') as cron_keys,
                  (select stripe_only_from is null from public.food_payment_policy) as policy_off,
                  public.food_payment_policy_public() as policy_public;" | tee result.json | jq .
              jq -e '.[0].rls_tables == 2 and .[0].members_read_jobs == false and .[0].anon_read_policy == false
                     and .[0].triggers == 3 and .[0].members_claim == false and .[0].members_complete == false
                     and .[0].service_claim == true and .[0].anon_retry == false and .[0].anon_options == true
                     and .[0].cron_keys == 1 and .[0].policy_off == true and .[0].policy_public == false' result.json >/dev/null \
                || { echo "::error::Verification failed"; exit 1; } ;;
            cron)
              run_sql "select count(*) as jobs from cron.job
                  where jobname='wynos-food-stripe-refund-worker' and active and schedule='* * * * *'
                    and command like '%internal.food_refund_worker_tick()%';" | tee result.json | jq .
              jq -e '.[0].jobs == 1' result.json >/dev/null || { echo "::error::Verification failed"; exit 1; } ;;
            activate)
              run_sql "select
                  (select stripe_only_from is not null and stripe_only_from <= now() from public.food_payment_policy) as active,
                  public.food_payment_policy_public() as policy_public;" | tee result.json | jq .
              jq -e '.[0].active == true and .[0].policy_public == true' result.json >/dev/null \
                || { echo "::error::Verification failed"; exit 1; } ;;
          esac
          echo "ZOKY Stripe jobs step '$STEP' applied and verified."
