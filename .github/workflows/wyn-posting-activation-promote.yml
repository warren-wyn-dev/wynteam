name: WYN Posting Activation Promote

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wyn-posting-activation-promote.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Promote verified preview to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: https://web-8i8d08apv-warren14.vercel.app
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          npx --yes vercel@latest promote "$DEPLOYMENT_URL" --yes --token="$VERCEL_TOKEN"

      - name: Verify posting activation production build
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if curl --silent --show-error --fail --location --max-time 20               --header 'Cache-Control: no-cache'               "https://wynos.online/?_wyn_posting_activation=${GITHUB_RUN_ID}-${attempt}"               | grep -q '/_next/'; then
              break
            fi
            test "$attempt" -lt 24 || exit 1
            sleep 5
          done

          curl --fail --location --retry 5 --retry-delay 2 --max-time 30             --output /dev/null https://wynos.online/
          curl --fail --location --retry 5 --retry-delay 2 --max-time 30             --output /dev/null https://wynos.online/settings

          curl --silent --show-error --fail --location --retry 5 --max-time 30             --output /tmp/wynos-sw.js https://wynos.online/sw.js
          grep -q 'posting_prompt' /tmp/wynos-sw.js
          grep -q 'followed_post_digest' /tmp/wynos-sw.js

          curl --silent --show-error --fail --location --retry 3 --max-time 30             --output /tmp/wynos-push-config.json https://wynos.online/api/push-config
          node -e 'const c=require("/tmp/wynos-push-config.json"); process.exit(c.configured===true?0:1)'
