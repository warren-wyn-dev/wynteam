name: Normalize post activity diff once

on:
  push:
    branches: [feat/post-activity-people]
    paths:
      - .github/workflows/normalize-post-activity-diff-once.yml

permissions:
  contents: write

jobs:
  normalize-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/post-activity-people
          fetch-depth: 0

      - name: Reset touched files to main and reapply focused patch
        run: |
          git fetch origin main
          git checkout origin/main -- \
            app/lib/features/drop/data/drop_repository.dart \
            app/lib/features/drop/presentation/drop_detail_screen.dart \
            app/test/drop_detail_screen_test.dart \
            app/test/support/recording_drop_repository.dart \
            app/test/support/recording_profile_repository.dart
          git show 8e9bfa2c2598a7c6e16b61dc265bdce1a54f2dee:tools/apply_post_activity_people.py > /tmp/apply_post_activity_people.py
          git show 8e9bfa2c2598a7c6e16b61dc265bdce1a54f2dee:tools/fix_post_activity_view_tests.py > /tmp/fix_post_activity_view_tests.py
          python3 /tmp/apply_post_activity_people.py
          python3 /tmp/fix_post_activity_view_tests.py
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'app/lib/features/drop/data/drop_repository.dart',
              'app/lib/features/drop/presentation/drop_detail_screen.dart',
              'app/test/drop_detail_screen_test.dart',
              'app/test/support/recording_drop_repository.dart',
              'app/test/support/recording_profile_repository.dart',
          ]:
              path = Path(name)
              path.write_text(path.read_text().rstrip() + '\n')
          PY
          git diff --check
          git diff --stat origin/main

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Drop detail regression tests
        working-directory: app
        run: flutter test test/drop_detail_screen_test.dart

      - name: Commit focused diff
        run: |
          rm -f .github/workflows/normalize-post-activity-diff-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(drop): keep post activity diff focused"
          git push origin feat/post-activity-people
