name: Debug profile-language UI tests once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debug-profile-language-ui-tests-once.yml

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Profile-language UI refresh
        run: python3 tools/apply_profile_language_system_ui_v2.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Format refreshed surfaces
        run: |
          dart format \
            app/lib/features/home/presentation/home_feed_screen.dart \
            app/lib/features/search/presentation/search_screen.dart \
            app/lib/features/notification/presentation/notification_list_screen.dart \
            app/lib/features/settings/presentation/settings_screen.dart \
            app/lib/features/root/presentation/side_menu.dart

      - name: Capture focused test output
        run: |
          LOG=/tmp/profile-ui-tests.log
          : > "$LOG"
          cd app
          for testfile in \
            test/home_feed_screen_test.dart \
            test/search_screen_test.dart \
            test/notification_list_screen_test.dart \
            test/settings_screen_test.dart \
            test/root_shell_test.dart \
            test/side_menu_test.dart \
            test/create_drop_screen_test.dart; do
            if [ -f "$testfile" ]; then
              echo "===== $testfile =====" | tee -a "$LOG"
              set +e
              flutter test "$testfile" -r expanded >> "$LOG" 2>&1
              STATUS=$?
              set -e
              echo "EXIT_STATUS=$STATUS" | tee -a "$LOG"
              echo "" >> "$LOG"
            else
              echo "===== $testfile (missing) =====" | tee -a "$LOG"
              echo "" >> "$LOG"
            fi
          done
          cd ..
          cp "$LOG" debug_profile_ui_tests.log

      - name: Commit captured log only
        run: |
          git checkout -- app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug_profile_ui_tests.log
          git commit -m "chore: capture profile UI regression output"
          git push origin HEAD:main
