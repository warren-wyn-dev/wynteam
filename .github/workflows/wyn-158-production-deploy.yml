name: WYN-158 Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/wyn-158-production-deploy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production preflight
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # Reuse existing PUBLIC Firebase Web config already used by the
          # original Flutter Web deployment. Never include an FCM service
          # account or a VAPID private key in a browser environment.
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          VERCEL_TOKEN=$(clean "$VERCEL_TOKEN")
          VERCEL_ORG_ID=$(clean "$VERCEL_ORG_ID")
          VERCEL_PROJECT_ID=$(clean "$VERCEL_PROJECT_ID")
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_PUBLISHABLE_KEY=$(clean "$SUPABASE_PUBLISHABLE_KEY")

          for value in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            test -n "$(eval echo \"\$$value\")" || { echo "::error::$value is empty"; exit 1; }
          done

          # Old Flutter Web already sources this project's PUBLIC Firebase
          # values from GitHub secrets, while the Next.js production command
          # previously forwarded only Supabase credentials. If these public
          # keys are present, forward them to BOTH build and runtime.
          # If absent, preserve any existing Vercel project settings.
          firebase_args=()
          firebase_ready=0
          if [ -n "$(clean "$FIREBASE_WEB_API_KEY")" ] && \
             [ -n "$(clean "$FIREBASE_WEB_APP_ID")" ] && \
             [ -n "$(clean "$FIREBASE_MESSAGING_SENDER_ID")" ] && \
             [ -n "$(clean "$FIREBASE_PROJECT_ID")" ] && \
             [ -n "$(clean "$FIREBASE_VAPID_KEY")" ]; then
            firebase_ready=1
            append_public_env() {
              local name="$1" value="$2"
              value=$(clean "$value")
              if [ -n "$value" ]; then
                firebase_args+=(--build-env "$name=$value" --env "$name=$value")
              fi
            }
            append_public_env NEXT_PUBLIC_FIREBASE_API_KEY "$FIREBASE_WEB_API_KEY"
            append_public_env NEXT_PUBLIC_FIREBASE_APP_ID "$FIREBASE_WEB_APP_ID"
            append_public_env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FIREBASE_MESSAGING_SENDER_ID"
            append_public_env NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
            append_public_env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FIREBASE_AUTH_DOMAIN"
            append_public_env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FIREBASE_STORAGE_BUCKET"
            append_public_env NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FIREBASE_VAPID_KEY"
            echo 'Firebase Web public config will be provided to Next.js build and runtime.'
          else
            echo '::warning::Missing at least one public Firebase Web config secret. Preserving existing Vercel settings; Push may remain unavailable.'
          fi

          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          url=$(npx --yes vercel@latest deploy --prod --yes \
            --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            "${firebase_args[@]}" \
            | tail -n 1)
          echo "firebase_supplied=$firebase_ready" >> "$GITHUB_OUTPUT"

          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production routes
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          FIREBASE_SUPPLIED: ${{ steps.deploy.outputs.firebase_supplied }}
        run: |
          set -euo pipefail

          verify_next() {
            local url="$1"
            local html
            html=$(curl --silent --show-error --fail --location --retry 6 --retry-delay 5 --max-time 30 \
              --header 'Cache-Control: no-cache' "$url")
            grep -q '/_next/' <<< "$html"
            ! grep -q 'flutter_bootstrap.js' <<< "$html"
          }

          ready=0
          for attempt in $(seq 1 30); do
            echo "Waiting for production alias (attempt $attempt/30)"
            if verify_next "https://wynos.online/?_wyn_verify=${GITHUB_RUN_ID}-${attempt}"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1 || { echo '::error::wynos.online did not serve the deployed Next.js build'; exit 1; }

          for route in / /search /notifications /chat /settings /profile/me /clubs /bookmarks; do
            echo "Checking https://wynos.online$route"
            curl --fail --location --retry 5 --retry-delay 2 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --output /dev/null "https://wynos.online$route"
          done

          # Check the public readiness flag only. Never print the Firebase
          # keys or VAPID value into Actions logs.
          curl --silent --show-error --fail --location --retry 3 --max-time 30 \
            --output /tmp/wynos-push-config.json \
            "https://wynos.online/api/push-config?_wyn_push_verify=${GITHUB_RUN_ID}"
          if node -e 'const c = require("/tmp/wynos-push-config.json"); process.exit(c.configured === true ? 0 : 1)'; then
            echo 'Firebase Web Push configuration is available on production.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FIREBASE_SUPPLIED" = '1' ]; then
            echo '::error::Firebase public config was provided at deploy, but the live /api/push-config still reports unconfigured.'
            exit 1
          else
            echo '::warning::Production Web Push is not configured. Add the required Firebase public values to GitHub Secrets or Vercel.'
          fi

          echo 'WYN-158 production deployment verified on wynos.online.' >> "$GITHUB_STEP_SUMMARY"
