name: Deploy Flutter web to Vercel (production)

# Manual-only on purpose: the connected Vercel account is on the free
# Hobby plan (100 deployments/day, shared across every project in the
# account, including the "wynteam" project's auto-preview-per-branch
# deploys). Auto-running this on every push to main would compete with
# those for the same daily quota. Run it by hand from the Actions tab
# ("Run workflow") whenever main is ready to ship.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - run: flutter pub get

      # Regenerates the gitignored web/ scaffold. flutter_bootstrap.js is
      # excluded from the gitignore's /web/* wipe (see app/.gitignore) so
      # it survives this regeneration -- it disables the default
      # service-worker registration; without it, redeploys can appear to
      # still serve a stale cached build.
      - run: flutter create . --platforms web

      # SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY are meant to be public/
      # client-embedded (they end up in the built JS bundle either way),
      # but are still kept out of the repo via GitHub Secrets rather than
      # hardcoded here, matching dart_define.json's existing
      # never-commit convention (see app/.gitignore).
      #
      # Secret values are stripped of stray whitespace/newlines before
      # being embedded in JSON -- pasting a secret's value into GitHub's
      # web UI (especially on mobile) can silently carry a trailing
      # newline from the clipboard, which produces a control character
      # inside the JSON string and fails `flutter build` with a
      # FormatException. Trimming here means a slightly-sloppy paste
      # into the Secrets UI doesn't need to be perfectly exact.
      # Beta4 adds the 7 FIREBASE_* values, for Web Push. A Flutter Web
      # build has no native google-services file to read, so without
      # these `Firebase.initializeApp()` cannot start on web at all and
      # every push path no-ops -- see `app/lib/core/push_env.dart`.
      #
      # A Firebase Web config is public by design (it ships inside every
      # web bundle that uses it, and Google documents it as such), so
      # these are secrets only in the same sense SUPABASE_URL is: kept
      # out of the repo, not kept from the browser. The VAPID key is the
      # *public* half of the Web Push key pair; its private half never
      # leaves the Firebase Console.
      #
      # Every one is optional. A build with none of them set produces
      # empty strings, `PushEnv.isConfigured` returns false, and the app
      # behaves exactly as it did before Beta4 -- so this step is safe to
      # merge before the secrets exist, which is the point: the secrets
      # can be added later and the next deploy picks them up with no
      # further code change.
      - name: Write dart_define.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          # Built with jq rather than a heredoc. The heredoc was fine for
          # two values, but nine interpolations into hand-written JSON is
          # one stray quote away from a FormatException at build time,
          # and jq escapes each value correctly by construction.
          jq -n \
            --arg supabase_url            "$(clean "$SUPABASE_URL")" \
            --arg supabase_key            "$(clean "$SUPABASE_PUBLISHABLE_KEY")" \
            --arg fb_api_key              "$(clean "$FIREBASE_WEB_API_KEY")" \
            --arg fb_app_id               "$(clean "$FIREBASE_WEB_APP_ID")" \
            --arg fb_sender_id            "$(clean "$FIREBASE_MESSAGING_SENDER_ID")" \
            --arg fb_project_id           "$(clean "$FIREBASE_PROJECT_ID")" \
            --arg fb_auth_domain          "$(clean "$FIREBASE_AUTH_DOMAIN")" \
            --arg fb_storage_bucket       "$(clean "$FIREBASE_STORAGE_BUCKET")" \
            --arg fb_vapid_key            "$(clean "$FIREBASE_VAPID_KEY")" \
            '{
              SUPABASE_URL:                 $supabase_url,
              SUPABASE_PUBLISHABLE_KEY:     $supabase_key,
              FIREBASE_WEB_API_KEY:         $fb_api_key,
              FIREBASE_WEB_APP_ID:          $fb_app_id,
              FIREBASE_MESSAGING_SENDER_ID: $fb_sender_id,
              FIREBASE_PROJECT_ID:          $fb_project_id,
              FIREBASE_AUTH_DOMAIN:         $fb_auth_domain,
              FIREBASE_STORAGE_BUCKET:      $fb_storage_bucket,
              FIREBASE_VAPID_KEY:           $fb_vapid_key
            }' > dart_define.json

          # Says whether this build will ship a working Web Push setup,
          # without printing any value. Without this the only way to
          # find out is to open the deployed site and watch a push not
          # arrive.
          if [ -n "$(clean "$FIREBASE_WEB_API_KEY")" ] && [ -n "$(clean "$FIREBASE_VAPID_KEY")" ]; then
            echo "Web Push: configured -- this build can request a push token."
          else
            echo "Web Push: NOT configured -- this build behaves as before Beta4 (every push path no-ops)."
            echo "To enable it, add the FIREBASE_* repository secrets and deploy again."
          fi

      - run: flutter build web --release --dart-define-from-file=dart_define.json

      # Deploys straight to the existing "web" Vercel project (set as
      # VERCEL_PROJECT_ID/VERCEL_ORG_ID secrets -- find both under that
      # project's Settings -> General on vercel.com) rather than creating
      # a new project or relying on Vercel's GitHub-integration preview
      # deploys (that's a separate, already-connected "wynteam" project).
      - name: Deploy to Vercel production
        working-directory: app/build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Same trailing-newline/whitespace guard as the dart_define.json
          # step above -- a sloppy paste into the Secrets UI shouldn't
          # break the CLI invocation either.
          VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          VERCEL_ORG_ID=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          VERCEL_PROJECT_ID=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
