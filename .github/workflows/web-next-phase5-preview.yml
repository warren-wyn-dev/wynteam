name: Web Staging (Vercel Preview per PR)

# Staging for WYNOS Web (Founder decision 2026-09-26, .wyn/company/APPROVALS.md):
# Automatic PR preview deployment is paused. A protected preview can still be started manually,
# smoke-checked and browser-QA'd against the deployed URL, and the URL is posted
# on the PR so it can be opened on a phone before merging.
# - Uses the SAME Supabase project as production (no separate staging DB). Test
#   only with developer accounts; do not rehearse database migrations here.
# - Merging to main still deploys production via wyn-158-production-deploy.yml.
# - This workflow must never move the production alias.
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/web-next-phase5-preview.yml'
      - 'web/**'
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-staging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork and Dependabot PRs get no secrets (GitHub runs Dependabot like a
    # fork, with a read-only token), so only other same-repository PRs deploy.
    # Beta2 automatic Vercel previews are paused. Deploy staging only when
    # explicitly started with workflow_dispatch.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Preflight consumer web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check

      - name: Deploy Next.js preview to existing Vercel project
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          VERCEL_TOKEN=$(clean "$VERCEL_TOKEN")
          VERCEL_ORG_ID=$(clean "$VERCEL_ORG_ID")
          VERCEL_PROJECT_ID=$(clean "$VERCEL_PROJECT_ID")
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_PUBLISHABLE_KEY=$(clean "$SUPABASE_PUBLISHABLE_KEY")

          for value in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            test -n "$(eval echo \"\$$value\")" || { echo "::error::$value is empty"; exit 1; }
          done

          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          url=$(npx --yes vercel@latest deploy --yes \
            --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --build-env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            | tail -n 1)

          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Web staging (Vercel preview)"
            echo
            echo "Preview URL: $url"
            echo
            echo "Vercel Preview Toolbar is disabled for this CI deployment so hosted QA exercises the consumer app rather than preview-feedback tooling. Deployment Protection remains enabled."
            echo
            echo "This is a preview deployment only. The production alias was not changed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create temporary Vercel automation bypass
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          VERCEL_TOKEN=$(clean "$VERCEL_TOKEN")
          VERCEL_ORG_ID=$(clean "$VERCEL_ORG_ID")
          VERCEL_PROJECT_ID=$(clean "$VERCEL_PROJECT_ID")
          for value in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            test -n "$(eval echo \"\$$value\")" || { echo "::error::$value is empty"; exit 1; }
          done

          bypass=$(openssl rand -hex 16)
          echo "::add-mask::$bypass"

          curl --fail --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"generate\":{\"secret\":\"$bypass\",\"note\":\"Web staging CI $GITHUB_RUN_ID\"}}" \
            > /dev/null

          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass" >> "$GITHUB_ENV"

      - name: Smoke preview deployment
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # curl does not keep cookies unless a cookie jar is enabled. The bypass
          # header is sufficient for smoke checks; requesting a bypass cookie here
          # would cause Vercel's cookie-setting redirect to repeat on some routes.
          for route in / /search /notifications /chat /settings /profile/me; do
            echo "Checking $PREVIEW_URL$route"
            curl --fail --location --retry 8 --retry-delay 3 --max-time 30 \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --output /dev/null "$PREVIEW_URL$route"
          done

          html=$(curl --fail --location --retry 8 --retry-delay 3 --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$PREVIEW_URL/")
          grep -q '/_next/' <<< "$html" || {
            echo '::error::preview homepage does not look like a Next.js deployment'
            exit 1
          }
          if grep -q 'flutter_bootstrap.js' <<< "$html"; then
            echo '::error::preview unexpectedly contains the legacy Flutter bootstrap'
            exit 1
          fi

      - name: Post staging URL on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- wynos-web-staging -->';
            const body = [
              marker,
              '### WYNOS Web staging',
              '',
              `Staging URL for \`${context.payload.pull_request.head.sha.slice(0, 7)}\`: ${process.env.PREVIEW_URL}`,
              '',
              '- Protected by Vercel Deployment Protection: sign in to Vercel to open it.',
              '- Uses the production database. Test with developer accounts only.',
              '- Push notifications are not configured on staging.',
              '- Merging this PR deploys to https://wynos.online.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser QA against deployed Vercel preview
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.deploy.outputs.url }}
        run: npm run qa:browser

      - name: Revoke temporary Vercel automation bypass
        if: always()
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            echo 'No temporary bypass was created; nothing to revoke.'
            exit 0
          fi

          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          VERCEL_TOKEN=$(clean "$VERCEL_TOKEN")
          VERCEL_ORG_ID=$(clean "$VERCEL_ORG_ID")
          VERCEL_PROJECT_ID=$(clean "$VERCEL_PROJECT_ID")
          for value in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            test -n "$(eval echo \"\$$value\")" || { echo "::error::$value is empty"; exit 1; }
          done

          curl --fail --silent --show-error \
            --request PATCH \
            --url "https://api.vercel.com/v1/projects/$VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"revoke\":{\"secret\":\"$VERCEL_AUTOMATION_BYPASS_SECRET\",\"regenerate\":false}}" \
            > /dev/null
