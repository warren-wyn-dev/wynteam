name: CI

# Runs on every pull request and on every push to main. Deliberately
# separate from deploy workflows: CI validates buildability without deploying.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Flutter app (`app/`) -- WYNOS, the product this repo ships.
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - name: Test with coverage
        run: flutter test --coverage
      - name: Report Flutter coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          lcov = Path('coverage/lcov.info')
          if not lcov.exists():
              raise SystemExit('coverage/lcov.info was not generated')

          found = hit = 0
          for line in lcov.read_text().splitlines():
              if line.startswith('LF:'):
                  found += int(line[3:])
              elif line.startswith('LH:'):
                  hit += int(line[3:])

          if found == 0:
              raise SystemExit('coverage report contains zero executable lines')

          percent = hit * 100 / found
          print(f'Flutter line coverage: {percent:.2f}% ({hit}/{found})')
          PY
      - name: Flutter web release build smoke test
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://example.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=ci-placeholder-key

  admin:
    name: Admin (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Block critical npm vulnerabilities
        run: npm audit --audit-level=critical
      - name: Admin production build smoke test
        run: npm run build

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  edge-functions:
    name: Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions/

  migration-safety:
    name: Destructive migration guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test migration safety guard
        run: python3 supabase/check_migration_safety_test.py
      - name: Reject unapproved destructive SQL
        run: >-
          python3 supabase/check_migration_safety.py
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

  schema:
    name: schema.sql ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 supabase/check_schema_ordering.py

  # BUG-004: execute every maintained PostgreSQL/RLS integration script.
  # WYN-038 is intentionally quarantined because its own header marks its
  # assertions stale after the Founder-approved WYN-083 view-count behavior
  # change. WYN-083 is the maintained executable regression for owner/repeat
  # views and remains in this loop. Every other persisted script must pass.
  database:
    name: Supabase PostgreSQL integration (maintained SQL/RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run maintained PostgreSQL/RLS regression scripts
        run: |
          set -euo pipefail

          # Older scripts retry failed psql commands via `sudo -u postgres`.
          # That was useful on local machines but, in Actions, PostgreSQL is a
          # TCP service container. A naive retry either switches to a nonexistent
          # local socket or replays a half-applied SQL file and hides the original
          # error behind duplicate-object failures. Wrap psql so the first failure
          # is preserved, and make the legacy sudo fallback replay that original
          # diagnostic instead of mutating the throwaway DB a second time.
          ci_bin="$RUNNER_TEMP/wynos-db-ci-bin"
          mkdir -p "$ci_bin"

          cat > "$ci_bin/psql" <<'EOF'
          #!/usr/bin/env bash
          set +e
          capture="${RUNNER_TEMP}/wynos-psql-capture-$$.out"
          /usr/bin/psql "$@" >"$capture" 2>&1
          status=$?
          cat "$capture"
          if [ "$status" -ne 0 ]; then
            cp "$capture" "${RUNNER_TEMP}/wynos-last-psql-failure.out"
          fi
          rm -f "$capture"
          exit "$status"
          EOF

          cat > "$ci_bin/sudo" <<'EOF'
          #!/usr/bin/env bash
          set -e
          if [ "${1:-}" = "-u" ] && [ "${2:-}" = "postgres" ]; then
            shift 2
            if [ "${1:-}" = "psql" ] && [ -f "${RUNNER_TEMP}/wynos-last-psql-failure.out" ]; then
              cat "${RUNNER_TEMP}/wynos-last-psql-failure.out" >&2
              exit 1
            fi
            # createdb/dropdb legacy fallbacks stay on the same TCP service.
            exec "$@"
          fi
          exec /usr/bin/sudo "$@"
          EOF

          chmod +x "$ci_bin/psql" "$ci_bin/sudo"
          export PATH="$ci_bin:$PATH"

          executed=0
          skipped=0
          for test_script in supabase/tests/*.sh; do
            if [ "$test_script" = "supabase/tests/wyn_038_view_counting_test.sh" ]; then
              echo "::notice::Skipping stale WYN-038 test; WYN-083 is the maintained owner/repeat view regression."
              skipped=$((skipped + 1))
              continue
            fi
            executed=$((executed + 1))
            echo "::group::$test_script"
            bash "$test_script"
            echo "::endgroup::"
          done

          test -f supabase/tests/wyn_083_view_count_owner_and_repeat_test.sh
          echo "Executed $executed maintained database integration scripts; quarantined $skipped explicitly stale script(s)."
