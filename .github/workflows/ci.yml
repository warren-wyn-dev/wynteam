name: CI

# Runs on every pull request and on every push to main. Deliberately
# separate from deploy-web.yml (manual `workflow_dispatch` only, because
# the Vercel account's free-tier deploy quota is shared) -- this one is
# free to run on every change, and is meant to.
#
# Why this exists: until 2026-09-03 nothing in this repo ran
# `flutter analyze` or `flutter test` automatically. Every check was a
# human/AI role remembering to run it and reporting the result by hand,
# which is exactly how the Wynos V1.0.0 Beta2 release shipped a build
# whose profile screen could not load (see
# .wyn/logs/deployments/2026-09-03-wyn-077-105-beta2-real-deploy.md).
# Nothing here replaces the AI QA role -- it just makes the mechanical
# half of the check impossible to forget.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Flutter app (`app/`) -- WYNOS, the product this repo ships.
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  admin:
    name: Admin (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit

  edge-functions:
    name: Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions/

  schema:
    name: schema.sql ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 supabase/check_schema_ordering.py

  # BUG-004: execute every maintained PostgreSQL/RLS integration script.
  # WYN-038 is intentionally quarantined because its own header marks its
  # assertions stale after the Founder-approved WYN-083 view-count behavior
  # change. WYN-083 is the maintained executable regression for owner/repeat
  # views and remains in this loop. Every other persisted script must pass.
  database:
    name: Supabase PostgreSQL integration (maintained SQL/RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run maintained PostgreSQL/RLS regression scripts
        run: |
          set -euo pipefail

          # Older scripts retry failed psql commands via `sudo -u postgres`.
          # That was useful on local machines but, in Actions, PostgreSQL is a
          # TCP service container. A naive retry either switches to a nonexistent
          # local socket or replays a half-applied SQL file and hides the original
          # error behind duplicate-object failures. Wrap psql so the first failure
          # is preserved, and make the legacy sudo fallback replay that original
          # diagnostic instead of mutating the throwaway DB a second time.
          ci_bin="$RUNNER_TEMP/wynos-db-ci-bin"
          mkdir -p "$ci_bin"

          cat > "$ci_bin/psql" <<'EOF'
          #!/usr/bin/env bash
          set +e
          capture="${RUNNER_TEMP}/wynos-psql-capture-$$.out"
          /usr/bin/psql "$@" >"$capture" 2>&1
          status=$?
          cat "$capture"
          if [ "$status" -ne 0 ]; then
            cp "$capture" "${RUNNER_TEMP}/wynos-last-psql-failure.out"
          fi
          rm -f "$capture"
          exit "$status"
          EOF

          cat > "$ci_bin/sudo" <<'EOF'
          #!/usr/bin/env bash
          set -e
          if [ "${1:-}" = "-u" ] && [ "${2:-}" = "postgres" ]; then
            shift 2
            if [ "${1:-}" = "psql" ] && [ -f "${RUNNER_TEMP}/wynos-last-psql-failure.out" ]; then
              cat "${RUNNER_TEMP}/wynos-last-psql-failure.out" >&2
              exit 1
            fi
            # createdb/dropdb legacy fallbacks stay on the same TCP service.
            exec "$@"
          fi
          exec /usr/bin/sudo "$@"
          EOF

          chmod +x "$ci_bin/psql" "$ci_bin/sudo"
          export PATH="$ci_bin:$PATH"

          executed=0
          skipped=0
          for test_script in supabase/tests/*.sh; do
            if [ "$test_script" = "supabase/tests/wyn_038_view_counting_test.sh" ]; then
              echo "::notice::Skipping stale WYN-038 test; WYN-083 is the maintained owner/repeat view regression."
              skipped=$((skipped + 1))
              continue
            fi
            executed=$((executed + 1))
            echo "::group::$test_script"
            if ! bash "$test_script"; then
              echo "::endgroup::"
              echo "::error file=$test_script::Database regression failed: $test_script"
              exit 1
            fi
            echo "::endgroup::"
          done

          test -f supabase/tests/wyn_083_view_count_owner_and_repeat_test.sh
          echo "Executed $executed maintained database integration scripts; quarantined $skipped explicitly stale script(s)."
