name: CI

# Runs on every pull request and on every push to main. Deliberately
# separate from deploy-web.yml (manual `workflow_dispatch` only, because
# the Vercel account's free-tier deploy quota is shared) -- this one is
# free to run on every change, and is meant to.
#
# Why this exists: until 2026-09-03 nothing in this repo ran
# `flutter analyze` or `flutter test` automatically. Every check was a
# human/AI role remembering to run it and reporting the result by hand,
# which is exactly how the Wynos V1.0.0 Beta2 release shipped a build
# whose profile screen could not load (see
# .wyn/logs/deployments/2026-09-03-wyn-077-105-beta2-real-deploy.md).
# Nothing here replaces the AI QA role -- it just makes the mechanical
# half of the check impossible to forget.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Flutter app (`app/`) -- WYNOS, the product this repo ships.
  flutter:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  admin:
    name: Admin (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit

  edge-functions:
    name: Supabase Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno check supabase/functions/*/index.ts
      - run: deno test supabase/functions/

  schema:
    name: schema.sql ordering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 supabase/check_schema_ordering.py

  # BUG-004: execute every persisted PostgreSQL/RLS integration script.
  # Each script creates and drops its own throwaway database, so this job
  # provides real DB/RLS evidence without touching dev or production data.
  database:
    name: Supabase PostgreSQL integration (all SQL/RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run all persisted PostgreSQL/RLS regression scripts
        run: |
          set -euo pipefail

          # Older scripts fall back to `sudo -u postgres` when a direct psql
          # command fails. On Actions, PostgreSQL lives in a service container,
          # so switching OS user would discard the TCP env and incorrectly try
          # a local Unix socket. Preserve the historical fallback contract while
          # keeping it on the same service connection.
          mkdir -p "$RUNNER_TEMP/wynos-db-ci-bin"
          cat > "$RUNNER_TEMP/wynos-db-ci-bin/sudo" <<'EOF'
          #!/usr/bin/env bash
          set -e
          if [ "${1:-}" = "-u" ] && [ "${2:-}" = "postgres" ]; then
            shift 2
            exec "$@"
          fi
          exec /usr/bin/sudo "$@"
          EOF
          chmod +x "$RUNNER_TEMP/wynos-db-ci-bin/sudo"
          export PATH="$RUNNER_TEMP/wynos-db-ci-bin:$PATH"

          count=0
          for test_script in supabase/tests/*.sh; do
            count=$((count + 1))
            echo "::group::$test_script"
            bash "$test_script"
            echo "::endgroup::"
          done
          echo "Executed $count database integration scripts."
