name: Fix chat reply preview once (2026-09-12)

on:
  push:
    branches: [fix/chat-reply-preview-20260912]
    paths:
      - '.github/workflows/fix-chat-reply-preview-once-20260912.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-reply-preview-20260912
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable

      - name: Apply patch
        run: python3 tools/fix_chat_reply_preview_20260912.py

      - name: Format changed Dart files
        working-directory: app
        run: dart format lib/features/chat/data/chat_message.dart lib/features/chat/data/chat_repository.dart lib/features/chat/presentation/conversation_screen.dart test/chat_model_test.dart

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run focused chat regressions
        working-directory: app
        run: flutter test test/chat_model_test.dart test/conversation_screen_test.dart

      - name: Run full Flutter suite
        working-directory: app
        run: flutter test

      - name: Commit clean fix
        run: |
          rm -f tools/fix_chat_reply_preview_20260912.py
          rm -f .github/workflows/fix-chat-reply-preview-once-20260912.yml
          git config user.name 'warren-wyn-dev'
          git config user.email 'warren.wyn.dev@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(chat): restore reply preview content'
          git push origin HEAD:fix/chat-reply-preview-20260912
