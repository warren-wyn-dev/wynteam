name: Food -- apply payment integrity (P1/P3)

# Applies the WYNOS Food payment-safety migrations, one step per run.
# Manual dispatch on main only, after the Founder approves production.
# Behaviour test: supabase/tests/food_payment_integrity_test.sh.
#
# Step "integrity" -> supabase/migrations/20261012090000_food_payment_integrity_v1.sql
#   Webhook flags a payment on a cancelled order for automatic refund,
#   flags Stripe payment during slip review, keeps paid ledgers; merchant
#   payment-status rules (P3). Same signatures and grants. Apply ONLY after
#   the new stripe-webhook and merchant-stripe-refund Edge Functions are
#   deployed: the new webhook is a no-op on the old database, while the old
#   webhook would leave a refund-pending order without the automatic refund.
# Step "cancel-guard" -> supabase/migrations/20261012090100_food_cancel_requires_closed_checkout.sql
#   The buyer cannot cancel while a Stripe Checkout is open. Apply ONLY after
#   the WYNOS Food web release that expires the Checkout before cancelling is
#   live, or buyer cancels fail for those orders.
#
# SAFETY: functions and one trigger only; no table, column or data change.
# Each migration checks production first and verifies itself afterwards.
# ROLLBACK: supabase/rollbacks/20261012090000_food_payment_integrity_v1_rollback.sql
#   and supabase/rollbacks/20261012090100_food_cancel_requires_closed_checkout_rollback.sql
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'Which migration to apply'
        required: true
        type: choice
        options:
          - integrity
          - cancel-guard
      confirm:
        description: 'Type APPLY-FOOD-PAYMENT-INTEGRITY to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-FOOD-PAYMENT-INTEGRITY'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      STEP: ${{ github.event.inputs.step }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          case "$STEP" in
            integrity) FILE=supabase/migrations/20261012090000_food_payment_integrity_v1.sql ;;
            cancel-guard) FILE=supabase/migrations/20261012090100_food_cancel_requires_closed_checkout.sql ;;
            *) echo "::error::unknown step"; exit 1 ;;
          esac
          run_sql "begin;
          $(cat "$FILE")
          commit;" >/dev/null
          # Definitions and privileges only; no order or payment data is read.
          run_sql "select
              pg_get_functiondef('public.food_apply_stripe_event(text,text,uuid,text,text,text,text,bigint,text,text,text,text,text)'::regprocedure) like '%paid_after_cancel%' as webhook_flags_paid_after_cancel,
              pg_get_functiondef('public.food_set_payment_status(uuid,text,text)'::regprocedure) like '%order is cancelled%' as merchant_rules,
              pg_get_functiondef('public.food_submit_payment(uuid,text)'::regprocedure) like '%cancel stripe checkout before submitting slip%' as slip_guard,
              exists (select 1 from pg_trigger where tgname = 'trg_food_guard_cancel_open_checkout' and not tgisinternal) as cancel_guard,
              has_function_privilege('anon', 'public.food_submit_payment(uuid,text)', 'execute') as anon_can_submit,
              has_function_privilege('authenticated', 'public.food_apply_stripe_event(text,text,uuid,text,text,text,text,bigint,text,text,text,text,text)', 'execute') as members_can_apply_events;" \
            | tee result.json | jq .
          jq -e '.[0].anon_can_submit == false and .[0].members_can_apply_events == false' result.json >/dev/null \
            || { echo "::error::privilege check failed"; exit 1; }
          if [ "$STEP" = integrity ]; then
            jq -e '.[0].webhook_flags_paid_after_cancel and .[0].merchant_rules and .[0].slip_guard' result.json >/dev/null \
              || { echo "::error::integrity verification failed"; exit 1; }
          else
            jq -e '.[0].cancel_guard == true' result.json >/dev/null \
              || { echo "::error::cancel guard verification failed"; exit 1; }
          fi
          echo "Food payment integrity step '$STEP' is installed."
