name: WYN-158 Founder media parity patch

on:
  push:
    branches:
      - fix/wyn-158-founder-visual-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wyn-158-founder-visual-parity
          fetch-depth: 0
      - name: Apply source parity patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block missing in {path}: {old[:140]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "web/lib/phase3-data.ts",
              'const dropCardSelect = "id,author_id,caption,image_url,image_width,image_height,created_at,author:profiles!drops_author_id_fkey(username,display_name,avatar_url,is_verified),drop_likes(count),drop_comments(count),redrops(count),drop_images(count)";',
              'const dropCardSelect = "id,author_id,caption,image_url,image_width,image_height,image_aspect_ratio,created_at,author:profiles!drops_author_id_fkey(username,display_name,avatar_url,is_verified),drop_likes(count),drop_comments(count),redrops(count),drop_images(count)";',
          )
          replace(
              "web/lib/phase3-data.ts",
              '    image_height: row.image_height == null ? null : Number(row.image_height),\n    image_count: firstCount(row.drop_images),',
              '    image_height: row.image_height == null ? null : Number(row.image_height),\n    image_aspect_ratio: row.image_aspect_ratio == null ? null : String(row.image_aspect_ratio),\n    image_count: firstCount(row.drop_images),',
          )

          replace(
              "web/components/parity-home-final.tsx",
              '  ImagePlus,\n  Menu,',
              '  ImagePlus,\n  Menu,',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '  type PointerEvent,\n  type TouchEvent,',
              '  type CSSProperties,\n  type PointerEvent,\n  type TouchEvent,',
          )
          replace(
              "web/components/parity-home-final.tsx",
              'import { authorLabel, relativeTimeTh, type HomeFeedRow } from "@/lib/feed";',
              'import { authorLabel, postMediaAspectRatio, relativeTimeTh, type HomeFeedRow } from "@/lib/feed";',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '  const [burst, setBurst] = useState(false);\n  const doubleLike = () => {',
              '  const [burst, setBurst] = useState(false);\n  const mediaRatio = postMediaAspectRatio(row, urls.length > 1);\n  const doubleLike = () => {',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '      <div className={`audit-media-carousel ${urls.length === 1 ? "single" : ""}`}>',
              '      <div className={`audit-media-carousel ${urls.length === 1 ? "single" : ""}`} style={{ "--post-media-ratio": String(mediaRatio) } as CSSProperties}>',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '{row.quote_text ? <p className="audit-quote-text">{row.quote_text}</p> : null}',
              '{row.quote_text ? <RichPostText className="audit-quote-text" value={row.quote_text} /> : null}',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '<Avatar src={post.author_avatar_url} label={post.author_username || "WYNOS"} size={42} />',
              '<Avatar src={post.author_avatar_url} label={post.author_username || "WYNOS"} size={44} />',
          )

          replace(
              "web/components/golden-drop-card.tsx",
              'import { useCallback, useEffect, useMemo, useRef, useState, type PointerEvent } from "react";',
              'import { useCallback, useEffect, useMemo, useRef, useState, type CSSProperties, type PointerEvent } from "react";',
          )
          replace(
              "web/components/golden-drop-card.tsx",
              'import { authorLabel, relativeTimeTh, type HomeFeedRow } from "@/lib/feed";',
              'import { authorLabel, postMediaAspectRatio, relativeTimeTh, type HomeFeedRow } from "@/lib/feed";',
          )
          replace(
              "web/components/golden-drop-card.tsx",
              '  const [burst, setBurst] = useState(false);\n  const lastTap = useRef(0);',
              '  const [burst, setBurst] = useState(false);\n  const lastTap = useRef(0);\n  const mediaRatio = postMediaAspectRatio(row, images.length > 1);',
          )
          replace(
              "web/components/golden-drop-card.tsx",
              '<Link className={`golden-drop-media ${images.length > 1 ? "multi" : "single"}`} href={`/drop/${row.id}`}>',
              '<Link className={`golden-drop-media ${images.length > 1 ? "multi" : "single"}`} style={{ "--post-media-ratio": String(mediaRatio) } as CSSProperties} href={`/drop/${row.id}`}>',
          )

          Path(".github/workflows/wyn158-founder-media-parity-patch.yml").unlink()
          PY
      - name: Commit source parity patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web .github/workflows/wyn158-founder-media-parity-patch.yml
          git commit -m "WYN-158: mirror Flutter post media aspect rules"
          git push origin HEAD:fix/wyn-158-founder-visual-parity
