name: Dispatch profile cover production deploy once

on:
  push:
    branches:
      - ops/dispatch-profile-cover-full-bleed
    paths:
      - .github/workflows/dispatch-profile-cover-full-bleed-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-web.yml --repo warren-wyn-dev/wynteam --ref main
