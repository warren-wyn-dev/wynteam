name: Dispatch WYNOS production deploy once

# One-shot helper for the 2026-09-13 web OAuth callback hotfix.
# The real production workflow intentionally stays manual-only; this file
# only dispatches it once, then is deleted after the deploy completes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web-hotfix-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger existing WYNOS production deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "$GITHUB_REPOSITORY" --ref main
