name: Zoky Android Home Native Screens QA

on:
  pull_request:
    paths:
      - ".github/workflows/food-native-locale-screen-qa.yml"
      - "food-android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-web-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build native QA APK (all mutations disabled)
        working-directory: food-android
        env:
          WYNOS_FOOD_SUPABASE_URL: https://kqokpocajhfbidcxpvhh.supabase.co
          WYNOS_FOOD_SUPABASE_PUBLISHABLE_KEY: sb_publishable_FzWdursjrE36_LvtJnayiA_-kWuw9Lt
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Capture Android native guest screens and enforce network check
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8,1.1.1.1
          script: bash food-android/scripts/native-screen-qa.sh
      - name: Upload paired screenshots (not an automatic parity certificate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zoky-native-320-360-390-430-600-840-th-en-qa-screens
          path: visual/
          if-no-files-found: warn
          retention-days: 7
