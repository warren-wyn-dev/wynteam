name: One-shot chat UI regression verification (2026-09-12)

on:
  push:
    branches:
      - feat/chat-threads-ui-20260912

permissions:
  contents: read
  pull-requests: write

jobs:
  chat-ui-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Run chat UI regression tests
        working-directory: app
        run: >-
          flutter test
          test/chat_inbox_screen_test.dart
          test/conversation_screen_test.dart
          test/new_message_screen_test.dart
          test/message_request_list_screen_test.dart
          test/push_reliability_controller_test.dart
      - name: Report success to PR 363
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr comment 363 --repo warren-wyn-dev/wynteam
          --body "### Chat UI regression verification\n\nPASS: Inbox, Conversation, New Message, Message Requests, and push reliability targeted suites all passed on this PR head. Full-suite failures remain in unrelated pre-existing Profile/guest-gate tests on main."
