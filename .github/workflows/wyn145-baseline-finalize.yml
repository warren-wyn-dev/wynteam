name: One-shot WYN-145 baseline sync

on:
  push:
    branches: [fix/beta4-audit-remaining-bugs]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
          fetch-depth: 0

      - name: Insert WYN-145 before WYN-146 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path('supabase/schema.sql')
          migration_path = Path('supabase/migrations_wyn145_experimentation.sql')
          schema = schema_path.read_text(encoding='utf-8')
          migration = migration_path.read_text(encoding='utf-8').strip()

          marker145 = '-- WYN-145 / Phase 7: Experimentation & A/B Testing'
          marker146 = '-- WYN-146 / Phases 8-10: WYNOS Feed Algorithm v1 Production Candidate'

          if marker145 not in schema:
              if marker146 not in schema:
                  raise SystemExit('WYN-146 insertion marker not found')
              schema = schema.replace(marker146, migration + '\n\n' + marker146, 1)
              schema_path.write_text(schema, encoding='utf-8')

          schema = schema_path.read_text(encoding='utf-8')
          if schema.count(marker145) != 1:
              raise SystemExit(f'expected one WYN-145 baseline block, got {schema.count(marker145)}')
          if schema.index(marker145) > schema.index(marker146):
              raise SystemExit('WYN-145 must precede WYN-146')
          if schema.index('create or replace function public.resolve_home_feed_experiments') > schema.index(marker146):
              raise SystemExit('resolve_home_feed_experiments must exist before WYN-146')
          PY

      - name: Verify baseline contracts
        run: |
          set -euo pipefail
          bash supabase/tests/wyn_145_experimentation_test.sh
          bash supabase/tests/wyn_146_feed_algorithm_v1_test.sh
          bash supabase/tests/wyn_147_feed_repetition_control_test.sh
          python3 supabase/check_schema_ordering.py
          git diff --check

      - name: Commit schema baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          if git diff --cached --quiet; then
            echo 'WYN-145 baseline already synchronized.'
            exit 0
          fi
          git commit -m 'chore(db): sync WYN-145 experimentation baseline'
          git push origin HEAD:fix/beta4-audit-remaining-bugs
