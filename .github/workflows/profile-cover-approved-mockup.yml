name: Profile approved cover mockup

on:
  push:
    branches:
      - fix/profile-cover-approved-mockup
    paths:
      - tools/profile_cover_approved_mockup_patch.py
      - .github/workflows/profile-cover-approved-mockup.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-cover-approved-mockup
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Apply approved Profile cover mockup patch
        run: python3 tools/profile_cover_approved_mockup_patch.py

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/core/design/wynos_founder_metrics.dart \
            app/lib/features/profile/presentation/view_profile_screen.dart

      - name: Verify approved cover values
        run: |
          grep -n "profileCoverExpandedHeight = 121" app/lib/core/design/wynos_founder_metrics.dart
          grep -n "const SizedBox(width: 16)" app/lib/features/profile/presentation/view_profile_screen.dart

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Run focused Profile tests
        working-directory: app
        run: flutter test test/wynos_founder_profile_header_test.dart test/profile_refresh_coordinator_test.dart

      - name: Commit validated implementation
        run: |
          git config user.name "WYNOS UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/lib/core/design/wynos_founder_metrics.dart \
            app/lib/features/profile/presentation/view_profile_screen.dart
          git commit -m "fix(profile): match approved cover mockup"
          git push origin HEAD:fix/profile-cover-approved-mockup
