name: Web Beta1 Username Preflight Security

on:
  pull_request:
    paths:
      - 'supabase/migrations_web_beta1_username_preflight.sql'
      - 'supabase/tests/web_beta1_username_preflight.sql'
      - '.github/workflows/web-beta1-username-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  username-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Assert anon cannot read profiles and public RPC only returns safe boolean
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/web_beta1_username_preflight.sql
