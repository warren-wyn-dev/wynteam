name: WYNOS Food Web Post-Splash Screenshot

on:
  pull_request:
    paths:
      - ".github/workflows/food-web-post-splash-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install lightweight Chromium automation library
        run: npm install --no-save --prefix /tmp/wynos-playwright playwright-core@1.56.1
      - name: Capture page after splash and data loading
        shell: bash
        run: |
          mkdir -p visual
          NODE_PATH=/tmp/wynos-playwright/node_modules node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'th-TH',
            });
            const page = await context.newPage();
            await page.goto('https://food.wynos.online/', {waitUntil:'domcontentloaded', timeout:60000});
            await page.waitForTimeout(8500);
            await page.screenshot({ path:'visual/food-web-after-splash.png', fullPage:false });
            console.log('captured', await page.title(), page.url());
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Save web screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wynos-food-web-after-splash
          path: visual/food-web-after-splash.png
          retention-days: 3
          if-no-files-found: warn
