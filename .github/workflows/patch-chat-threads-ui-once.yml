name: Apply chat Threads/Profile UI patch once

on:
  push:
    branches: [feat/chat-threads-ui-20260912]
    paths:
      - '.github/workflows/patch-chat-threads-ui-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-threads-ui-20260912
          fetch-depth: 0

      - name: Apply chat UI patch
        run: python3 tools/patch_chat_threads_ui_20260912.py

      - name: Commit final UI files and remove one-shot patch tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/patch_chat_threads_ui_20260912.py .github/workflows/patch-chat-threads-ui-once.yml
          git add \
            app/lib/features/chat/presentation/chat_inbox_screen.dart \
            app/lib/features/chat/presentation/conversation_screen.dart \
            app/lib/features/chat/presentation/new_message_screen.dart \
            app/lib/features/chat/presentation/message_request_list_screen.dart
          git commit -m "feat(chat): align messaging UI with profile direction"
          git push origin HEAD:feat/chat-threads-ui-20260912
