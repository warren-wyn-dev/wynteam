name: Cleanup web system font patch workflows

on:
  push:
    branches:
      - fix/web-system-font-emoji-final

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-system-font-emoji-final
      - name: Remove temporary workflows
        run: |
          git rm .github/workflows/apply-web-system-font-emoji-final.yml
          git rm .github/workflows/cleanup-web-system-font-emoji-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(web): remove temporary patch workflows'
          git push origin HEAD:fix/web-system-font-emoji-final
