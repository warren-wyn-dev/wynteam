name: Dispatch duplicate Web Push fix production deploy (2026-09-12)

# One-shot bridge: dispatch the canonical manual-only production workflow once
# for the merged Beta4 duplicate iOS/Web Push notification fix, then archive
# this file again after the canonical deploy completes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-deploy-web-once-20260912.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production web deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "${{ github.repository }}" --ref main
