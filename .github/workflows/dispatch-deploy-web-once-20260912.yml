name: One-shot production web deploy (2026-09-13)

# Temporary bridge: dispatch the existing manual production deploy exactly
# once from a push, then archive this file again after the production run is
# confirmed. The job only runs for the activation commit message below.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-deploy-web-once-20260912.yml
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: contains(github.event.head_commit.message, 'dispatch production web deploy')
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "${{ github.repository }}" --ref main
