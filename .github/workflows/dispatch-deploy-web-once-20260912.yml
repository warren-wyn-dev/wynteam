name: Dispatch production web deploy once (2026-09-12)

# One-shot bridge used because this integration cannot call GitHub's
# workflow_dispatch endpoint directly. The actual deployment remains the
# canonical manual-only deploy-web.yml workflow; this file only dispatches it
# once from a main-branch push, then is removed after the deploy completes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-deploy-web-once-20260912.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production web deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "${{ github.repository }}" --ref main
