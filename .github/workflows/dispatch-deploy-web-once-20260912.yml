name: Dispatch final DM reliability production deploy (2026-09-12)

# One-shot bridge for the Founder-approved Beta4 DM notification fix. It only
# dispatches the canonical manual-only deploy-web.yml workflow once; it is
# archived again immediately after the deployment is verified.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-deploy-web-once-20260912.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production web deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "${{ github.repository }}" --ref main
