name: Dispatch production chat UI deploy (2026-09-12)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-deploy-web-once-20260912.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "$GITHUB_REPOSITORY" --ref main
