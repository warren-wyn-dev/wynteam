name: Dispatch production web deploy once (2026-09-12 stale-cache hotfix)

# One-shot dispatcher for the approved production hotfix. A push to this file
# starts the existing manual deploy workflow on main. Archive this file again
# immediately after the dispatch run is observed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-deploy-web-once-20260912.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Start canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "$GITHUB_REPOSITORY" --ref main
