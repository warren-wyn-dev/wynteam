name: Verify duplicate Web Push fix in production (2026-09-12)

# One-shot production smoke. It only reads public production assets and does
# not deploy or mutate production. Archive this file again after it passes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-deploy-web-once-20260912.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production service worker duplicate guard
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 2 https://wynos.online/firebase-messaging-sw.js -o /tmp/firebase-messaging-sw.js
          grep -F "messaging.onBackgroundMessage" /tmp/firebase-messaging-sw.js
          grep -F "if (payload.notification) return;" /tmp/firebase-messaging-sw.js
          if grep -qE "__FIREBASE_[A-Z_]+__" /tmp/firebase-messaging-sw.js; then
            echo "Firebase placeholder remains in production service worker" >&2
            exit 1
          fi
          echo "Production service worker contains the duplicate-notification guard."
