name: Dispatch WebKit service-worker fix deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web-swfix-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger WYNOS production deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "$GITHUB_REPOSITORY" --ref main
