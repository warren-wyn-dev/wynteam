name: WYN-158 Final Pixel Closure

on:
  push:
    paths:
      - 'tools/wyn158_pixel_closure.mjs'
      - '.github/workflows/wyn158-final-pixel-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/fix/wyn-158-system-wide-visual-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Apply final pixel closure
        run: node tools/wyn158_pixel_closure.mjs
      - name: Install consumer dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Consumer preflight
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: npm run check
      - name: Commit final pixel closure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/beta4-composer.tsx web/components/post-detail-route.tsx web/app/system-parity-final.css web/tests/browser/final-source-parity-gate.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "WYN-158: close final Flutter pixel gaps"
          git push
