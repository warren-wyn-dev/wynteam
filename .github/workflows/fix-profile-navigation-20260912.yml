name: Fix profile navigation 2026-09-12

on:
  push:
    branches: [fix/ci-reconcile-20260912]
    paths:
      - '.github/workflows/fix-profile-navigation-20260912.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-reconcile-20260912

      - name: Apply patch
        run: python3 tools/profile_nav_fix_20260912.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files
        working-directory: app
        run: dart format lib/features/profile/presentation/view_profile_screen.dart lib/features/root/presentation/root_shell.dart lib/features/root/presentation/root_navigation_controller.dart test/view_profile_screen_test.dart

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Profile and root navigation tests
        working-directory: app
        run: flutter test test/view_profile_screen_test.dart test/root_shell_test.dart

      - name: WYN-142 personalization SQL regression
        run: bash supabase/tests/wyn_142_personalization_test.sh

      - name: Commit fix and remove temporary files
        run: |
          rm -f .github/workflows/sql-diagnostic-20260912.yml
          rm -f sql_failure_diagnostic.txt
          rm -f tools/profile_nav_fix_20260912.py
          rm -f .github/workflows/fix-profile-navigation-20260912.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore pushed profile navigation'
          git push origin HEAD:fix/ci-reconcile-20260912
