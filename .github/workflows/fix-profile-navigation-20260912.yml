name: Fix profile navigation 2026-09-12

on:
  push:
    branches: [fix/ci-reconcile-20260912]
    paths:
      - '.github/workflows/fix-profile-navigation-20260912.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-reconcile-20260912

      - name: Patch profile navigation and WYN-142 harness
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'needle not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          profile = 'app/lib/features/profile/presentation/view_profile_screen.dart'
          replace_once(
              profile,
              "import '../../report/presentation/report_sheet.dart';\nimport '../../search/data/discovery_repository.dart';",
              "import '../../report/presentation/report_sheet.dart';\nimport '../../root/presentation/root_navigation_controller.dart';\nimport '../../root/presentation/widgets/wynos_founder_bottom_navigation.dart';\nimport '../../search/data/discovery_repository.dart';",
          )

          replace_once(
              profile,
              "  Widget _buildProfileCoverBar(Profile profile, bool isOwnProfile) {",
              """  void _goBack() {
    final navigator = Navigator.of(context);
    if (navigator.canPop()) {
      navigator.pop();
    } else {
      widget.onRootBack?.call();
    }
  }

  Future<void> _openRootDestination(int navIndex) async {
    if (!RootNavigationController.isAttached) return;

    // A pushed profile sits above RootShell on the app's single Navigator.
    // Switching a bottom destination should leave that pushed stack entirely,
    // reveal the existing RootShell (preserving its IndexedStack state), then
    // let RootShell perform the real destination action/guest gate.
    final navigator = Navigator.of(context);
    navigator.popUntil((route) => route.isFirst);
    await Future<void>.delayed(Duration.zero);
    await RootNavigationController.selectDestination(navIndex);
  }

  Widget _buildPushedProfileBottomNavigation() {
    return WynosFounderBottomNavigation(
      selectedIndex: 4,
      onDestinationSelected: (navIndex) {
        _openRootDestination(navIndex);
      },
      createAction: Container(
        width: WynosFounderMetrics.createActionDiameter,
        height: WynosFounderMetrics.createActionDiameter,
        decoration: BoxDecoration(
          shape: BoxShape.circle,
          color: WynColors.ink,
          boxShadow: [
            BoxShadow(
              color: WynColors.ink.withValues(alpha: 0.18),
              blurRadius: 10,
              offset: const Offset(0, 3),
            ),
          ],
        ),
        child: const Icon(
          Icons.add_rounded,
          size: 33,
          color: WynColors.paper,
        ),
      ),
      notificationIcon: const Icon(Icons.notifications_outlined),
      selectedNotificationIcon: const Icon(Icons.notifications),
    );
  }

  Widget _buildProfileCoverBar(Profile profile, bool isOwnProfile) {""",
          )

          replace_once(
              profile,
              """          Positioned(
            top: topInset,
            left: 16,
            right: 0,
            height: kToolbarHeight,
            child: Row(
              children: [
                const Text(
                  'โปรไฟล์',""",
              """          Positioned(
            top: topInset,
            left: 4,
            right: 0,
            height: kToolbarHeight,
            child: Row(
              children: [
                IconButton(
                  tooltip: 'ย้อนกลับ',
                  icon: const Icon(
                    Icons.chevron_left_rounded,
                    size: 32,
                    color: WynColors.paper,
                  ),
                  onPressed: _goBack,
                ),
                const Text(
                  'โปรไฟล์',""",
          )

          replace_once(
              profile,
              """      child: Scaffold(
        backgroundColor: WynColors.paper,
        body: FutureBuilder<_ProfileWithCounts>(""",
              """      child: Scaffold(
        backgroundColor: WynColors.paper,
        bottomNavigationBar: !isOwnProfile && RootNavigationController.isAttached
            ? _buildPushedProfileBottomNavigation()
            : null,
        body: FutureBuilder<_ProfileWithCounts>(""",
          )

          root = 'app/lib/features/root/presentation/root_shell.dart'
          replace_once(
              root,
              "import 'widgets/wynos_founder_bottom_navigation.dart';\nimport '../../../core/navigation/deep_link_service.dart';",
              "import 'widgets/wynos_founder_bottom_navigation.dart';\nimport 'root_navigation_controller.dart';\nimport '../../../core/navigation/deep_link_service.dart';",
          )
          replace_once(
              root,
              """  void initState() {
    super.initState();
    _tabIndex = widget.startOnProfileTab ? _profileTab : _homeTab;""",
              """  void initState() {
    super.initState();
    RootNavigationController.attach(this, _onDestinationSelected);
    _tabIndex = widget.startOnProfileTab ? _profileTab : _homeTab;""",
          )
          replace_once(
              root,
              """  void dispose() {
    WidgetsBinding.instance.removeObserver(this);""",
              """  void dispose() {
    RootNavigationController.detach(this);
    WidgetsBinding.instance.removeObserver(this);""",
          )

          controller = Path('app/lib/features/root/presentation/root_navigation_controller.dart')
          controller.write_text("""/// Bridge used by full-screen pushed routes that need to return to the
/// already-mounted [RootShell] and select one of its bottom destinations.
///
/// WYNOS currently uses one app Navigator rather than a nested Navigator per
/// tab, so a pushed route paints above RootShell's own bottom navigation. The
/// controller keeps the RootShell as the single owner of destination behavior
/// (guest gates, badges, create-post action, tab refresh semantics) instead of
/// duplicating that logic in pushed screens.
class RootNavigationController {
  RootNavigationController._();

  static Object? _owner;
  static Future<void> Function(int)? _handler;

  static bool get isAttached => _handler != null;

  static void attach(Object owner, Future<void> Function(int) handler) {
    _owner = owner;
    _handler = handler;
  }

  static void detach(Object owner) {
    if (!identical(_owner, owner)) return;
    _owner = null;
    _handler = null;
  }

  static Future<void> selectDestination(int navIndex) async {
    final handler = _handler;
    if (handler == null) return;
    await handler(navIndex);
  }
}
""")

          wyn142 = 'supabase/tests/wyn_142_personalization_test.sh'
          replace_once(
              wyn142,
              """grant usage on schema public to authenticated, anon;
grant usage on schema storage to authenticated, anon;
alter default privileges in schema public grant select, insert, update, delete on tables to authenticated;""",
              """grant usage on schema public to authenticated, anon;
grant usage on schema storage to authenticated, anon;
grant usage on schema auth to authenticated, anon;
grant execute on function auth.uid() to authenticated, anon;
grant execute on function auth.role() to authenticated, anon;
alter default privileges in schema public grant select, insert, update, delete on tables to authenticated;""",
          )

          test = 'app/test/view_profile_screen_test.dart'
          replace_once(
              test,
              "import 'package:wyn/features/profile/presentation/view_profile_screen.dart';\n",
              "import 'package:wyn/features/profile/presentation/view_profile_screen.dart';\nimport 'package:wyn/features/root/presentation/root_navigation_controller.dart';\n",
          )
          p = Path(test)
          text = p.read_text()
          insert = r'''

  group('pushed profile navigation chrome', () {
    Widget buildLauncher() => MaterialApp(
          home: Builder(
            builder: (context) => Scaffold(
              body: Center(
                child: TextButton(
                  key: const Key('open_other_profile'),
                  onPressed: () => Navigator.of(context).push(
                    MaterialPageRoute<void>(
                      builder: (_) => ViewProfileScreen(
                        profileRepository: otherProfileRepo,
                        followRepository: otherFollowRepo,
                        dropRepository: dropRepo,
                        popRepository: popRepo,
                        savedRepository: savedRepo,
                        userId: 'someone-else',
                      ),
                    ),
                  ),
                  child: const Text('เปิดโปรไฟล์คนอื่น'),
                ),
              ),
            ),
          ),
        );

    testWidgets('shows a real back button on someone else profile',
        (tester) async {
      final owner = Object();
      RootNavigationController.attach(owner, (_) async {});
      addTearDown(() => RootNavigationController.detach(owner));

      await tester.pumpWidget(buildLauncher());
      await tester.tap(find.byKey(const Key('open_other_profile')));
      await tester.pumpAndSettle();

      expect(find.byTooltip('ย้อนกลับ'), findsOneWidget);
      await tester.tap(find.byTooltip('ย้อนกลับ'));
      await tester.pumpAndSettle();

      expect(find.byKey(const Key('open_other_profile')), findsOneWidget);
      expect(find.text('น้ำฝน'), findsNothing);
    });

    testWidgets(
        'keeps the root bottom destinations visible and dispatches a tab tap',
        (tester) async {
      final owner = Object();
      final selected = <int>[];
      RootNavigationController.attach(owner, (index) async {
        selected.add(index);
      });
      addTearDown(() => RootNavigationController.detach(owner));

      await tester.pumpWidget(buildLauncher());
      await tester.tap(find.byKey(const Key('open_other_profile')));
      await tester.pumpAndSettle();

      expect(find.text('หน้าหลัก'), findsOneWidget);
      expect(find.text('ค้นหา'), findsOneWidget);
      expect(find.text('การแจ้งเตือน'), findsOneWidget);
      expect(find.text('โปรไฟล์'), findsWidgets);

      await tester.tap(find.text('ค้นหา'));
      await tester.pumpAndSettle();

      expect(selected, [1]);
      expect(find.byKey(const Key('open_other_profile')), findsOneWidget);
      expect(find.text('น้ำฝน'), findsNothing);
    });
  });
'''
          pos = text.rfind('\n}')
          if pos < 0:
              raise SystemExit(f'could not find main() closing brace in {test}')
          p.write_text(text[:pos] + insert + text[pos:])
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install app dependencies
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files
        working-directory: app
        run: dart format lib/features/profile/presentation/view_profile_screen.dart lib/features/root/presentation/root_shell.dart lib/features/root/presentation/root_navigation_controller.dart test/view_profile_screen_test.dart

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Profile and root navigation tests
        working-directory: app
        run: flutter test test/view_profile_screen_test.dart test/root_shell_test.dart

      - name: WYN-142 personalization SQL regression
        run: bash supabase/tests/wyn_142_personalization_test.sh

      - name: Commit fix and remove temporary diagnostics
        shell: bash
        run: |
          rm -f .github/workflows/sql-diagnostic-20260912.yml
          rm -f sql_failure_diagnostic.txt
          rm -f .github/workflows/fix-profile-navigation-20260912.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore pushed profile navigation'
          git push origin HEAD:fix/ci-reconcile-20260912
