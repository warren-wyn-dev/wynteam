name: Apply final web system font and emoji patch

on:
  push:
    branches:
      - fix/web-system-font-emoji-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-system-font-emoji-final
          fetch-depth: 0

      - name: Apply verified typography implementation onto latest main
        run: |
          set -euo pipefail
          SOURCE=6aec7b6

          git checkout "$SOURCE" -- \
            app/lib/core/design/wyn_theme.dart \
            app/lib/core/typography/browser_system_text.dart \
            app/lib/core/typography/browser_system_text_stub.dart \
            app/lib/core/typography/browser_system_text_web.dart \
            app/lib/core/widgets/hashtag_text.dart \
            app/lib/core/widgets/wynos_social_chrome.dart \
            app/lib/features/home/presentation/home_feed_screen.dart \
            app/lib/features/home/presentation/widgets/liked_by_row.dart \
            app/lib/features/home/presentation/widgets/top_reply_preview.dart \
            app/lib/features/root/presentation/widgets/wynos_founder_bottom_navigation.dart \
            app/lib/main.dart \
            app/test/system_typography_ios_accessibility_test.dart

          git rm -f \
            app/lib/core/typography/looped_thai_font_loader.dart \
            app/lib/core/typography/looped_thai_font_loader_stub.dart \
            app/lib/core/typography/looped_thai_font_loader_web.dart

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected pattern not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          drop = 'app/lib/features/home/presentation/widgets/home_drop_card.dart'
          pop = 'app/lib/features/home/presentation/widgets/home_pop_card.dart'

          for path in (drop, pop):
              replace_once(
                  path,
                  "import '../../../../core/text_utils.dart';\n",
                  "import '../../../../core/text_utils.dart';\nimport '../../../../core/typography/browser_system_text.dart';\n",
              )

          replace_once(
              drop,
              'Flexible(\n                          child: Text(\n                            // WYN-087',
              'Flexible(\n                          child: BrowserSystemText(\n                            // WYN-087',
          )
          replace_once(
              drop,
              'Flexible(\n                                        child: Text(\n                                          item.authorNameOrUsername,',
              'Flexible(\n                                        child: BrowserSystemText(\n                                          item.authorNameOrUsername,',
          )
          replace_once(
              drop,
              'child: Text(\n                                          item.location != null',
              'child: BrowserSystemText(\n                                          item.location != null',
          )
          replace_once(
              pop,
              'Flexible(\n                                        child: Text(\n                                          item.authorNameOrUsername,',
              'Flexible(\n                                        child: BrowserSystemText(\n                                          item.authorNameOrUsername,',
          )
          replace_once(
              pop,
              'child: Text(\n                                          relativeTimeLabel(',
              'child: BrowserSystemText(\n                                          relativeTimeLabel(',
          )
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Verify final tree
        working-directory: app
        run: |
          flutter pub get
          dart format \
            lib/core/design/wyn_theme.dart \
            lib/core/typography/browser_system_text.dart \
            lib/core/typography/browser_system_text_stub.dart \
            lib/core/typography/browser_system_text_web.dart \
            lib/core/widgets/hashtag_text.dart \
            lib/core/widgets/wynos_social_chrome.dart \
            lib/features/home/presentation/home_feed_screen.dart \
            lib/features/home/presentation/widgets/home_drop_card.dart \
            lib/features/home/presentation/widgets/home_pop_card.dart \
            lib/features/home/presentation/widgets/liked_by_row.dart \
            lib/features/home/presentation/widgets/top_reply_preview.dart \
            lib/features/root/presentation/widgets/wynos_founder_bottom_navigation.dart \
            lib/main.dart \
            test/system_typography_ios_accessibility_test.dart
          flutter analyze
          flutter test \
            test/hashtag_text_test.dart \
            test/system_typography_ios_accessibility_test.dart \
            test/home_drop_card_overflow_test.dart \
            test/web_ios_full_bleed_test.dart
          flutter build web --release

      - name: Commit verified final patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(web): use device system text and emoji'
          git push origin HEAD:fix/web-system-font-emoji-final
