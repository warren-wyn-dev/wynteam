name: Retry all-page web system text migration

on:
  push:
    branches:
      - feat/web-system-text-all
    paths:
      - .github/workflows/apply-web-system-text-all-retry.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-system-text-all
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - name: Resolve packages before formatting
        working-directory: app
        run: flutter pub get

      - name: Run corrected full migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/apply-web-system-text-all.yml').read_text()
          match = re.search(
              r"      - name: Migrate every app-owned text surface\n"
              r"        run: \|\n"
              r"          python3 - <<'PY'\n"
              r"(?P<script>.*?)\n"
              r"          PY\n",
              workflow,
              re.S,
          )
          if match is None:
              raise SystemExit('Could not extract migration script')
          script = textwrap.dedent(match.group('script'))
          old = '''def add_import(source, imp):
              if imp in source: return source
              lines=source.splitlines(keepends=True)
              indexes=[i for i,line in enumerate(lines) if line.lstrip().startswith('import ')]
              if not indexes: return imp+'\\n\\n'+source
              lines.insert(indexes[-1]+1, imp+'\\n')
              return ''.join(lines)'''
          new = '''def add_import(source, imp):
              if imp in source: return source
              # Insert before the first import instead of after a line that merely
              # starts an import. Dart imports may continue on the next line with
              # `show`/`hide`; inserting between those lines breaks the program.
              match = re.search(r'(?m)^import\\s+', source)
              if match is None: return imp+'\\n\\n'+source
              return source[:match.start()] + imp + '\\n' + source[match.start():]'''
          if old not in script:
              raise SystemExit('Expected add_import implementation not found')
          script = script.replace(old, new, 1)
          exec(compile(script, '<full-system-text-migration>', 'exec'))

          # Fix analyzer-only style issues in the expanded Web compatibility
          # layer at the same time; these are independent from the mass rewrite.
          path = Path('app/lib/core/typography/browser_system_text_web.dart')
          text = path.read_text()
          text = text.replace(
              "      if (decoration.contains(TextDecoration.underline))\n        values.add('underline');",
              "      if (decoration.contains(TextDecoration.underline)) {\n        values.add('underline');\n      }",
          )
          text = text.replace(
              "    if (enterKeyHint != null)\n      element.setAttribute('enterkeyhint', enterKeyHint);",
              "    if (enterKeyHint != null) {\n      element.setAttribute('enterkeyhint', enterKeyHint);\n    }",
          )
          text = text.replace(
              'type == TextInputType.numberWithOptions())',
              'type == const TextInputType.numberWithOptions())',
          )
          path.write_text(text)
          PY

      - name: Persist migration before compiler cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib
          git commit -m 'feat(web): migrate all app text to system DOM surfaces'
          git push origin HEAD:feat/web-system-text-all

      - name: Format migrated files
        run: |
          mapfile -t files < <(git show --pretty='' --name-only HEAD | grep '^app/lib/.*\.dart$' || true)
          if [ ${#files[@]} -gt 0 ]; then dart format "${files[@]}"; fi
          if ! git diff --quiet; then
            git add app/lib
            git commit -m 'style(web): format all-page system text migration'
            git push origin HEAD:feat/web-system-text-all
          fi

      - name: Compile verification
        working-directory: app
        run: |
          flutter analyze
          flutter build web --release
