name: ZOKY -- admin-chosen service areas

# Founder 2026-11-02: "ให้ Admin เลือกได้ว่าจะเปิดให้บริการที่ไหนบ้าง" (whole
# country + 77 provinces, ZOKY Admin, super admin only; .wyn/company/APPROVALS.md).
# Applies 20261103100000_zoky_service_area_admin.sql: area columns, 76 province
# rows (all off; Maha Sarakham is the existing row), the audited super-admin
# RPCs and the public overview/boundary RPCs. Live ordering does not change.
# Verifies definitions, grants and fixed coordinates only; no personal data is
# read. Re-runnable (keeps each area's on/off state).
# Test: supabase/tests/zoky_service_area_admin_test.sh
# Rollback: supabase/rollbacks/20261103100000_zoky_service_area_admin_rollback.sql
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-ZOKY-SERVICE-AREA-ADMIN to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-ZOKY-SERVICE-AREA-ADMIN'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          # The migration is ~340 KB, too big for a command-line argument:
          # the SQL and the request body go through files.
          run_sql_file() {
            local body out code
            body=$(mktemp); out=$(mktemp)
            jq -n --rawfile q "$1" '{query: $q}' > "$body"
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data-binary @"$body")
            rm -f "$body"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql() {
            local sql; sql=$(mktemp); printf '%s' "$1" > "$sql"
            run_sql_file "$sql"; local rc=$?; rm -f "$sql"; return $rc
          }
          apply_sql=$(mktemp)
          { echo "begin;"; cat supabase/migrations/20261103100000_zoky_service_area_admin.sql; echo; echo "commit;"; } > "$apply_sql"
          run_sql_file "$apply_sql" >/dev/null
          rm -f "$apply_sql"
          # Definitions, grants, counts and fixed coordinates only; no personal data is read.
          run_sql "select
              (select count(distinct group_code) from public.food_service_areas where kind = 'province') as provinces,
              (select count(*) from public.food_service_areas where kind = 'country') as countries,
              (select count(*) from public.food_service_areas where group_code is null) as ungrouped,
              (select count(*) from public.food_service_areas where active) > 0 as something_open,
              (select string_agg(distinct group_code, ',') from public.food_service_areas a where kind = 'province'
                 and internal.food_point_in_polygon(13.7563, 100.5018, a.lats, a.lngs)) as bangkok_province,
              (select string_agg(distinct group_code, ',') from public.food_service_areas a where kind = 'province'
                 and internal.food_point_in_polygon(10.0956, 99.8404, a.lats, a.lngs)) as ko_tao_province,
              (select string_agg(distinct group_code, ',') from public.food_service_areas a where kind = 'province'
                 and internal.food_point_in_polygon(16.1847, 103.3007, a.lats, a.lngs)) as maha_sarakham_province,
              has_function_privilege('anon', 'public.admin_zoky_set_service_area(text,boolean)', 'execute') as anon_can_set,
              has_function_privilege('anon', 'public.admin_zoky_service_areas()', 'execute') as anon_can_list,
              has_function_privilege('authenticated', 'public.admin_zoky_set_service_area(text,boolean)', 'execute') as members_can_call_set,
              has_function_privilege('anon', 'public.food_service_area_overview()', 'execute') as anon_overview,
              has_table_privilege('authenticated', 'public.food_service_areas', 'update') as members_update_table,
              (select pg_get_functiondef('public.admin_zoky_set_service_area(text,boolean)'::regprocedure)
                 like '%is_super_admin()%') as set_is_super_admin_only,
              (select pg_get_constraintdef(c.oid) like '%zoky_service_area_changed%' from pg_constraint c
                 where c.conrelid = 'public.audit_log'::regclass and c.contype = 'c'
                   and pg_get_constraintdef(c.oid) like '%event_type%' limit 1) as audit_event_allowed;" \
            | tee result.json | jq .
          jq -e '.[0].provinces == 77 and .[0].countries == 1 and .[0].ungrouped == 0 and .[0].something_open == true
                 and .[0].bangkok_province == "TH-10" and .[0].ko_tao_province == "TH-84" and .[0].maha_sarakham_province == "TH-44"
                 and .[0].anon_can_set == false and .[0].anon_can_list == false and .[0].members_can_call_set == true
                 and .[0].anon_overview == true and .[0].members_update_table == false
                 and .[0].set_is_super_admin_only == true and .[0].audit_event_allowed == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "ZOKY Admin can now choose service areas (super admin). Live areas are unchanged."
