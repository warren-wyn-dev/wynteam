name: WYN-120 -- delete-drop failure diagnostic (read-only)

# Founder just tried to delete a Drop from the "wynos_online" account
# via DropDetailScreen and got "ลบโพสต์ไม่สำเร็จ ลองใหม่อีกครั้ง" (delete
# failed) right after WYN-120's fetchById() fix was deployed. That fix
# only changed a SELECT filter -- it never touched soft_delete_drop()
# itself -- so this looks like a different, new failure. Working theory
# (needs verification, not a guess): this may be the SAME Drop the
# Founder deleted earlier while reproducing WYN-120 in the first place.
# soft_delete_drop() raises 'Drop is already deleted' if deleted_at is
# already set -- DropDetailScreen's catch block swallows every
# exception into the same generic SnackBar, so a genuine "already
# deleted, this is working as intended" case looks identical in the UI
# to a real failure. This checks read-only, no data touched:
#   1. wynos_online's most recent Drops and their current deleted_at.
#   2. Whether any of them were deleted very recently (near the time of
#      this report), which would confirm the "double-delete on a stale
#      screen" theory rather than a real RPC failure.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          echo "=== 1. wynos_online's own profile id ==="
          run_sql "select id, username, display_name from public.profiles where lower(username) = 'wynos_online';" | jq .
          echo

          echo "=== 2. wynos_online's most recent Drops -- id, caption preview, created_at, deleted_at, edited_at ==="
          run_sql "select d.id, left(coalesce(d.caption,''), 40) as caption_preview,
                          d.created_at, d.deleted_at, d.edited_at,
                          extract(epoch from (now() - d.deleted_at))/60 as minutes_since_deleted
                   from public.drops d
                   join public.profiles p on p.id = d.author_id
                   where lower(p.username) = 'wynos_online'
                   order by d.created_at desc
                   limit 15;" | jq .
          echo

          echo "=== 3. soft_delete_drop() live definition on production (compare against schema.sql) ==="
          run_sql "select proname, pg_get_functiondef(oid) as def
                   from pg_proc where proname = 'soft_delete_drop';" | jq .
          echo

          echo "Read this as: if a wynos_online Drop shows deleted_at set with"
          echo "minutes_since_deleted small (single digits), the RPC's 'Drop is already"
          echo "deleted' exception is the real cause -- the delete already succeeded on an"
          echo "earlier attempt, and the Founder is looking at a stale screen that still"
          echo "renders the delete option for an already-gone Drop. If no recent Drop shows"
          echo "deleted_at set at all, this is a genuine new RPC/permission failure and needs"
          echo "further investigation (e.g. author_id mismatch, RLS, or definition drift from"
          echo "part 3 above)."
