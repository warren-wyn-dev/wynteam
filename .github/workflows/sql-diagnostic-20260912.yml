name: SQL diagnostic 2026-09-12

on:
  push:
    branches:
      - fix/ci-reconcile-20260912
    paths:
      - '.github/workflows/sql-diagnostic-20260912.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-reconcile-20260912

      - name: Align SQL harness contracts and run maintained suite
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('supabase/tests/wyn_143_cold_start_test.sh'),
              Path('supabase/tests/wyn_144_feed_quality_test.sh'),
          ]
          grant_anchor = 'grant usage on schema public to authenticated, anon;\n'
          grants = (
              'grant usage on schema public to authenticated, anon;\n'
              'grant usage on schema auth to authenticated, anon;\n'
              'grant execute on function auth.uid() to authenticated, anon;\n'
              'grant execute on function auth.role() to authenticated, anon;\n'
          )
          old_top100 = (
              "position('top100_quality_bonus' in pg_get_functiondef(\n"
              "   'public.get_wynos_ranked_feed()'::regprocedure))>0\n"
              "   and position('(101 - t100.current_rank) / 10.0' in pg_get_functiondef(\n"
              "   'public.get_wynos_ranked_feed()'::regprocedure))>0"
          )
          new_top100 = (
              "position('top100_quality_bonus' in pg_get_functiondef(\n"
              "   'internal.get_wynos_ranked_feed_base_v1()'::regprocedure))>0\n"
              "   and position('(101 - t100.current_rank) / 10.0' in pg_get_functiondef(\n"
              "   'internal.get_wynos_ranked_feed_base_v1()'::regprocedure))>0"
          )

          for path in paths:
              text = path.read_text()
              if 'grant usage on schema auth to authenticated, anon;' not in text:
                  if grant_anchor not in text:
                      raise SystemExit(f'expected grant anchor not found in {path}')
                  text = text.replace(grant_anchor, grants, 1)
              if old_top100 in text:
                  text = text.replace(old_top100, new_top100, 1)
              elif new_top100 not in text:
                  raise SystemExit(f'expected Top100 contract anchor not found in {path}')
              path.write_text(text)

          path = Path('supabase/tests/wyn_144_feed_quality_test.sh')
          text = path.read_text()
          old_quality = (
              "((position('feed_content_quality' in pg_get_functiondef(\n"
              "   'public.get_wynos_ranked_feed()'::regprocedure))>0\n"
              "   and position('from public.reports' in pg_get_functiondef(\n"
              "   'public.get_wynos_ranked_feed()'::regprocedure))=0)::int),1;"
          )
          new_quality = (
              "((position('internal.content_quality_factors' in pg_get_functiondef(\n"
              "   'internal.get_wynos_ranked_feed_base_v1()'::regprocedure))>0\n"
              "   and position('feed_content_quality' in pg_get_functiondef(\n"
              "   'internal.content_quality_factors(uuid[])'::regprocedure))>0\n"
              "   and position('from public.reports' in pg_get_functiondef(\n"
              "   'internal.get_wynos_ranked_feed_base_v1()'::regprocedure))=0)::int),1;"
          )
          if old_quality in text:
              text = text.replace(old_quality, new_quality, 1)
          elif new_quality not in text:
              raise SystemExit('expected WYN-144 quality contract anchor not found')
          path.write_text(text)
          PY

          chmod +x tools/sql_ci_diagnostic_20260912.sh
          set +e
          bash tools/sql_ci_diagnostic_20260912.sh
          status=$?
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/wyn_143_cold_start_test.sh supabase/tests/wyn_144_feed_quality_test.sh sql_failure_diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'fix: align WYN-144 precomputed quality harness'
            git push origin HEAD:fix/ci-reconcile-20260912
          fi

          exit "$status"
