name: SQL diagnostic 2026-09-12

on:
  push:
    branches: [fix/ci-reconcile-20260912]
    paths:
      - '.github/workflows/sql-diagnostic-20260912.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-reconcile-20260912

      - name: Run maintained SQL tests and persist exact first failure
        shell: bash
        run: |
          set -euo pipefail
          ci_bin="$RUNNER_TEMP/wynos-db-ci-bin"
          mkdir -p "$ci_bin"

          cat > "$ci_bin/psql" <<'EOF'
          #!/usr/bin/env bash
          set +e
          capture="${RUNNER_TEMP}/wynos-psql-capture-$$.out"
          /usr/bin/psql "$@" >"$capture" 2>&1
          status=$?
          cat "$capture"
          if [ "$status" -ne 0 ]; then
            cp "$capture" "${RUNNER_TEMP}/wynos-last-psql-failure.out"
          fi
          rm -f "$capture"
          exit "$status"
          EOF

          cat > "$ci_bin/sudo" <<'EOF'
          #!/usr/bin/env bash
          set -e
          if [ "${1:-}" = "-u" ] && [ "${2:-}" = "postgres" ]; then
            shift 2
            if [ "${1:-}" = "psql" ] && [ -f "${RUNNER_TEMP}/wynos-last-psql-failure.out" ]; then
              cat "${RUNNER_TEMP}/wynos-last-psql-failure.out" >&2
              exit 1
            fi
            exec "$@"
          fi
          exec /usr/bin/sudo "$@"
          EOF

          chmod +x "$ci_bin/psql" "$ci_bin/sudo"
          export PATH="$ci_bin:$PATH"

          failed=""
          : > /tmp/sql-suite.log
          for test_script in supabase/tests/*.sh; do
            if [ "$test_script" = "supabase/tests/wyn_038_view_counting_test.sh" ]; then
              continue
            fi
            echo "===== RUN $test_script =====" | tee -a /tmp/sql-suite.log
            set +e
            bash "$test_script" 2>&1 | tee -a /tmp/sql-suite.log
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -ne 0 ]; then
              failed="$test_script"
              break
            fi
          done

          if [ -z "$failed" ]; then
            printf 'ALL_MAINTAINED_SQL_TESTS_PASSED\n' > sql_failure_diagnostic.txt
          else
            {
              printf 'FAILED_SCRIPT=%s\n' "$failed"
              printf '%s\n' '--- LAST 240 LINES ---'
              tail -n 240 /tmp/sql-suite.log
            } > sql_failure_diagnostic.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql_failure_diagnostic.txt
          git commit -m 'chore(ci): record SQL diagnostic result'
          git push origin HEAD:fix/ci-reconcile-20260912

          if [ -n "$failed" ]; then
            exit 1
          fi
