name: SQL diagnostic 2026-09-12

on:
  push:
    branches:
      - fix/ci-reconcile-20260912
    paths:
      - '.github/workflows/sql-diagnostic-20260912.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-reconcile-20260912

      - name: Run maintained SQL suite and persist first failure
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/sql_ci_diagnostic_20260912.sh
          set +e
          bash tools/sql_ci_diagnostic_20260912.sh
          status=$?
          set -e

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sql_failure_diagnostic.txt
          if ! git diff --cached --quiet; then
            git commit -m 'chore(ci): record SQL diagnostic result'
            git push origin HEAD:fix/ci-reconcile-20260912
          fi

          exit "$status"
