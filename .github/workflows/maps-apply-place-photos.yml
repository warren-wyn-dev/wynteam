name: Maps -- apply place photos v1

# Applies supabase/migrations_wynos_maps_place_photos_v1.sql: private
# place-photos bucket, wynos_place_photos table, storage policies and RPCs.
# Additive only. Manual dispatch on main only, after the Founder approves
# the production migration.
# Behaviour test: supabase/tests/wynos_maps_place_photos_test.sh.
# ROLLBACK: see the header of the migration file.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-MAPS-PLACE-PHOTOS to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-MAPS-PLACE-PHOTOS'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_maps_place_photos_v1.sql)
          commit;" >/dev/null
          # Definitions and privileges only; no personal data is read.
          run_sql "select
              (select relrowsecurity from pg_class where oid = 'public.wynos_place_photos'::regclass) as rls_on,
              has_table_privilege('authenticated', 'public.wynos_place_photos', 'select') as auth_table_select,
              (select public from storage.buckets where id = 'place-photos') as bucket_public,
              (select count(*) from pg_policies where schemaname = 'storage' and tablename = 'objects' and policyname like 'Place photos%') as storage_policies,
              has_function_privilege('anon', 'public.wynos_place_photos(text)', 'execute') as anon_list,
              has_function_privilege('authenticated', 'public.submit_wynos_place_photo(text,text,integer,integer)', 'execute') as auth_submit,
              has_function_privilege('authenticated', 'public.admin_review_wynos_place_photo(uuid,text)', 'execute') as auth_review_grant;" \
            | tee result.json | jq .
          jq -e '.[0].rls_on == true and .[0].auth_table_select == false and .[0].bucket_public == false
                 and .[0].storage_policies == 3 and .[0].anon_list == false and .[0].auth_submit == true
                 and .[0].auth_review_grant == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "WYNOS Maps place photos are installed. Next: redeploy validate-upload so it also checks place-photos."
