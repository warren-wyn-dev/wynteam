name: Web Beta2 -- apply user_preferences (WYN-188/189)

# Applies supabase/migrations_web_beta2_user_preferences.sql to production.
# Runs only by manual dispatch after the Founder approves this migration
# (AGENTS.md Change Control). Validated in CI by
# supabase/tests/web_beta2_user_preferences_test.sh (applied twice).
#
# SAFETY: additive only. One new owner-only table plus an updated_at trigger.
# No existing table or data is changed.
# ROLLBACK (Founder, SQL editor), if ever needed:
#   drop table if exists public.user_preferences;
#   drop function if exists internal.touch_user_preferences();
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "$(cat supabase/migrations_web_beta2_user_preferences.sql)" >/dev/null
          run_sql "select
              (select relrowsecurity from pg_class where oid = 'public.user_preferences'::regclass) as rls_enabled,
              (select count(*) from pg_policies where schemaname = 'public' and tablename = 'user_preferences') as policies,
              (select has_table_privilege('anon', 'public.user_preferences', 'select')) as anon_can_select;" | tee result.json | jq .
          jq -e '.[0].rls_enabled == true and (.[0].policies|tonumber) == 3 and .[0].anon_can_select == false' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "user_preferences is live."
