name: Web Beta1 Signup Security QA

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-beta1-signup-security-qa.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-beta1-signup-security-qa.yml'

permissions:
  contents: read

jobs:
  signup-security:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_for_mocked_auth_only
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run focused signup security regressions
        run: npx playwright test tests/browser/signup-security.spec.ts tests/browser/password-recovery.spec.ts
      - name: Upload focused test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-beta1-auth-test-results
          path: web/test-results/
          retention-days: 3
