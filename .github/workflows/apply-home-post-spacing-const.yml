name: Apply Home post spacing const fix

on:
  push:
    branches:
      - fix/home-post-symmetric-spacing
    paths:
      - .github/workflows/apply-home-post-spacing-const.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-post-symmetric-spacing

      - name: Add const to balanced padding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('app/lib/features/home/presentation/widgets/home_drop_card.dart'),
              Path('app/lib/features/home/presentation/widgets/home_pop_card.dart'),
          ]
          old = "padding: EdgeInsets.fromLTRB(\n            0,\n            WynSpacing.space2,\n            0,\n            WynSpacing.space2,\n          ),"
          new = "padding: const EdgeInsets.fromLTRB(\n            0,\n            WynSpacing.space2,\n            0,\n            WynSpacing.space2,\n          ),"

          for path in files:
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Balanced spacing block not found in {path}')
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "warren-wyn-dev"
          git config user.email "warren.wyn.dev@gmail.com"
          git add app/lib/features/home/presentation/widgets/home_drop_card.dart app/lib/features/home/presentation/widgets/home_pop_card.dart
          git commit -m "fix(feed): make balanced spacing const"
          git push origin HEAD:fix/home-post-symmetric-spacing
