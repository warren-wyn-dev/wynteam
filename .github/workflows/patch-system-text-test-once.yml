name: Patch DOM typography test compatibility once
on:
  push:
    branches: [ops/apply-system-font-dom-fix-20260913]
    paths: [.github/workflows/patch-system-text-test-once.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-system-text-all
          fetch-depth: 0
      - name: Update WYN-079 test for custom DOM undo button
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/test/home_feed_screen_test.dart')
          s = p.read_text()
          old = ("        final undoAction = find.widgetWithText(SnackBarAction, 'เลิกทำ');\n"
                 "        tester.widget<SnackBarAction>(undoAction).onPressed();\n")
          new = ("        final undoButton = find.widgetWithText(TextButton, 'เลิกทำ');\n"
                 "        tester.widget<TextButton>(undoButton).onPressed!();\n")
          if old not in s:
              raise SystemExit('Expected WYN-079 SnackBarAction test snippet not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/test/home_feed_screen_test.dart
          git commit -m 'test(web): update undo finder for system text snackbar'
          git push origin HEAD:feat/web-system-text-all
