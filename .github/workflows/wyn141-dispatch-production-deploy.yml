name: WYN-141 dispatch production deploy

on:
  push:
    branches:
      - ops/wyn141-production-deploy
    paths:
      - .github/workflows/wyn141-dispatch-production-deploy.yml

permissions:
  actions: write
  contents: read

# Dispatch marker: profile avatar/nav hotfix 2026-09-10
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production web deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo ${{ github.repository }} --ref main
