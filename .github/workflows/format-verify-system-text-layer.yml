name: Format and verify expanded web system text layer

on:
  push:
    branches:
      - feat/web-system-text-all
    paths:
      - .github/workflows/format-verify-system-text-layer.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-system-text-all
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - name: Format compatibility layer
        working-directory: app
        run: |
          dart format \
            lib/core/typography/browser_system_text_stub.dart \
            lib/core/typography/browser_system_text_web.dart \
            lib/core/typography/browser_system_picker.dart \
            lib/core/typography/browser_system_picker_stub.dart \
            lib/core/typography/browser_system_picker_web.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib/core/typography
          git commit -m 'style(web): format system text compatibility layer'
          git push origin HEAD:feat/web-system-text-all
      - name: Verify layer
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter build web --release
