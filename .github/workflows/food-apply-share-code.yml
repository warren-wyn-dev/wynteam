name: Food -- apply short share links

# Applies supabase/migrations_wynos_food_share_code_v1.sql: every store gets a
# fixed random 6-character share_code (assigned by the database, never
# changeable through the API), food_store_id_by_share_code(text) resolves a
# code to a published, non-suspended store id for food.wynos.online/s/<code>,
# and food_store_share_preview also returns the code. Additive; old
# /?store=<uuid> links keep working. Founder approved 2026-10-05. Manual
# dispatch on main only. The web code keeps sharing /?store=<uuid> until this
# has run.
# Behaviour test: supabase/tests/wynos_food_share_code_test.sh.
# ROLLBACK: see the header of the migration file.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-FOOD-SHARE-CODE to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-FOOD-SHARE-CODE'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_food_share_code_v1.sql)
          commit;" >/dev/null
          # Counts, definitions and privileges only; no store data is read.
          run_sql "select
              (select count(*) from public.food_stores where share_code is null) as missing_codes,
              (select count(*) - count(distinct share_code) from public.food_stores) as duplicate_codes,
              has_function_privilege('anon', 'public.food_store_id_by_share_code(text)', 'execute') as anon_resolve,
              has_function_privilege('anon', 'internal.food_new_share_code()', 'execute') as anon_generator,
              (pg_get_functiondef('public.food_store_id_by_share_code(text)'::regprocedure) like '%admin_suspended_at is null%') as hides_suspended,
              has_function_privilege('anon', 'public.food_store_share_preview(uuid)', 'execute') as anon_preview;" \
            | tee result.json | jq .
          jq -e '.[0].missing_codes == 0 and .[0].duplicate_codes == 0 and .[0].anon_resolve == true
                 and .[0].anon_generator == false and .[0].hides_suspended == true and .[0].anon_preview == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "Food short share links are installed."
