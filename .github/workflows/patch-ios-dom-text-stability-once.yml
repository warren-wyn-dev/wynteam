name: Patch iOS Web DOM text stability once

'on':
  push:
    branches:
      - fix/ios-web-dom-text-stability-20260913
    paths:
      - '.github/workflows/patch-ios-dom-text-stability-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-web-dom-text-stability-20260913

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Apply patch
        run: |
          python3 tools/patch_ios_dom_text_stability.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/test/ios_web_dom_stability_source_test.dart')
          text = path.read_text()
          text = text.replace(
              'contains("RegExp(r\'iPhone|iPad|iPod\'")',
              'contains("r\'iPhone|iPad|iPod\'")',
          )
          path.write_text(text)
          PY

      - name: Format and verify
        working-directory: app
        run: |
          dart format \
            lib/core/typography/browser_system_text_web.dart \
            lib/core/typography/native_emoji_web.dart \
            test/ios_web_dom_stability_source_test.dart
          flutter pub get
          flutter analyze
          flutter test test/ios_web_dom_stability_source_test.dart

      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/lib/core/typography/browser_system_text_web.dart \
            app/lib/core/typography/native_emoji_web.dart \
            app/test/ios_web_dom_stability_source_test.dart
          git diff --cached --check
          git commit -m 'fix(web): avoid DOM text platform views on iOS'
          git push origin HEAD:fix/ios-web-dom-text-stability-20260913
