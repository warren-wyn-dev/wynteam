name: Web Beta2 -- apply Club chat actions (WYN-135)

# Manual-only production migration. Requires explicit Founder approval.
# PR CI and hosted Preview never apply schema; previews share the public DB.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Require separate Founder approval for production SQL
        run: |
          grep -Fq 'APPROVED WYN-135 production SQL' .wyn/company/APPROVALS.md ||
            { echo "::error::WYN-135 SQL is staged, not approved for production."; exit 1; }
      - name: Apply and verify WYN-135 SQL
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_ACCESS_TOKEN" ||
            { echo "::error::Missing database secrets"; exit 1; }
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local response code body
            body=$(jq -n --arg q "$1" '{query: $q}')
            response=$(mktemp)
            code=$(curl -sS -o "$response" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Supabase SQL HTTP $code"; cat "$response"; rm -f "$response"; return 1
            fi
            cat "$response"; rm -f "$response"
          }
          run_sql "$(cat supabase/migrations_web_beta2_club_chat_actions.sql)" >/dev/null
          run_sql "select
            (select count(*) from information_schema.columns
             where table_schema='public' and table_name='club_channel_messages'
             and column_name in ('edited_at','pinned_at','pinned_by')) as columns,
            (select count(*) from pg_indexes
             where schemaname='public' and indexname in
              ('club_channel_messages_fts_idx','club_channel_messages_pinned_idx')) as indexes,
            (select count(*) from pg_proc where pronamespace='public'::regnamespace
             and proname in ('edit_club_channel_message',
              'set_club_channel_message_pin','search_club_channel_messages')) as rpcs;" |
            tee result.json | jq .
          jq -e '.[0].columns == 3 and .[0].indexes == 2 and .[0].rpcs == 3' result.json >/dev/null ||
            { echo "::error::WYN-135 post-migration checks failed"; exit 1; }
