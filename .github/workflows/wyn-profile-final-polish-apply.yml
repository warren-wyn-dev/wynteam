name: WYN Profile Final Polish Apply

on:
  push:
    branches:
      - wyn/profile-final-cover-polish
    paths:
      - .github/workflows/wyn-profile-final-polish-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wyn/profile-final-cover-polish

      - name: Apply approved Profile mockup polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          metrics = Path('app/lib/core/design/wynos_founder_metrics.dart')
          text = metrics.read_text()
          old = 'static const double profileCoverExpandedHeight = 108;'
          new = 'static const double profileCoverExpandedHeight = 121;'
          if old not in text:
              raise SystemExit(f'Expected cover height token not found: {old}')
          metrics.write_text(text.replace(old, new, 1))

          screen = Path('app/lib/features/profile/presentation/view_profile_screen.dart')
          text = screen.read_text()
          old = '''          Positioned(\n            top: topInset,\n            left: 0,\n            right: 0,\n            height: kToolbarHeight,'''
          new = '''          Positioned(\n            top: topInset,\n            left: 16,\n            right: 0,\n            height: kToolbarHeight,'''
          if old not in text:
              raise SystemExit('Expected Profile cover title positioning block not found')
          screen.write_text(text.replace(old, new, 1))
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Format
        run: dart format app/lib/core/design/wynos_founder_metrics.dart app/lib/features/profile/presentation/view_profile_screen.dart

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Focused Profile regression tests
        working-directory: app
        run: |
          flutter test \
            test/wynos_founder_profile_header_test.dart \
            test/view_profile_screen_test.dart \
            test/view_profile_screen_scroll_test.dart

      - name: Commit polished Profile UI and remove helper workflow
        run: |
          rm .github/workflows/wyn-profile-final-polish-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/core/design/wynos_founder_metrics.dart \
                  app/lib/features/profile/presentation/view_profile_screen.dart \
                  .github/workflows/wyn-profile-final-polish-apply.yml
          git commit -m "fix(ui): match approved Profile cover mockup"
          git push origin HEAD:wyn/profile-final-cover-polish
