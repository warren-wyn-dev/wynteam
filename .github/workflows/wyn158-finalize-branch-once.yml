name: Finalize WYN-158 branch once

'on':
  push:
    branches:
      - feat/wyn-158-nextjs-consumer-web
    paths:
      - '.github/workflows/wyn158-finalize-branch-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wyn-158-nextjs-consumer-web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic consumer web lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Record approval and finalize CI
        run: python3 scripts/wyn158_finalize_once.py
      - name: Remove one-shot helpers and commit
        run: |
          rm .github/workflows/wyn158-finalize-branch-once.yml
          rm scripts/wyn158_finalize_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .wyn/company/APPROVALS.md .wyn/company/DECISIONS.md web/package-lock.json .github/workflows/web-next-ci.yml .github/workflows/wyn158-finalize-branch-once.yml scripts/wyn158_finalize_once.py
          git commit -m 'chore(web): record WYN-158 architecture approval'
          git push origin HEAD:feat/wyn-158-nextjs-consumer-web
