name: WYNOS Web Beta 2 Baseline Certification

on:
  push:
    branches:
      - web-beta2
    paths:
      - '.github/workflows/web-beta2-baseline-certify.yml'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed on branch and Staging Supabase
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_url=$(clean "$STAGING_SUPABASE_URL"); stage_url=${stage_url%/}
          test "$GITHUB_REF" = "refs/heads/web-beta2"
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"
          test -n "$(clean "$STAGING_SUPABASE_PUBLISHABLE_KEY")"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Re-run the only failed full-suite case
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npx playwright test tests/browser/home-scroll-chrome.spec.ts --project=webkit-iphone

  deploy:
    needs: certify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy exact certified commit to Beta 2 Staging only
        id: deploy
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_url=$(clean "$STAGING_SUPABASE_URL"); stage_url=${stage_url%/}
          stage_project=$(clean "$STAGING_VERCEL_PROJECT_ID")
          prod_project=$(clean "$PRODUCTION_VERCEL_PROJECT_ID")
          org_id=$(clean "$VERCEL_ORG_ID")
          token=$(clean "$VERCEL_TOKEN")
          test "$GITHUB_REF" = "refs/heads/web-beta2"
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"
          test "$stage_project" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$prod_project" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$stage_project" != "$prod_project"

          export VERCEL_PROJECT_ID="$stage_project"
          export VERCEL_ORG_ID="$org_id"
          firebase_args=()
          append_env() {
            local name="$1" value
            value=$(clean "$2")
            test -n "$value" || { echo "::error::Missing $name"; exit 1; }
            firebase_args+=(--build-env "$name=$value" --env "$name=$value")
          }
          append_env NEXT_PUBLIC_FIREBASE_API_KEY "$FIREBASE_WEB_API_KEY"
          append_env NEXT_PUBLIC_FIREBASE_APP_ID "$FIREBASE_WEB_APP_ID"
          append_env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FIREBASE_MESSAGING_SENDER_ID"
          append_env NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          append_env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FIREBASE_AUTH_DOMAIN"
          append_env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FIREBASE_STORAGE_BUCKET"
          append_env NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FIREBASE_VAPID_KEY"

          url=$(npx --yes vercel@60.1.3 deploy --yes \
            --token="$token" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --build-env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            --env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            "${firebase_args[@]}" | tail -n 1)
          case "$url" in https://*.vercel.app) ;; *) echo "::error::Unexpected deployment URL"; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Certified Beta 2 Staging: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Temporary protection bypass
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bypass=$(openssl rand -hex 16)
          echo "::add-mask::$bypass"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"generate\":{\"secret\":\"$bypass\",\"note\":\"WYNOS Beta2 baseline certify $GITHUB_RUN_ID\"}}" >/dev/null

      - name: Hosted parity smoke
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          smoke_route() {
            local route="$1" url="$PREVIEW_URL$route" hop code location
            for hop in 1 2 3 4; do
              rm -f /tmp/headers /tmp/route.html
              code=$(curl --silent --show-error --max-time 30 \
                --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                --dump-header /tmp/headers --output /tmp/route.html --write-out '%{http_code}' "$url")
              if [ "$code" = "200" ]; then
                grep -q '/_next/' /tmp/route.html || {
                  echo "::error::$route final response is not the WYNOS Next.js app"
                  exit 1
                }
                return 0
              fi
              case "$code" in 301|302|303|307|308) ;; *)
                echo "::error::$route returned HTTP $code"
                exit 1
              esac
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/headers)
              test -n "$location" || { echo "::error::$route redirected without Location"; exit 1; }
              case "$location" in
                /*) url="$PREVIEW_URL$location" ;;
                "$PREVIEW_URL"/*) url="$location" ;;
                *) echo "::error::$route tried to redirect outside the certified Preview"; exit 1 ;;
              esac
            done
            echo "::error::$route exceeded four redirects"
            exit 1
          }

          routes=(/ /home /search /notifications /chat /settings /profile/me /clubs /bookmarks /login /signup/step-1)
          for route in "${routes[@]}"; do smoke_route "$route"; done

          html=$(curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/")
          grep -q 'yydgdapzlrjmlrjgijkj.supabase.co' <<< "$html"
          ! grep -q 'kqokpocajhfbidcxpvhh.supabase.co' <<< "$html"

          curl --silent --show-error --fail --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --output /tmp/push.json "$PREVIEW_URL/api/push-config"
          node -e 'const c=require("/tmp/push.json"); process.exit(c.configured===true?0:1)'

      - name: Revoke temporary bypass
        if: always()
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" || exit 0
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"revoke\":{\"secret\":\"$VERCEL_AUTOMATION_BYPASS_SECRET\",\"regenerate\":false}}" >/dev/null
