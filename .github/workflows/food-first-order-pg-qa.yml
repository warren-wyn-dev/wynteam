name: Food First-Order Promotion PostgreSQL QA
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261009120000_food_first_order_merchant_funded.sql'
      - 'supabase/tests/wynos_platform_campaigns_test.sh'
      - '.github/workflows/food-first-order-pg-qa.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Run merchant campaign and first-order database integration
        run: bash supabase/tests/wynos_platform_campaigns_test.sh
