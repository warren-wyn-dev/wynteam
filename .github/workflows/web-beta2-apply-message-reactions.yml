name: Web Beta2 -- apply message reactions + delete-for-me (WYN-159)

# Applies supabase/migrations_web_beta2_message_reactions.sql to production.
# Runs only by manual dispatch after the Founder approves this migration
# (AGENTS.md Change Control). Validated in CI by
# supabase/tests/web_beta2_message_reactions_test.sh (applied twice).
#
# SAFETY: additive only. Two new tables (message_reactions, message_hides) and two
# RPCs (set_message_reaction, hide_message_for_me), developer-gated while in Beta2.
# No existing table, row, policy or function is changed.
# ROLLBACK (Founder, SQL editor), if ever needed:
#   drop function if exists public.hide_message_for_me(uuid);
#   drop function if exists public.set_message_reaction(uuid, text);
#   drop table if exists public.message_hides;
#   drop table if exists public.message_reactions;
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "$(cat supabase/migrations_web_beta2_message_reactions.sql)" >/dev/null
          run_sql "select
              (select relrowsecurity from pg_class where oid = 'public.message_reactions'::regclass) as reactions_rls,
              (select relrowsecurity from pg_class where oid = 'public.message_hides'::regclass) as hides_rls,
              (select count(*) from pg_policies where schemaname = 'public' and tablename in ('message_reactions', 'message_hides')) as policies,
              (select has_table_privilege('authenticated', 'public.message_reactions', 'insert')) as client_can_insert,
              (select has_table_privilege('anon', 'public.message_reactions', 'select')) as anon_can_select,
              (select count(*) from pg_proc where proname in ('set_message_reaction', 'hide_message_for_me') and pronamespace = 'public'::regnamespace) as rpcs;" | tee result.json | jq .
          jq -e '.[0].reactions_rls == true and .[0].hides_rls == true and (.[0].policies|tonumber) == 2 and .[0].client_can_insert == false and .[0].anon_can_select == false and (.[0].rpcs|tonumber) == 2' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "message reactions + delete-for-me are live (developer-only while in Beta2)."
