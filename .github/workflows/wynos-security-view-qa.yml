name: WYNOS Security View Release Script QA

on:
  pull_request:
    paths:
      - 'supabase/**'
      - '.github/scripts/apply-wynos-security-views.sh'
      - '.github/workflows/wynos-security-views-manual.yml'
      - '.github/workflows/wynos-security-view-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  founder-release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n .github/scripts/apply-wynos-security-views.sh
      - name: Reject live DDL without exact Founder confirmation
        env:
          GITHUB_REF: refs/heads/main
          STAGE: WYN188
          DRY_RUN: 'false'
          CONFIRMATION: ''
          PROJECT_REF_CONFIRM: aaaaaaaaaaaaaaaaaaaa
          SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          SUPABASE_ACCESS_TOKEN: synthetic-test-only
        run: |
          if bash .github/scripts/apply-wynos-security-views.sh > "$RUNNER_TEMP/refusal.log" 2>&1; then
            echo "::error::Live migration script accepted missing confirmation"
            exit 1
          fi
          grep -q "Exact stage confirmation phrase missing" "$RUNNER_TEMP/refusal.log"
          echo "Live migration refusal PASS; zero network requests."
      - name: Reject project mismatch before any network call
        env:
          GITHUB_REF: refs/heads/main
          STAGE: WYN188
          DRY_RUN: 'true'
          CONFIRMATION: ''
          PROJECT_REF_CONFIRM: wrong
          SUPABASE_URL: https://aaaaaaaaaaaaaaaaaaaa.supabase.co
          SUPABASE_ACCESS_TOKEN: synthetic-test-only
        run: |
          if bash .github/scripts/apply-wynos-security-views.sh > "$RUNNER_TEMP/mismatch.log" 2>&1; then
            echo "::error::Migration script accepted mismatched Supabase project"
            exit 1
          fi
          grep -q "project ref does not match" "$RUNNER_TEMP/mismatch.log"
          echo "Project mismatch refusal PASS; zero network requests."
      - name: Manual-only workflow and safe dry-run default
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          w = Path('.github/workflows/wynos-security-views-manual.yml').read_text()
          assert re.search(r'(?m)^on:\n  workflow_dispatch:', w)
          assert not re.search(r'(?m)^  (?:push|pull_request|schedule):', w)
          assert re.search(r'(?m)^        default: true$', w)
          assert "github.ref == 'refs/heads/main'" in w
          assert "cancel-in-progress: false" in w
          print("Manual-only release controls PASS")
          PY
