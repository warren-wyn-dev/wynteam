name: Deploy Admin (Next.js) to Vercel

# Manual-only. Preview is the default; Production requires explicit typed
# confirmation. Never create another Vercel project to bypass a quota error.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment environment"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
      confirm_production:
        description: "For production only, type DEPLOY_ADMIN_PRODUCTION"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      # Exact existing WYNOS Admin project, verified against the Vercel project API.
      # These public IDs scope the deployment without an untracked .vercel/project.json.
      VERCEL_ORG_ID: team_Kamt1PUT5XKn9MWrF404re1w
      VERCEL_PROJECT_ID: prj_Ca3SJBvzn0K4w8t0bwQn13EDbVh5
      VERCEL_TEAM_SLUG: warren14
      DEPLOY_TARGET: ${{ inputs.target }}
      CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify requested environment
        run: |
          set -euo pipefail
          case "$DEPLOY_TARGET" in
            preview) echo "Admin preview requested. Production aliases will not change." ;;
            production)
              if [ "$CONFIRM_PRODUCTION" != "DEPLOY_ADMIN_PRODUCTION" ]; then
                echo "::error::Production requires confirm_production=DEPLOY_ADMIN_PRODUCTION."
                exit 1
              fi
              ;;
            *) echo "::error::Invalid deployment target"; exit 1 ;;
          esac
          test "$VERCEL_ORG_ID" = "team_Kamt1PUT5XKn9MWrF404re1w"
          test "$VERCEL_PROJECT_ID" = "prj_Ca3SJBvzn0K4w8t0bwQn13EDbVh5"
          # Explicitly link this clean CI checkout to the existing Admin project;
          # never let the CLI create or infer a different project by directory.
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - name: Deploy existing Admin project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          VERCEL_TOKEN=$(clean "$VERCEL_TOKEN")
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_PUBLISHABLE_KEY=$(clean "$SUPABASE_PUBLISHABLE_KEY")
          for name in VERCEL_TOKEN SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Required GitHub Actions secret $name is not available"
              exit 1
            fi
          done
          args=()
          if [ "$DEPLOY_TARGET" = production ]; then args+=(--prod); fi

          # Do not pass --name or project-creation options: the exact pre-existing
          # Vercel project is locked by VERCEL_ORG_ID and VERCEL_PROJECT_ID.
          npx --yes vercel@latest deploy "${args[@]}" --yes \
            --scope "$VERCEL_TEAM_SLUG" \
            --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
