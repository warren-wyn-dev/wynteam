name: Deploy Admin (Next.js) to Vercel

# Manual-only, same reasoning as deploy-web.yml: the connected Vercel
# account is on the free Hobby plan (100 deployments/day, shared across
# every project in the account). Run it by hand from the Actions tab
# ("Run workflow") whenever admin/ is ready to try or ship.
#
# First run ever for this app: no Vercel project exists yet for `admin/`
# (only the Flutter web app has one, see deploy-web.yml). `vercel deploy`
# creates one automatically on its first invocation in a directory with
# no linked `.vercel/project.json` -- no dashboard setup needed first.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      # Next.js is a framework Vercel builds natively -- unlike
      # deploy-web.yml's Flutter build, there's no local build step here;
      # `vercel deploy` uploads the source and builds it on Vercel's own
      # infrastructure using the env vars below.
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Same Supabase project as the Flutter app (Shared Backend
          # decision, .wyn/company/DECISIONS.md 2026-08-14) -- reusing
          # deploy-web.yml's existing secrets rather than duplicating them
          # under new names.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          VERCEL_TOKEN=$(clean "$VERCEL_TOKEN")
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_PUBLISHABLE_KEY=$(clean "$SUPABASE_PUBLISHABLE_KEY")

          # --build-env: available while Next.js compiles, which is when
          # NEXT_PUBLIC_* values get inlined into the bundle.
          # --env: available at request time too, in case any server
          # code reads process.env directly instead of through the
          # build-time inline (Next statically replaces NEXT_PUBLIC_*
          # either way, but this costs nothing extra to also set).
          npx --yes vercel@latest deploy --prod --yes \
            --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
