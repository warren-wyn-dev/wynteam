name: QA iOS Web image stress once

on:
  push:
    branches:
      - main
      - fix/ios-web-image-stability-20260913
    paths:
      - '.github/workflows/qa-ios-web-image-stress-once.yml'
      - 'app/lib/core/widgets/network_thumbnail.dart'
      - 'app/lib/core/widgets/post_media.dart'
      - 'app/lib/features/profile/presentation/widgets/avatar_circle.dart'

permissions:
  contents: read

jobs:
  ios-web-image-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Build WYNOS image stress harness
        shell: bash
        working-directory: app
        run: |
          flutter pub get
          cat > lib/qa_ios_image_stress.dart <<'DART'
          import 'dart:html' as html;

          import 'package:flutter/material.dart';

          import 'core/widgets/network_thumbnail.dart';
          import 'core/widgets/post_media.dart';
          import 'features/profile/presentation/widgets/avatar_circle.dart';

          void main() {
            html.document.documentElement?.setAttribute(
              'data-wyn-image-strategy',
              wynNetworkImageStrategy.name,
            );
            runApp(const _StressApp());
          }

          class _StressApp extends StatelessWidget {
            const _StressApp();

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  body: ListView.builder(
                    itemCount: 180,
                    itemBuilder: (context, index) {
                      final url = Uri.base
                          .resolve('stress/${index % 18}.jpg')
                          .toString();
                      switch (index % 3) {
                        case 0:
                          return SizedBox(
                            height: 300,
                            width: double.infinity,
                            child: PostImage(imageUrl: url),
                          );
                        case 1:
                          return SizedBox(
                            height: 220,
                            width: double.infinity,
                            child: NetworkThumbnail(imageUrl: url),
                          );
                        default:
                          return SizedBox(
                            height: 96,
                            child: Center(
                              child: AvatarCircle(
                                imageUrl: url,
                                fallbackText: 'WYNOS $index',
                                radius: 22,
                              ),
                            ),
                          );
                      }
                    },
                  ),
                ),
              );
            }
          }
          DART
          flutter build web --release --no-wasm-dry-run \
            --dart-define=WYN_QA_FORCE_IOS_WEB_IMAGE_STRATEGY=true \
            -t lib/qa_ios_image_stress.dart

      - name: Generate large raster fixtures
        shell: bash
        working-directory: app
        run: |
          python3 -m pip install --quiet pillow
          mkdir -p build/web/stress
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          out = Path('build/web/stress')
          for i in range(18):
              image = Image.new('RGB', (1600, 1600), ((31*i)%255, (67*i)%255, (113*i)%255))
              draw = ImageDraw.Draw(image)
              for y in range(0, 1600, 32):
                  draw.line((0, y, 1599, (y + i*29) % 1600), fill=((i*97+y)%255, (i*43+y//2)%255, (i*17+y//3)%255), width=6)
              image.save(out / f'{i}.jpg', quality=94, optimize=True)
          PY

      - name: Install WebKit
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit

      - name: Stress actual WYNOS image widgets through HTML images
        shell: bash
        working-directory: app
        run: |
          python3 -m http.server 8787 --directory build/web >/tmp/wynos-qa-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          cat > /tmp/wynos-ios-image-stress.js <<'NODE'
          const { webkit } = require(process.env.GITHUB_WORKSPACE + '/node_modules/playwright');

          (async () => {
            const browser = await webkit.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              screen: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              locale: 'th-TH',
              timezoneId: 'Asia/Bangkok',
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            let crashed = false;
            let navigations = 0;
            const errors = [];
            page.on('crash', () => { crashed = true; errors.push('page-crash'); });
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', message => console.log(`browser: ${message.type()}: ${message.text()}`));
            page.on('framenavigated', frame => {
              if (frame === page.mainFrame()) navigations++;
            });

            await page.goto('http://127.0.0.1:8787/', {
              waitUntil: 'domcontentloaded',
              timeout: 60000,
            });
            await page.waitForFunction(
              () => document.documentElement.getAttribute('data-wyn-image-strategy') === 'prefer',
              null,
              { timeout: 30000 },
            );
            await page.waitForTimeout(3000);

            const strategy = await page.getAttribute('html', 'data-wyn-image-strategy');
            const initialNavigations = navigations;
            await page.evaluate(() => { window.__wynStressMarker = 'alive'; });

            // Repeatedly create/dispose image-heavy rows. This is closer to the
            // real feed failure than a one-shot Welcome-page smoke test.
            for (let cycle = 0; cycle < 5; cycle++) {
              for (let i = 0; i < 70; i++) {
                await page.mouse.wheel(0, 560);
                await page.waitForTimeout(70);
              }
              for (let i = 0; i < 70; i++) {
                await page.mouse.wheel(0, -560);
                await page.waitForTimeout(70);
              }
            }
            await page.waitForTimeout(8000);

            const marker = await page.evaluate(() => window.__wynStressMarker || null);
            const finalNavigations = navigations - initialNavigations;
            const imageRequests = await page.evaluate(() =>
              performance.getEntriesByType('resource')
                .map(e => e.name)
                .filter(name => name.includes('/stress/') && name.endsWith('.jpg')).length
            );
            const platformViews = await page.locator('flt-platform-view').count();
            const htmlImages = await page.locator('img').count();

            console.log(JSON.stringify({
              strategy,
              crashed,
              finalNavigations,
              marker,
              imageRequests,
              platformViews,
              htmlImages,
              errors,
            }, null, 2));

            if (strategy !== 'prefer') throw new Error(`Expected HTML image strategy prefer, got ${strategy}`);
            if (crashed) throw new Error('WebKit page crashed under WYNOS image stress');
            if (finalNavigations !== 0) throw new Error(`Unexpected reload/navigation count: ${finalNavigations}`);
            if (marker !== 'alive') throw new Error('JS document was replaced during stress test');
            if (imageRequests < 12) throw new Error(`Too few stress images loaded: ${imageRequests}`);
            if (platformViews < 1 && htmlImages < 1) {
              throw new Error('HTML image platform views were not created');
            }
            if (errors.length) throw new Error(errors.join(' | '));

            await context.close();
            await browser.close();
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE

          node /tmp/wynos-ios-image-stress.js
