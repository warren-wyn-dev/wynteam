name: Consumer Web Phase 4 Browser QA

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-phase4-browser-qa.yml'
  push:
    branches:
      - feat/wyn-158-phase4-parity-qa
    paths:
      - 'web/**'
      - '.github/workflows/web-phase4-browser-qa.yml'

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Bootstrap Home visual-regression baselines (WYN-158, one-time)
        run: npx playwright test home-visual-parity --update-snapshots
      - name: Phase 4 browser QA
        run: npm run qa:browser
      - name: Commit real WebKit/Chromium Home baselines (WYN-158, one-time)
        if: success() && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/browser/home-visual-parity.spec.ts-snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "ci: commit real WebKit/Chromium Home visual baselines (WYN-158)"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 7
