name: Consumer Web Phase 4 Browser QA

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-phase4-browser-qa.yml'
  push:
    branches:
      - feat/wyn-158-phase4-parity-qa
    paths:
      - 'web/**'
      - '.github/workflows/web-phase4-browser-qa.yml'

permissions:
  contents: write

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Update visual regression baselines
        run: npm run qa:browser -- --update-snapshots
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/browser/*-snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Update visual regression baselines for compact action row"
            git push origin HEAD:"${{ github.head_ref }}"
          fi
      - name: Phase 4 browser QA
        run: npm run qa:browser
      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: web/test-results/
          retention-days: 7
