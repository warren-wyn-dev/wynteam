name: WYNOS Web Beta 2 Vercel Isolation

on:
  push:
    branches:
      - web-beta2
    paths:
      - '.github/workflows/web-beta2-vercel-isolation.yml'

permissions:
  contents: read

jobs:
  isolate:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict the dedicated Staging Vercel project to Beta 2 sources
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_project=$(clean "$STAGING_VERCEL_PROJECT_ID")
          prod_project=$(clean "$PRODUCTION_VERCEL_PROJECT_ID")
          org_id=$(clean "$VERCEL_ORG_ID")
          token=$(clean "$VERCEL_TOKEN")

          test "$stage_project" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$prod_project" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$stage_project" != "$prod_project"

          # Vercel's Ignored Build Step exits 0 to skip and non-zero to build.
          # Git-connected main/feature branches are skipped. The controlled
          # Beta 2 branch and exact-SHA CLI deploys (reported as HEAD) remain
          # allowed.
          cmd='if [ "$VERCEL_GIT_COMMIT_REF" = "web-beta2" ] || [ "$VERCEL_GIT_COMMIT_REF" = "HEAD" ]; then exit 1; else exit 0; fi'
          payload=$(jq -n --arg cmd "$cmd" '{commandForIgnoringBuildStep:$cmd}')

          curl --fail --silent --show-error --request PATCH             --url "https://api.vercel.com/v9/projects/$stage_project?teamId=$org_id"             --header "Authorization: Bearer $token"             --header 'Content-Type: application/json'             --data "$payload" > /tmp/project.json

          node - /tmp/project.json "$cmd" <<'NODE'
          const fs = require("node:fs");
          const project = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expected = process.argv[3];
          if (project.id !== "prj_70GIbp0o056AOPsVUAie9CROED7r") {
            throw new Error("Unexpected Vercel project");
          }
          if (project.commandForIgnoringBuildStep !== expected) {
            throw new Error("Vercel isolation command was not persisted");
          }
          console.log("Beta 2 Staging Vercel project now ignores non-Beta2 Git branches.");
          NODE

      - name: Confirm Production project was not modified
        env:
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          prod_project=$(printf '%s' "$PRODUCTION_VERCEL_PROJECT_ID" | tr -d '\n\r ')
          org_id=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '\n\r ')
          token=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\n\r')
          test "$prod_project" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          curl --fail --silent --show-error             --url "https://api.vercel.com/v9/projects/$prod_project?teamId=$org_id"             --header "Authorization: Bearer $token"             --output /tmp/prod.json
          node - /tmp/prod.json <<'NODE'
          const fs = require("node:fs");
          const project = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (project.id !== "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a") {
            throw new Error("Production project identity mismatch");
          }
          console.log("Production project identity verified read-only.");
          NODE
