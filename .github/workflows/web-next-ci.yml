name: Consumer Web (Next.js)

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-next-ci.yml'
      - '.github/workflows/wyn-158-production-deploy.yml'
  push:
    branches:
      - main
      - feat/wyn-158-nextjs-consumer-web
    paths:
      - 'web/**'
      - '.github/workflows/web-next-ci.yml'
      - '.github/workflows/wyn-158-production-deploy.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Follow recovery regression
        run: npm run test:follow
      - name: Feed non-blocking impression regression
        run: npm run test:feed-latency
      - name: Cross-account persisted query cache isolation
        run: npm run test:account-cache-isolation
      - name: Account switch session and cross-tab regression
        run: npm run test:account-switch
      - name: App-wide navigation, loading and cache performance regression
        run: npm run test:app-performance
      - name: People Search ranking, privacy and Thai/English regression
        run: npm run test:search
      - name: Notification realtime, Push delivery and unread-race regression
        run: npm run test:notifications
      - name: Offline Push logout fallback regression
        run: npm run test:push-offline-logout
      - name: Push toggle permission and device-registration regression
        run: npm run test:push-toggle
      - name: Shared link return-after-login regression
        run: npm run test:share-links
      - name: Android App Links statement
        run: npm run test:android-asset-links
      - name: Photo location removal and upload type regression
        run: npm run test:image-location
      - name: Maps routing and place regression
        run: npm run test:maps
      - name: Thai / English coverage and Beta2 gate regression
        run: npm run test:i18n
      - name: Stripe Connect v2 payment regression
        run: npm run test:stripe
      - name: Web Beta1 club and draft regression
        run: node --test tests/draft-hotfix.test.mjs tests/club-rpc-error.test.mjs
      - name: Production build
        run: npm run build
      - name: License/font guard
        # Text fonts remain forbidden. The helper permits only the compiler's
        # exact MaterialIcons output, with an icon-only FontManifest and OTF signature.
        run: node scripts/check-web-fonts.mjs
