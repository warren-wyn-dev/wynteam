name: Consumer Web (Next.js)

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-next-ci.yml'
  push:
    branches:
      - feat/wyn-158-nextjs-consumer-web
    paths:
      - 'web/**'
      - '.github/workflows/web-next-ci.yml'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Follow recovery regression
        run: npm run test:follow
      - name: Feed non-blocking impression regression
        run: npm run test:feed-latency
      - name: Cross-account persisted query cache isolation
        run: npm run test:account-cache-isolation
      - name: Account switch session and cross-tab regression
        run: npm run test:account-switch
      - name: App-wide navigation, loading and cache performance regression
        run: npm run test:app-performance
      - name: Notification realtime, Push delivery and unread-race regression
        run: npm run test:notifications
      - name: Offline Push logout fallback regression
        run: npm run test:push-offline-logout
      - name: Web Beta1 club and draft regression
        run: node --test tests/draft-hotfix.test.mjs tests/club-rpc-error.test.mjs
      - name: Production build
        run: npm run build
      - name: License/font guard
        run: |
          for dir in app components lib public; do
            [ -d "$dir" ] || continue
            if find "$dir" -type f \( -iname '*.ttf' -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -print -quit | grep -q .; then
              echo '::error::Consumer web source must not bundle font files; use the OS/browser system font stack.'
              exit 1
            fi
          done
          if grep -R --include='*.css' -n '@font-face' app components public 2>/dev/null; then
            echo '::error::Consumer web must not self-host fonts.'
            exit 1
          fi
