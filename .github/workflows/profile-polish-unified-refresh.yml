name: Profile polish unified refresh

on:
  push:
    branches:
      - fix/profile-polish-unified-refresh
    paths:
      - tools/profile_polish_unified_refresh_patch.py
      - .github/workflows/profile-polish-unified-refresh.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-polish-unified-refresh
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Apply profile polish patch
        run: python3 tools/profile_polish_unified_refresh_patch.py

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/features/profile/presentation/view_profile_screen.dart \
            app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart \
            app/lib/features/profile/presentation/widgets/profile_drop_grid_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_redrops_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_likes_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_refresh_coordinator.dart \
            app/lib/features/profile/presentation/widgets/suggested_follow_sheet.dart \
            app/lib/features/follow/presentation/widgets/follow_action_button.dart \
            app/lib/core/design/wynos_founder_metrics.dart

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Run profile regression tests
        working-directory: app
        run: |
          flutter test \
            test/view_profile_screen_test.dart \
            test/view_profile_screen_scroll_test.dart \
            test/qa_wyn110_profile_scroll_header_test.dart \
            test/profile_recommendation_section_test.dart \
            test/follow_list_screen_test.dart

      - name: Commit validated implementation
        run: |
          git config user.name "WYNOS UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/lib/features/profile/presentation/view_profile_screen.dart \
            app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart \
            app/lib/features/profile/presentation/widgets/profile_drop_grid_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_redrops_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_likes_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_refresh_coordinator.dart \
            app/lib/features/profile/presentation/widgets/suggested_follow_sheet.dart \
            app/lib/features/follow/presentation/widgets/follow_action_button.dart \
            app/lib/core/design/wynos_founder_metrics.dart
          git diff --cached --stat
          git commit -m "feat(profile): polish header suggestions and unified refresh"
          git push origin HEAD:fix/profile-polish-unified-refresh
