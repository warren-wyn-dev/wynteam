name: Patch web system font and emoji

on:
  push:
    branches:
      - fix/web-system-font-emoji

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-system-font-emoji

      - name: Apply focused web typography patch
        run: python3 tools/patch_web_system_font_emoji.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Format and verify
        working-directory: app
        run: |
          dart format lib test/system_typography_ios_accessibility_test.dart
          flutter pub get
          flutter analyze
          flutter test test/hashtag_text_test.dart test/system_typography_ios_accessibility_test.dart
          flutter build web --release

      - name: Commit verified patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(web): use browser system text and emoji'
          git push origin HEAD:fix/web-system-font-emoji
