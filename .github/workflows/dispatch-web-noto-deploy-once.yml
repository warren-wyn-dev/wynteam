name: Dispatch web Noto production deploy once

on:
  push:
    branches:
      - ops/dispatch-web-noto-deploy-20260913
    paths:
      - .github/workflows/dispatch-web-noto-deploy-once.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch reviewed main to production
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-web.yml --repo warren-wyn-dev/wynteam --ref main
