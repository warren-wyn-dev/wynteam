name: Dispatch approved Web production deploy once
on:
  push:
    branches: [ops/apply-system-font-dom-fix-20260913]
    paths: [.github/workflows/dispatch-web-production-once.yml]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy-web.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy-web.yml/dispatches \
            -d '{"ref":"main"}'
          echo "Production Web deploy dispatched for main."
