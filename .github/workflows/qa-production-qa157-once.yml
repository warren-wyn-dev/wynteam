name: QA WYNOS production WYN-157 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-production-qa157-once.yml'

jobs:
  production-browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: HTTP production checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-artifacts
          urls=(
            'https://wynos.online/'
            'https://wynos.online/flutter_bootstrap.js'
            'https://wynos.online/main.dart.js'
            'https://wynos.online/manifest.json'
            'https://wynos.online/firebase-messaging-sw.js'
            'https://wynos.online/drop/00000000-0000-0000-0000-000000000000'
          )
          for url in "${urls[@]}"; do
            code="$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/body -w '%{http_code}' "$url")"
            size="$(wc -c </tmp/body)"
            printf '%s status=%s size=%s\n' "$url" "$code" "$size" | tee -a qa-artifacts/http.txt
            test "$code" = 200
            test "$size" -gt 0
          done

      - name: Install Playwright
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Browser QA Chromium + WebKit
        shell: bash
        run: |
          cat > wynos-qa.js <<'NODE'
          const { chromium, webkit } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const OUT = path.resolve('qa-artifacts');
          fs.mkdirSync(OUT, { recursive: true });

          async function clickDomText(page, text) {
            const candidates = page.locator('div').filter({ hasText: new RegExp(`^${text}$`) });
            const count = await candidates.count();
            for (let i = count - 1; i >= 0; i--) {
              const box = await candidates.nth(i).boundingBox().catch(() => null);
              if (box && box.width > 1 && box.height > 1) {
                await page.mouse.click(box.x + box.width / 2, box.y + box.height / 2);
                return;
              }
            }
            throw new Error(`visible DOM text not found: ${text}`);
          }

          async function waitDomText(page, text, timeout = 15000) {
            const started = Date.now();
            while (Date.now() - started < timeout) {
              const candidates = page.locator('div').filter({ hasText: new RegExp(`^${text}$`) });
              const count = await candidates.count();
              for (let i = 0; i < count; i++) {
                const box = await candidates.nth(i).boundingBox().catch(() => null);
                if (box && box.width > 1 && box.height > 1) return;
              }
              await page.waitForTimeout(250);
            }
            throw new Error(`timed out waiting for DOM text: ${text}`);
          }

          async function run(browserType, name) {
            const browser = await browserType.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              locale: 'th-TH',
              timezoneId: 'Asia/Bangkok',
              serviceWorkers: 'allow',
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.stack || e}`));
            page.on('crash', () => errors.push('page crashed'));
            page.on('requestfailed', req => {
              const u = req.url();
              if (u.includes('wynos.online') && !u.includes('favicon')) {
                errors.push(`requestfailed: ${u} ${req.failure()?.errorText || ''}`);
              }
            });

            await page.goto('https://wynos.online/', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await waitDomText(page, 'เริ่มต้นใช้งาน', 20000);
            await page.screenshot({ path: path.join(OUT, `${name}-root.png`), fullPage: true });
            if (errors.length) throw new Error(`${name} root errors:\n${errors.join('\n')}`);

            // Verify the deployed web OAuth flow is implicit: clicking Google
            // must call Supabase authorize without a PKCE code_challenge.
            await clickDomText(page, 'เริ่มต้นใช้งาน');
            await waitDomText(page, 'เข้าสู่ระบบด้วย Google', 15000);
            let authorizeUrl = null;
            await page.route('**/auth/v1/authorize**', async route => {
              authorizeUrl = route.request().url();
              await route.abort();
            });
            await clickDomText(page, 'เข้าสู่ระบบด้วย Google');
            const deadline = Date.now() + 10000;
            while (!authorizeUrl && Date.now() < deadline) await page.waitForTimeout(100);
            if (!authorizeUrl) throw new Error(`${name}: Google OAuth authorize request was not observed`);
            const oauth = new URL(authorizeUrl);
            if (oauth.searchParams.has('code_challenge') || oauth.searchParams.has('code_challenge_method')) {
              throw new Error(`${name}: deployed web OAuth is still PKCE: ${authorizeUrl}`);
            }
            fs.writeFileSync(path.join(OUT, `${name}-oauth.txt`), authorizeUrl + '\n');

            await context.close();

            // A fresh signed-out shared-link visit must not silently create an
            // anonymous Supabase user/session while Guest browsing is paused.
            const guestContext = await browser.newContext({
              viewport: { width: 390, height: 844 },
              locale: 'th-TH',
              timezoneId: 'Asia/Bangkok',
              serviceWorkers: 'allow',
            });
            const guestPage = await guestContext.newPage();
            let anonymousSignupRequests = 0;
            const guestErrors = [];
            guestPage.on('request', req => {
              if (req.url().includes('/auth/v1/signup')) anonymousSignupRequests++;
            });
            guestPage.on('pageerror', e => guestErrors.push(`pageerror: ${e.stack || e}`));
            guestPage.on('crash', () => guestErrors.push('page crashed'));
            await guestPage.goto(
              'https://wynos.online/drop/00000000-0000-0000-0000-000000000000',
              { waitUntil: 'domcontentloaded', timeout: 45000 },
            );
            await waitDomText(guestPage, 'เริ่มต้นใช้งาน', 20000);
            await guestPage.waitForTimeout(3000);
            const storage = await guestPage.evaluate(() => Object.fromEntries(Object.entries(localStorage)));
            const hasAnonymousPersistedSession = Object.values(storage).some(v =>
              typeof v === 'string' && /"is_anonymous"\s*:\s*true/.test(v)
            );
            await guestPage.screenshot({ path: path.join(OUT, `${name}-signed-out-deeplink.png`), fullPage: true });
            fs.writeFileSync(path.join(OUT, `${name}-guest.json`), JSON.stringify({ anonymousSignupRequests, hasAnonymousPersistedSession, storageKeys: Object.keys(storage), guestErrors }, null, 2));
            if (anonymousSignupRequests !== 0) throw new Error(`${name}: signed-out deep link created anonymous auth request(s): ${anonymousSignupRequests}`);
            if (hasAnonymousPersistedSession) throw new Error(`${name}: signed-out deep link persisted an anonymous session`);
            if (guestErrors.length) throw new Error(`${name} guest errors:\n${guestErrors.join('\n')}`);

            await guestContext.close();
            await browser.close();
          }

          (async () => {
            const failures = [];
            for (const [type, name] of [[chromium, 'chromium'], [webkit, 'webkit']]) {
              try {
                await run(type, name);
                console.log(`PASS ${name}`);
              } catch (e) {
                console.error(e);
                failures.push(`${name}: ${e.stack || e}`);
              }
            }
            if (failures.length) {
              fs.writeFileSync(path.join(OUT, 'failures.txt'), failures.join('\n\n'));
              process.exit(1);
            }
          })();
          NODE
          node wynos-qa.js

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wynos-production-qa157
          path: qa-artifacts/
          if-no-files-found: warn
