name: Deploy Threads-like Home posts once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-profile-header-once.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - run: flutter pub get
      - run: flutter create . --platforms web

      - name: Write dart_define.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          jq -n \
            --arg supabase_url "$(clean "$SUPABASE_URL")" \
            --arg supabase_key "$(clean "$SUPABASE_PUBLISHABLE_KEY")" \
            --arg fb_api_key "$(clean "$FIREBASE_WEB_API_KEY")" \
            --arg fb_app_id "$(clean "$FIREBASE_WEB_APP_ID")" \
            --arg fb_sender_id "$(clean "$FIREBASE_MESSAGING_SENDER_ID")" \
            --arg fb_project_id "$(clean "$FIREBASE_PROJECT_ID")" \
            --arg fb_auth_domain "$(clean "$FIREBASE_AUTH_DOMAIN")" \
            --arg fb_storage_bucket "$(clean "$FIREBASE_STORAGE_BUCKET")" \
            --arg fb_vapid_key "$(clean "$FIREBASE_VAPID_KEY")" \
            '{SUPABASE_URL:$supabase_url,SUPABASE_PUBLISHABLE_KEY:$supabase_key,FIREBASE_WEB_API_KEY:$fb_api_key,FIREBASE_WEB_APP_ID:$fb_app_id,FIREBASE_MESSAGING_SENDER_ID:$fb_sender_id,FIREBASE_PROJECT_ID:$fb_project_id,FIREBASE_AUTH_DOMAIN:$fb_auth_domain,FIREBASE_STORAGE_BUCKET:$fb_storage_bucket,FIREBASE_VAPID_KEY:$fb_vapid_key}' > dart_define.json

      - name: Bake Firebase config into service worker
        env:
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
        run: |
          SW=web/firebase-messaging-sw.js
          test -f "$SW"
          for name in FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_PROJECT_ID FIREBASE_AUTH_DOMAIN FIREBASE_STORAGE_BUCKET; do
            value=$(printf '%s' "$(eval echo \"\$$name\")" | tr -d '[:space:]')
            [ -n "$value" ] || continue
            python3 - "$SW" "__${name}__" "$value" <<'PY'
          import sys
          path, placeholder, value = sys.argv[1], sys.argv[2], sys.argv[3]
          text = open(path, encoding='utf-8').read()
          open(path, 'w', encoding='utf-8').write(text.replace(placeholder, value))
          PY
          done

      - run: flutter build web --release --dart-define-from-file=dart_define.json

      - name: Retire legacy Flutter app service worker
        run: |
          cat > build/web/flutter_service_worker.js <<'JS'
          const LEGACY_FLUTTER_CACHES = ['flutter-app-cache','flutter-temp-cache','flutter-app-manifest'];
          self.addEventListener('install', (event) => event.waitUntil(self.skipWaiting()));
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              await Promise.all(LEGACY_FLUTTER_CACHES.map((name) => caches.delete(name)));
              await self.clients.claim();
              const windows = await self.clients.matchAll({type:'window', includeUncontrolled:true});
              await self.registration.unregister();
              await Promise.all(windows.map((client) => client.navigate(client.url)));
            })());
          });
          JS

      - name: Deploy to Vercel production
        working-directory: app/build/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          VERCEL_ORG_ID=$(printf '%s' "$VERCEL_ORG_ID" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          VERCEL_PROJECT_ID=$(printf '%s' "$VERCEL_PROJECT_ID" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
