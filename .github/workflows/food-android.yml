name: WYNOS Food Android (Native)

on:
  pull_request:
    paths:
      - "food-android/**"
      - ".github/workflows/food-android.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: food-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDK_MANAGER" ]; then
            echo "Android SDK command-line tools not found" >&2
            exit 1
          fi
          "$SDK_MANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Build and verify demo
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
