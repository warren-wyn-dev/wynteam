name: Beta2 bottom-nav screenshot (preview only)

on:
  push:
    branches:
      - preview/web-beta2-bottom-nav-20260928

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local WYNOS Web Beta 2
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/wynos-beta2.log 2>&1 &
          echo $! > /tmp/wynos-beta2.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/dev/home-fixture >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wynos-beta2.log
          exit 1

      - name: Capture mobile screenshots
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              locale: 'th-TH',
            });
            const states = [
              ['club', 'wynos-beta2-nav-club-active.png'],
              ['post', 'wynos-beta2-nav-post-active.png'],
              ['chat', 'wynos-beta2-nav-chat-active.png'],
              ['profile', 'wynos-beta2-nav-profile-active.png'],
            ];
            for (const [state, file] of states) {
              await page.goto(`http://127.0.0.1:3000/dev/home-fixture?nav=${state}`, { waitUntil: 'networkidle' });
              await page.screenshot({ path: `../${file}`, fullPage: false });
            }
            await browser.close();
          })();
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wynos-beta2-bottom-nav-active-states
          path: |
            wynos-beta2-nav-club-active.png
            wynos-beta2-nav-post-active.png
            wynos-beta2-nav-chat-active.png
            wynos-beta2-nav-profile-active.png
          if-no-files-found: error
          retention-days: 7
