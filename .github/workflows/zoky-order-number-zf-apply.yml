name: ZOKY -- order numbers ZF-0000

# Founder 2026-11-04: "เลขออเดอร์ คือ ZF-0000". Applies
# 20261104120000_zoky_order_number_zf.sql: new orders are numbered ZF-0036,
# ZF-0037, ... from the same sequence; past orders keep their WF numbers.
# Run only after send-push-notification accepts ZF- numbers
# (zoky-line-push-deploy.yml), or ZF- order pushes go to the wrong app.
# Verifies the definition and grants only; draws no number, reads no
# personal data. Re-runnable.
# Test: supabase/tests/zoky_order_number_zf_test.sh
# Rollback: supabase/rollbacks/20261104120000_zoky_order_number_zf_rollback.sql
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-ZOKY-ORDER-NUMBER-ZF to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-ZOKY-ORDER-NUMBER-ZF'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          # The SQL and the request body go through files.
          run_sql_file() {
            local body out code
            body=$(mktemp); out=$(mktemp)
            jq -n --rawfile q "$1" '{query: $q}' > "$body"
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data-binary @"$body")
            rm -f "$body"
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql() {
            local sql; sql=$(mktemp); printf '%s' "$1" > "$sql"
            run_sql_file "$sql"; local rc=$?; rm -f "$sql"; return $rc
          }
          apply_sql=$(mktemp)
          { echo "begin;"; cat supabase/migrations/20261104120000_zoky_order_number_zf.sql; echo; echo "commit;"; } > "$apply_sql"
          run_sql_file "$apply_sql" >/dev/null
          rm -f "$apply_sql"
          # Definition and grants only; no number is drawn.
          run_sql "select
              (select pg_get_functiondef('public.food_next_order_number()'::regprocedure) like '%''ZF-''%') as zf_prefix,
              (select pg_get_functiondef('public.food_next_order_number()'::regprocedure) like '%food_order_number_seq%') as same_sequence,
              has_function_privilege('anon', 'public.food_next_order_number()', 'execute') as anon_can_draw,
              has_function_privilege('authenticated', 'public.food_next_order_number()', 'execute') as members_can_draw;" \
            | tee result.json | jq .
          jq -e '.[0].zf_prefix == true and .[0].same_sequence == true
                 and .[0].anon_can_draw == false and .[0].members_can_draw == false' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "New ZOKY orders are numbered ZF-0000. Past orders keep their WF numbers."
