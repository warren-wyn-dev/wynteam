name: Apply iOS web image-rendering mitigation once

on:
  push:
    branches:
      - fix/ios-web-image-process-crash-20260913
    paths:
      - '.github/workflows/apply-ios-web-image-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ios-web-image-process-crash-20260913
          fetch-depth: 0

      - name: Patch image rendering on iOS Web
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          p = Path('app/lib/core/widgets/network_thumbnail.dart')
          text = p.read_text()
          text = text.replace(
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/foundation.dart';\nimport 'package:flutter/material.dart';\n",
              1,
          )
          marker = "import 'package:flutter/material.dart';\n\n"
          helper = '''import 'package:flutter/material.dart';\n\n/// Flutter Web ignores cacheWidth/cacheHeight, and CanvasKit network-image\n/// textures can exhaust WebKit's page process on image-heavy iPhone feeds.\n/// Keep the normal engine image path everywhere except iOS Web, where Flutter\n/// can host the network image as a browser <img> platform view instead.\nWebHtmlElementStrategy networkImageStrategyFor({\n  required bool isWeb,\n  required TargetPlatform platform,\n}) {\n  return isWeb && platform == TargetPlatform.iOS\n      ? WebHtmlElementStrategy.prefer\n      : WebHtmlElementStrategy.never;\n}\n\nWebHtmlElementStrategy get wynNetworkImageStrategy =>\n    networkImageStrategyFor(isWeb: kIsWeb, platform: defaultTargetPlatform);\n\n'''
          if marker not in text:
              raise SystemExit('network_thumbnail import marker missing')
          text = text.replace(marker, helper, 1)
          old = "          fit: fit,\n          cacheWidth: decodeWidthFor("
          new = "          fit: fit,\n          webHtmlElementStrategy: wynNetworkImageStrategy,\n          cacheWidth: decodeWidthFor("
          if old not in text:
              raise SystemExit('NetworkThumbnail Image.network marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text)

          replace_once(
              'app/lib/core/widgets/post_media.dart',
              "          semanticLabel: semanticLabel,\n          cacheWidth: decodeWidthFor(",
              "          semanticLabel: semanticLabel,\n          webHtmlElementStrategy: wynNetworkImageStrategy,\n          cacheWidth: decodeWidthFor(",
          )

          replace_once(
              'app/lib/features/home/presentation/widgets/home_pop_card.dart',
              "                                        item.thumbnailUrl!,\n                                        fit: BoxFit.cover,\n                                        errorBuilder: networkImageErrorBuilder,",
              "                                        item.thumbnailUrl!,\n                                        fit: BoxFit.cover,\n                                        webHtmlElementStrategy:\n                                            wynNetworkImageStrategy,\n                                        errorBuilder: networkImageErrorBuilder,",
          )

          p = Path('app/test/network_thumbnail_test.dart')
          text = p.read_text()
          insertion = '''\n  group('networkImageStrategyFor', () {\n    test('prefers browser HTML images only on iOS Web', () {\n      expect(\n        networkImageStrategyFor(isWeb: true, platform: TargetPlatform.iOS),\n        WebHtmlElementStrategy.prefer,\n      );\n      expect(\n        networkImageStrategyFor(isWeb: true, platform: TargetPlatform.android),\n        WebHtmlElementStrategy.never,\n      );\n      expect(\n        networkImageStrategyFor(isWeb: false, platform: TargetPlatform.iOS),\n        WebHtmlElementStrategy.never,\n      );\n    });\n  });\n'''
          needle = "\n  group('NetworkThumbnail', () {"
          if needle not in text:
              raise SystemExit('network_thumbnail_test insertion marker missing')
          text = text.replace(needle, insertion + needle, 1)
          p.write_text(text)
          PY

          dart format \
            app/lib/core/widgets/network_thumbnail.dart \
            app/lib/core/widgets/post_media.dart \
            app/lib/features/home/presentation/widgets/home_pop_card.dart \
            app/test/network_thumbnail_test.dart

          git diff --check
          git diff -- \
            app/lib/core/widgets/network_thumbnail.dart \
            app/lib/core/widgets/post_media.dart \
            app/lib/features/home/presentation/widgets/home_pop_card.dart \
            app/test/network_thumbnail_test.dart

      - name: Commit mitigation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/lib/core/widgets/network_thumbnail.dart \
            app/lib/core/widgets/post_media.dart \
            app/lib/features/home/presentation/widgets/home_pop_card.dart \
            app/test/network_thumbnail_test.dart
          git commit -m 'fix(web): bypass CanvasKit network-image textures on iOS'
          git push origin HEAD:fix/ios-web-image-process-crash-20260913
