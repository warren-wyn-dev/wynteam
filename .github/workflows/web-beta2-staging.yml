name: WYNOS Web Beta 2 Staging

# Long-lived WYNOS Web Beta 2 pipeline.
# It can deploy only the dedicated Beta 2 Staging Vercel/Supabase projects.
# It never uses --prod and never targets WYNOS Web Beta 1 Production.
on:
  push:
    branches:
      - web-beta2
    paths:
      - 'web/**'
      - '.github/workflows/web-beta2-staging.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wynos-web-beta2-staging
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout exact Beta 2 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fail closed unless Beta 2 is isolated
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_url=$(clean "$STAGING_SUPABASE_URL"); stage_url=${stage_url%/}
          prod_url=$(clean "$PRODUCTION_SUPABASE_URL"); prod_url=${prod_url%/}
          stage_project=$(clean "$STAGING_VERCEL_PROJECT_ID")
          prod_project=$(clean "$PRODUCTION_VERCEL_PROJECT_ID")
          stage_key=$(clean "$STAGING_SUPABASE_PUBLISHABLE_KEY")

          test "$GITHUB_REF" = "refs/heads/web-beta2"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"
          test "$prod_url" = "https://kqokpocajhfbidcxpvhh.supabase.co"
          test "$stage_url" != "$prod_url"
          test "$stage_project" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$prod_project" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$stage_project" != "$prod_project"
          test -n "$stage_key"

          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          code=$(curl --silent --show-error --max-time 30 \
            --output "$body" --write-out '%{http_code}' \
            --header "apikey: $stage_key" \
            --header "Authorization: Bearer $stage_key" \
            "$stage_url/rest/v1/profiles?select=id&limit=0")
          test "$code" = "200"
          node - "$body" <<'NODE'
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!Array.isArray(value) || value.length !== 0) {
            throw new Error("Expected a zero-row Staging Data API probe.");
          }
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Beta 2 against Staging public configuration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check

  browser_qa:
    needs: checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser regression QA
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        # One retry handles known browser-timing flakes while still failing
        # deterministic regressions.
        run: npm run qa:browser -- --retries=1

  deploy:
    needs:
      - checks
      - browser_qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy preview to the dedicated Beta 2 Staging project only
        id: deploy
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_url=$(clean "$STAGING_SUPABASE_URL"); stage_url=${stage_url%/}
          stage_key=$(clean "$STAGING_SUPABASE_PUBLISHABLE_KEY")
          stage_project=$(clean "$STAGING_VERCEL_PROJECT_ID")
          prod_project=$(clean "$PRODUCTION_VERCEL_PROJECT_ID")
          org_id=$(clean "$VERCEL_ORG_ID")
          token=$(clean "$VERCEL_TOKEN")

          test "$GITHUB_REF" = "refs/heads/web-beta2"
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"
          test "$stage_project" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$prod_project" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$stage_project" != "$prod_project"

          firebase_args=()
          append_public_env() {
            local name="$1" value
            value=$(clean "$2")
            test -n "$value" || { echo "::error::Missing $name"; exit 1; }
            firebase_args+=(--build-env "$name=$value" --env "$name=$value")
          }
          append_public_env NEXT_PUBLIC_FIREBASE_API_KEY "$FIREBASE_WEB_API_KEY"
          append_public_env NEXT_PUBLIC_FIREBASE_APP_ID "$FIREBASE_WEB_APP_ID"
          append_public_env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FIREBASE_MESSAGING_SENDER_ID"
          append_public_env NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          append_public_env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FIREBASE_AUTH_DOMAIN"
          append_public_env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FIREBASE_STORAGE_BUCKET"
          append_public_env NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FIREBASE_VAPID_KEY"

          export VERCEL_PROJECT_ID="$stage_project"
          export VERCEL_ORG_ID="$org_id"
          url=$(npx --yes vercel@60.1.3 deploy --yes \
            --token="$token" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$stage_key" \
            --build-env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            --env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$stage_key" \
            --env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            "${firebase_args[@]}" | tail -n 1)

          case "$url" in
            https://*.vercel.app) ;;
            *) echo "::error::Unexpected Vercel deployment URL"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Beta 2 Staging preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Preview only; WYNOS Web Beta 1 Production is never targeted." >> "$GITHUB_STEP_SUMMARY"

      - name: Require Vercel Authentication before QA bypass
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          trap 'rm -f "$headers"' EXIT
          status=$(curl --silent --show-error --max-time 30 \
            --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/")
          case "$status" in
            302|303|307|308)
              grep -Eiq '^location:[[:space:]]*https://vercel[.]com/sso-api' "$headers" || {
                echo "::error::Protected Staging did not redirect to Vercel SSO"
                exit 1
              }
              ;;
            *)
              echo "::error::Expected protected Staging preview; received HTTP $status"
              exit 1
              ;;
          esac

      - name: Create temporary Staging QA bypass
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bypass=$(openssl rand -hex 16)
          echo "::add-mask::$bypass"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"generate\":{\"secret\":\"$bypass\",\"note\":\"WYNOS Web Beta 2 staging $GITHUB_RUN_ID\"}}" >/dev/null

      - name: Verify hosted routes and environment isolation
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          smoke_route() {
            local route="$1" url="$PREVIEW_URL$route" hop code location
            for hop in 1 2 3 4; do
              rm -f /tmp/headers /tmp/route.html
              code=$(curl --silent --show-error --max-time 30 \
                --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                --dump-header /tmp/headers --output /tmp/route.html --write-out '%{http_code}' "$url")
              if [ "$code" = "200" ]; then
                grep -q '/_next/' /tmp/route.html || {
                  echo "::error::$route final response is not the WYNOS Next.js app"
                  exit 1
                }
                return 0
              fi
              case "$code" in 301|302|303|307|308) ;; *)
                echo "::error::$route returned HTTP $code"
                exit 1
              esac
              location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); sub(/\r$/,""); print; exit}' /tmp/headers)
              test -n "$location" || { echo "::error::$route redirected without Location"; exit 1; }
              case "$location" in
                /*) url="$PREVIEW_URL$location" ;;
                "$PREVIEW_URL"/*) url="$location" ;;
                *) echo "::error::$route tried to redirect outside the Staging Preview"; exit 1 ;;
              esac
            done
            echo "::error::$route exceeded four redirects"
            exit 1
          }

          routes=(/ /home /search /notifications /chat /settings /profile/me /clubs /bookmarks /login /signup/step-1)
          for route in "${routes[@]}"; do smoke_route "$route"; done

          html=$(curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/")
          grep -q '/_next/' <<< "$html"
          grep -q 'yydgdapzlrjmlrjgijkj.supabase.co' <<< "$html" || {
            echo "::error::Staging Supabase origin is missing"
            exit 1
          }
          if grep -q 'kqokpocajhfbidcxpvhh.supabase.co' <<< "$html"; then
            echo "::error::Production Supabase origin leaked into Beta 2 Staging"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --output /tmp/push-config.json "$PREVIEW_URL/api/push-config"
          node -e 'const c=require("/tmp/push-config.json"); if(c.configured!==true) process.exit(1)'

      - name: Revoke temporary Staging QA bypass
        if: always()
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then exit 0; fi
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"revoke\":{\"secret\":\"$VERCEL_AUTOMATION_BYPASS_SECRET\",\"regenerate\":false}}" >/dev/null
