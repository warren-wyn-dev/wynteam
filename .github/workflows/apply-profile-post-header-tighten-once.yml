name: Apply compact post header once

on:
  push:
    branches: [feat/profile-post-header-tighten]
    paths:
      - .github/workflows/apply-profile-post-header-tighten-once.yml
      - tools/apply_profile_post_header_tighten.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-post-header-tighten
          fetch-depth: 0

      - name: Apply compact post header patch
        run: python3 tools/apply_profile_post_header_tighten.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/features/home/presentation/widgets/home_drop_card.dart \
            app/test/home_drop_card_overflow_test.dart
          git diff --check

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Header regression tests
        working-directory: app
        run: flutter test test/home_drop_card_overflow_test.dart

      - name: Commit validated change
        run: |
          rm -f tools/apply_profile_post_header_tighten.py
          rm -f .github/workflows/apply-profile-post-header-tighten-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(profile): compact post header layout"
          git push origin feat/profile-post-header-tighten
