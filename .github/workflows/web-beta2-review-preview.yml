name: Web Beta2 Review Preview

on:
  pull_request:
    branches:
      - web-beta2
    paths:
      - 'web/**'
      - '.github/workflows/web-beta2-review-preview.yml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: web-beta2-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Beta2 staging is isolated
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY PRODUCTION_SUPABASE_URL PRODUCTION_SUPABASE_PUBLISHABLE_KEY STAGING_VERCEL_PROJECT_ID PRODUCTION_VERCEL_PROJECT_ID VERCEL_ORG_ID VERCEL_TOKEN; do
            value="${!name:-}"
            test -n "$value" || { echo "::error::$name is empty"; exit 1; }
          done
          test "$STAGING_SUPABASE_URL" != "$PRODUCTION_SUPABASE_URL" || {
            echo "::error::Beta2 staging Supabase URL matches production"; exit 1;
          }
          test "$STAGING_SUPABASE_PUBLISHABLE_KEY" != "$PRODUCTION_SUPABASE_PUBLISHABLE_KEY" || {
            echo "::error::Beta2 staging Supabase key matches production"; exit 1;
          }
          test "$STAGING_VERCEL_PROJECT_ID" != "$PRODUCTION_VERCEL_PROJECT_ID" || {
            echo "::error::Beta2 staging Vercel project matches production"; exit 1;
          }
          echo "Beta2 staging isolation verified."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check Web Beta2
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check

      - name: Deploy protected Beta2 preview
        id: deploy
        working-directory: .
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          export VERCEL_PROJECT_ID="$STAGING_VERCEL_PROJECT_ID"
          url=$(npx --yes vercel@latest deploy --yes \
            --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$STAGING_SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --build-env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            --env NEXT_PUBLIC_SUPABASE_URL="$STAGING_SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            | tail -n 1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## WYNOS Web Beta 2 review preview"
            echo
            echo "Preview URL: $url"
            echo
            echo "This deployment uses the isolated Beta2 staging project and does not move wynos.online."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post Beta2 preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- wynos-web-beta2-review -->';
            const body = [
              marker,
              '### WYNOS Web Beta 2 — review preview',
              '',
              `Preview URL: ${process.env.PREVIEW_URL}`,
              '',
              '- Isolated Beta2 staging deployment.',
              '- Does not change wynos.online / Beta 1.',
              '- Protected by Vercel Authentication.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
