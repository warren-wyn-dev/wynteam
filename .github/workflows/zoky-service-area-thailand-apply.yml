name: ZOKY -- open ordering to all of Thailand

# Founder 2026-11-02: "เปิดใช้ทั่วประเทศไทย" (.wyn/company/APPROVALS.md).
# Applies the data-only migration 20261102140000_zoky_service_area_thailand.sql:
# one active Thailand row in public.food_service_areas (OpenStreetMap, ODbL).
# No function, policy or grant changes; the Maha Sarakham row is untouched.
# Verifies with fixed coordinates, definitions and counts only; no personal
# data is read. Re-runnable. Test: supabase/tests/zoky_service_area_thailand_test.sh
# Rollback: supabase/rollbacks/20261102140000_zoky_service_area_thailand_rollback.sql
# (sets the Thailand row inactive: Maha Sarakham-only ordering again).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-ZOKY-THAILAND-AREA to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-ZOKY-THAILAND-AREA'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations/20261102140000_zoky_service_area_thailand.sql)
          commit;" >/dev/null
          # Fixed coordinates, definitions and counts only; no personal data is read.
          run_sql "select
              (select count(*) from public.food_service_areas where code = 'thailand' and active) as thailand_active,
              (select count(*) from public.food_service_areas where code = 'maha_sarakham' and active) as maha_sarakham_active,
              internal.food_in_service_area(13.7563, 100.5018) as bangkok_inside,
              internal.food_in_service_area(18.7883, 98.9853) as chiang_mai_inside,
              internal.food_in_service_area(7.8961, 98.2961) as phuket_inside,
              internal.food_in_service_area(10.0956, 99.8404) as ko_tao_inside,
              internal.food_in_service_area(16.1847, 103.3007) as maha_sarakham_inside,
              internal.food_in_service_area(17.9757, 102.6331) as vientiane_inside,
              internal.food_in_service_area(11.5564, 104.9282) as phnom_penh_inside,
              (select pg_get_functiondef('internal.food_delivery_fee(uuid,double precision,double precision)'::regprocedure)
                 like '%outside delivery area%') as store_radius_still_checked,
              has_table_privilege('authenticated', 'public.food_service_areas', 'select') as users_read_boundary,
              (select count(*) from public.food_stores where is_published) as published_stores,
              (select count(*) from public.food_stores where is_published
                 and not internal.food_in_service_area(latitude, longitude)) as published_stores_outside;" \
            | tee result.json | jq .
          jq -e '.[0].thailand_active == 1 and .[0].maha_sarakham_active == 1
                 and .[0].bangkok_inside == true and .[0].chiang_mai_inside == true and .[0].phuket_inside == true
                 and .[0].ko_tao_inside == true and .[0].maha_sarakham_inside == true
                 and .[0].vientiane_inside == false and .[0].phnom_penh_inside == false
                 and .[0].store_radius_still_checked == true and .[0].users_read_boundary == false' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "ZOKY ordering is open across Thailand; each store's own delivery radius still applies."
