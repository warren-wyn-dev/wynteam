name: Founder feed polish one-shot

on:
  push:
    branches: [ui/founder-feed-polish]
    paths:
      - .github/workflows/founder-feed-polish-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/founder-feed-polish
      - name: Apply approved feed polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'app/lib/core/widgets/hashtag_text.dart',
              """    final hashtagStyle = baseStyle.copyWith(\n      color: _hashtagLinkBlue,\n      fontWeight: FontWeight.w600,\n    );\n""",
              """    final hashtagStyle = baseStyle.copyWith(\n      color: _hashtagLinkBlue,\n    );\n""",
          )

          path = Path('app/lib/core/widgets/hashtag_text.dart')
          text = path.read_text()
          old = """    final spans = <InlineSpan>[];\n    var lastEnd = 0;\n    for (final token in _findTokens(displayText)) {\n      // hashtagPattern/mentionPattern never overlap (different prefix\n      // characters), but a token could still start before lastEnd if\n      // sorting alone let a shorter earlier overlap through -- skip\n      // defensively rather than emit a negative-length substring.\n      if (token.start < lastEnd) continue;\n\n      if (token.start > lastEnd) {\n        _appendPlainText(\n          spans,\n          displayText.substring(lastEnd, token.start),\n          baseStyle,\n        );\n      }\n\n      final recognizer = TapGestureRecognizer()\n        ..onTap = token.kind == _SpanKind.hashtag\n            ? () => _openHashtagFeed(token.value)\n            : () => _openMentionedProfile(token.value);\n      _recognizers.add(recognizer);\n      spans.add(TextSpan(\n        text: displayText.substring(token.start, token.end),\n        style: token.kind == _SpanKind.hashtag ? hashtagStyle : mentionStyle,\n        recognizer: recognizer,\n      ));\n      lastEnd = token.end;\n    }\n    if (lastEnd < displayText.length) {\n      _appendPlainText(\n        spans,\n        displayText.substring(lastEnd),\n        baseStyle,\n      );\n    }\n\n    return Text.rich(\n      TextSpan(style: baseStyle, children: spans),\n      maxLines: widget.maxLines,\n      overflow: widget.overflow ?? TextOverflow.clip,\n      // Feed cards use a tighter first/last line box so the caption sits closer\n      // to the author row and the action row without changing readable line\n      // height between lines. Full post/detail surfaces keep authored spacing.\n      textHeightBehavior: compactFeedCard\n          ? const TextHeightBehavior(\n              applyHeightToFirstAscent: false,\n              applyHeightToLastDescent: false,\n            )\n          : null,\n    );\n"""
          new = """    Text buildRichText(String text) {\n      final spans = <InlineSpan>[];\n      var lastEnd = 0;\n      for (final token in _findTokens(text)) {\n        if (token.start < lastEnd) continue;\n\n        if (token.start > lastEnd) {\n          _appendPlainText(\n            spans,\n            text.substring(lastEnd, token.start),\n            baseStyle,\n          );\n        }\n\n        final recognizer = TapGestureRecognizer()\n          ..onTap = token.kind == _SpanKind.hashtag\n              ? () => _openHashtagFeed(token.value)\n              : () => _openMentionedProfile(token.value);\n        _recognizers.add(recognizer);\n        spans.add(TextSpan(\n          text: text.substring(token.start, token.end),\n          style: token.kind == _SpanKind.hashtag ? hashtagStyle : mentionStyle,\n          recognizer: recognizer,\n        ));\n        lastEnd = token.end;\n      }\n      if (lastEnd < text.length) {\n        _appendPlainText(\n          spans,\n          text.substring(lastEnd),\n          baseStyle,\n        );\n      }\n\n      return Text.rich(\n        TextSpan(style: baseStyle, children: spans),\n        maxLines: widget.maxLines,\n        overflow: widget.overflow ?? TextOverflow.clip,\n        textHeightBehavior: compactFeedCard\n            ? const TextHeightBehavior(\n                applyHeightToFirstAscent: false,\n                applyHeightToLastDescent: false,\n              )\n            : null,\n      );\n    }\n\n    if (compactFeedCard && widget.maxLines == null) {\n      final boundary = RegExp(r'\\r?\\n(?=[ \\t]*#)').firstMatch(displayText);\n      if (boundary != null) {\n        final caption = displayText.substring(0, boundary.start).trimRight();\n        final hashtagBlock = displayText.substring(boundary.end).trimLeft();\n        if (caption.isNotEmpty && hashtagBlock.isNotEmpty) {\n          return Column(\n            mainAxisSize: MainAxisSize.min,\n            crossAxisAlignment: CrossAxisAlignment.start,\n            children: [\n              buildRichText(caption),\n              const SizedBox(\n                key: ValueKey<String>('feed_caption_hashtag_gap'),\n                height: 4,\n              ),\n              buildRichText(hashtagBlock),\n            ],\n          );\n        }\n      }\n    }\n\n    return buildRichText(displayText);\n"""
          if text.count(old) != 1:
              raise SystemExit(f'hashtag_text.dart: expected render block once, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          for card in [
              'app/lib/features/home/presentation/widgets/home_drop_card.dart',
              'app/lib/features/home/presentation/widgets/home_pop_card.dart',
          ]:
              replace_once(
                  card,
                  """          padding: const EdgeInsets.fromLTRB(\n            0,\n            WynSpacing.space3,\n            0,\n            WynSpacing.space2,\n          ),\n""",
                  """          padding: EdgeInsets.fromLTRB(\n            0,\n            WynSpacing.space3,\n            0,\n            item.topReply == null ? 0 : WynSpacing.space2,\n          ),\n""",
              )

          for card in [
              'app/lib/features/home/presentation/widgets/home_drop_card.dart',
              'app/lib/features/home/presentation/widgets/home_pop_card.dart',
          ]:
              p = Path(card)
              text = p.read_text()
              old_name = """                                      Flexible(\n                                        child: Text(\n                                          item.authorNameOrUsername,\n"""
              new_name = """                                      Expanded(\n                                        flex: 3,\n                                        child: Text(\n                                          item.authorNameOrUsername,\n                                          maxLines: 1,\n                                          softWrap: false,\n"""
              if text.count(old_name) != 1:
                  raise SystemExit(f'{card}: expected author Flexible once, found {text.count(old_name)}')
              text = text.replace(old_name, new_name, 1)

              old_date = """                                      Flexible(\n                                        child: Text(\n"""
              new_date = """                                      Flexible(\n                                        flex: 2,\n                                        child: Text(\n"""
              if text.count(old_date) != 1:
                  raise SystemExit(f'{card}: expected date Flexible once, found {text.count(old_date)}')
              text = text.replace(old_date, new_date, 1)
              p.write_text(text)

          p = Path('app/test/hashtag_text_test.dart')
          text = p.read_text()
          old_helper = """TextSpan _spanWithText(WidgetTester tester, String text) {\n  final richText = tester.widget<RichText>(find.byType(RichText).first);\n  final rootSpan = richText.text as TextSpan;\n  TextSpan? found;\n  rootSpan.visitChildren((span) {\n    if (span is TextSpan && span.text == text) {\n      found = span;\n      return false;\n    }\n    return true;\n  });\n  expect(found, isNotNull, reason: 'no span found for \"$text\"');\n  return found!;\n}\n"""
          new_helper = """TextSpan _spanWithText(WidgetTester tester, String text) {\n  TextSpan? found;\n  for (final richText in tester.widgetList<RichText>(find.byType(RichText))) {\n    final rootSpan = richText.text as TextSpan;\n    rootSpan.visitChildren((span) {\n      if (span is TextSpan && span.text == text) {\n        found = span;\n        return false;\n      }\n      return true;\n    });\n    if (found != null) break;\n  }\n  expect(found, isNotNull, reason: 'no span found for \"$text\"');\n  return found!;\n}\n"""
          if text.count(old_helper) != 1:
              raise SystemExit('hashtag_text_test.dart: helper mismatch')
          text = text.replace(old_helper, new_helper, 1)

          old_test = """    final richText = tester.widget<RichText>(find.byType(RichText).first);\n    expect(\n      richText.text.toPlainText(),\n      'ชีวิตไม่ต้องสมบูรณ์แบบ\\n#คำคม #ชีวิตดีๆ #WYNOS',\n    );\n"""
          new_test = """    final richTexts = tester.widgetList<RichText>(find.byType(RichText)).toList();\n    expect(richTexts, hasLength(2));\n    expect(richTexts[0].text.toPlainText(), 'ชีวิตไม่ต้องสมบูรณ์แบบ');\n    expect(richTexts[1].text.toPlainText(), '#คำคม #ชีวิตดีๆ #WYNOS');\n    final gap = find.byKey(const ValueKey<String>('feed_caption_hashtag_gap'));\n    expect(gap, findsOneWidget);\n    expect(tester.getSize(gap).height, 4);\n\n    final hashtagSpan = _spanWithText(tester, '#คำคม');\n    expect(hashtagSpan.style?.fontSize, 17.5);\n    expect(hashtagSpan.style?.fontWeight, FontWeight.w400);\n    expect(hashtagSpan.style?.color, const Color(0xFF1D9BF0));\n"""
          if text.count(old_test) != 1:
              raise SystemExit('hashtag_text_test.dart: compact-block test mismatch')
          text = text.replace(old_test, new_test, 1)

          old_trailing = """    final richText = tester.widget<RichText>(find.byType(RichText).first);\n    expect(richText.text.toPlainText(), 'ข้อความ\\n#WYN');\n"""
          new_trailing = """    final richTexts = tester.widgetList<RichText>(find.byType(RichText)).toList();\n    expect(richTexts, hasLength(2));\n    expect(richTexts[0].text.toPlainText(), 'ข้อความ');\n    expect(richTexts[1].text.toPlainText(), '#WYN');\n"""
          if text.count(old_trailing) != 1:
              raise SystemExit('hashtag_text_test.dart: trailing test mismatch')
          p.write_text(text.replace(old_trailing, new_trailing, 1))
          PY

          dart format app/lib/core/widgets/hashtag_text.dart \
            app/lib/features/home/presentation/widgets/home_drop_card.dart \
            app/lib/features/home/presentation/widgets/home_pop_card.dart \
            app/test/hashtag_text_test.dart

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/core/widgets/hashtag_text.dart \
            app/lib/features/home/presentation/widgets/home_drop_card.dart \
            app/lib/features/home/presentation/widgets/home_pop_card.dart \
            app/test/hashtag_text_test.dart
          git commit -m "fix(feed): match approved spacing and hashtag typography"
          git push origin HEAD:ui/founder-feed-polish
