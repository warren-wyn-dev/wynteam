name: WYN-129 -- apply club member badges schema (table, RLS)

# PR #297 merged WYN-127 (Club Channels)/WYN-129 (Club Role Badges)/
# WYN-128 (Club Group Chat) into main -- QA-approved -- but, same
# established gap as every prior WYN-*-apply-*-schema.yml in this
# project (wyn118, wyn125, ...), schema.sql does not auto-apply to
# production. This workflow applies WYN-129's own section.
#
# RUN ORDER: no FK dependency on WYN-127 or WYN-128 either way --
# club_member_badges only references public.clubs and public.profiles,
# both of which already exist in production. Safe to run before, after,
# or interleaved with wyn127-apply-club-channels-schema.yml /
# wyn128-apply-club-channel-messages-schema.yml.
#
# Every statement below is copy-paste identical (in meaning) to the
# WYN-129 section of supabase/schema.sql (search "WYN-129: Club Role
# Badge") and to supabase/migrations_wyn129_club_member_badges.sql --
# if the three ever drift, schema.sql/the migrations file is wrong, not
# this workflow (this file is what actually ran against production).
# In particular, this includes the QA/Debug fast-follow fix
# (.wyn/tasks/bugs/WYN-129-badge-update-target-membership-gap.md): the
# "Club owners and admins can edit member badges" UPDATE policy's
# `with check` re-derives the *target* user's own membership
# (`public.club_role(club_id, user_id) is not null`), not just the
# caller's role, closing the gap where an Owner/Admin could retarget an
# existing badge row's user_id to a non-member/pending/banned user.
#
# CRITICAL INVARIANT (per the Product spec's Risks section, restated
# here as in schema.sql/the migrations file): a badge must NEVER be
# queried anywhere a permission check happens -- it is a purely
# cosmetic, Club-scoped identity layer, completely separate from
# club_role()/authorization. Nothing below calls club_role() to grant
# anything; it is only ever read here to decide who may set/edit/remove
# *cosmetic* rows.
#
# Safe to run more than once (CREATE TABLE IF NOT EXISTS, DROP POLICY
# IF EXISTS before every CREATE POLICY) -- validated locally against a
# scratch PostgreSQL loaded with supabase/schema.sql from before
# WYN-127/128/129 existed (commit 5498928), run twice in a row with
# zero errors and all 4 RLS policies present and unchanged on the
# second pass.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          echo "=== 0. Diagnose: does club_member_badges already exist? ==="
          run_sql "select table_name from information_schema.tables where table_schema = 'public' and table_name = 'club_member_badges';" | jq .

          echo "=== 1. Create club_member_badges (idempotent) + RLS (incl. target-membership fix) ==="
          run_sql "create table if not exists public.club_member_badges (
                     club_id uuid not null references public.clubs (id) on delete cascade,
                     user_id uuid not null references public.profiles (id) on delete cascade,
                     label text not null,
                     color_key text not null check (color_key in ('gold', 'sage', 'plum')),
                     created_by uuid not null references public.profiles (id) on delete cascade,
                     created_at timestamptz not null default now(),
                     constraint club_member_badges_label_length check (char_length(label) between 1 and 20),
                     primary key (club_id, user_id)
                   );

                   alter table public.club_member_badges enable row level security;

                   drop policy if exists \"Club member badges are viewable by authenticated users\" on public.club_member_badges;
                   create policy \"Club member badges are viewable by authenticated users\"
                     on public.club_member_badges
                     for select
                     to authenticated
                     using (true);

                   drop policy if exists \"Club owners and admins can set member badges\" on public.club_member_badges;
                   create policy \"Club owners and admins can set member badges\"
                     on public.club_member_badges
                     for insert
                     to authenticated
                     with check (
                       auth.uid() = created_by
                       and public.club_role(club_id, auth.uid()) in ('owner', 'admin')
                       and public.club_role(club_id, user_id) is not null
                     );

                   drop policy if exists \"Club owners and admins can edit member badges\" on public.club_member_badges;
                   create policy \"Club owners and admins can edit member badges\"
                     on public.club_member_badges
                     for update
                     to authenticated
                     using (public.club_role(club_id, auth.uid()) in ('owner', 'admin'))
                     with check (
                       public.club_role(club_id, auth.uid()) in ('owner', 'admin')
                       and public.club_role(club_id, user_id) is not null
                     );

                   drop policy if exists \"Club owners and admins can remove member badges\" on public.club_member_badges;
                   create policy \"Club owners and admins can remove member badges\"
                     on public.club_member_badges
                     for delete
                     to authenticated
                     using (public.club_role(club_id, auth.uid()) in ('owner', 'admin'));" >/dev/null
          echo "Done."

          echo "=== 2. Verify: table + all 4 policies present ==="
          run_sql "select count(*) as club_member_badge_count from public.club_member_badges;" | jq .
          run_sql "select policyname from pg_policies where schemaname = 'public' and tablename = 'club_member_badges' order by policyname;" | jq .

          echo "=== 3. Smoke test: query club_member_badges against real data (should return cleanly, even if empty) ==="
          run_sql "select b.club_id, b.user_id, b.label, b.color_key from public.club_member_badges b limit 5;" | jq .
