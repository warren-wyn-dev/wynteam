name: WYN-161 Flutter Wynii check

on:
  push:
    branches:
      - chatgpt/wyn-161-flutter-wynii

permissions:
  contents: write

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - run: flutter pub get
      - name: Apply analyzer cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/chat/presentation/widgets/wynii_menu.dart')
          text = path.read_text()
          text = text.replace('if (!mounted || pet == null) return;', 'if (!mounted) return;')
          text = text.replace('initialPet: pet!,', 'initialPet: pet,')
          path.write_text(text)
          PY
      - name: Format Wynii files
        run: dart format lib/features/chat/data/wynii_pet.dart lib/features/chat/presentation/widgets/chat_ui.dart lib/features/chat/presentation/widgets/wynii_menu.dart test/wynii_pet_test.dart
      - name: Commit formatter output
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/features/chat/data/wynii_pet.dart lib/features/chat/presentation/widgets/chat_ui.dart lib/features/chat/presentation/widgets/wynii_menu.dart test/wynii_pet_test.dart
            git commit -m "style(chat): clean and format Wynii Flutter sources"
            git push
          fi
      - name: Analyze Wynii files
        run: flutter analyze lib/features/chat/data/wynii_pet.dart lib/features/chat/presentation/widgets/chat_ui.dart lib/features/chat/presentation/widgets/wynii_menu.dart test/wynii_pet_test.dart
      - name: Run Wynii tests
        run: flutter test test/wynii_pet_test.dart
