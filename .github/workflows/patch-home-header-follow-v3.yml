name: Patch Home header follow button v3

on:
  push:
    branches: [fix/home-header-follow-button]
    paths:
      - .github/workflows/patch-home-header-follow-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-header-follow-button
          fetch-depth: 0

      - name: Apply approved Home header design
        run: |
          python3 <<'PYRUN'
          from pathlib import Path

          lines = Path('.github/workflows/patch-home-header-follow-v2.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(script, 'home_follow_patch.py', 'exec'))
          PYRUN

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Format changed Dart files
        working-directory: app
        run: |
          dart format \
            lib/features/home/presentation/widgets/home_drop_card.dart \
            lib/features/home/presentation/widgets/mode_feed_page.dart \
            lib/features/follow/presentation/widgets/follow_action_button.dart

      - name: Commit patch to branch
        run: |
          git config user.name "warren-wyn-dev"
          git config user.email "warren.wyn.dev@gmail.com"
          git add app/lib/features/home/presentation/widgets/home_drop_card.dart \
                  app/lib/features/home/presentation/widgets/mode_feed_page.dart \
                  app/lib/features/follow/presentation/widgets/follow_action_button.dart
          git commit -m "feat(home): add compact follow button to post header"
          git push origin HEAD:fix/home-header-follow-button
