name: ZOKY Admin -- apply ZOKY team leads

# Applies supabase/migrations/20261025100000_zoky_admin_team_v1.sql
# (ZOKY-ADMIN-001): internal.zoky_team_leads plus the RPCs ZOKY Admin's
# "ทีม ZOKY" page uses. A Team Lead may grant/revoke only food and merchant,
# never their own rows, another Lead's or the super admin's; only the super
# admin appoints Leads. Manual dispatch on main only, inside the approved
# release gates (QA & Security, CTO review, staging, Founder approval).
# Behaviour test: supabase/tests/zoky_admin_team_test.sh.
#
# SAFETY: additive. No existing RPC, policy or admin_permissions row changes;
# every Food/Merchant RPC keeps checking internal.has_admin_permission().
# ROLLBACK: supabase/rollbacks/20261025100000_zoky_admin_team_v1_rollback.sql
# (permissions granted by Leads stay and can be revoked by the super admin).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-ZOKY-ADMIN-TEAM to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-ZOKY-ADMIN-TEAM'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          # Requires the WYN-219 permission foundation.
          run_sql "select (to_regprocedure('internal.has_admin_permission(text,text)') is not null
                     and to_regprocedure('internal.is_super_admin()') is not null) as ok;" | tee pre.json | jq .
          jq -e '.[0].ok == true' pre.json >/dev/null || { echo "::error::WYN-219 foundation missing"; exit 1; }
          run_sql "begin;
          $(cat supabase/migrations/20261025100000_zoky_admin_team_v1.sql)
          commit;" >/dev/null
          # Definitions and privileges only; no personal data is read.
          run_sql "select
              (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = 'public' and p.prosecdef and p.proname in ('zoky_admin_my_access', 'admin_set_zoky_team_lead',
                  'admin_zoky_find_user', 'admin_zoky_list_team', 'admin_zoky_grant_permission', 'admin_zoky_revoke_permission')) as rpcs_ready,
              to_regclass('internal.zoky_team_leads') is not null as table_ready,
              has_table_privilege('authenticated', 'internal.zoky_team_leads', 'select') as members_read_leads,
              has_function_privilege('anon', 'public.admin_zoky_grant_permission(uuid,text,text)', 'execute') as anon_can_grant,
              has_function_privilege('authenticated', 'internal.zoky_assert_can_manage(uuid,text)', 'execute') as members_call_helper,
              has_function_privilege('authenticated', 'public.admin_zoky_grant_permission(uuid,text,text)', 'execute') as members_can_call;" \
            | tee result.json | jq .
          jq -e '.[0].rpcs_ready == 6 and .[0].table_ready == true and .[0].members_read_leads == false
                 and .[0].anon_can_grant == false and .[0].members_call_helper == false and .[0].members_can_call == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "ZOKY team leads are installed. Appoint Leads from WYNOS Admin -> Roles & Permissions."
