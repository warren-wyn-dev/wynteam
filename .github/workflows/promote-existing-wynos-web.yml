name: Promote Existing WYNOS Web Artifact

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/promote-existing-wynos-web.yml'

permissions:
  contents: read

jobs:
  promote:
    if: contains(github.event.head_commit.message, '[promote-existing]')
    runs-on: ubuntu-latest
    env:
      TARGET_DEPLOYMENT: web-8i8d08apv-warren14.vercel.app
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Validate deployment target and credentials
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          VERCEL_TOKEN=$(clean "$VERCEL_TOKEN")
          VERCEL_ORG_ID=$(clean "$VERCEL_ORG_ID")
          VERCEL_PROJECT_ID=$(clean "$VERCEL_PROJECT_ID")
          export VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          npx --yes vercel@61.0.0 inspect "$TARGET_DEPLOYMENT" --token="$VERCEL_TOKEN"

      - name: Authenticated preview smoke before promotion
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          npx --yes vercel@61.0.0 --token="$VERCEL_TOKEN" curl / --deployment "$TARGET_DEPLOYMENT" > /tmp/home.html
          grep -q '/_next/' /tmp/home.html
          ! grep -q 'flutter_bootstrap.js' /tmp/home.html

          npx --yes vercel@61.0.0 --token="$VERCEL_TOKEN" curl /sw.js --deployment "$TARGET_DEPLOYMENT" > /tmp/sw.js
          grep -q 'posting_prompt' /tmp/sw.js
          grep -q 'followed_post_digest' /tmp/sw.js
          grep -q 'daily_follow_suggestion' /tmp/sw.js

          npx --yes vercel@61.0.0 --token="$VERCEL_TOKEN" curl /api/push-config --deployment "$TARGET_DEPLOYMENT" > /tmp/push-config.json
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("/tmp/push-config.json","utf8")); if(c.configured!==true) process.exit(1)'

      - name: Promote existing READY deployment
        run: |
          set -euo pipefail
          export VERCEL_ORG_ID VERCEL_PROJECT_ID
          npx --yes vercel@61.0.0 --token="$VERCEL_TOKEN" promote "$TARGET_DEPLOYMENT" --yes --timeout 5m

      - name: Verify wynos.online after promotion
        run: |
          set -euo pipefail

          ready=0
          for attempt in $(seq 1 24); do
            html=$(curl --silent --show-error --fail --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              "https://wynos.online/?_wyn_promote_verify=${GITHUB_RUN_ID}-${attempt}" || true)
            if grep -q '/_next/' <<< "$html" && ! grep -q 'flutter_bootstrap.js' <<< "$html"; then
              ready=1
              break
            fi
            sleep 5
          done
          test "$ready" -eq 1

          for route in / /search /notifications /chat /settings /profile/me /clubs /bookmarks /suggested; do
            curl --fail --location --retry 5 --retry-delay 2 --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --output /dev/null "https://wynos.online$route"
          done

          curl --silent --show-error --fail --location --max-time 30 \
            "https://wynos.online/sw.js?_wyn_promote_verify=${GITHUB_RUN_ID}" > /tmp/live-sw.js
          grep -q 'posting_prompt' /tmp/live-sw.js
          grep -q 'followed_post_digest' /tmp/live-sw.js

          curl --silent --show-error --fail --location --max-time 30 \
            "https://wynos.online/api/push-config?_wyn_promote_verify=${GITHUB_RUN_ID}" > /tmp/live-push-config.json
          node -e 'const fs=require("fs"); const c=JSON.parse(fs.readFileSync("/tmp/live-push-config.json","utf8")); if(c.configured!==true) process.exit(1)'

          echo 'Existing READY WYNOS Web artifact promoted and verified on wynos.online.' >> "$GITHUB_STEP_SUMMARY"
