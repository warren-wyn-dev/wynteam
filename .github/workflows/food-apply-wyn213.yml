name: Food -- apply WYN-213 merchant access hardening

# Applies supabase/migrations_wynos_merchant_access_hardening_v1.sql (WYN-213):
# developer accounts lose cross-store merchant access, legacy food_staff rows
# count by their role, WYNOS campaign payouts need the amount the admin saw,
# owed amounts only count paid orders from real customers, and an ad slip
# can be submitted once. Manual dispatch on main only, after the Founder
# approves production. Behaviour test:
# supabase/tests/wynos_merchant_access_hardening_test.sh.
#
# SAFETY: replaces four helper functions and one admin RPC, adds a unique
# index. No data is changed. After applying, deploy WYNOS Admin
# (deploy-admin.yml) so the payout button sends the expected amount.
# ROLLBACK (Founder, SQL editor): re-run the previous definitions from
# migrations_wynos_merchant_core_completion_v1.sql (merchant_has_store_role),
# migrations_wynos_merchant_accounts_v2.sql (food_has_merchant_access),
# migrations_wynos_food_storage_store_isolation_v1.sql (media) and
# migrations_wynos_platform_campaigns_v1.sql (owed rows, payout RPC), and
# drop index public.food_ad_topups_slip_path_uidx.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WYN-213 to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-WYN-213'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_merchant_access_hardening_v1.sql)
          commit;" >/dev/null
          # Definitions, privileges and counts only; no personal data is read.
          run_sql "select
              (pg_get_functiondef('public.merchant_has_store_role(uuid,text[])'::regprocedure) like '%developer_accounts%') as role_helper_dev_bypass,
              (pg_get_functiondef('public.food_has_merchant_access(uuid)'::regprocedure) like '%developer_accounts%') as access_helper_dev_bypass,
              (pg_get_functiondef('public.food_store_media_writable(text)'::regprocedure) like '%developer_accounts%') as media_dev_bypass,
              (pg_get_functiondef('public.merchant_has_store_role(uuid,text[])'::regprocedure) like '%when ''delivery'' then ''delivery''%') as legacy_roles_mapped,
              (select count(*) from pg_proc where proname = 'admin_settle_platform_store' and pronargs = 5) as payout_v2,
              (select count(*) from pg_proc where proname = 'admin_settle_platform_store' and pronargs = 3) as payout_v1_left,
              has_function_privilege('anon', 'public.admin_settle_platform_store(uuid,text,numeric,integer,text)', 'execute') as anon_can_settle,
              (select count(*) from pg_indexes where indexname = 'food_ad_topups_slip_path_uidx') as slip_unique,
              (select count(*) from public.food_staff where active) as legacy_staff_active,
              (select count(*) from public.food_staff where active and role <> 'owner') as legacy_staff_non_owner,
              (select count(*) from public.developer_accounts) as developer_accounts;" \
            | tee result.json | jq .
          jq -e '.[0].role_helper_dev_bypass == false and .[0].access_helper_dev_bypass == false and .[0].media_dev_bypass == false
                 and .[0].legacy_roles_mapped == true and .[0].payout_v2 == 1 and .[0].payout_v1_left == 0
                 and .[0].anon_can_settle == false and .[0].slip_unique == 1' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "WYN-213 merchant access hardening is installed. Next: deploy WYNOS Admin."
