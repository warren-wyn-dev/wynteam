name: Shift Home post content up once

on:
  push:
    branches: [fix/home-post-content-up]
    paths:
      - tools/shift_home_post_content_up.py
      - .github/workflows/shift-home-post-content-up-once.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-post-content-up
          fetch-depth: 0

      - name: Apply vertical rhythm patch
        run: python3 tools/shift_home_post_content_up.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format changed Dart files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi
          git diff --check

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Home regression tests
        working-directory: app
        run: |
          flutter test test/home_feed_screen_test.dart
          flutter test test/home_drop_card_overflow_test.dart
          flutter test test/qa_round2_ui_regression_test.dart

      - name: Verify tighter header rhythm
        run: |
          grep -q "height: 40," app/lib/features/home/presentation/widgets/home_drop_card.dart
          grep -q "height: 40," app/lib/features/home/presentation/widgets/home_pop_card.dart
          grep -q "WynSpacing.space1" app/lib/features/home/presentation/widgets/home_drop_card.dart
          grep -q "WynSpacing.space1" app/lib/features/home/presentation/widgets/home_pop_card.dart

      - name: Commit validated layout change
        run: |
          rm -f tools/shift_home_post_content_up.py
          rm -f .github/workflows/shift-home-post-content-up-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(home): move author caption and media upward"
          git push origin fix/home-post-content-up
