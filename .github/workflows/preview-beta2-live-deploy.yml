name: Beta2 live preview deploy

on:
  push:
    branches:
      - preview/web-beta2-bottom-nav-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify staging secrets exist
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          for name in STAGING_SUPABASE_URL STAGING_SUPABASE_PUBLISHABLE_KEY STAGING_VERCEL_PROJECT_ID VERCEL_ORG_ID VERCEL_TOKEN; do
            test -n "${!name:-}" || { echo "::error::$name is empty"; exit 1; }
          done

      - name: Install and check WYNOS Web Beta 2
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci --no-audit --no-fund
          npm run check

      - name: Deploy Beta 2 to isolated Vercel staging
        id: deploy
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          export VERCEL_PROJECT_ID="$STAGING_VERCEL_PROJECT_ID"
          url=$(npx --yes vercel@latest deploy --yes             --token="$VERCEL_TOKEN"             --build-env NEXT_PUBLIC_SUPABASE_URL="$STAGING_SUPABASE_URL"             --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY"             --build-env VERCEL_PREVIEW_FEEDBACK_ENABLED=0             --env NEXT_PUBLIC_SUPABASE_URL="$STAGING_SUPABASE_URL"             --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY"             --env VERCEL_PREVIEW_FEEDBACK_ENABLED=0             | tail -n 1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$url" > beta2-preview-url.txt
          echo "Beta 2 staging URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview URL
        uses: actions/upload-artifact@v4
        with:
          name: beta2-live-preview-url
          path: beta2-preview-url.txt
          retention-days: 7
