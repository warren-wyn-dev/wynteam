name: Dispatch Home 6px production deploy

on:
  push:
    branches:
      - ops/dispatch-home-6px-rhythm
    paths:
      - .github/workflows/dispatch-home-6px-rhythm.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production web deploy from main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/workflows/deploy-web.yml/dispatches" \
            -d '{"ref":"main"}'
