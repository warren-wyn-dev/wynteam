name: Apply Home 6px post rhythm

on:
  push:
    branches:
      - fix/home-post-6px-rhythm
    paths:
      - .github/workflows/apply-home-6px-rhythm.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-post-6px-rhythm

      - name: Apply exact 6px Home post rhythm
        run: |
          python3 - <<'PY'
          from pathlib import Path

          metrics = Path('app/lib/features/home/presentation/widgets/home_card_metrics.dart')
          drop = Path('app/lib/features/home/presentation/widgets/home_drop_card.dart')
          pop = Path('app/lib/features/home/presentation/widgets/home_pop_card.dart')

          text = metrics.read_text()
          anchor = 'const double homeCardContentInset =\n    homeCardEdgeInset + homeCardAvatarDiameter + homeCardAvatarGap;\n'
          addition = (
              '\n/// Founder-approved vertical rhythm around Home feed post boundaries.\n'
              '/// Divider -> post header, content/media -> action row, and action row ->\n'
              '/// divider all use this same 6px target.\n'
              'const double homePostVerticalRhythm = 6;\n\n'
              '/// Caption text is intentionally lifted 3px toward the author row. Transform\n'
              '/// does not affect layout, so the trailing layout gap is reduced by the same\n'
              '/// amount to keep the visible caption/hashtag -> action/media gap at 6px.\n'
              'const double homePostCaptionLift = 3;\n'
              'const double homePostCaptionTrailingLayoutGap =\n'
              '    homePostVerticalRhythm - homePostCaptionLift;\n'
          )
          if anchor not in text:
              raise SystemExit('home_card_metrics anchor not found')
          metrics.write_text(text.replace(anchor, anchor + addition, 1))

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          text = drop.read_text()
          old = '          // Approved final mockup: each post gets breathing room above\n          // the avatar/name, while the content inside the post stays compact.\n          padding: const EdgeInsets.fromLTRB(\n            0,\n            WynSpacing.space2,\n            0,\n            WynSpacing.space2,\n          ),'
          new = '          // Founder-approved 6px rhythm: divider -> header and action row ->\n          // divider use the same exact spacing.\n          padding: const EdgeInsets.fromLTRB(\n            0,\n            homePostVerticalRhythm,\n            0,\n            homePostVerticalRhythm,\n          ),'
          text = replace_once(text, old, new, 'Drop outer spacing')
          old = '                              homeCardEdgeInset,\n                              WynSpacing.space2,\n                            ),\n                            child: Transform.translate(\n                              offset: const Offset(0, -3),'
          new = '                              homeCardEdgeInset,\n                              homePostCaptionTrailingLayoutGap,\n                            ),\n                            child: Transform.translate(\n                              offset: const Offset(0, -homePostCaptionLift),'
          text = replace_once(text, old, new, 'Drop caption spacing')
          old = '                        // Compact feed polish: one fixed 8px gap after media\n                        // before liked-by/actions. Caption-only Drops already get\n                        // the same 8px from the caption\'s own bottom padding.\n                        if (item.isPoll || item.imageUrl != null)\n                          const SizedBox(height: WynSpacing.space2),'
          new = '                        // Keep media -> actions on the same Founder-approved\n                        // 6px vertical rhythm used by text-only posts.\n                        if (item.isPoll || item.imageUrl != null)\n                          const SizedBox(height: homePostVerticalRhythm),'
          text = replace_once(text, old, new, 'Drop media/action spacing')
          drop.write_text(text)

          text = pop.read_text()
          old = '          padding: const EdgeInsets.fromLTRB(\n            0,\n            WynSpacing.space2,\n            0,\n            WynSpacing.space2,\n          ),'
          new = '          padding: const EdgeInsets.fromLTRB(\n            0,\n            homePostVerticalRhythm,\n            0,\n            homePostVerticalRhythm,\n          ),'
          text = replace_once(text, old, new, 'Pop outer spacing')
          old = '                              homeCardEdgeInset,\n                              WynSpacing.space2,\n                            ),\n                            child: Transform.translate(\n                              offset: const Offset(0, -3),'
          new = '                              homeCardEdgeInset,\n                              homePostCaptionTrailingLayoutGap,\n                            ),\n                            child: Transform.translate(\n                              offset: const Offset(0, -homePostCaptionLift),'
          text = replace_once(text, old, new, 'Pop caption spacing')
          old = '                        ),\n                        const SizedBox(height: WynSpacing.space2),\n                        if (showLikedBy && item.likedBy.isNotEmpty)'
          new = '                        ),\n                        const SizedBox(height: homePostVerticalRhythm),\n                        if (showLikedBy && item.likedBy.isNotEmpty)'
          text = replace_once(text, old, new, 'Pop media/action spacing')
          pop.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name "warren-wyn-dev"
          git config user.email "warren.wyn.dev@gmail.com"
          git add app/lib/features/home/presentation/widgets/home_card_metrics.dart \
                  app/lib/features/home/presentation/widgets/home_drop_card.dart \
                  app/lib/features/home/presentation/widgets/home_pop_card.dart
          git commit -m "fix(feed): set Home post rhythm to 6px"
          git push origin HEAD:fix/home-post-6px-rhythm
