name: WYN-141 profile live hotfix

on:
  push:
    branches:
      - fix/wyn141-profile-avatar-nav
    paths:
      - tools/wyn141_profile_avatar_nav_hotfix.py
      - .github/workflows/wyn141-profile-live-hotfix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wyn141-profile-avatar-nav
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Apply targeted live UI hotfix
        run: |
          python3 tools/wyn141_profile_avatar_nav_hotfix.py
          # WYN-141 moved the compact stat rendering into the new founder
          # header widget, leaving this import stale on main.
          sed -i "/import '\.\.\/\.\.\/\.\.\/core\/text_utils\.dart';/d" \
            app/lib/features/profile/presentation/view_profile_screen.dart

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/features/profile/presentation/view_profile_screen.dart \
            app/lib/features/root/presentation/widgets/wynos_founder_bottom_navigation.dart \
            app/lib/core/design/wynos_founder_metrics.dart

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Commit validated hotfix
        run: |
          git config user.name "WYNOS UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/lib/features/profile/presentation/view_profile_screen.dart \
            app/lib/features/root/presentation/widgets/wynos_founder_bottom_navigation.dart \
            app/lib/core/design/wynos_founder_metrics.dart
          git diff --cached --stat
          git commit -m "fix(ui): stop profile avatar clipping and separate create label"
          git push origin HEAD:fix/wyn141-profile-avatar-nav
