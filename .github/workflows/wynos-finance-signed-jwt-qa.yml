name: WYNOS Finance Signed-JWT HTTP QA

# QA-only, explicitly opt-in. Normally skipped on Sandbox pushes.
# Signing credentials must be supplied securely by authorized QA tester.
on:
  push:
    branches:
      - sandbox/stripe-testmode-20261008
    paths:
      - .github/workflows/wynos-finance-signed-jwt-qa.yml
      - supabase/sandbox/gp/finance_http_signed_jwt_qa.mjs
      - supabase/sandbox/gp/finance_qa_password_auth_runner.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-jwt-http-qa:
    if: github.ref == 'refs/heads/sandbox/stripe-testmode-20261008' && vars.WYNOS_QA_JWT_HTTP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WYNOS_QA_HTTP_ACK: pcatuxtenluqzjzzwsvl
      WYNOS_QA_STRICT_AUTH_GATE: "true"
      WYNOS_QA_SUPABASE_URL: https://pcatuxtenluqzjzzwsvl.supabase.co
      # QA-only publishable/anon key and QA-only signed Auth JWTs.
      # NEVER inject service_role keys, Stripe keys, or Production credentials.
      WYNOS_QA_ANON_KEY: ${{ secrets.WYNOS_QA_ANON_KEY }}
      WYNOS_QA_OWNER_JWT: ${{ secrets.WYNOS_QA_OWNER_JWT }}
      WYNOS_QA_UNRELATED_JWT: ${{ secrets.WYNOS_QA_UNRELATED_JWT }}
      WYNOS_QA_APPROVED_ADMIN_JWT: ${{ secrets.WYNOS_QA_APPROVED_ADMIN_JWT }}
      WYNOS_QA_USE_PASSWORD_AUTH: ${{ vars.WYNOS_QA_USE_PASSWORD_AUTH }}
      WYNOS_QA_PASSWORD_GRANT_ACK: existing-three-qa-users-only
      WYNOS_QA_OWNER_EMAIL: ${{ secrets.WYNOS_QA_OWNER_EMAIL }}
      WYNOS_QA_OWNER_PASSWORD: ${{ secrets.WYNOS_QA_OWNER_PASSWORD }}
      WYNOS_QA_UNRELATED_EMAIL: ${{ secrets.WYNOS_QA_UNRELATED_EMAIL }}
      WYNOS_QA_UNRELATED_PASSWORD: ${{ secrets.WYNOS_QA_UNRELATED_PASSWORD }}
      WYNOS_QA_APPROVED_ADMIN_EMAIL: ${{ secrets.WYNOS_QA_APPROVED_ADMIN_EMAIL }}
      WYNOS_QA_APPROVED_ADMIN_PASSWORD: ${{ secrets.WYNOS_QA_APPROVED_ADMIN_PASSWORD }}
      WYNOS_QA_OWNER_STORE_ID: ${{ vars.WYNOS_QA_OWNER_STORE_ID }}
      WYNOS_QA_OTHER_STORE_ID: ${{ vars.WYNOS_QA_OTHER_STORE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove QA-only target before calling an external endpoint
        run: |
          test "$WYNOS_QA_HTTP_ACK" = "pcatuxtenluqzjzzwsvl"
          test "$WYNOS_QA_SUPABASE_URL" = "https://pcatuxtenluqzjzzwsvl.supabase.co"
      - name: Verify real Supabase-signed QA JWT owner, outsider and Admin RPC authorization
        run: |
          if [ "$WYNOS_QA_USE_PASSWORD_AUTH" = "true" ]; then
            node supabase/sandbox/gp/finance_qa_password_auth_runner.mjs
          else
            node supabase/sandbox/gp/finance_http_signed_jwt_qa.mjs
          fi
