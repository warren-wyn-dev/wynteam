name: Apply approved Edit Profile and deploy once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-approved-edit-profile-once.yml

permissions:
  contents: write
  actions: write

jobs:
  apply-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved Edit Profile patch
        run: python3 tools/apply_edit_profile_approved_v3.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/features/profile/data/profile.dart \
            app/lib/features/profile/data/profile_repository.dart \
            app/lib/features/profile/presentation/edit_profile_screen.dart \
            app/test/support/recording_profile_repository.dart \
            app/test/edit_profile_screen_test.dart

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Focused Edit Profile tests
        working-directory: app
        run: flutter test test/edit_profile_screen_test.dart

      - name: Commit approved UI and remove one-shot helpers
        run: |
          rm -f tools/apply_edit_profile_approved.py
          rm -f tools/apply_edit_profile_approved_v2.py
          rm -f tools/apply_edit_profile_approved_v3.py
          rm -f debug_flutter_test.log
          rm -f .github/workflows/debug-edit-profile-tests-once.yml
          rm -f .github/workflows/apply-approved-edit-profile-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply approved Edit Profile UI"
          git push origin HEAD:main

      - name: Deploy production and wait for success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(git rev-parse HEAD)
          gh workflow run deploy-web.yml --ref main
          RUN_ID=""
          for i in $(seq 1 40); do
            RUN_ID=$(gh run list --workflow deploy-web.yml --branch main --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$SHA\") | .databaseId" | head -n1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 3
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::Could not find production deploy run for $SHA"
            exit 1
          fi
          echo "Deploy run: $RUN_ID"
          gh run watch "$RUN_ID" --exit-status
