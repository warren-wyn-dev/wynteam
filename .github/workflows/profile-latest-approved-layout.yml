name: Profile latest approved layout

on:
  push:
    branches:
      - fix/profile-latest-approved-layout
    paths:
      - tools/profile_latest_approved_layout_patch.py
      - .github/workflows/profile-latest-approved-layout.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/profile-latest-approved-layout
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Apply approved Profile layout patch
        run: python3 tools/profile_latest_approved_layout_patch.py

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            app/lib/features/profile/presentation/view_profile_screen.dart \
            app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart \
            app/test/wynos_founder_profile_header_test.dart

      - name: Verify removed back affordance
        run: |
          if grep -n "tooltip: 'ย้อนกลับ'" app/lib/features/profile/presentation/view_profile_screen.dart; then
            echo "::error::Profile back affordance is still present"
            exit 1
          fi

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze

      - name: Run focused Profile tests
        working-directory: app
        run: flutter test test/wynos_founder_profile_header_test.dart test/profile_refresh_coordinator_test.dart

      - name: Commit validated implementation
        run: |
          git config user.name "WYNOS UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            app/lib/features/profile/presentation/view_profile_screen.dart \
            app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart \
            app/test/wynos_founder_profile_header_test.dart
          git commit -m "fix(profile): match latest approved header layout"
          git push origin HEAD:fix/profile-latest-approved-layout
