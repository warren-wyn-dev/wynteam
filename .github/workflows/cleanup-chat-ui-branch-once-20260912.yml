name: Cleanup chat UI branch metadata drift (one-shot)

on:
  push:
    branches:
      - feat/chat-system-ui-20260912
    paths:
      - .github/workflows/cleanup-chat-ui-branch-once-20260912.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-system-ui-20260912
          fetch-depth: 0
      - name: Restore non-chat metadata and verify Profile untouched
        run: |
          git fetch origin main
          git checkout origin/main -- .wyn/company/DECISIONS.md
          if git diff --name-only origin/main...HEAD | grep -E '^app/lib/features/profile/'; then
            echo '::error::Profile files changed; Founder explicitly locked Profile layout.'
            exit 1
          fi
          rm -f .github/workflows/cleanup-chat-ui-branch-once-20260912.yml
          git config user.name "warren-wyn-dev"
          git config user.email "warren.wyn.dev@gmail.com"
          git add -A
          git commit -m "chore(chat): keep UI work scoped to chat only"
          git push origin HEAD:feat/chat-system-ui-20260912
