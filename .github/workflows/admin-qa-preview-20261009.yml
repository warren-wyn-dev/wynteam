name: Admin QA preview (isolated one-off)

# Branch-scoped preview only. Does not deploy or modify Food/Merchant.
on:
  push:
    branches: [fix/admin-qa-guardrails-20261009]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  preview-admin:
    if: github.ref == 'refs/heads/fix/admin-qa-guardrails-20261009'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      VERCEL_ORG_ID: team_Kamt1PUT5XKn9MWrF404re1w
      VERCEL_PROJECT_ID: prj_Ca3SJBvzn0K4w8t0bwQn13EDbVh5
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:qa
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Deploy only the existing Admin project to Preview
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing deployment token'; exit 1; }
          test -n "$SUPABASE_URL" || { echo 'Missing backend URL'; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing publishable key'; exit 1; }
          test "$VERCEL_ORG_ID" = 'team_Kamt1PUT5XKn9MWrF404re1w'
          test "$VERCEL_PROJECT_ID" = 'prj_Ca3SJBvzn0K4w8t0bwQn13EDbVh5'
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          npx --yes vercel@latest deploy --yes --scope warren14 \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --env NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
