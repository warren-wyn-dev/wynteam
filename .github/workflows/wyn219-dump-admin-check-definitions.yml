name: WYN-219 -- dump admin check definitions (read-only)

# Reads, never writes: three plain SELECTs over the catalog save the current
# production definitions of every function, policy and view that checks
# profiles.platform_role or food_is_platform_admin(), as a workflow artifact.
# WYN-219 step 2 migrations are written from this dump (schema.sql can drift
# from production) and their rollback files restore these definitions.
# Checklist: .wyn/docs/engineering/wyn-219-step2-check-migration-checklist.md
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DUMP-WYN-219 to read the production definitions'
        required: true
        type: string

permissions:
  contents: read

jobs:
  dump:
    if: github.event.inputs.confirm == 'DUMP-WYN-219'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Dump definitions
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"
            exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2
              cat "$out" >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          mkdir -p dump
          run_sql "select n.nspname as schema, p.proname as name,
                   pg_get_function_identity_arguments(p.oid) as args,
                   pg_get_functiondef(p.oid) as definition
            from pg_proc p join pg_namespace n on n.oid = p.pronamespace
            where n.nspname in ('public', 'internal')
              and p.prokind = 'f'
              and (p.prosrc like '%platform_role%' or p.prosrc like '%food_is_platform_admin%')
            order by 1, 2, 3;" > dump/functions.json

          run_sql "select schemaname, tablename, policyname, cmd, roles::text, qual, with_check
            from pg_policies
            where coalesce(qual, '') || coalesce(with_check, '') like '%platform_role%'
               or coalesce(qual, '') || coalesce(with_check, '') like '%food_is_platform_admin%'
            order by 1, 2, 3;" > dump/policies.json

          run_sql "select schemaname, viewname, definition
            from pg_views
            where schemaname in ('public', 'internal')
              and definition like '%platform_role%'
            order by 1, 2;" > dump/views.json

          for f in functions policies views; do
            echo "$f: $(jq 'length' dump/$f.json) objects"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wyn219-admin-check-definitions
          path: dump/
          retention-days: 30
