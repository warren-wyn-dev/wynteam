name: Food -- apply WYN-211 open Food, Maha Sarakham service area

# Applies supabase/migrations_wynos_food_service_area_v1.sql (WYN-211):
# the Maha Sarakham boundary (OpenStreetMap, ODbL), server checks that the
# store pin and the delivery pin are inside it when quoting and ordering,
# "service_area" in store readiness, and public_enabled = true (WYNOS Food
# open to everyone). Manual dispatch on main only, after the Founder approves
# production. Behaviour test: supabase/tests/wynos_food_service_area_test.sh.
#
# SAFETY: one new table (RLS on, no grants), new functions, and a
# replacement of internal.food_delivery_fee / food_store_readiness_missing.
# No customer or order data is changed. Stores without a pin inside
# Maha Sarakham stop taking orders until they pin it (the summary prints how
# many published stores that is).
# ROLLBACK (Founder, SQL editor): update public.food_rollout_settings set
# public_enabled = false (hides Food from customers again). To lift the area
# limit only: update public.food_service_areas set active = false is NOT
# enough (no active area blocks every order); re-apply
# migrations_wynos_food_delivery_zone_v1.sql and core completion instead.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WYN-211 to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-WYN-211'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_food_service_area_v1.sql)
          commit;" >/dev/null
          # Definitions, privileges and counts only; no personal data is read.
          run_sql "select
              (select count(*) from public.food_service_areas where code = 'maha_sarakham' and active) as area_ready,
              internal.food_in_service_area(16.1847, 103.3007) as msk_city_inside,
              internal.food_in_service_area(16.4419, 102.8360) as khon_kaen_inside,
              (select public_enabled from public.food_rollout_settings where id = true) as public_enabled,
              has_function_privilege('anon', 'public.food_service_area_check(double precision,double precision)', 'execute') as anon_can_check,
              has_table_privilege('authenticated', 'public.food_service_areas', 'select') as users_read_boundary,
              (select pg_get_functiondef('internal.food_delivery_fee(uuid,double precision,double precision)'::regprocedure)
                 like '%outside service area%') as fee_checks_area,
              (select count(*) from public.food_stores where is_published) as published_stores,
              (select count(*) from public.food_stores where is_published
                 and not internal.food_in_service_area(latitude, longitude)) as published_stores_outside;" \
            | tee result.json | jq .
          jq -e '.[0].area_ready == 1 and .[0].msk_city_inside == true and .[0].khon_kaen_inside == false
                 and .[0].public_enabled == true and .[0].anon_can_check == false
                 and .[0].users_read_boundary == false and .[0].fee_checks_area == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "WYN-211: WYNOS Food is open; ordering is limited to Maha Sarakham."
