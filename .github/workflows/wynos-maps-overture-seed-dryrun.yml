name: WYNOS Maps -- Overture seed dry run

on:
  push:
    branches:
      - ops/wynos-maps-overture-seed-dryrun
    paths:
      - ".github/workflows/wynos-maps-overture-seed-dryrun.yml"

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL is missing"; exit 1; }

      - name: Install official Overture client
        run: python -m pip install --disable-pip-version-check overturemaps

      - name: Download Overture Places around current WYNOS Maps launch area
        run: |
          overturemaps download \
            --bbox=102.95,16.00,103.55,16.55 \
            -f geojson \
            --type=place \
            -o overture-places.geojson

      - name: Dry-run WYNOS filter
        run: |
          python .github/scripts/import-overture-places.py \
            --file overture-places.geojson \
            --supabase-url "$SUPABASE_URL" \
            --access-token "$SUPABASE_ACCESS_TOKEN" \
            --min-confidence 0.90 \
            --activate-confidence 0.95 \
            --max-places 5000 \
            --dry-run
