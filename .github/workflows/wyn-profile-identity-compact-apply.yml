name: WYN Profile Compact Identity Apply

on:
  push:
    branches:
      - wyn/profile-cover-170-overlap
    paths:
      - .github/workflows/wyn-profile-identity-compact-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wyn/profile-cover-170-overlap

      - name: Apply compact Profile identity layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          header = Path('app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart')
          text = header.read_text()

          old_name = '''  Widget _nameRow() {
    return Row(
      mainAxisSize: MainAxisSize.min,
      children: [
        Flexible(
          child: Text(
            profile.nameOrUsername,
            maxLines: 1,
            overflow: TextOverflow.ellipsis,
            style: const TextStyle(
              fontSize: 21,
              height: 1.12,
              fontWeight: FontWeight.w700,
              color: WynColors.ink,
            ),
          ),
        ),
        if (profile.isVerified) ...[
          const SizedBox(width: 4),
          const VerifiedBadge(),
        ],
        const SizedBox(width: 8),
        Text(
          '@${profile.username}',
          maxLines: 1,
          overflow: TextOverflow.ellipsis,
          style: const TextStyle(
            fontSize: 13.5,
            height: 1.1,
            color: WynColors.graphite,
            fontWeight: FontWeight.w400,
          ),
        ),
        if (isOwnProfile) ...[
          const SizedBox(width: 5),
          const Icon(
            Icons.keyboard_arrow_down,
            size: 22,
            color: WynColors.ink,
          ),
        ],
      ],
    );
  }
'''
          new_name = '''  Widget _nameRow() {
    return Column(
      mainAxisSize: MainAxisSize.min,
      crossAxisAlignment: CrossAxisAlignment.start,
      children: [
        Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            Flexible(
              child: Text(
                profile.nameOrUsername,
                maxLines: 1,
                overflow: TextOverflow.ellipsis,
                style: const TextStyle(
                  fontSize: 21,
                  height: 1.08,
                  fontWeight: FontWeight.w700,
                  color: WynColors.ink,
                ),
              ),
            ),
            if (profile.isVerified) ...[
              const SizedBox(width: 4),
              const VerifiedBadge(),
            ],
            if (isOwnProfile) ...[
              const SizedBox(width: 5),
              const Icon(
                Icons.keyboard_arrow_down,
                size: 22,
                color: WynColors.ink,
              ),
            ],
          ],
        ),
        const SizedBox(height: 1),
        Text(
          '@${profile.username}',
          maxLines: 1,
          overflow: TextOverflow.ellipsis,
          style: const TextStyle(
            fontSize: 13.5,
            height: 1.0,
            color: WynColors.graphite,
            fontWeight: FontWeight.w400,
          ),
        ),
      ],
    );
  }
'''
          if old_name not in text:
              raise SystemExit('Expected current name/username row not found')
          text = text.replace(old_name, new_name, 1)

          old_avatar = '''                Transform.translate(
                  offset: const Offset(0, -25),
                  child: _ProfileAvatar(
                    profile: profile,
                    showOnline: showOnline,
                  ),
                ),
                const SizedBox(width: 12),'''
          new_avatar = '''                SizedBox(
                  width: WynosFounderMetrics.profileAvatarOuterDiameter,
                  height: 67,
                  child: Stack(
                    clipBehavior: Clip.none,
                    children: [
                      Positioned(
                        top: -25,
                        left: 0,
                        child: _ProfileAvatar(
                          profile: profile,
                          showOnline: showOnline,
                        ),
                      ),
                    ],
                  ),
                ),
                const SizedBox(width: 12),'''
          if old_avatar not in text:
              raise SystemExit('Expected current avatar overlap block not found')
          text = text.replace(old_avatar, new_avatar, 1)

          replacements = {
              '''              12,\n              WynSpacing.space4,\n              2,''': '''              8,\n              WynSpacing.space4,\n              0,''',
              '                        const SizedBox(height: 9),': '                        const SizedBox(height: 3),',
              '            const SizedBox(height: 12),': '            const SizedBox(height: 4),',
              '            padding: const EdgeInsets.fromLTRB(16, 12, 16, 8),': '            padding: const EdgeInsets.fromLTRB(16, 8, 16, 6),',
              '              padding: const EdgeInsets.fromLTRB(16, 0, 16, 8),': '              padding: const EdgeInsets.fromLTRB(16, 0, 16, 4),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected spacing token not found: {old!r}')
              text = text.replace(old, new, 1)
          header.write_text(text)

          test = Path('app/test/wynos_founder_profile_header_test.dart')
          t = test.read_text()
          old_test = '''  testWidgets('username sits beside display name on the same row',
      (tester) async {
    await tester.pumpWidget(buildHeader());

    final name = tester.getRect(find.text('หาเพื่อนคุย'));
    final username = tester.getRect(find.text('@kkcu52'));
    expect(username.left, greaterThan(name.left));
    expect((username.center.dy - name.center.dy).abs(), lessThan(8));
  });'''
          new_test = '''  testWidgets('username sits directly below the display name', (tester) async {
    await tester.pumpWidget(buildHeader());

    final name = tester.getRect(find.text('หาเพื่อนคุย'));
    final username = tester.getRect(find.text('@kkcu52'));
    expect(username.left, closeTo(name.left, 1));
    expect(username.center.dy, greaterThan(name.center.dy));
    expect(username.top - name.bottom, lessThan(6));
  });'''
          if old_test not in t:
              raise SystemExit('Expected current username placement regression test not found')
          test.write_text(t.replace(old_test, new_test, 1))
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Format
        run: dart format app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart app/test/wynos_founder_profile_header_test.dart

      - name: Validate compact Profile intent
        run: |
          grep -q "height: 67" app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart
          grep -q "top: -25" app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart
          grep -q "SizedBox(height: 1)" app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart
          grep -q "username sits directly below" app/test/wynos_founder_profile_header_test.dart

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Founder Profile regression tests
        working-directory: app
        run: flutter test test/wynos_founder_profile_header_test.dart

      - name: Commit compact Profile UI and remove helper workflow
        run: |
          rm .github/workflows/wyn-profile-identity-compact-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart \
                  app/test/wynos_founder_profile_header_test.dart \
                  .github/workflows/wyn-profile-identity-compact-apply.yml
          git commit -m "fix(ui): compact Profile identity and stack username"
          git push origin HEAD:wyn/profile-cover-170-overlap
