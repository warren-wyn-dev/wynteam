name: WYN Profile Compact Identity Apply

on:
  push:
    branches:
      - wyn/profile-cover-170-overlap
    paths:
      - .github/workflows/wyn-profile-identity-compact-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wyn/profile-cover-170-overlap

      - name: Apply compact Profile identity layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          header = Path('app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart')
          text = header.read_text()
          pattern = r"  Widget _nameRow\(\) \{.*?\n  \}\n\n  Widget _displayNameControl\(\)"
          replacement = "  Widget _nameRow() {\n    return Column(\n      mainAxisSize: MainAxisSize.min,\n      crossAxisAlignment: CrossAxisAlignment.start,\n      children: [\n        Row(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            Flexible(\n              child: Text(\n                profile.nameOrUsername,\n                maxLines: 1,\n                overflow: TextOverflow.ellipsis,\n                style: const TextStyle(\n                  fontSize: 21,\n                  height: 1.08,\n                  fontWeight: FontWeight.w700,\n                  color: WynColors.ink,\n                ),\n              ),\n            ),\n            if (profile.isVerified) ...[\n              const SizedBox(width: 4),\n              const VerifiedBadge(),\n            ],\n            if (isOwnProfile) ...[\n              const SizedBox(width: 5),\n              const Icon(\n                Icons.keyboard_arrow_down,\n                size: 22,\n                color: WynColors.ink,\n              ),\n            ],\n          ],\n        ),\n        const SizedBox(height: 1),\n        Text(\n          '@${profile.username}',\n          maxLines: 1,\n          overflow: TextOverflow.ellipsis,\n          style: const TextStyle(\n            fontSize: 13.5,\n            height: 1.0,\n            color: WynColors.graphite,\n            fontWeight: FontWeight.w400,\n          ),\n        ),\n      ],\n    );\n  }\n\n  Widget _displayNameControl()"
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected current name/username block not found')
          old_avatar = "                Transform.translate(\n                  offset: const Offset(0, -25),\n                  child: _ProfileAvatar(\n                    profile: profile,\n                    showOnline: showOnline,\n                  ),\n                ),\n                const SizedBox(width: 12),"
          new_avatar = "                SizedBox(\n                  width: WynosFounderMetrics.profileAvatarOuterDiameter,\n                  height: 67,\n                  child: Stack(\n                    clipBehavior: Clip.none,\n                    children: [\n                      Positioned(\n                        top: -25,\n                        left: 0,\n                        child: _ProfileAvatar(\n                          profile: profile,\n                          showOnline: showOnline,\n                        ),\n                      ),\n                    ],\n                  ),\n                ),\n                const SizedBox(width: 12),"
          if old_avatar not in text:
              raise SystemExit('Expected current avatar overlap block not found')
          text = text.replace(old_avatar, new_avatar, 1)
          for old, new in [
              ("              12,\n              WynSpacing.space4,\n              2,", "              8,\n              WynSpacing.space4,\n              0,"),
              ("                        const SizedBox(height: 9),", "                        const SizedBox(height: 3),"),
              ("            const SizedBox(height: 12),", "            const SizedBox(height: 4),"),
              ("            padding: const EdgeInsets.fromLTRB(16, 12, 16, 8),", "            padding: const EdgeInsets.fromLTRB(16, 8, 16, 6),"),
              ("              padding: const EdgeInsets.fromLTRB(16, 0, 16, 8),", "              padding: const EdgeInsets.fromLTRB(16, 0, 16, 4),"),
          ]:
              if old not in text:
                  raise SystemExit(f'Expected spacing token not found: {old!r}')
              text = text.replace(old, new, 1)
          header.write_text(text)
          test = Path('app/test/wynos_founder_profile_header_test.dart')
          t = test.read_text()
          pattern = r"  testWidgets\('username sits beside display name on the same row',.*?\n  \}\);"
          replacement = "  testWidgets('username sits directly below the display name', (tester) async {\n    await tester.pumpWidget(buildHeader());\n\n    final name = tester.getRect(find.text('หาเพื่อนคุย'));\n    final username = tester.getRect(find.text('@kkcu52'));\n    expect(username.left, closeTo(name.left, 1));\n    expect(username.center.dy, greaterThan(name.center.dy));\n    expect(username.top - name.bottom, lessThan(6));\n  });"
          t, count = re.subn(pattern, replacement, t, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Expected username regression test not found')
          test.write_text(t)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Format
        run: dart format app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart app/test/wynos_founder_profile_header_test.dart

      - name: Validate compact Profile intent
        run: |
          grep -q "height: 67" app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart
          grep -q "top: -25" app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart
          grep -q "SizedBox(height: 1)" app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart
          grep -q "username sits directly below" app/test/wynos_founder_profile_header_test.dart

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Founder Profile regression tests
        working-directory: app
        run: flutter test test/wynos_founder_profile_header_test.dart

      - name: Commit compact Profile UI and remove helper workflow
        run: |
          rm .github/workflows/wyn-profile-identity-compact-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/features/profile/presentation/widgets/wynos_founder_profile_header.dart \
                  app/test/wynos_founder_profile_header_test.dart \
                  .github/workflows/wyn-profile-identity-compact-apply.yml
          git commit -m "fix(ui): compact Profile identity and stack username"
          git push origin HEAD:wyn/profile-cover-170-overlap
