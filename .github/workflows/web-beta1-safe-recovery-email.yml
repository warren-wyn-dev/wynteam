name: Web Beta1 Safe Recovery Email

on:
  pull_request:
    paths:
      - '.github/templates/wynos-recovery-email.html'
      - '.github/scripts/sync-auth-recovery-email-template.sh'
      - '.github/workflows/web-beta1-safe-recovery-email.yml'
      - 'web/lib/password-recovery-link.ts'
      - 'web/components/auth-flow/screens.tsx'
      - 'web/tests/browser/password-recovery.spec.ts'
  workflow_dispatch:
  workflow_run:
    workflows: ['WYN-158 Production Deploy']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: wynos-safe-recovery-email-template
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate guarded recovery template deployment
        run: |
          bash -n .github/scripts/sync-auth-recovery-email-template.sh
          bash .github/scripts/sync-auth-recovery-email-template.sh --check-only

  sync:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set prefetch-safe recovery template after verified production deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash .github/scripts/sync-auth-recovery-email-template.sh
