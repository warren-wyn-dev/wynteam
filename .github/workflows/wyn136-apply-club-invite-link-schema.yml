name: WYN-136 -- apply club invite link schema (tables, RPCs)

# Same established gap as every prior WYN-*-apply-*-schema.yml in this
# project (wyn133, wyn127, wyn125, wyn118, ...): schema.sql does not
# auto-apply to production, it only describes the desired end state.
# This workflow applies WYN-136's own section (Club Invite Link --
# generate/revoke/expiration/max-uses, .wyn/tasks/approved/WYN-136-club-invite-link.md).
#
# RUN ORDER: independent of WYN-134/138/139 -- touches only
# clubs/club_members (existing, WYN-014), no dependency either way.
#
# Every statement below is copy-paste identical (in meaning) to the
# WYN-136 section of supabase/schema.sql (search "WYN-136: Club Invite
# Link") and to supabase/migrations_wyn136_club_invite_link.sql -- if
# the three ever drift, schema.sql/the migrations file is wrong, not
# this workflow (this file is what actually ran against production).
#
# POLICY NOTE (Founder-approved, .wyn/company/DECISIONS.md 2026-09-07
# "[2026-09-07] Social 3-Domain Roadmap"): redeem_club_invite_link()
# below is written for "ทางเลือก A" -- a valid invite link joins a
# Private Club immediately, skipping Join Request/Approve entirely, and
# upgrades an existing pending request to approved on redeem.
#
# SAFETY: additive only, no destructive step.
#   * club_invite_links / club_invite_link_uses are brand new tables.
#   * All 4 RPCs are new functions -- nothing existing is redefined.
#   * redeem_club_invite_link()'s club_members insert uses
#     `on conflict ... do update ... where status = 'pending'` --
#     never touches an already-approved or banned row.
#
# Safe to run more than once (CREATE TABLE/INDEX IF NOT EXISTS, DROP
# POLICY IF EXISTS before CREATE, CREATE OR REPLACE FUNCTION) --
# validated locally via supabase/tests/wyn_136_club_invite_link_test.sh
# against a scratch PostgreSQL loaded with the full schema.sql
# (including a concurrent-session race-condition test on the max-uses
# cap, and re-run/idempotency, per
# .wyn/logs/deployments/2026-09-07-wyn-134-136-137-138-139-phase-a-go-live-package.md).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          echo "=== 0. Diagnose: does club_invite_links already exist? ==="
          run_sql "select table_name from information_schema.tables where table_schema = 'public' and table_name = 'club_invite_links';" | jq .

          echo "=== 1. Create club_invite_links + RLS (idempotent) ==="
          run_sql "create table if not exists public.club_invite_links (
                     id uuid primary key default gen_random_uuid(),
                     club_id uuid not null references public.clubs (id) on delete cascade,
                     code text not null,
                     created_by uuid not null references public.profiles (id) on delete cascade,
                     expires_at timestamptz,
                     max_uses integer,
                     use_count integer not null default 0,
                     revoked_at timestamptz,
                     created_at timestamptz not null default now(),
                     constraint club_invite_links_max_uses_positive check (max_uses is null or max_uses > 0)
                   );

                   create unique index if not exists club_invite_links_code_idx on public.club_invite_links (code);
                   create index if not exists club_invite_links_club_id_idx on public.club_invite_links (club_id, created_at desc);

                   alter table public.club_invite_links enable row level security;

                   drop policy if exists \"Owners/admins can view their club's invite links\" on public.club_invite_links;
                   create policy \"Owners/admins can view their club's invite links\"
                     on public.club_invite_links
                     for select
                     to authenticated
                     using (public.club_role(club_id, auth.uid()) in ('owner', 'admin'));" >/dev/null
          echo "Done."

          echo "=== 2. Create club_invite_link_uses + RLS (idempotent) ==="
          run_sql "create table if not exists public.club_invite_link_uses (
                     link_id uuid not null references public.club_invite_links (id) on delete cascade,
                     user_id uuid not null references public.profiles (id) on delete cascade,
                     used_at timestamptz not null default now(),
                     primary key (link_id, user_id)
                   );
                   alter table public.club_invite_link_uses enable row level security;" >/dev/null
          echo "Done."

          echo "=== 3. create_club_invite_link() RPC (Owner/Admin only) ==="
          run_sql "create or replace function public.create_club_invite_link(
                     p_club_id uuid,
                     p_expires_in_days integer default null,
                     p_max_uses integer default null
                   )
                   returns public.club_invite_links
                   language plpgsql
                   security definer
                   set search_path = public
                   as \$fn\$
                   declare
                     v_me uuid := auth.uid();
                     v_code text;
                     v_row public.club_invite_links;
                   begin
                     if coalesce(public.club_role(p_club_id, v_me), '') not in ('owner', 'admin') then
                       raise exception 'Not permitted to create invite links for this club';
                     end if;
                     if p_max_uses is not null and p_max_uses <= 0 then
                       raise exception 'max_uses must be positive';
                     end if;

                     loop
                       v_code := substr(md5(random()::text || clock_timestamp()::text), 1, 10);
                       begin
                         insert into public.club_invite_links (club_id, code, created_by, expires_at, max_uses)
                         values (
                           p_club_id,
                           v_code,
                           v_me,
                           case when p_expires_in_days is null then null
                                else now() + (p_expires_in_days || ' days')::interval end,
                           p_max_uses
                         )
                         returning * into v_row;
                         exit;
                       exception when unique_violation then
                         -- ชนกันของ code (โอกาสน้อยมาก, 10 ตัวอักษรจาก md5) -- สุ่มใหม่แล้วลองอีกรอบ
                         continue;
                       end;
                     end loop;

                     return v_row;
                   end;
                   \$fn\$;

                   grant execute on function public.create_club_invite_link(uuid, integer, integer) to authenticated;" >/dev/null
          echo "Done."

          echo "=== 4. revoke_club_invite_link() RPC (Owner/Admin only) ==="
          run_sql "create or replace function public.revoke_club_invite_link(p_link_id uuid)
                   returns void
                   language plpgsql
                   security definer
                   set search_path = public
                   as \$fn\$
                   declare
                     v_me uuid := auth.uid();
                     v_club_id uuid;
                   begin
                     select club_id into v_club_id from public.club_invite_links where id = p_link_id;
                     if v_club_id is null then
                       raise exception 'Invite link not found';
                     end if;
                     if coalesce(public.club_role(v_club_id, v_me), '') not in ('owner', 'admin') then
                       raise exception 'Not permitted to revoke invite links for this club';
                     end if;

                     update public.club_invite_links
                     set revoked_at = now()
                     where id = p_link_id and revoked_at is null;

                     if not found then
                       raise exception 'Invite link already revoked, or not found';
                     end if;
                   end;
                   \$fn\$;

                   grant execute on function public.revoke_club_invite_link(uuid) to authenticated;" >/dev/null
          echo "Done."

          echo "=== 5. preview_club_invite_link() RPC (public, incl. guest/anonymous) ==="
          run_sql "create or replace function public.preview_club_invite_link(p_code text)
                   returns table (
                     status text,
                     club_id uuid,
                     club_name text,
                     club_privacy text,
                     club_icon_url text
                   )
                   language sql
                   stable
                   security definer
                   set search_path = public
                   as \$fn\$
                     select
                       case
                         when l.id is null then 'not_found'
                         when l.revoked_at is not null then 'revoked'
                         when l.expires_at is not null and l.expires_at < now() then 'expired'
                         when l.max_uses is not null and l.use_count >= l.max_uses then 'exhausted'
                         else 'valid'
                       end,
                       c.id, c.name, c.privacy, c.icon_url
                     from public.club_invite_links l
                     right join (select p_code as code) req on true
                     left join public.clubs c on c.id = l.club_id
                     where l.code = req.code or l.code is null
                     limit 1;
                   \$fn\$;

                   grant execute on function public.preview_club_invite_link(text) to authenticated;" >/dev/null
          echo "Done."

          echo "=== 6. redeem_club_invite_link() RPC -- join for real (Founder's ทางเลือก A) ==="
          run_sql "create or replace function public.redeem_club_invite_link(p_code text)
                   returns uuid
                   language plpgsql
                   security definer
                   set search_path = public
                   as \$fn\$
                   declare
                     v_me uuid := auth.uid();
                     v_link public.club_invite_links;
                     v_club public.clubs;
                     v_already_approved boolean;
                   begin
                     if v_me is null then
                       raise exception 'Not authenticated';
                     end if;

                     select * into v_link from public.club_invite_links where code = p_code for update;
                     if v_link.id is null then raise exception 'Invite link not found'; end if;
                     if v_link.revoked_at is not null then raise exception 'This invite link has been revoked'; end if;
                     if v_link.expires_at is not null and v_link.expires_at < now() then
                       raise exception 'This invite link has expired';
                     end if;
                     if v_link.max_uses is not null and v_link.use_count >= v_link.max_uses then
                       raise exception 'This invite link has reached its usage limit';
                     end if;

                     select * into v_club from public.clubs where id = v_link.club_id;

                     if exists (
                       select 1 from public.club_members
                       where club_id = v_club.id and user_id = v_me and status = 'banned'
                     ) then
                       raise exception 'You have been banned from this club';
                     end if;

                     -- Founder ยืนยันทางเลือก A (2026-09-07, .wyn/company/DECISIONS.md):
                     -- invite link ที่ valid = อนุมัติล่วงหน้าในตัวเสมอ ไม่ว่า club จะเป็น public หรือ private
                     insert into public.club_members (club_id, user_id, role, status)
                     values (v_club.id, v_me, 'member', 'approved')
                     on conflict (club_id, user_id)
                     do update set status = 'approved'
                     where public.club_members.status = 'pending';
                     -- upgrade แถว pending เดิม (จาก join ปกติที่ยังไม่ได้รับอนุมัติ) เป็น approved ทันที
                     -- ให้สอดคล้องกับเจตนาของทางเลือก A (\"ลิงก์เชิญ = อนุมัติล่วงหน้าแล้ว\") --
                     -- ไม่ทำอะไรกับแถวที่เป็น approved/banned อยู่แล้ว (do update ...where... กรองไว้)

                     select exists (
                       select 1 from public.club_members
                       where club_id = v_club.id and user_id = v_me and status = 'approved'
                     ) into v_already_approved;

                     -- นับ use_count/บันทึก attribution เฉพาะตอนเป็นการเข้าร่วมใหม่จริง
                     -- (ไม่ใช่การกดลิงก์ซ้ำของสมาชิกเดิม/คนที่ pending อยู่แล้วจาก join ปกติ)
                     if not exists (select 1 from public.club_invite_link_uses where link_id = v_link.id and user_id = v_me) then
                       update public.club_invite_links set use_count = use_count + 1 where id = v_link.id;
                       insert into public.club_invite_link_uses (link_id, user_id) values (v_link.id, v_me);
                     end if;

                     return v_club.id;
                   end;
                   \$fn\$;

                   grant execute on function public.redeem_club_invite_link(text) to authenticated;" >/dev/null
          echo "Done."

          echo "=== 7. Verify: tables + all 4 RPCs now present ==="
          run_sql "select table_name from information_schema.tables where table_schema = 'public' and table_name in ('club_invite_links', 'club_invite_link_uses') order by table_name;" | jq .
          run_sql "select proname from pg_proc where pronamespace = 'public'::regnamespace and proname in ('create_club_invite_link', 'revoke_club_invite_link', 'preview_club_invite_link', 'redeem_club_invite_link') order by proname;" | jq .

          echo "=== 8. Smoke test: query against real data (should return cleanly, even if empty) ==="
          run_sql "select id, club_id, code, use_count from public.club_invite_links limit 5;" | jq .
