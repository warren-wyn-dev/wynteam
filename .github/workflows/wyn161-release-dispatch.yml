name: WYN-161 one-off production deploy

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-deploy:
    if: github.event.head_commit.message == 'ci: trigger WYN-161 production deploy'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "${{ github.repository }}" --ref main
