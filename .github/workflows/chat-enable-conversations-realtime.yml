name: Chat -- add conversations to the realtime publication

# schema.sql changes don't auto-apply to production (this session's own
# earlier finding: ZOKY removal only ever went to the web deploy, by the
# Founder's explicit choice, never to the database). The Message
# Grouping & Bubble Behavior spec's read-receipt feature needs
# `public.conversations` in the `supabase_realtime` publication so the
# "sent" -> "read" flip reaches an already-open ConversationScreen live
# (schema.sql's own guarded DO block already covers this for a *fresh*
# project, but this one is already migrated) -- this applies just that
# one statement, safely idempotent (checks membership first).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          echo "=== Before ==="
          run_sql "select exists (
                     select 1 from pg_publication_tables
                     where pubname = 'supabase_realtime'
                       and schemaname = 'public' and tablename = 'conversations'
                   ) as already_enabled;" | jq .

          echo "=== Applying (no-op if already enabled) ==="
          run_sql "do \$\$
                   begin
                     if not exists (
                       select 1 from pg_publication_tables
                       where pubname = 'supabase_realtime' and schemaname = 'public' and tablename = 'conversations'
                     ) then
                       execute 'alter publication supabase_realtime add table public.conversations';
                     end if;
                   end
                   \$\$;" >/dev/null
          echo "Done."

          echo "=== After ==="
          run_sql "select exists (
                     select 1 from pg_publication_tables
                     where pubname = 'supabase_realtime'
                       and schemaname = 'public' and tablename = 'conversations'
                   ) as now_enabled;" | jq .
