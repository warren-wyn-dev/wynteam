name: WYN-158 Founder parity patch

on:
  push:
    branches:
      - fix/wyn-158-founder-visual-parity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/wyn-158-founder-visual-parity
          fetch-depth: 0
      - name: Apply exact source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              "web/app/layout.tsx",
              'import "./club-post-card-web.css";\n',
              'import "./club-post-card-web.css";\nimport "./founder-parity-lock.css";\n',
          )

          replace(
              "web/components/parity-home-final.tsx",
              'import { AppChrome, Avatar } from "@/components/phase3-ui";\n',
              'import { AppChrome, Avatar } from "@/components/phase3-ui";\nimport { RichPostText } from "@/components/rich-post-text";\n',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '<Avatar src={row.author_avatar_url} label={row.author_username || "WYNOS"} size={42} />',
              '<Avatar src={row.author_avatar_url} label={row.author_username || "WYNOS"} size={44} />',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '''{row.caption ? (\n          <Link className="post-open-button" href={`/drop/${row.id}`}>\n            <p className="caption audit-caption">{row.caption}</p>\n          </Link>\n        ) : null}''',
              '''{row.caption ? (\n          <RichPostText className="caption audit-caption" value={row.caption} postHref={`/drop/${row.id}`} />\n        ) : null}''',
          )
          replace(
              "web/components/parity-home-final.tsx",
              '''{post.content ? (\n          <Link className="post-open-button" href={`/club-post/${post.id}`}>\n            <p className="caption audit-caption">{post.content}</p>\n          </Link>\n        ) : null}''',
              '''{post.content ? (\n          <RichPostText className="caption audit-caption" value={post.content} postHref={`/club-post/${post.id}`} />\n        ) : null}''',
          )

          replace(
              "web/components/golden-drop-card.tsx",
              'import { authorLabel, relativeTimeTh, type HomeFeedRow } from "@/lib/feed";\n',
              'import { RichPostText } from "@/components/rich-post-text";\nimport { authorLabel, relativeTimeTh, type HomeFeedRow } from "@/lib/feed";\n',
          )
          replace(
              "web/components/golden-drop-card.tsx",
              '{row.quote_text ? <p className="golden-drop-quote">{row.quote_text}</p> : null}',
              '{row.quote_text ? <RichPostText className="golden-drop-quote" value={row.quote_text} /> : null}',
          )
          replace(
              "web/components/golden-drop-card.tsx",
              '{row.caption ? <Link className="golden-drop-open" href={`/drop/${row.id}`}><p>{row.caption}</p></Link> : null}',
              '{row.caption ? <RichPostText className="golden-drop-open" value={row.caption} postHref={`/drop/${row.id}`} /> : null}',
          )

          replace(
              "web/components/post-detail-route.tsx",
              'import { AppChrome, Avatar, EmptyState, LoadingState } from "@/components/phase3-ui";\n',
              'import { AppChrome, Avatar, EmptyState, LoadingState } from "@/components/phase3-ui";\nimport { RichPostText } from "@/components/rich-post-text";\n',
          )
          old_caption = '''function Caption({ value }: { value: string }) {\n  const parts = value.split(/((?:https?:\\/\\/[^\\s]+)|(?:#[\\p{L}\\p{N}_]+))/gu);\n  return (\n    <p className="detail-caption">\n      {parts.map((part, index) => {\n        if (/^https?:\\/\\//i.test(part)) {\n          return <a className="linkish" href={part} target="_blank" rel="noreferrer" key={`${part}-${index}`}>{part}</a>;\n        }\n        if (part.startsWith("#")) return <span className="hashtag" key={`${part}-${index}`}>{part}</span>;\n        return part;\n      })}\n    </p>\n  );\n}\n'''
          new_caption = '''function Caption({ value }: { value: string }) {\n  return <RichPostText className="detail-caption" value={value} />;\n}\n'''
          replace("web/components/post-detail-route.tsx", old_caption, new_caption)

          replace(
              "web/components/search-route.tsx",
              'import Link from "next/link";\n',
              'import Link from "next/link";\nimport { useSearchParams } from "next/navigation";\n',
          )
          replace(
              "web/components/search-route.tsx",
              '''function SearchInner({ client, userId }: { client: SupabaseClient; userId: string }) {\n  const [draft, setDraft] = useState("");\n  const [query, setQuery] = useState("");\n  const [tab, setTab] = useState<"user" | "drop" | "club">("user");''',
              '''function SearchInner({ client, userId }: { client: SupabaseClient; userId: string }) {\n  const params = useSearchParams();\n  const urlQuery = params.get("q")?.trim() ?? "";\n  const [draft, setDraft] = useState(urlQuery);\n  const [query, setQuery] = useState(urlQuery.length >= 2 ? urlQuery : "");\n  const [tab, setTab] = useState<"user" | "drop" | "club">(urlQuery.startsWith("#") ? "drop" : "user");\n  useEffect(() => {\n    if (urlQuery.length < 2) return;\n    setDraft(urlQuery);\n    setQuery(urlQuery);\n    if (urlQuery.startsWith("#")) setTab("drop");\n  }, [urlQuery]);''',
          )

          # Self-delete: the patch helper must not ship in the PR.
          Path(".github/workflows/wyn158-founder-parity-patch.yml").unlink()
          PY
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web .github/workflows/wyn158-founder-parity-patch.yml
          git commit -m "WYN-158: restore founder-approved UI geometry and text"
          git push origin HEAD:fix/wyn-158-founder-visual-parity
