name: Food -- apply WYN-197 store places

# Applies supabase/migrations_wynos_food_store_places_v1.sql (WYN-197): the
# per-store place list (food_store_places) with its RLS policies, and the
# customer search RPC food_search_store_places. Manual dispatch on main only,
# after the Founder approves production. Behaviour test:
# supabase/tests/wynos_food_store_places_test.sh.
#
# SAFETY: additive. One new table, its policies and one RPC; no existing
# object or row changes. Until a store adds places, search falls back to the
# location-search Edge Function exactly as before.
# ROLLBACK (Founder, SQL editor): drop function
# public.food_search_store_places(uuid,text); drop table
# public.food_store_places; the web hides the list and falls back by itself.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WYN-197 to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-WYN-197'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_food_store_places_v1.sql)
          commit;" >/dev/null
          # Definitions and privileges only; no personal data is read.
          run_sql "select
              (select relrowsecurity from pg_class where oid='public.food_store_places'::regclass) as rls_enabled,
              (select count(*) from pg_policies where schemaname='public' and tablename='food_store_places') as policies,
              has_table_privilege('anon', 'public.food_store_places', 'select') as anon_can_read,
              has_function_privilege('authenticated', 'public.food_search_store_places(uuid,text)', 'execute') as customers_can_search,
              has_function_privilege('anon', 'public.food_search_store_places(uuid,text)', 'execute') as anon_can_search;" \
            | tee result.json | jq .
          jq -e '.[0].rls_enabled == true and .[0].policies == 4 and .[0].anon_can_read == false
                 and .[0].customers_can_search == true and .[0].anon_can_search == false' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "WYN-197 store places are live."
