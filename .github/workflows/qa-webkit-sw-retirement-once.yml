name: QA production WebKit service-worker retirement once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-webkit-sw-retirement-once.yml'

jobs:
  production-sw-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify production retirement worker is passive
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --connect-timeout 10 --max-time 30 \
            https://wynos.online/flutter_service_worker.js -o /tmp/flutter_service_worker.js
          grep -F 'self.registration.unregister()' /tmp/flutter_service_worker.js
          if grep -Eq 'self[.]clients[.]claim|client[.]navigate' /tmp/flutter_service_worker.js; then
            echo '::error::production retirement worker still controls or navigates open tabs'
            cat /tmp/flutter_service_worker.js
            exit 1
          fi
          curl -fsSL --connect-timeout 10 --max-time 30 https://wynos.online/ >/dev/null

      - name: Install Playwright browsers
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium webkit

      - name: Exercise retirement worker without unsolicited reloads
        shell: bash
        run: |
          cat > sw-retirement-qa.js <<'NODE'
          const { chromium, webkit } = require('playwright');

          async function probe(browserType, name) {
            const browser = await browserType.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              locale: 'th-TH',
              timezoneId: 'Asia/Bangkok',
              serviceWorkers: 'allow',
            });
            const page = await context.newPage();
            const events = [];
            let navigations = 0;
            let loads = 0;
            let crashed = false;

            page.on('framenavigated', frame => {
              if (frame === page.mainFrame()) {
                navigations++;
                events.push(`navigation ${frame.url()}`);
              }
            });
            page.on('load', () => { loads++; events.push(`load ${page.url()}`); });
            page.on('crash', () => { crashed = true; events.push('crash'); });
            page.on('pageerror', err => events.push(`pageerror ${err.message}`));
            page.on('requestfailed', req => {
              if (req.resourceType() === 'document') {
                events.push(`document-failed ${req.url()} ${req.failure()?.errorText || ''}`);
              }
            });

            await page.goto('https://wynos.online/', {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            await page.waitForTimeout(10000);

            const originalUrl = page.url();
            const marker = `wynos-sw-qa-${name}-${Date.now()}`;
            await page.evaluate(value => { window.__wynosSwQaMarker = value; }, marker);

            // Ignore the expected initial document navigation. From this point,
            // activation of /flutter_service_worker.js must be completely passive.
            navigations = 0;
            loads = 0;
            events.length = 0;

            await page.evaluate(async () => {
              const regs = await navigator.serviceWorker.getRegistrations();
              for (const reg of regs) {
                const url = reg.active?.scriptURL || reg.waiting?.scriptURL || reg.installing?.scriptURL || '';
                if (url.includes('/flutter_service_worker.js')) await reg.unregister();
              }
              const suffix = Date.now();
              await navigator.serviceWorker.register(`/flutter_service_worker.js?qa_retire=${suffix}`);
            });

            // The old production worker used to force client.navigate(client.url)
            // during this activation window. Observe longer than the failure shown
            // in the iPhone recording and require the same JS document to survive.
            await page.waitForTimeout(30000);

            const result = await page.evaluate(async () => {
              const regs = await navigator.serviceWorker.getRegistrations();
              return {
                href: location.href,
                marker: window.__wynosSwQaMarker || null,
                legacyRegistrations: regs
                  .map(reg => reg.active?.scriptURL || reg.waiting?.scriptURL || reg.installing?.scriptURL || '')
                  .filter(url => url.includes('/flutter_service_worker.js')),
                readyState: document.readyState,
              };
            });

            console.log(JSON.stringify({ name, originalUrl, navigations, loads, crashed, events, result }, null, 2));

            if (crashed) throw new Error(`${name}: page crashed`);
            if (navigations !== 0 || loads !== 0) {
              throw new Error(`${name}: unsolicited reload/navigation after retirement worker activation: nav=${navigations}, loads=${loads}`);
            }
            if (result.marker !== marker) {
              throw new Error(`${name}: document was replaced; QA marker disappeared`);
            }
            if (result.href !== originalUrl) {
              throw new Error(`${name}: URL changed from ${originalUrl} to ${result.href}`);
            }
            if (result.legacyRegistrations.length !== 0) {
              throw new Error(`${name}: retirement worker failed to unregister: ${result.legacyRegistrations.join(', ')}`);
            }
            if (events.some(e => e.startsWith('document-failed'))) {
              throw new Error(`${name}: main document request failed: ${events.join(' | ')}`);
            }

            await context.close();
            await browser.close();
          }

          (async () => {
            await probe(chromium, 'chromium');
            await probe(webkit, 'webkit');
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE
          node sw-retirement-qa.js
