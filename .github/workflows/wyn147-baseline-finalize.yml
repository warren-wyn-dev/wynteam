name: One-shot WYN-147 baseline sync

on:
  push:
    branches: [fix/beta4-audit-remaining-bugs]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
          fetch-depth: 0

      - name: Insert WYN-147 before dependent WYN-151 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path('supabase/schema.sql')
          migration_path = Path('supabase/migrations_wyn147_feed_repetition_control.sql')
          schema = schema_path.read_text(encoding='utf-8')
          migration = migration_path.read_text(encoding='utf-8').strip()

          marker147 = '-- WYN-147: Home Feed Repetition Control'
          marker148 = '-- WYN-148: Atomic and idempotent non-poll Drop publication'
          marker151 = '-- WYN-151 / BUG-004 follow-up: restore the documented Discovery semantics.'

          if marker147 not in schema:
              if marker148 not in schema:
                  raise SystemExit('WYN-148 insertion marker not found')
              schema = schema.replace(marker148, migration + '\n\n' + marker148, 1)
              schema_path.write_text(schema, encoding='utf-8')

          schema = schema_path.read_text(encoding='utf-8')
          if schema.count(marker147) != 1:
              raise SystemExit(f'expected one WYN-147 baseline block, got {schema.count(marker147)}')
          if marker151 not in schema:
              raise SystemExit('WYN-151 baseline marker missing')
          if schema.index(marker147) > schema.index(marker151):
              raise SystemExit('WYN-147 must precede WYN-151')
          if schema.index('create table if not exists public.feed_repetition_config') > schema.index(marker151):
              raise SystemExit('feed_repetition_config must exist before WYN-151')
          PY

      - name: Verify baseline contracts
        run: |
          set -euo pipefail
          grep -Fq -- '-- WYN-147: Home Feed Repetition Control' supabase/schema.sql
          grep -Fq 'create table if not exists public.feed_repetition_config' supabase/schema.sql
          grep -Fq 'internal.my_recent_feed_deliveries' supabase/schema.sql
          grep -Fq 'internal.repetition_adjust_source_scores' supabase/schema.sql
          bash supabase/tests/wyn_147_feed_repetition_control_test.sh
          python3 supabase/check_schema_ordering.py
          git diff --check

      - name: Commit schema baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          if git diff --cached --quiet; then
            echo 'WYN-147 baseline already synchronized.'
            exit 0
          fi
          git commit -m 'chore(db): sync WYN-147 repetition baseline'
          git push origin HEAD:fix/beta4-audit-remaining-bugs
