name: WYN-190 -- Notifications Developer Preview control

# Manual-only production control for the Notifications Developer Preview.
# Run order:
#   1) ship the web build that contains the developer-only Realtime gate
#   2) action=apply_schema
#   3) deploy send-push-notification through deploy-edge-functions.yml
#   4) action=verify
#
# action=disable_realtime is the fast rollback switch if Realtime causes an
# incident. It leaves notification rows/settings/delivery telemetry intact.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Preview control action"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - apply_schema
          - disable_realtime
      confirm:
        description: "For apply_schema type APPLY-WYN-190; for disable_realtime type DISABLE-WYN-190; verify can use VERIFY"
        required: true
        type: string

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate requested action
        env:
          ACTION: ${{ github.event.inputs.action }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            verify)
              test "$CONFIRM" = "VERIFY" || { echo "::error::Type VERIFY to run verification."; exit 1; }
              ;;
            apply_schema)
              test "$CONFIRM" = "APPLY-WYN-190" || { echo "::error::Type APPLY-WYN-190 to apply production schema."; exit 1; }
              ;;
            disable_realtime)
              test "$CONFIRM" = "DISABLE-WYN-190" || { echo "::error::Type DISABLE-WYN-190 to disable Notifications Realtime."; exit 1; }
              ;;
            *)
              echo "::error::Unknown action: $ACTION"
              exit 1
              ;;
          esac

      - name: Production database control
        env:
          ACTION: ${{ github.event.inputs.action }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")

          for value in SUPABASE_URL SUPABASE_ACCESS_TOKEN; do
            test -n "$(eval echo "\$$value")" || { echo "::error::$value is empty"; exit 1; }
          done

          PROJECT_REF=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Supabase SQL API returned HTTP $code"
              cat "$out"
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          verify() {
            echo "=== WYN-190 verification ==="
            run_sql "select column_name
                     from information_schema.columns
                     where table_schema='public'
                       and table_name='notification_settings'
                       and column_name in (
                         'push_likes','push_comments','push_follows','push_messages',
                         'push_club','push_trending','push_system',
                         'push_quiet_enabled','push_quiet_start','push_quiet_end','push_timezone'
                       )
                     order by column_name;" | jq .

            run_sql "select to_regclass('public.notification_push_deliveries') as delivery_table;" | jq .

            run_sql "select relrowsecurity
                     from pg_class
                     where oid = 'public.notification_push_deliveries'::regclass;" | jq .

            run_sql "select
                       has_table_privilege('anon','public.notification_push_deliveries','SELECT') as anon_select,
                       has_table_privilege('authenticated','public.notification_push_deliveries','SELECT') as authenticated_select;" | jq .

            run_sql "select exists (
                       select 1
                       from pg_publication_tables
                       where pubname='supabase_realtime'
                         and schemaname='public'
                         and tablename='notifications'
                     ) as notifications_realtime_enabled;" | jq .

            run_sql "select count(*) as developer_account_count from public.developer_accounts;" | jq .
          }

          case "$ACTION" in
            apply_schema)
              test -f supabase/migrations/20260929193000_notifications_developer_preview.sql
              echo "Applying WYN-190 additive migration..."
              run_sql "$(cat supabase/migrations/20260929193000_notifications_developer_preview.sql)" >/dev/null
              echo "Migration applied."
              verify
              ;;
            disable_realtime)
              run_sql "do \$\$
                       begin
                         if exists (
                           select 1
                           from pg_publication_tables
                           where pubname='supabase_realtime'
                             and schemaname='public'
                             and tablename='notifications'
                         ) then
                           execute 'alter publication supabase_realtime drop table public.notifications';
                         end if;
                       end
                       \$\$;" >/dev/null
              echo "Notifications Realtime publication membership disabled."
              verify
              ;;
            verify)
              verify
              ;;
          esac

      - name: Release notes
        run: |
          {
            echo "## WYN-190 Notifications Developer Preview"
            echo "- Action: ${{ github.event.inputs.action }}"
            echo "- Production control is manual-only."
            echo "- No Email Notifications are part of WYN-190."
            echo "- disable_realtime is the fast rollback for the Realtime channel only."
            echo "- Push Edge Function deployment remains a separate gated workflow."
          } >> "$GITHUB_STEP_SUMMARY"
