name: Android

# Wynos Android v1.0.0 Beta 1: the native Kotlin + Jetpack Compose app in
# android/ (Founder decision 2026-09-27, docs/engineering/ANDROID_NATIVE_PLAN.md).
# Builds the debug APK, verifies the unsigned release bundle with R8, and runs
# the JVM tests + lint (including screenshot tests). Never signs or uploads to Play.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch: {}

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug bundleRelease
      # Normal JVM tests do not record screenshots by default. Run Roborazzi
      # separately to produce real Compose PNG captures for visual review.
      - name: Record native UI screenshots (QA only)
        run: ./gradlew --no-daemon :app:recordRoborazziDebug
      # CI provides an installable debug APK for device QA only (not a Play release).
      # No Supabase/Firebase credentials are injected into pull-request builds.
      - name: Upload Beta 1 debug APK (device QA only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: wynos-android-beta1-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Upload screen renders and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          # Robolectric captureRoboImage snapshots supplement CI report artifacts.
          path: |
            android/app/build/reports/
            android/app/build/outputs/roborazzi/
            android/app/build/screenshots/
            android/build/screenshots/
          retention-days: 7

  connected-qa:
    name: Connected Android Beta 1 QA APK (manual only)
    # Manual runs from the exact Beta 1 branch only. PR events can never
    # access the android-qa environment or its configuration.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/fix/android-beta1-play-api36-20261013' }}
    needs: android
    runs-on: ubuntu-latest
    # Founder must configure this Environment with required reviewers and
    # branch restrictions BEFORE manually running this job.
    environment: android-qa
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate Android QA client configuration (never print values)
        env:
          WYNOS_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WYNOS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys
          from urllib.parse import urlsplit

          url = os.environ.get("WYNOS_SUPABASE_URL", "").strip()
          key = os.environ.get("WYNOS_SUPABASE_PUBLISHABLE_KEY", "").strip()
          if not url.startswith("https://") or not key:
              sys.exit("::error::Configure Supabase HTTPS URL and publishable client key in android-qa.")
          # supabase-kt 3.1.x throws IllegalStateException when the client URL
          # is an API endpoint (/rest/v1, /auth/v1, ...), rather than the
          # project base URL. Never print the configured URL or key.
          parsed = urlsplit(url)
          if (parsed.scheme != "https" or not parsed.hostname or parsed.username or
              parsed.password or parsed.path not in ("", "/") or
              parsed.query or parsed.fragment or any(ch.isspace() for ch in url)):
              sys.exit("::error::SUPABASE_URL must be the HTTPS Project URL only (no /rest/v1, /auth/v1, path or query).")
          if key.startswith("sb_publishable_"):
              pass
          elif key.count(".") == 2:
              try:
                  encoded = key.split(".")[1]
                  payload = json.loads(base64.urlsafe_b64decode(encoded + "=" * (-len(encoded) % 4)))
                  if payload.get("role") != "anon":
                      raise ValueError("not an anon key")
              except (ValueError, KeyError, TypeError, json.JSONDecodeError):
                  sys.exit("::error::Only Supabase publishable/anon client keys are allowed.")
          else:
              sys.exit("::error::Only Supabase publishable/anon client keys are allowed.")
          print("Android QA Supabase client configuration format checked (values not shown).")
          PY
      - name: Build connected Beta 1 debug APK
        env:
          # Client-public settings only. Never use service_role or database credentials.
          WYNOS_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          WYNOS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Upload connected Beta 1 Android APK (QA only)
        uses: actions/upload-artifact@v4
        with:
          name: wynos-android-beta1-connected-qa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
