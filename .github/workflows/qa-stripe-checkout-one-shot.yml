name: One-time WYNOS Stripe Sandbox Checkout E2E
on:
  push:
    branches: ['sandbox/stripe-testmode-20261008']
    paths: ['.github/workflows/qa-stripe-checkout-one-shot.yml']
permissions:
  contents: read
jobs:
  stripe-checkout-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright browser
        run: |
          mkdir -p /tmp/wynos-stripe-qa
          cd /tmp/wynos-stripe-qa
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Perform Stripe sandbox-only browser checkout (no real money)
        run: |
          cd /tmp/wynos-stripe-qa
          node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          (async()=>{
            const url='https://pcatuxtenluqzjzzwsvl.supabase.co/functions/v1/qa-stripe-checkout-readonly?order=WF000005';
            const response=await fetch(url,{headers:{'Accept':'application/json'}});
            const payload=await response.json();
            assert.equal(response.status,200,JSON.stringify({error:payload.error||'unknown',status:response.status}));
            assert.equal(payload.order_number,'WF000005');
            assert.ok(payload.checkout_url.startsWith('https://checkout.stripe.com/'),'Only Stripe-hosted Checkout');
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({locale:'en-US',viewport:{width:1280,height:850}});
            page.setDefaultTimeout(15000);
            try{
              await page.goto(payload.checkout_url,{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(4500);
              const frameSummary=()=>page.frames().map(f=>({url:f.url().slice(0,130),inputNames:'pending'}));
              console.log('STRIPE_CHECKOUT_OPEN',page.url().slice(0,90),'FRAMES',JSON.stringify(frameSummary()));
              async function fillAny(label,selectors,value){
                for(let pass=0;pass<4;pass++){
                  for(const frame of page.frames()){
                    for(const selector of selectors){
                      try{const e=frame.locator(selector).first(); if(await e.count()&&await e.isVisible()){await e.fill(value,{timeout:6000});console.log('FIELD_OK',label,'FRAME',frame.url().slice(0,90),'SELECTOR',selector);return true}}catch(e){console.log('FIELD_RETRY',label,selector,String(e).slice(0,85));}
                    }
                  }
                  await page.waitForTimeout(1500);
                }
                console.log('VISIBLE_INPUTS',JSON.stringify(await Promise.all(page.frames().map(async f=>({url:f.url().slice(0,100),inputs:await f.locator('input').evaluateAll(els=>els.map(e=>({name:e.getAttribute('name'),placeholder:e.getAttribute('placeholder'),autocomplete:e.getAttribute('autocomplete'),type:e.getAttribute('type')})).slice(0,16)).catch(()=>[])})))));
                throw new Error('Missing required Stripe test field '+label);
              }
              await fillAny('email',['input[type=email]','input[name=email]','input[autocomplete=email]','input[placeholder*="email" i]'],'qa-stripe-20261008@example.com');
              await fillAny('card_number',['input[name="cardNumber"]','input[autocomplete="cc-number"]','input[placeholder*="1234"]','input[aria-label*="Card number" i]','input[data-testid*="cardNumber"]'],'4242424242424242');
              await fillAny('expiry',['input[name="cardExpiry"]','input[autocomplete="cc-exp"]','input[placeholder*="MM"]','input[aria-label*="Expiration" i]'],'1230');
              await fillAny('cvc',['input[name="cardCvc"]','input[autocomplete="cc-csc"]','input[placeholder="CVC"]','input[aria-label*="security code" i]','input[aria-label*="CVC" i]'],'123');
              const nameInputs=['input[name="billingName"]','input[autocomplete="cc-name"]','input[placeholder*="name on card" i]'];
              for(const name of nameInputs){try{const x=page.locator(name).first();if(await x.count() && await x.isVisible()){await x.fill('Sandbox Test Buyer');break}}catch{}}
              await page.waitForTimeout(1200);
              let submitted=false;
              for(const selector of ['button[type="submit"]','button[data-testid="hosted-payment-submit-button"]','button:has-text("Pay")','button:has-text("ชำระ")']){
                const b=page.locator(selector).last();
                try{if(await b.count()&&await b.isVisible()&&await b.isEnabled()){console.log('SUBMIT_BUTTON',selector);await b.click({timeout:18000});submitted=true;break}}catch(e){console.log('SUBMIT_RETRY',selector,String(e).slice(0,100));}
              }
              if(!submitted)throw new Error('Stripe payment button unavailable');
              try{await page.waitForURL(u=>u.toString().includes('stripe=success')||u.toString().includes('checkout.stripe.com/c/pay/'),{timeout:30000});}catch{}
              await page.waitForTimeout(4000);
              console.log('STRIPE_AFTER_SUBMIT_URL',page.url().slice(0,260));
              console.log('STRIPE_AFTER_SUBMIT_TEXT',(await page.locator('body').innerText().catch(()=>'' )).slice(0,800).replace(/\\s+/g,' '));
              if(!page.url().includes('stripe=success')){
                 const text=(await page.locator('body').innerText().catch(()=>'' )).slice(0,1500);
                 if(!/payment complete|payment successful|thanks for your payment|ชำระเงินสำเร็จ/i.test(text))throw new Error('Checkout did not confirm paid');
              }
              console.log('QA_CHECKOUT_BROWSER_SUCCESS');
            }finally{await browser.close()}
          })().catch(e=>{console.error('QA_CHECKOUT_BROWSER_FAILED',e.stack||e);process.exitCode=1});
          NODE
