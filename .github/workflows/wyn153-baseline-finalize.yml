name: One-shot WYN-153 baseline sync

on:
  push:
    branches: [fix/beta4-audit-remaining-bugs]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
          fetch-depth: 0

      - name: Append WYN-153 to schema baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          schema_path = Path('supabase/schema.sql')
          migration_path = Path('supabase/migrations_wyn153_feed_repetition_config_access.sql')
          schema = schema_path.read_text(encoding='utf-8')
          migration = migration_path.read_text(encoding='utf-8').strip()
          marker = '-- WYN-153 / BUG-004 follow-up: keep repetition configuration private while'
          if marker not in schema:
              schema_path.write_text(schema.rstrip() + '\n\n' + migration + '\n', encoding='utf-8')
          schema = schema_path.read_text(encoding='utf-8')
          if schema.count(marker) != 1:
              raise SystemExit(f'expected one WYN-153 baseline block, got {schema.count(marker)}')
          if schema.index(marker) < schema.index('-- WYN-152 / BUG-004 follow-up: make the WYN-145 experiment outcome trigger'):
              raise SystemExit('WYN-153 must follow WYN-152 in the baseline')
          PY

      - name: Verify WYN-153 baseline
        run: |
          set -euo pipefail
          bash supabase/tests/wyn_153_feed_repetition_config_access_test.sh
          python3 supabase/check_schema_ordering.py
          git diff --check

      - name: Commit schema baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          if git diff --cached --quiet; then
            echo 'WYN-153 baseline already synchronized.'
            exit 0
          fi
          git commit -m 'chore(db): sync WYN-153 repetition config baseline'
          git push origin HEAD:fix/beta4-audit-remaining-bugs
