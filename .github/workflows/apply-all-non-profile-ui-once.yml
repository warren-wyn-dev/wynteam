name: Apply all non-profile UX UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-all-non-profile-ui-once.yml
      - tools/apply_all_non_profile_ui.py
      - tools/apply_all_non_profile_ui_v2.py

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-style-test-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture protected feature trees
        id: protected
        run: |
          echo "profile=$(git rev-parse HEAD:app/lib/features/profile)" >> "$GITHUB_OUTPUT"
          echo "pop=$(git rev-parse HEAD:app/lib/features/pop)" >> "$GITHUB_OUTPUT"

      - name: Apply all non-profile UI system pass
        run: python3 tools/apply_all_non_profile_ui_v2.py

      - name: Fix Drop Detail activity sheet on short viewports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/lib/features/drop/presentation/drop_detail_screen.dart')
          text = path.read_text()
          start = text.index('  Future<void> _openActivitySheet() {')
          end = text.index('\n  Widget _buildCommentRow', start)
          method = text[start:end]

          marker = '        child: Padding('
          if method.count(marker) != 1:
              raise RuntimeError('Activity Sheet Padding shape changed; refusing an unsafe patch')
          padding_start = method.index('Padding(', method.index(marker))
          open_idx = padding_start + len('Padding')
          depth = 0
          quote = None
          i = open_idx
          close_idx = None
          while i < len(method):
              ch = method[i]
              if quote is not None:
                  if ch == '\\':
                      i += 2
                      continue
                  if ch == quote:
                      quote = None
                  i += 1
                  continue
              if ch in ('\"', "'"):
                  quote = ch
              elif ch == '(':
                  depth += 1
              elif ch == ')':
                  depth -= 1
                  if depth == 0:
                      close_idx = i
                      break
              i += 1
          if close_idx is None:
              raise RuntimeError('Could not find Activity Sheet Padding close')

          method = method[:padding_start] + 'SingleChildScrollView(\n          child: ' + method[padding_start:close_idx + 1] + ',\n        )' + method[close_idx + 1:]
          path.write_text(text[:start] + method + text[end:])

          audit_path = Path('.wyn/docs/qa/non-profile-system-ui-audit.md')
          audit = audit_path.read_text()
          old_audit = '- Behavior-sensitive Founder-final surface audited and intentionally preserved unchanged: `app/lib/features/drop/presentation/drop_detail_screen.dart`'
          new_audit = '- Behavior-sensitive Founder-final surface excluded from the mechanical transformer; targeted short-viewport Activity Sheet overflow fix applied: `app/lib/features/drop/presentation/drop_detail_screen.dart`'
          if old_audit not in audit:
              raise RuntimeError('Expected Drop Detail audit marker is missing')
          audit_path.write_text(audit.replace(old_audit, new_audit, 1))
          PY

      - name: Protect Profile and hidden Pop
        run: |
          test "$(git rev-parse HEAD:app/lib/features/profile)" = "${{ steps.protected.outputs.profile }}"
          test "$(git rev-parse HEAD:app/lib/features/pop)" = "${{ steps.protected.outputs.pop }}"
          if ! git diff --quiet -- app/lib/features/profile; then
            echo "::error::Profile changed; this pass is not allowed to touch it."
            git diff -- app/lib/features/profile
            exit 1
          fi
          if ! git diff --quiet -- app/lib/features/pop; then
            echo "::error::Hidden Pop changed; this pass must not resurface it."
            git diff -- app/lib/features/pop
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart sources
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi

      - name: Flutter analyze
        working-directory: app
        # Keep analyzer errors and warnings release-blocking. The repository has
        # a small number of pre-existing style-only info diagnostics, so those
        # do not block this one-shot UI rollout.
        run: flutter analyze --no-fatal-infos

      - name: Non-profile screen regression tests
        working-directory: app
        run: |
          set -e
          mapfile -t tests < <(find test -type f \( -name '*screen_test.dart' -o -name '*shell_test.dart' -o -name '*navigation_test.dart' \) | sort | grep -v '/profile' || true)
          echo "Running ${#tests[@]} non-profile screen/shell test files"
          for testfile in "${tests[@]}"; do
            case "$testfile" in
              *pop*) continue ;;
            esac
            echo "==> $testfile"
            flutter test "$testfile"
          done

      - name: Full Flutter test suite diagnostic
        working-directory: app
        run: |
          set +e
          flutter test 2>&1 | tee ../full_flutter_test.log
          status=${PIPESTATUS[0]}
          echo "Full suite status: $status"
          exit 0

      - name: Verify coverage audit exists
        run: |
          test -s .wyn/docs/qa/non-profile-system-ui-audit.md
          grep -q 'Protected and intentionally untouched: `app/lib/features/profile/\*\*`' .wyn/docs/qa/non-profile-system-ui-audit.md

      - name: Stage validated UI pass on review branch
        id: stage
        run: |
          BRANCH="ui/non-profile-system-refresh-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          rm -f tools/apply_all_non_profile_ui.py
          rm -f tools/apply_all_non_profile_ui_v2.py
          rm -f .github/workflows/apply-all-non-profile-ui-once.yml
          rm -f full_flutter_test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "feat: unify all non-profile screens with Profile UI language"
          git push --set-upstream origin "$BRANCH"

      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.stage.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat: unify all non-profile screens with Profile UI language" \
            --body "Generated from the validated one-shot UI pass. Profile remains unchanged and hidden Pop remains hidden. This PR intentionally does not deploy production; merge and production deployment stay separate release gates."

