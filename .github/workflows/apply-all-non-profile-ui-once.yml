name: Apply all non-profile UX UI once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-all-non-profile-ui-once.yml
      - tools/apply_all_non_profile_ui.py
      - tools/apply_all_non_profile_ui_v2.py

permissions:
  contents: write
  pull-requests: write

jobs:
  audit-style-test-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture protected feature trees
        id: protected
        run: |
          echo "profile=$(git rev-parse HEAD:app/lib/features/profile)" >> "$GITHUB_OUTPUT"
          echo "pop=$(git rev-parse HEAD:app/lib/features/pop)" >> "$GITHUB_OUTPUT"

      - name: Apply all non-profile UI system pass
        run: python3 tools/apply_all_non_profile_ui_v2.py

      - name: Protect Profile and hidden Pop
        run: |
          test "$(git rev-parse HEAD:app/lib/features/profile)" = "${{ steps.protected.outputs.profile }}"
          test "$(git rev-parse HEAD:app/lib/features/pop)" = "${{ steps.protected.outputs.pop }}"
          if ! git diff --quiet -- app/lib/features/profile; then
            echo "::error::Profile changed; this pass is not allowed to touch it."
            git diff -- app/lib/features/profile
            exit 1
          fi
          if ! git diff --quiet -- app/lib/features/pop; then
            echo "::error::Hidden Pop changed; this pass must not resurface it."
            git diff -- app/lib/features/pop
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart sources
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Non-profile screen regression tests
        working-directory: app
        run: |
          set -e
          mapfile -t tests < <(find test -type f \( -name '*screen_test.dart' -o -name '*shell_test.dart' -o -name '*navigation_test.dart' \) | sort | grep -v '/profile' || true)
          echo "Running ${#tests[@]} non-profile screen/shell test files"
          for testfile in "${tests[@]}"; do
            case "$testfile" in
              *pop*) continue ;;
            esac
            echo "==> $testfile"
            flutter test "$testfile"
          done

      - name: Full Flutter test suite diagnostic
        working-directory: app
        run: |
          set +e
          flutter test 2>&1 | tee ../full_flutter_test.log
          status=${PIPESTATUS[0]}
          echo "Full suite status: $status"
          exit 0

      - name: Verify coverage audit exists
        run: |
          test -s .wyn/docs/qa/non-profile-system-ui-audit.md
          grep -q 'Protected and intentionally untouched: `app/lib/features/profile/\*\*`' .wyn/docs/qa/non-profile-system-ui-audit.md

      - name: Stage validated UI pass on review branch
        id: stage
        run: |
          BRANCH="ui/non-profile-system-refresh-${GITHUB_RUN_ID}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          rm -f tools/apply_all_non_profile_ui.py
          rm -f tools/apply_all_non_profile_ui_v2.py
          rm -f .github/workflows/apply-all-non-profile-ui-once.yml
          rm -f full_flutter_test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "feat: unify all non-profile screens with Profile UI language"
          git push --set-upstream origin "$BRANCH"

      - name: Open review PR
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.stage.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat: unify all non-profile screens with Profile UI language" \
            --body "Generated from the validated one-shot UI pass. Profile remains unchanged and hidden Pop remains hidden. This PR intentionally does not deploy production; merge and production deployment stay separate release gates."
