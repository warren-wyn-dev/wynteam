name: Database Webhook (notifications -> push)

# The last manual step of WYN-016. Everything else about push is either
# code in this repo or a value in a secret store; this one piece lived
# only as a paragraph of Dashboard instructions, which is the same shape
# of problem that left `send-push-notification` un-deployed for a whole
# release: a change that only exists as someone's clicks is a change
# nobody can verify, reproduce, or undo from here.
#
# What it creates is exactly what the Dashboard's "Database Webhooks"
# form creates -- an AFTER INSERT trigger calling
# supabase_functions.http_request -- so the hook still shows up in, and
# stays manageable from, that same Dashboard page. This is a different
# way to press the same button, not a second mechanism.
#
# Why the trigger still is NOT in schema.sql: unchanged from WYN-016 --
# supabase_functions.http_request() does not exist in plain Postgres, so
# putting it there would break the local Postgres 16 run that is the only
# way `schema.sql` gets verified. That reasoning was always about
# schema.sql specifically, not about refusing to automate the step.
#
# `verify` is the default action on purpose: the useful thing to do most
# often is look, and looking should never be one mis-click away from
# changing production.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "verify = look only · create = install/replace · test = fire one harmless request · remove = drop · enable = turn on webhooks only · diagnose = why did no push arrive · secrets = list Edge Function secret NAMES · moderation-check = is anyone currently restricted/suspended/banned · chat-check = why can wynos.online<->warren not message each other"
        required: true
        default: verify
        type: choice
        options:
          - verify
          - create
          - remove
          - enable
          - test
          - diagnose
          - secrets
          - moderation-check
          - chat-check

jobs:
  webhook:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      TRIGGER_NAME: send_push_on_notification
    steps:
      - name: Pre-flight
        run: |
          fail=0
          # Never print these; only whether they arrived. Each is read as
          # its own secrets.X above -- referencing the whole secrets
          # context is what blocked two Edge Function runs with
          # action_required and zero jobs.
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "$(eval echo \"\$$name\")" ]; then
              echo "::error::$name is empty -- add it under Settings > Secrets and variables > Actions."
              fail=1
            else
              echo "  $name  present"
            fi
          done
          [ "$fail" = "0" ] || exit 1

          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "$SUPABASE_URL" ]; then
            echo "::error::Could not read a project ref out of SUPABASE_URL."
            exit 1
          fi
          echo "PROJECT_REF=$PROJECT_REF" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_REF"

      - name: Run
        run: |
          set -euo pipefail
          # A secret pasted into the GitHub UI keeps whatever trailing
          # newline came with the copy. The first create wrote a URL with
          # a literal \n inside it -- a webhook that could never fire, and
          # one that reads as correct everywhere except the trigger
          # definition. deploy-edge-functions.yml already learned this
          # about the access token; the lesson just was not carried over.
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_PUBLISHABLE_KEY=$(clean "$SUPABASE_PUBLISHABLE_KEY")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")

          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          ENABLE_API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/webhooks/enable"

          # Every statement goes through here so failures surface as the
          # message Postgres actually gave, not as a bare non-zero exit.
          # SQL string literal: single quotes, with any internal single
          # quote doubled. jq -R produces JSON syntax ("..." with
          # backslash escapes), which Postgres reads as an identifier,
          # not a string -- close enough to look right and guaranteed to
          # fail.
          sqlq() { printf "'%s'" "$(printf '%s' "$1" | sed "s/'/''/g")"; }

          run_sql() {
            local sql="$1"
            local body out code
            body=$(jq -n --arg q "$sql" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::Supabase answered HTTP $code"
              # The publishable key is public by design, but there is no
              # reason to widen where it appears -- redact it anyway.
              sed -E 's/sb_publishable_[A-Za-z0-9_-]+/sb_publishable_***/g' "$out"
              rm -f "$out"
              return 1
            fi
            sed -E 's/sb_publishable_[A-Za-z0-9_-]+/sb_publishable_***/g' "$out"
            rm -f "$out"
          }

          # The same operation the Dashboard's "Enable webhooks" button
          # performs -- that button calls this endpoint. So this is still
          # Supabase running their own migration (pg_net + the
          # supabase_functions schema and their http_request), not this
          # workflow hand-writing their internals, which is the thing
          # worth refusing to do.
          enable_webhooks() {
            local out code
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$ENABLE_API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{}')
            echo "Enable webhooks -> HTTP $code"
            cat "$out"; echo
            rm -f "$out"
            case "$code" in
              200|201|204) return 0 ;;
              404)
                echo "::error::This Supabase API does not expose an enable endpoint for this project."
                echo "::error::Do it once by hand instead: Dashboard > Database > Webhooks > 'Enable webhooks'."
                return 1 ;;
              *)
                echo "::error::Enable failed with HTTP $code -- see the body above."
                return 1 ;;
            esac
          }

          show() {
            echo "--- current state of trigger $TRIGGER_NAME ---"
            run_sql "select tgname as trigger_name,
                            tgenabled as enabled,
                            regexp_replace(pg_get_triggerdef(oid),
                                           'sb_publishable_[A-Za-z0-9_-]+',
                                           'sb_publishable_***', 'g') as definition
                     from pg_trigger
                     where tgrelid = 'public.notifications'::regclass
                       and not tgisinternal
                       and tgname = '$TRIGGER_NAME';" | jq .
          }

          # Three separate facts, because "webhooks are off" has three
          # different causes and they need three different fixes. A
          # single yes/no here would send someone to the wrong one.
          probe_prereqs() {
          echo "=== Is the webhook machinery enabled on this project? ==="
          probe=$(run_sql "select
                    (select count(*) from pg_extension where extname = 'pg_net')          as pg_net_installed,
                    (select count(*) from pg_available_extensions where name = 'pg_net')   as pg_net_available,
                    (select count(*) from pg_namespace where nspname = 'supabase_functions') as schema_exists,
                    (select count(*) from pg_proc p
                       join pg_namespace n on n.oid = p.pronamespace
                      where n.nspname = 'supabase_functions'
                        and p.proname = 'http_request')                                   as http_request_exists;")
          echo "$probe" | jq .
          has_fn=$(echo "$probe" | jq -r '.[0].http_request_exists')
          }

          probe_prereqs

          case "${{ inputs.action }}" in
            enable|create)
              if [ "$has_fn" = "0" ]; then
                echo "=== Webhooks are not enabled yet -- enabling ==="
                enable_webhooks || exit 1
                probe_prereqs
                if [ "$has_fn" = "0" ]; then
                  echo "::error::Enable reported success but supabase_functions.http_request still does not exist."
                  exit 1
                fi
                echo "Webhooks are enabled now."
              fi
              ;;
          esac

          case "${{ inputs.action }}" in
            enable)
              echo "Nothing else to do -- run again with action=create to install the trigger."
              ;;

            verify)
              show
              ;;

            test)
              # Sends the payload the function ignores by design
              # (type=UPDATE), so this proves the whole path -- pg_net,
              # the URL, the auth header, the function answering -- while
              # writing nothing and pushing nothing to anybody.
              FN_URL="$SUPABASE_URL/functions/v1/send-push-notification"
              HEADERS=$(jq -nc --arg auth "Bearer $SUPABASE_PUBLISHABLE_KEY" \
                        '{"Content-type":"application/json", "Authorization":$auth}')
              req=$(run_sql "select net.http_post(
                               url := $(sqlq "$FN_URL"),
                               headers := $(sqlq "$HEADERS")::jsonb,
                               body := '{\"type\":\"UPDATE\",\"table\":\"notifications\",\"record\":{},\"schema\":\"public\"}'::jsonb
                             ) as request_id;" | jq -r '.[0].request_id')
              echo "pg_net request id: $req"
              # pg_net's background worker polls, so the reply is not
              # there the instant the statement returns.
              run_sql "select pg_sleep(5);" >/dev/null
              echo "--- what came back ---"
              run_sql "select status_code, content, error_msg
                       from net._http_response where id = $req;" | jq .
              echo "Expect status_code 200 and content \"Ignored\"."
              ;;

            diagnose)
              # Reads every link of the chain in one run, in the order a
              # push actually travels, so the first section that looks
              # wrong is the one that broke. All read-only, and none of
              # it prints a token, a notification body, or a full user id.
              echo
              echo "=== 1. Is the trigger still installed? ==="
              show

              echo
              echo "=== 2. Did any notification rows get created in the last hour? ==="
              echo "(no row here means the like/comment never reached the DB -- an app problem, not a push one)"
              run_sql "select id, type, created_at
                       from public.notifications
                       where created_at > now() - interval '1 hour'
                       order by created_at desc limit 10;" | jq .

              echo
              echo "=== 3. Has any device registered for push? ==="
              echo "(zero here means the browser never handed us a token -- on iOS that is usually"
              echo " the app not being installed to the Home Screen, so Safari refuses to issue one)"
              run_sql "select platform, count(*) as devices, max(updated_at) as newest
                       from public.push_tokens group by platform;" | jq .

              # Which device holds which token matters once FCM starts
              # reporting sent=1 while nothing appears: the push may be
              # going to a browser that is not the one being watched.
              # There is no user-agent column, so registration time is
              # the only way to tell a freshly-installed PWA from an
              # older browser session. Ids are truncated -- matching a
              # token to a recipient needs only the prefix, and the full
              # uuid is not this log's business.
              echo
              echo "  which account registered which device, newest first:"
              run_sql "select left(user_id::text, 8) as user_prefix, platform,
                              created_at, updated_at
                       from public.push_tokens order by updated_at desc;" | jq .
              echo "  who the recent notifications were addressed to:"
              run_sql "select left(recipient_id::text, 8) as recipient_prefix, type, created_at
                       from public.notifications
                       order by created_at desc limit 5;" | jq .
              echo "  (a recipient with no row in the table above got no push at all;"
              echo "   a recipient whose token predates the Home Screen install is being"
              echo "   delivered to whatever browser registered it back then)"

              echo
              echo "=== 4. What did the webhook actually send, and what came back? ==="
              echo "(this is the decisive one -- content is the Edge Function's own reply)"
              run_sql "select r.id, r.status_code, left(r.content, 300) as content,
                              r.error_msg, r.created
                       from net._http_response r
                       order by r.id desc limit 10;" | jq .

              echo
              echo "=== 5. Anything still queued or failed inside pg_net? ==="
              run_sql "select count(*) as queued from net.http_request_queue;" | jq .
              ;;

            secrets)
              # Names only. This endpoint returns values too, and there
              # is no reason for one of them to pass through a log: the
              # question here is only whether FCM_SERVICE_ACCOUNT exists
              # and is spelled exactly that, which the names answer.
              echo "=== Edge Function secrets on this project (names only) ==="
              out=$(mktemp)
              code=$(curl -sS -o "$out" -w '%{http_code}' \
                "https://api.supabase.com/v1/projects/$PROJECT_REF/secrets" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
              if [ "$code" != "200" ]; then
                echo "::error::Supabase answered HTTP $code when listing secrets."
                rm -f "$out"; exit 1
              fi
              # Quoted and with the length, so a trailing space or a
              # zero-width character in the name is visible rather than
              # invisible -- that is the failure this is looking for.
              jq -r '.[] | "  \"" + .name + "\"  (" + (.name | length | tostring) + " chars)"' "$out" | sort
              echo
              if jq -e 'any(.[]; .name == "FCM_SERVICE_ACCOUNT")' "$out" >/dev/null; then
                echo "FCM_SERVICE_ACCOUNT: present under exactly that name."
                echo "So if pushes still fail, the name is not the reason -- read the reply body"
                echo "in diagnose section 4. The function returns its own error there now, and a"
                echo "SyntaxError with a character position means the stored value is malformed."
              else
                echo "FCM_SERVICE_ACCOUNT: NOT present under that exact name."
                echo "That is why the function answers 'FCM not configured'."
              fi
              rm -f "$out"
              ;;

            chat-check)
              # One-off, named after the two usernames because that is
              # genuinely what this run is checking: nobody is
              # currently restricted (moderation-check ruled that out),
              # and the send fails identically for every recipient
              # tried -- both point away from anything recipient-
              # specific (blocks, dm_permission) and toward either the
              # sender's own state or a bug in how the client evaluates
              # what to show, versus what public.profiles/conversations
              # actually holds.
              #
              # Usernames are public (profile pages show them to
              # anyone); this reads no email, no auth identity, nothing
              # beyond what those two profile pages already display,
              # and prints only truncated ids and booleans.
              U1="warren"
              U2="wynos.online"
              run_sql "with u1 as (select id, dm_permission from public.profiles where lower(username) = lower($(sqlq "$U1"))),
                            u2 as (select id, dm_permission from public.profiles where lower(username) = lower($(sqlq "$U2")))
                       select (select count(*) from u1) as u1_found,
                              (select count(*) from u2) as u2_found,
                              (select dm_permission from u1) as u1_dm_permission,
                              (select dm_permission from u2) as u2_dm_permission,
                              (select internal.is_posting_blocked(id) from u1) as u1_posting_blocked,
                              (select internal.is_posting_blocked(id) from u2) as u2_posting_blocked,
                              (select internal.is_blocked_either_way((select id from u1), (select id from u2))) as blocked_either_way;" | jq .

              run_sql "select left(c.id::text, 8) as conversation_id,
                              left(c.user_a_id::text, 8) as user_a,
                              left(c.user_b_id::text, 8) as user_b,
                              c.status, left(c.requested_by::text, 8) as requested_by,
                              c.user_a_id = (select id from public.profiles where lower(username) = lower($(sqlq "$U1"))) as user_a_is_u1,
                              c.created_at
                       from public.conversations c
                       where c.user_a_id in (
                               select id from public.profiles
                               where lower(username) in (lower($(sqlq "$U1")), lower($(sqlq "$U2")))
                             )
                         and c.user_b_id in (
                               select id from public.profiles
                               where lower(username) in (lower($(sqlq "$U1")), lower($(sqlq "$U2")))
                             );" | jq .
              echo
              echo "u1/u2_posting_blocked true -> that account is currently restricted/suspended/banned"
              echo "(should already read false/false per moderation-check, this re-checks these two specifically)."
              echo "blocked_either_way true -> RLS rejects every send between them regardless of conversation status."
              echo "status=pending with requested_by NOT matching the sender -> that sender is the pending"
              echo "recipient, who has no INSERT path until the request is accepted -- and the client's own"
              echo "restriction/composer state fails open on a fetch error, so this can be invisible in the UI"
              echo "(see conversation_screen.dart's _loadSafetyState/_loadConversationMeta doc comments)."
              ;;

            moderation-check)
              # A chat send failed with a generic error for every
              # recipient tried -- the RLS insert policy on
              # public.messages rejects the sender when
              # internal.is_posting_blocked(auth.uid()) is true, which
              # is the one condition that would explain a send failing
              # identically regardless of who the recipient is. The
              # client's own restriction banner fails open on a fetch
              # error (see conversation_screen.dart's _loadSafetyState),
              # so a real restriction can be invisible in the UI while
              # still correctly enforced at the database.
              #
              # Ids are truncated to 8 characters -- enough to match
              # against "does this look like the account I'm testing
              # with", not enough to identify anyone from this log alone.
              echo "=== Anyone currently restricted, suspended, or banned? ==="
              run_sql "select left(target_user_id::text, 8) as user_prefix,
                              action_type, reason, expires_at, created_at
                       from public.moderation_actions
                       where overturned_at is null
                         and (
                           (action_type in ('restrict', 'suspend') and expires_at > now())
                           or action_type = 'ban'
                         )
                       order by created_at desc;" | jq .
              echo
              echo "An empty array above means nobody is currently blocked from posting --"
              echo "the chat failure has some other cause and this was not it."
              ;;

            remove)
              run_sql "drop trigger if exists $TRIGGER_NAME on public.notifications;" >/dev/null
              echo "Dropped (if it existed)."
              show
              ;;

            create)
              # The function URL and the key both come from secrets, so
              # this repo stores no environment-specific value -- same
              # reasoning as the --dart-define block in deploy-web.yml.
              FN_URL="$SUPABASE_URL/functions/v1/send-push-notification"
              HEADERS=$(jq -nc --arg auth "Bearer $SUPABASE_PUBLISHABLE_KEY" \
                        '{"Content-type":"application/json", "Authorization":$auth}')

              # Dropped first so re-running is a safe way to correct a
              # bad header rather than an error to work around.
              run_sql "drop trigger if exists $TRIGGER_NAME on public.notifications;" >/dev/null

              # 5000 ms, not the Dashboard's default 1000: this function
              # talks to Google for an OAuth token and then to FCM, and a
              # timeout here only ends Postgres's wait -- the function
              # still runs to completion and the push is still delivered.
              # The longer value keeps net._http_response readable instead
              # of full of timeouts that did not actually fail.
              run_sql "create trigger $TRIGGER_NAME
                       after insert on public.notifications
                       for each row
                       execute function supabase_functions.http_request(
                         $(sqlq "$FN_URL"),
                         'POST',
                         $(sqlq "$HEADERS"),
                         '{}',
                         '5000'
                       );" >/dev/null
              echo "Created."
              show
              ;;
          esac
