name: Integrate and verify DOM typography once
on:
  push:
    branches: [ops/apply-system-font-dom-fix-20260913]
    paths: [.github/workflows/apply-dom-typography-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/web-system-dom-all
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - name: Merge complete browser-system text layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main feat/web-system-text-all
          set +e
          git merge --no-commit --no-ff origin/feat/web-system-text-all
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git checkout --theirs -- app/lib/core/typography/browser_system_text_web.dart
            git add app/lib/core/typography/browser_system_text_web.dart
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo 'Unexpected unresolved conflicts:'
            git diff --name-only --diff-filter=U
            exit 20
          fi

          git checkout origin/feat/web-system-text-all -- \
            app/lib/core/design/wyn_theme.dart \
            app/lib/core/design/wyn_typography.dart \
            app/lib/core/typography/browser_system_picker.dart \
            app/lib/core/typography/browser_system_picker_stub.dart \
            app/lib/core/typography/browser_system_picker_web.dart \
            app/lib/core/typography/browser_system_text.dart \
            app/lib/core/typography/browser_system_text_stub.dart \
            app/lib/core/typography/browser_system_text_web.dart \
            app/lib/core/typography/native_emoji_stub.dart \
            app/test/system_typography_ios_accessibility_test.dart

          # Keep the latest Founder-approved Home spacing from main.
          git checkout origin/main -- app/lib/features/home/presentation/widgets/home_card_metrics.dart

          # Remove the bundled Web font workaround. Web text will use the
          # browser DOM system stack; native iOS/Android remain OS-default.
          git rm -r -f --ignore-unmatch app/assets/fonts/NotoSansThai
          git rm -f --ignore-unmatch app/test/web_typography_assets_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('app/pubspec.yaml')
          s = p.read_text()
          s = s.replace('    - assets/fonts/NotoSansThai/OFL.txt\n', '')
          s, n = re.subn(
              r'\n  fonts:\n    # Web-only at runtime: WynTheme selects this family only when kIsWeb\.\n    # Native iOS/Android keep their platform system typography\.\n    - family: WYNWebNotoThai\n      fonts:\n        - asset: assets/fonts/NotoSansThai/NotoSansThai\[wdth,wght\]\.ttf\n',
              '\n', s)
          if n != 1:
              raise SystemExit(f'Expected exactly one WYNWebNotoThai font block, removed {n}')
          p.write_text(s)
          PY

          # Do not carry temporary migration workflows into the product branch.
          git rm -f --ignore-unmatch \
            .github/workflows/apply-web-system-text-all-retry.yml \
            .github/workflows/apply-web-system-text-all.yml \
            .github/workflows/audit-web-system-text-all.yml \
            .github/workflows/cleanup-gate-web-system-text-all.yml \
            .github/workflows/fix-web-system-text-all-analyzer.yml \
            .github/workflows/format-verify-system-text-layer.yml \
            .github/workflows/verify-system-text-layer.yml

          mapfile -t files < <(git diff --name-only -- '*.dart' | grep '^app/' || true)
          if [ ${#files[@]} -gt 0 ]; then dart format "${files[@]}"; fi
          git add -A

      - name: Gate forced fonts and legacy Flutter text surfaces
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'WYNWebNotoThai|assets/fonts/NotoSansThai' -- app ':!app/build'; then
            echo 'Forced bundled Web font remains.'
            exit 30
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/lib')
          excluded = {
            root/'core/typography/browser_system_text_stub.dart',
            root/'core/typography/browser_system_text_web.dart',
            root/'core/typography/browser_system_picker_stub.dart',
            root/'core/typography/browser_system_picker_web.dart',
          }

          # Replace comments and string literal contents with spaces while
          # preserving indexes/newlines. This prevents documentation examples
          # such as `Text(...)` from being misclassified as executable UI.
          def code_only(source: str) -> str:
            out = list(source)
            i = 0
            quote = None
            triple = False
            escape = False
            line = False
            block = False
            while i < len(source):
              ch = source[i]
              pair = source[i:i+2]
              if line:
                if ch != '\n': out[i] = ' '
                else: line = False
                i += 1; continue
              if block:
                if pair == '*/':
                  out[i] = out[i+1] = ' '; block = False; i += 2; continue
                if ch != '\n': out[i] = ' '
                i += 1; continue
              if quote:
                if ch != '\n': out[i] = ' '
                if escape:
                  escape = False; i += 1; continue
                if ch == '\\': escape = True; i += 1; continue
                if triple and source.startswith(quote*3, i):
                  for j in range(i, min(i+3, len(out))): out[j] = ' '
                  quote = None; triple = False; i += 3; continue
                if not triple and ch == quote:
                  quote = None
                i += 1; continue
              if pair == '//':
                out[i] = out[i+1] = ' '; line = True; i += 2; continue
              if pair == '/*':
                out[i] = out[i+1] = ' '; block = True; i += 2; continue
              if source.startswith("'''", i):
                out[i:i+3] = [' ', ' ', ' ']; quote = "'"; triple = True; i += 3; continue
              if source.startswith('"""', i):
                out[i:i+3] = [' ', ' ', ' ']; quote = '"'; triple = True; i += 3; continue
              if ch in "'\"":
                out[i] = ' '; quote = ch; i += 1; continue
              i += 1
            return ''.join(out)

          direct_patterns = {
            'Text': re.compile(r'(?<![A-Za-z0-9_])Text(?:\.rich)?\s*\('),
            'RichText': re.compile(r'(?<![A-Za-z0-9_])RichText\s*\('),
            'TextField': re.compile(r'(?<![A-Za-z0-9_])TextField\s*\('),
            'TextFormField': re.compile(r'(?<![A-Za-z0-9_])TextFormField\s*\('),
            'SelectableText': re.compile(r'(?<![A-Za-z0-9_])SelectableText(?:\.rich)?\s*\('),
            'Tooltip': re.compile(r'(?<!BrowserSystem)(?<![A-Za-z0-9_])Tooltip\s*\('),
            'showDatePicker': re.compile(r'(?<![A-Za-z0-9_])showDatePicker\s*\('),
            'showTimePicker': re.compile(r'(?<![A-Za-z0-9_])showTimePicker\s*\('),
            'SnackBarAction': re.compile(r'(?<![A-Za-z0-9_])SnackBarAction\s*\('),
            'Tab(text:)': re.compile(r'\bTab\s*\([^\)]*\btext\s*:', re.S),
          }

          def call_bodies(clean: str, token: str):
            bodies = []
            i = 0
            while True:
              m = re.search(r'(?<![A-Za-z0-9_])' + re.escape(token) + r'\b', clean[i:])
              if not m: break
              start = i + m.start()
              j = i + m.end()
              while j < len(clean) and clean[j].isspace(): j += 1
              if j < len(clean) and clean[j] == '<':
                depth = 0
                while j < len(clean):
                  if clean[j] == '<': depth += 1
                  elif clean[j] == '>':
                    depth -= 1
                    if depth == 0:
                      j += 1; break
                  j += 1
                while j < len(clean) and clean[j].isspace(): j += 1
              if j >= len(clean) or clean[j] != '(':
                i = max(j, start + 1); continue
              open_i = j
              depth = 0
              while j < len(clean):
                if clean[j] == '(': depth += 1
                elif clean[j] == ')':
                  depth -= 1
                  if depth == 0:
                    bodies.append(clean[open_i+1:j])
                    j += 1
                    break
                j += 1
              i = max(j, start + 1)
            return bodies

          def has_top_level_named_arg(body: str, name: str) -> bool:
            par = br = cur = 0
            start = 0
            for idx, ch in enumerate(body + ','):
              if ch == '(': par += 1
              elif ch == ')': par -= 1
              elif ch == '[': br += 1
              elif ch == ']': br -= 1
              elif ch == '{': cur += 1
              elif ch == '}': cur -= 1
              elif ch == ',' and par == 0 and br == 0 and cur == 0:
                part = body[start:idx]
                if re.match(r'\s*' + re.escape(name) + r'\s*:', part): return True
                start = idx + 1
            return False

          failures = []
          for p in sorted(root.rglob('*.dart')):
            if p in excluded: continue
            clean = code_only(p.read_text())
            for label, rx in direct_patterns.items():
              if rx.search(clean): failures.append(f'{p}: {label}')
            # Flutter's built-in tooltip parameter paints framework tooltip text.
            # Custom widgets may safely expose a `tooltip` property if they route it
            # into BrowserSystemTooltip, so only framework constructors are gated.
            for token in ('IconButton', 'FloatingActionButton', 'PopupMenuButton'):
              for body in call_bodies(clean, token):
                if has_top_level_named_arg(body, 'tooltip'):
                  # tooltip:null is allowed only when wrapped by BrowserSystemTooltip;
                  # checking the presence conservatively catches any missed migration.
                  failures.append(f'{p}: {token}(tooltip:)')

          if failures:
            print('Legacy text surfaces remain:')
            print('\n'.join(failures[:250]))
            raise SystemExit(31)
          print('Source gate passed: executable app-owned text uses browser system surfaces.')
          PY
      - name: Flutter analyze and full tests
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
      - name: Production Web build typography gate
        working-directory: app
        run: |
          set -euo pipefail
          flutter build web --release
          test -f build/web/main.dart.js
          grep -q 'Apple Color Emoji' build/web/main.dart.js
          grep -q 'Thonburi' build/web/main.dart.js
          ! grep -q 'WYNWebNotoThai' build/web/main.dart.js
          ! test -e build/web/assets/assets/fonts/NotoSansThai
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git status --short
          git commit -m 'fix(web): use browser system typography across app'
          git push origin HEAD:fix/web-system-dom-all
