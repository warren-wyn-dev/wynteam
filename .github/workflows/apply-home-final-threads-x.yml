name: Apply Home final Threads + X UI

on:
  push:
    branches:
      - wyn/home-final-threads-x
    paths:
      - tools/apply_home_final_threads_x.py
      - .github/workflows/apply-home-final-threads-x.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wyn/home-final-threads-x

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Apply approved Home visual pass
        run: python tools/apply_home_final_threads_x.py

      - name: Format touched Dart files
        working-directory: app
        run: |
          dart format \
            lib/features/home/presentation/home_feed_screen.dart \
            lib/features/home/presentation/widgets/home_drop_card.dart \
            lib/features/home/presentation/widgets/home_pop_card.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Home regression tests
        working-directory: app
        run: |
          flutter test \
            test/home_feed_screen_test.dart \
            test/home_drop_card_overflow_test.dart

      - name: Commit final Home UI and remove one-shot helpers
        run: |
          rm tools/apply_home_final_threads_x.py
          rm .github/workflows/apply-home-final-threads-x.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): match approved Threads + X Home mockup"
          git push origin HEAD:wyn/home-final-threads-x
