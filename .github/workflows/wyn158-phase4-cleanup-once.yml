name: WYN-158 Phase 4 cleanup (one-shot)

on:
  push:
    branches:
      - feat/wyn-158-phase4-parity-qa
    paths:
      - '.github/workflows/wyn158-phase4-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wyn-158-phase4-parity-qa
      - name: Clean internal navigation and unused imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          chat = Path('web/components/chat-routes.tsx')
          text = chat.read_text(encoding='utf-8')
          replacements = [
            ('import { useSearchParams } from "next/navigation";', 'import { useRouter, useSearchParams } from "next/navigation";'),
            ('function ChatInboxInner({ client, userId }: { client: SupabaseClient; userId: string }) {\n  const [allowed,', 'function ChatInboxInner({ client, userId }: { client: SupabaseClient; userId: string }) {\n  const router = useRouter();\n  const [allowed,'),
            ('window.location.href = `/chat/${id}?user=${encodeURIComponent(profile.id)}`;', 'router.push(`/chat/${id}?user=${encodeURIComponent(profile.id)}`);'),
            ('}) {\n  const params = useSearchParams();', '}) {\n  const router = useRouter();\n  const params = useSearchParams();'),
            ('await deleteMessageRequest(client, conversationId); window.location.href = "/chat";', 'await deleteMessageRequest(client, conversationId); router.replace("/chat");'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'chat pattern missing: {old[:80]}')
            text = text.replace(old, new, 1)
          chat.write_text(text, encoding='utf-8')

          settings = Path('web/components/settings-route.tsx')
          text = settings.read_text(encoding='utf-8')
          replacements = [
            ('import { useCallback, useEffect, useState } from "react";', 'import { useRouter } from "next/navigation";\nimport { useCallback, useEffect, useState } from "react";'),
            ('function SettingsInner({ client, userId, signOut }: { client: SupabaseClient; userId: string; signOut: () => Promise<void> }) {\n  const [profile,', 'function SettingsInner({ client, userId, signOut }: { client: SupabaseClient; userId: string; signOut: () => Promise<void> }) {\n  const router = useRouter();\n  const [profile,'),
            ('await deleteMyAccount(client); await client.auth.signOut(); window.location.href = "/";', 'await deleteMyAccount(client); await client.auth.signOut(); router.replace("/");'),
          ]
          for old, new in replacements:
            if old not in text:
              raise SystemExit(f'settings pattern missing: {old[:80]}')
            text = text.replace(old, new, 1)
          settings.write_text(text, encoding='utf-8')

          profile = Path('web/components/profile-route.tsx')
          text = profile.read_text(encoding='utf-8')
          old = 'import { Camera, MessageCircle, MoreHorizontal, Settings as SettingsIcon } from "lucide-react";\nimport Link from "next/link";'
          new = 'import { Camera, MessageCircle, MoreHorizontal } from "lucide-react";'
          if old not in text:
            raise SystemExit('profile import pattern missing')
          profile.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'warren-wyn-dev'
          git config user.email 'warren.wyn.dev@gmail.com'
          git add web/components/chat-routes.tsx web/components/settings-route.tsx web/components/profile-route.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix(web): keep migrated navigation client-side'
          git push origin HEAD:feat/wyn-158-phase4-parity-qa
