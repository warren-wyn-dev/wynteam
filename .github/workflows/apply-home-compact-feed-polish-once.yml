name: Apply home compact feed polish once

on:
  push:
    branches: [feat/home-compact-feed-polish]
    paths:
      - .github/workflows/apply-home-compact-feed-polish-once.yml
      - tools/apply_home_compact_feed_polish.py

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-compact-feed-polish
          fetch-depth: 0

      - name: Apply compact feed polish
        run: python3 tools/apply_home_compact_feed_polish.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format changed Dart files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi
          git diff --check

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Focused Home regressions
        working-directory: app
        run: flutter test test/home_feed_screen_test.dart test/root_shell_test.dart

      - name: Commit validated change
        run: |
          rm -f tools/apply_home_compact_feed_polish.py
          rm -f .github/workflows/apply-home-compact-feed-polish-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): tighten feed rhythm and header chrome"
          git push origin feat/home-compact-feed-polish
