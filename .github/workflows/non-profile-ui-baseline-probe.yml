name: Non-profile UI baseline probe

on:
  push:
    branches:
      - ui/wynos-system-ui-harmonization-20260911
    paths:
      - .github/workflows/non-profile-ui-baseline-probe.yml

permissions:
  contents: read

jobs:
  baseline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/wynos-system-ui-harmonization-20260911
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Baseline Home contract
        working-directory: app
        run: flutter test test/home_feed_screen_test.dart
