name: Maps -- apply saved places v1

# Applies supabase/migrations_wynos_maps_saved_places_v1.sql: the owner-only
# wynos_saved_places table (Home, Work, Favorites) and its three RPCs.
# Additive only. Manual dispatch on main only, after the Founder approves
# the production migration.
# Behaviour test: supabase/tests/wynos_maps_saved_places_test.sh.
# ROLLBACK: see the header of the migration file.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-MAPS-SAVED-PLACES to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-MAPS-SAVED-PLACES'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_maps_saved_places_v1.sql)
          commit;" >/dev/null
          # Definitions and privileges only; no personal data is read.
          run_sql "select
              (select relrowsecurity from pg_class where oid = 'public.wynos_saved_places'::regclass) as rls_on,
              has_table_privilege('authenticated', 'public.wynos_saved_places', 'select') as auth_table_select,
              has_table_privilege('anon', 'public.wynos_saved_places', 'select') as anon_table_select,
              has_function_privilege('anon', 'public.wynos_saved_places_list()', 'execute') as anon_list,
              has_function_privilege('authenticated', 'public.wynos_saved_places_list()', 'execute') as auth_list,
              has_function_privilege('authenticated', 'public.wynos_save_place(text,text,text,text,text,double precision,double precision)', 'execute') as auth_save,
              has_function_privilege('authenticated', 'public.wynos_delete_saved_place(uuid)', 'execute') as auth_delete;" \
            | tee result.json | jq .
          jq -e '.[0].rls_on == true and .[0].auth_table_select == false and .[0].anon_table_select == false
                 and .[0].anon_list == false and .[0].auth_list == true and .[0].auth_save == true
                 and .[0].auth_delete == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "WYNOS Maps saved places are installed."
