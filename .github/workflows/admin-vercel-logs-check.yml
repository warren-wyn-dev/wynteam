name: Admin -- fetch recent Vercel runtime logs (read-only)

# app/(admin)/error.tsx deliberately shows only a generic message to the
# browser ("โหลดข้อมูลไม่สำเร็จ"), so the real thrown error only exists in the
# production deployment's runtime logs. Read-only: fetches logs, changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Same pinned IDs as deploy-admin.yml.
      VERCEL_ORG_ID: team_Kamt1PUT5XKn9MWrF404re1w
      VERCEL_PROJECT_ID: prj_Ca3SJBvzn0K4w8t0bwQn13EDbVh5
    steps:
      - name: Fetch recent runtime logs of the current production deployment
        run: |
          set -euo pipefail
          VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\n\r ')
          api="https://api.vercel.com"
          auth=(--header "Authorization: Bearer $VERCEL_TOKEN")
          dep=$(curl --silent --fail "${auth[@]}" \
            "$api/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1" \
            | jq -r '.deployments[0].uid')
          echo "production deployment: $dep"
          # The endpoint streams NDJSON; stop after 20s and keep what arrived.
          curl --silent --max-time 20 "${auth[@]}" \
            "$api/v1/projects/$VERCEL_PROJECT_ID/deployments/$dep/runtime-logs?teamId=$VERCEL_ORG_ID" \
            > logs.ndjson || true
          echo "lines: $(wc -l < logs.ndjson)"
          jq -r 'select(.level == "error" or (.message // "" | test("rror|exception|Not permitted|Not authorized"))) | "\(.timestampInMs // "") \(.requestPath // "") \(.level // "") \(.message // "" | .[0:600])"' logs.ndjson | tail -60 || tail -c 6000 logs.ndjson
