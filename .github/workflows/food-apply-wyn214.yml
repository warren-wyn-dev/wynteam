name: Food -- apply WYN-214 admin merchant polish

# Applies supabase/migrations_wynos_admin_merchant_polish_v1.sql (WYN-214):
# admin_food_store_detail returns the store pin, delivery radius, WYN-211
# service-area flag and missing readiness items; admin_food_orders gains the
# refund_pending and payment_review filters. Read-only RPC changes, same
# admin/moderator rules. Manual dispatch on main only, after the Founder
# approves production. Then run deploy-admin.yml.
# Behaviour test: supabase/tests/wynos_admin_merchant_polish_test.sh.
# ROLLBACK: re-run both functions from migrations_wynos_admin_food_ops_v1.sql.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WYN-214 to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-WYN-214'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_admin_merchant_polish_v1.sql)
          commit;" >/dev/null
          # Definitions and privileges only; no personal data is read.
          run_sql "select
              (pg_get_functiondef('public.admin_food_store_detail(uuid)'::regprocedure) like '%in_service_area%') as store_detail_area,
              (pg_get_functiondef('public.admin_food_orders(uuid,text,text,integer)'::regprocedure) like '%refund_pending%') as orders_refund_filter,
              has_function_privilege('anon', 'public.admin_food_store_detail(uuid)', 'execute') as anon_store_detail,
              has_function_privilege('anon', 'public.admin_food_orders(uuid,text,text,integer)', 'execute') as anon_orders;" \
            | tee result.json | jq .
          jq -e '.[0].store_detail_area == true and .[0].orders_refund_filter == true
                 and .[0].anon_store_detail == false and .[0].anon_orders == false' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "WYN-214 admin merchant polish is installed. Next: deploy WYNOS Admin."
