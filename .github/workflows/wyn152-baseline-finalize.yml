name: One-shot WYN-152 baseline sync

on:
  push:
    branches: [fix/beta4-audit-remaining-bugs]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
          fetch-depth: 0

      - name: Append WYN-152 to schema baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path
          schema_path = Path('supabase/schema.sql')
          migration_path = Path('supabase/migrations_wyn152_experiment_outcome_trigger_record_safety.sql')
          schema = schema_path.read_text(encoding='utf-8')
          migration = migration_path.read_text(encoding='utf-8').strip()
          marker = '-- WYN-152 / BUG-004 follow-up: make the WYN-145 experiment outcome trigger'
          if marker not in schema:
              schema_path.write_text(schema.rstrip() + '\n\n' + migration + '\n', encoding='utf-8')
          schema = schema_path.read_text(encoding='utf-8')
          if schema.count(marker) != 1:
              raise SystemExit(f'expected one WYN-152 baseline block, got {schema.count(marker)}')
          if schema.index(marker) < schema.index('-- WYN-151 / BUG-004 follow-up: restore the documented Discovery semantics.'):
              raise SystemExit('WYN-152 must follow WYN-151 in the baseline')
          PY

      - name: Verify WYN-152 baseline
        run: |
          set -euo pipefail
          grep -Fq "elsif tg_table_name = 'saves' then" supabase/schema.sql
          grep -Fq "elsif tg_table_name = 'reports' then" supabase/schema.sql
          grep -Fq 'create or replace function internal.attribute_feed_experiment_outcome()' supabase/schema.sql
          python3 supabase/check_schema_ordering.py
          git diff --check

      - name: Commit schema baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          if git diff --cached --quiet; then
            echo 'WYN-152 baseline already synchronized.'
            exit 0
          fi
          git commit -m 'chore(db): sync WYN-152 experiment outcome baseline'
          git push origin HEAD:fix/beta4-audit-remaining-bugs
