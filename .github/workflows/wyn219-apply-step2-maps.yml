name: WYN-219 -- apply step 2 Maps permissions

# Applies supabase/migrations/20261010160000_wyn219_step2_maps_permissions.sql:
# the WYNOS Maps admin RPCs and place-photo storage policies check
# internal.has_admin_permission('maps', view|edit) instead of platform_role.
# Requires the WYN-219 foundation (wyn219-apply-admin-permissions-foundation.yml)
# and refuses to run without it. Run only after explicit Founder approval.
# Behaviour test: supabase/tests/wyn_219_step2_maps_test.sh.
#
# ROLLBACK: apply supabase/rollbacks/20261010160000_wyn219_step2_maps_permissions_rollback.sql
# (restores the production definitions captured on 2026-10-10).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-WYN-219-MAPS to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-WYN-219-MAPS'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"
            exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2
              cat "$out" >&2
              rm -f "$out"
              return 1
            fi
            cat "$out"
            rm -f "$out"
          }

          ready=$(run_sql "select to_regprocedure('internal.has_admin_permission(text,text)') is not null
                             and (select count(*) from internal.platform_super_admins) = 1 as ready")
          echo "$ready" | jq -e '.[0].ready' >/dev/null \
            || { echo "::error::WYN-219 foundation is not applied (or has no super admin); apply it first"; exit 1; }

          run_sql "begin;
          $(cat supabase/migrations/20261010160000_wyn219_step2_maps_permissions.sql)
          commit;" >/dev/null

          result=$(run_sql "select
              (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = 'public' and p.proname like 'admin_%wynos_place%'
                  and p.prosrc like '%platform_role%') as functions_still_on_role,
              (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = 'public' and p.proname like 'admin_%wynos_place%'
                  and p.prosrc like '%has_admin_permission(''maps''%') as functions_on_permission,
              (select count(*) from pg_policies where policyname like 'Place photos%'
                and qual like '%has_admin_permission%') as policies_on_permission,
              has_function_privilege('authenticated', 'public.admin_review_wynos_place_photo(uuid,text)', 'execute') as review_grant_kept")
          echo "$result"
          echo "$result" | jq -e '.[0] | .functions_still_on_role == 0 and .functions_on_permission == 9
            and .policies_on_permission == 2 and .review_grant_kept' >/dev/null \
            || { echo "::error::Post-apply verification failed"; exit 1; }
          echo "WYN-219 step 2 (Maps) applied and verified."
