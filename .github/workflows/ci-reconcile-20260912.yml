name: CI reconciliation 2026-09-12

on:
  push:
    branches: [fix/ci-reconcile-20260912]
    paths:
      - .github/workflows/ci-reconcile-20260912.yml
      - tools/ci_reconcile_20260912.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-reconcile-20260912
          fetch-depth: 0

      - name: Apply reconciliation
        run: python3 tools/ci_reconcile_20260912.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACM -- '*.dart')
          if [ ${#files[@]} -gt 0 ]; then
            dart format "${files[@]}"
          fi

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Targeted Flutter regressions
        working-directory: app
        run: |
          flutter test \
            test/drop_comment_delete_test.dart \
            test/drop_detail_screen_test.dart \
            test/view_profile_screen_test.dart \
            test/qa_wyn110_profile_scroll_header_test.dart \
            test/view_profile_mute_test.dart \
            test/share_sheet_test.dart \
            test/root_shell_guest_gate_test.dart \
            test/view_profile_screen_scroll_test.dart

      - name: WYN-141 Top100 PostgreSQL regression
        run: bash supabase/tests/wyn_141_top100_integration_test.sh

      - name: Full Flutter suite
        working-directory: app
        run: flutter test

      - name: Commit validated reconciliation
        run: |
          rm -f tools/ci_reconcile_20260912.py
          rm -f .github/workflows/ci-reconcile-20260912.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reconcile Founder-final regressions and DB test parity"
          git push origin HEAD:fix/ci-reconcile-20260912
