name: Founder feed polish run 3

on:
  push:
    branches:
      - ui/founder-feed-polish
    paths:
      - .github/workflows/founder-feed-polish-run3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/founder-feed-polish
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - name: Apply patch
        run: python3 tools/founder_feed_polish_patch.py
      - name: Format
        run: dart format app/lib/core/widgets/hashtag_text.dart app/lib/features/home/presentation/widgets/home_drop_card.dart app/lib/features/home/presentation/widgets/home_pop_card.dart app/test/hashtag_text_test.dart
      - name: Focused test
        working-directory: app
        run: flutter test test/hashtag_text_test.dart
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/core/widgets/hashtag_text.dart app/lib/features/home/presentation/widgets/home_drop_card.dart app/lib/features/home/presentation/widgets/home_pop_card.dart app/test/hashtag_text_test.dart
          git commit -m "fix(feed): match approved spacing and hashtag typography"
          git push origin HEAD:ui/founder-feed-polish
