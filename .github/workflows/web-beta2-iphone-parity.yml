name: WYNOS Web Beta 2 iPhone Visual Parity

on:
  push:
    branches: [web-beta2]
    paths:
      - '.github/workflows/web-beta2-iphone-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wynos-web-beta2-iphone-parity
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify isolated Staging identifiers
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          stage_url=$(printf '%s' "$STAGING_SUPABASE_URL" | tr -d '\n\r '); stage_url=${stage_url%/}
          test "$GITHUB_REF" = "refs/heads/web-beta2"
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"
          test "$STAGING_VERCEL_PROJECT_ID" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$PRODUCTION_VERCEL_PROJECT_ID" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$STAGING_VERCEL_PROJECT_ID" != "$PRODUCTION_VERCEL_PROJECT_ID"
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - name: Targeted installed-iPhone parity QA
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npx playwright test tests/browser/ios-status-bar.spec.ts tests/browser/composer-popup-height.spec.ts --project=webkit-iphone --retries=1
      - name: Deploy exact tested commit to Beta 2 Staging only
        id: deploy
        working-directory: .
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          clean(){ printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_url=$(clean "$STAGING_SUPABASE_URL"); stage_url=${stage_url%/}
          stage_key=$(clean "$STAGING_SUPABASE_PUBLISHABLE_KEY")
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"
          test "$STAGING_VERCEL_PROJECT_ID" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$PRODUCTION_VERCEL_PROJECT_ID" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$STAGING_VERCEL_PROJECT_ID" != "$PRODUCTION_VERCEL_PROJECT_ID"
          firebase_args=()
          addenv(){ local n="$1" v; v=$(clean "$2"); test -n "$v"; firebase_args+=(--build-env "$n=$v" --env "$n=$v"); }
          addenv NEXT_PUBLIC_FIREBASE_API_KEY "$FIREBASE_WEB_API_KEY"
          addenv NEXT_PUBLIC_FIREBASE_APP_ID "$FIREBASE_WEB_APP_ID"
          addenv NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FIREBASE_MESSAGING_SENDER_ID"
          addenv NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          addenv NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FIREBASE_AUTH_DOMAIN"
          addenv NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FIREBASE_STORAGE_BUCKET"
          addenv NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FIREBASE_VAPID_KEY"
          export VERCEL_PROJECT_ID="$STAGING_VERCEL_PROJECT_ID"
          export VERCEL_ORG_ID
          url=$(npx --yes vercel@60.1.3 deploy --yes --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$stage_key" \
            --env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$stage_key" \
            --build-env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            --env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            "${firebase_args[@]}" | tail -n 1)
          case "$url" in https://*.vercel.app) ;; *) exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Beta 2 iPhone parity preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Temporary protected-preview bypass
        working-directory: .
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bypass=$(openssl rand -hex 16)
          echo "::add-mask::$bypass"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" --header 'Content-Type: application/json' \
            --data "{\"generate\":{\"secret\":\"$bypass\",\"note\":\"Beta2 iPhone parity $GITHUB_RUN_ID\"}}" >/dev/null
      - name: Verify hosted iOS metadata and Staging isolation
        working-directory: .
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          html=$(curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/")
          grep -q 'black-translucent' <<< "$html"
          grep -q 'yydgdapzlrjmlrjgijkj.supabase.co' <<< "$html"
          ! grep -q 'kqokpocajhfbidcxpvhh.supabase.co' <<< "$html"
      - name: Revoke temporary bypass
        if: always()
        working-directory: .
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then exit 0; fi
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" --header 'Content-Type: application/json' \
            --data "{\"revoke\":{\"secret\":\"$VERCEL_AUTOMATION_BYPASS_SECRET\",\"regenerate\":false}}" >/dev/null
