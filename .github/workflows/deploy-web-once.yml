name: Trigger production web deploy once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref main --repo "${{ github.repository }}"
