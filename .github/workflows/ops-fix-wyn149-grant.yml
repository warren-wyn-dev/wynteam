name: Ops fix WYN-149 portable grant

on:
  push:
    branches:
      - fix/beta4-audit-remaining-bugs
    paths:
      - .github/workflows/ops-fix-wyn149-grant.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
      - name: Make service-role grant portable to bare PostgreSQL tests
        run: |
          python3 -c "from pathlib import Path; old='grant execute on function public.reserve_location_search_request(uuid,integer,integer)\n  to service_role;'; new=\"do \\\$\\\$\\nbegin\\n  if exists (select 1 from pg_roles where rolname = 'service_role') then\\n    execute 'grant execute on function public.reserve_location_search_request(uuid,integer,integer) to service_role';\\n  end if;\\nend;\\n\\\$\\\$;\"; files=['supabase/migrations_wyn149_location_search_rate_limit.sql','supabase/schema.sql']; [(lambda p: p.write_text(p.read_text().replace(old,new)))(Path(f)) for f in files]"
          git diff --check
          python3 supabase/check_schema_ordering.py
      - name: Commit and push
        run: |
          git config user.name "warren-wyn-dev"
          git config user.email "warren.wyn.dev@gmail.com"
          git add supabase/migrations_wyn149_location_search_rate_limit.sql supabase/schema.sql
          git commit -m "fix(db): keep WYN-149 schema portable in test harnesses"
          git push origin HEAD:fix/beta4-audit-remaining-bugs
