name: Fix compact header CI once

on:
  push:
    branches: [feat/profile-post-header-tighten]
    paths:
      - .github/workflows/fix-profile-post-header-ci-once.yml
      - tools/fix_profile_post_header_ci.py

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/profile-post-header-tighten
          fetch-depth: 0

      - name: Update Drop menu regression expectations
        run: python3 tools/fix_profile_post_header_ci.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Format and check diff
        run: |
          dart format \
            app/lib/features/home/presentation/widgets/home_drop_card.dart \
            app/test/home_feed_screen_test.dart
          git diff --check

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze

      - name: Home feed regression tests
        working-directory: app
        run: flutter test test/home_feed_screen_test.dart test/home_drop_card_overflow_test.dart

      - name: Commit validated fix
        run: |
          rm -f tools/fix_profile_post_header_ci.py
          rm -f .github/workflows/fix-profile-post-header-ci-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(home): align More icon expectations"
          git push origin feat/profile-post-header-tighten
