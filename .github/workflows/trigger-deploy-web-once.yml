name: Trigger production web deploy once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/trigger-deploy-web-once.yml

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Trigger production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-web.yml --ref main

      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/trigger-deploy-web-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trigger-deploy-web-once.yml
          git commit -m "chore: remove production deploy trigger"
          git push origin HEAD:main
