name: ZOKY LINE -- apply line_links

# ZOKY-LINE-001 (Founder approval 2026-10-31, .wyn/company/APPROVALS.md).
# Applies the additive migration 20261031120000_zoky_line_links.sql to the
# production database and verifies definitions and privileges only. No
# personal data is read. Re-runnable. Rollback:
# supabase/rollbacks/20261031120000_zoky_line_links_rollback.sql
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-ZOKY-LINE-LINKS to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    environment: production
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-ZOKY-LINE-LINKS'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations/20261031120000_zoky_line_links.sql)
          commit;" >/dev/null
          # Definitions and privileges only; no rows are read.
          run_sql "select
              to_regclass('public.line_links') is not null as table_ready,
              (select relrowsecurity from pg_class where oid = 'public.line_links'::regclass) as rls_on,
              (select count(*) from pg_policies where schemaname = 'public' and tablename = 'line_links') as policies,
              has_table_privilege('anon', 'public.line_links', 'select') as anon_read,
              has_table_privilege('authenticated', 'public.line_links', 'insert') as members_insert,
              has_table_privilege('authenticated', 'public.line_links', 'update') as members_update,
              has_column_privilege('authenticated', 'public.line_links', 'line_user_id', 'select') as members_read_line_id,
              has_table_privilege('authenticated', 'public.line_links', 'delete') as members_delete;" \
            | tee result.json | jq .
          jq -e '.[0].table_ready == true and .[0].rls_on == true and .[0].policies == 2
                 and .[0].anon_read == false and .[0].members_insert == false and .[0].members_update == false
                 and .[0].members_read_line_id == false and .[0].members_delete == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "public.line_links is installed. LINE delivery stays off until LINE_NOTIFICATIONS_ENABLED=1."
