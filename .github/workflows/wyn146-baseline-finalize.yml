name: One-shot WYN-146 baseline sync

on:
  push:
    branches: [fix/beta4-audit-remaining-bugs]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
          fetch-depth: 0

      - name: Insert WYN-146 before WYN-147 baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path('supabase/schema.sql')
          migration_path = Path('supabase/migrations_wyn146_feed_algorithm_v1.sql')
          schema = schema_path.read_text(encoding='utf-8')
          migration = migration_path.read_text(encoding='utf-8').strip()

          marker146 = '-- WYN-146 / Phases 8-10: WYNOS Feed Algorithm v1 Production Candidate'
          marker147 = '-- WYN-147: Home Feed Repetition Control'
          marker151 = '-- WYN-151 / BUG-004 follow-up: restore the documented Discovery semantics.'

          if marker146 not in schema:
              if marker147 not in schema:
                  raise SystemExit('WYN-147 insertion marker not found')
              schema = schema.replace(marker147, migration + '\n\n' + marker147, 1)
              schema_path.write_text(schema, encoding='utf-8')

          schema = schema_path.read_text(encoding='utf-8')
          if schema.count(marker146) != 1:
              raise SystemExit(f'expected one WYN-146 baseline block, got {schema.count(marker146)}')
          if schema.index(marker146) > schema.index(marker147):
              raise SystemExit('WYN-146 must precede WYN-147')
          if schema.index('create table if not exists public.feed_impressions') > schema.index(marker147):
              raise SystemExit('feed_impressions must exist before WYN-147')
          if schema.index(marker147) > schema.index(marker151):
              raise SystemExit('WYN-147 must precede WYN-151')
          PY

      - name: Verify baseline contracts
        run: |
          set -euo pipefail
          bash supabase/tests/wyn_146_feed_algorithm_v1_test.sh
          bash supabase/tests/wyn_147_feed_repetition_control_test.sh
          python3 supabase/check_schema_ordering.py
          git diff --check

      - name: Commit schema baseline
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/schema.sql
          if git diff --cached --quiet; then
            echo 'WYN-146 baseline already synchronized.'
            exit 0
          fi
          git commit -m 'chore(db): sync WYN-146 feed baseline'
          git push origin HEAD:fix/beta4-audit-remaining-bugs
