name: Feed header time caption polish once

on:
  push:
    branches:
      - fix/feed-header-time-caption
    paths:
      - .github/workflows/feed-header-time-caption-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/feed-header-time-caption
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
      - name: Apply patch
        run: python3 tools/feed_header_time_caption_patch.py
      - name: Format
        run: dart format app/lib/features/home/presentation/widgets/home_drop_card.dart app/lib/features/home/presentation/widgets/home_pop_card.dart
      - name: Analyze touched files
        working-directory: app
        run: flutter analyze lib/features/home/presentation/widgets/home_drop_card.dart lib/features/home/presentation/widgets/home_pop_card.dart
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/features/home/presentation/widgets/home_drop_card.dart app/lib/features/home/presentation/widgets/home_pop_card.dart
          git commit -m "fix(feed): restore inline time and tighten caption"
          git push origin HEAD:fix/feed-header-time-caption
