name: Merchant -- apply unaccepted-order reminders

# Applies supabase/migrations_wynos_merchant_order_reminders_v1.sql: while a
# paid or slip-submitted order waits for the store, its staff get one more
# push every minute (at most 5), and pg_cron runs the job every minute.
# Founder approved 2026-10-06 ("ทำAก่อน ให้เสร็จเลย"). Manual dispatch on
# main only.
# Behaviour test: supabase/tests/wynos_merchant_order_reminders_test.sh.
# ROLLBACK: see the header of the migration file.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-MERCHANT-REMINDERS to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-MERCHANT-REMINDERS'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }
          run_sql "begin;
          $(cat supabase/migrations_wynos_merchant_order_reminders_v1.sql)
          commit;" >/dev/null
          # Definitions, privileges and the cron job only; no order data is read.
          run_sql "select
              to_regprocedure('internal.food_remind_waiting_orders()') is not null as reminder_function,
              has_table_privilege('anon', 'public.food_order_merchant_reminders', 'select') as anon_read_reminders,
              exists (select 1 from cron.job where jobname = 'wynos-merchant-order-reminders' and schedule = '* * * * *' and active) as cron_job;" \
            | tee result.json | jq .
          jq -e '.[0].reminder_function == true and .[0].anon_read_reminders == false and .[0].cron_job == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }
          echo "Merchant order reminders are installed and run every minute."
