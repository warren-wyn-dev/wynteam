name: Food -- apply Merchant sales report fix

# Applies supabase/migrations_wynos_merchant_sales_report_v1.sql: one read-only
# RPC for complete Merchant Home/Reports sales aggregation in Bangkok time.
# Manual dispatch on main only, after explicit Founder production approval.
#
# SAFETY: additive and read only. No table, column, policy or data changes.
# Authorization is checked inside the SECURITY DEFINER function with
# food_has_merchant_access(p_store_id); anon execute is revoked.
# ROLLBACK (Founder, SQL editor):
#   drop function public.merchant_sales_report(uuid);
# The web client has a complete paged fallback, so rollback remains usable.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-MERCHANT-SALES-REPORT to confirm the production migration'
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'APPLY-MERCHANT-SALES-REPORT'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply and verify
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ACCESS_TOKEN secret is missing"; exit 1
          fi
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"
          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code" >&2; cat "$out" >&2; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          run_sql "begin;
          $(cat supabase/migrations_wynos_merchant_sales_report_v1.sql)
          commit;" >/dev/null

          run_sql "select
              (select count(*) from pg_proc where proname = 'merchant_sales_report' and prosecdef and provolatile = 's') as fn_ready,
              has_function_privilege('anon', 'public.merchant_sales_report(uuid)', 'execute') as anon_can_call,
              has_function_privilege('authenticated', 'public.merchant_sales_report(uuid)', 'execute') as members_can_call,
              (select pg_get_functiondef('public.merchant_sales_report(uuid)'::regprocedure)
                 like '%food_has_merchant_access(p_store_id)%') as checks_store_access,
              (select pg_get_functiondef('public.merchant_sales_report(uuid)'::regprocedure)
                 like '%Asia/Bangkok%') as bangkok_time;" \
            | tee result.json | jq .

          jq -e '.[0].fn_ready == 1 and .[0].anon_can_call == false and .[0].members_can_call == true and .[0].checks_store_access == true and .[0].bangkok_time == true' result.json >/dev/null \
            || { echo "::error::Verification failed"; exit 1; }

          echo "Merchant sales report RPC is installed."
