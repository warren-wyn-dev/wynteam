name: Chat -- inspect the reply_to_message_id FK constraint directly

# Two independent PostgREST restarts (NOTIFY pgrst reload, then a real
# config value bump+restore via the Management API) both left
# chat-pgrst-cache-check.yml answering the identical PGRST200 "Could not
# find a relationship between 'messages' and 'messages' using the hint
# 'messages_reply_to_message_id_fkey'". A restart that changes nothing
# twice in a row means "stale cache" is very likely the wrong theory --
# the earlier chat-check confirmed a constraint by that exact name exists
# in pg_constraint, but never checked its contype/conrelid/confrelid, so
# it could be a same-named constraint that isn't actually the self-
# referencing FK PostgREST is looking for. This looks at the real
# constraint definition to settle that.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          echo "=== Every constraint named messages_reply_to_message_id_fkey, anywhere ==="
          run_sql "select conname, contype,
                          conrelid::regclass::text as on_table,
                          confrelid::regclass::text as references_table,
                          pg_get_constraintdef(oid) as definition
                   from pg_constraint
                   where conname = 'messages_reply_to_message_id_fkey';" | jq .
          echo

          echo "=== Every FK on public.messages, whatever it's actually named ==="
          run_sql "select conname, contype,
                          conrelid::regclass::text as on_table,
                          confrelid::regclass::text as references_table,
                          pg_get_constraintdef(oid) as definition
                   from pg_constraint
                   where conrelid = 'public.messages'::regclass and contype = 'f';" | jq .
          echo

          echo "=== Does authenticated/anon have SELECT on public.messages? ==="
          run_sql "select grantee, privilege_type
                   from information_schema.role_table_grants
                   where table_schema='public' and table_name='messages'
                     and grantee in ('authenticated','anon')
                   order by grantee, privilege_type;" | jq .
          echo
          echo "contype should be 'f' and both on_table/references_table should be public.messages."
          echo "If the first query is empty, no constraint has that exact name at all right now"
          echo "(despite the earlier chat-check run finding one -- which would mean something changed"
          echo "the schema between that run and this one). If the second query differs from the first"
          echo "conname, the actual FK exists under a DIFFERENT name than the hint PostgREST is asked"
          echo "for -- ChatRepository's embed hint string is simply wrong, not a cache/restart problem."
