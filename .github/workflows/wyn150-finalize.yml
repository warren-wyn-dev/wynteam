name: One-shot WYN-150 trigger finalizer

on:
  push:
    branches: [fix/beta4-audit-remaining-bugs]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
          fetch-depth: 0

      - name: Make personalization trigger record-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('supabase/migrations_wyn142_personalization_signals.sql'),
              Path('supabase/schema.sql'),
          ]

          old_save = """  elsif tg_table_name = 'saves' and new.content_type = 'drop' then
            perform internal.learn_from_drop('save:' || new.content_id || ':' || new.user_id
              || ':' || new.created_at, new.user_id, new.content_id, 4.0, new.created_at);
          """
          new_save = """  elsif tg_table_name = 'saves' then
            if new.content_type = 'drop' then
              perform internal.learn_from_drop('save:' || new.content_id || ':' || new.user_id
                || ':' || new.created_at, new.user_id, new.content_id, 4.0, new.created_at);
            end if;
          """

          old_report = """  elsif tg_table_name = 'reports' and new.target_type = 'drop' then
            perform internal.learn_from_drop('report:' || new.id, new.reporter_id,
              new.target_id, -12.0, new.created_at);
          """
          new_report = """  elsif tg_table_name = 'reports' then
            if new.target_type = 'drop' then
              perform internal.learn_from_drop('report:' || new.id, new.reporter_id,
                new.target_id, -12.0, new.created_at);
            end if;
          """

          old_block_mute = """  elsif tg_table_name = 'blocks' or tg_table_name = 'mutes' then
            v_event_key := tg_table_name || ':'
              || case when tg_table_name = 'blocks' then new.blocker_id else new.muter_id end
              || ':' || case when tg_table_name = 'blocks' then new.blocked_id else new.muted_id end
              || ':' || new.created_at;
            insert into public.personalization_processed_events(event_key)
            values(v_event_key) on conflict do nothing;
            if found then
              perform internal.apply_affinity_signal(
                case when tg_table_name = 'blocks' then new.blocker_id else new.muter_id end,
                'creator',
                (case when tg_table_name = 'blocks' then new.blocked_id else new.muted_id end)::text,
                case when tg_table_name = 'blocks' then -20.0 else -8.0 end,
                new.created_at);
            end if;
          """
          new_block_mute = """  elsif tg_table_name = 'blocks' then
            v_event_key := 'blocks:' || new.blocker_id || ':' || new.blocked_id
              || ':' || new.created_at;
            insert into public.personalization_processed_events(event_key)
            values(v_event_key) on conflict do nothing;
            if found then
              perform internal.apply_affinity_signal(new.blocker_id, 'creator',
                new.blocked_id::text, -20.0, new.created_at);
            end if;
          elsif tg_table_name = 'mutes' then
            v_event_key := 'mutes:' || new.muter_id || ':' || new.muted_id
              || ':' || new.created_at;
            insert into public.personalization_processed_events(event_key)
            values(v_event_key) on conflict do nothing;
            if found then
              perform internal.apply_affinity_signal(new.muter_id, 'creator',
                new.muted_id::text, -8.0, new.created_at);
            end if;
          """

          for path in paths:
              text = path.read_text(encoding='utf-8')
              for old, new, label in (
                  (old_save, new_save, 'save'),
                  (old_report, new_report, 'report'),
                  (old_block_mute, new_block_mute, 'block/mute'),
              ):
                  if old not in text:
                      raise SystemExit(f'{path}: expected {label} trigger block not found')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          source = Path('supabase/migrations_wyn142_personalization_signals.sql').read_text(encoding='utf-8')
          start_marker = 'create or replace function internal.capture_personalization_signal()'
          end_marker = 'revoke all on function internal.capture_personalization_signal() from public;'
          start = source.index(start_marker)
          end = source.index(end_marker, start) + len(end_marker)
          body = source[start:end]
          migration = Path('supabase/migrations_wyn150_personalization_trigger_record_safety.sql')
          migration.write_text(
              '-- WYN-150 / BUG-004 follow-up: make the polymorphic personalization trigger record-safe.\n'
              '-- PL/pgSQL NEW only has fields from the table that fired the trigger; branch on\n'
              '-- TG_TABLE_NAME before referencing table-specific fields.\n\n'
              + body + '\n',
              encoding='utf-8',
          )
          PY

      - name: Static verification
        run: |
          set -euo pipefail
          ! grep -Fq "tg_table_name = 'saves' and new." supabase/migrations_wyn142_personalization_signals.sql
          ! grep -Fq "tg_table_name = 'reports' and new." supabase/migrations_wyn142_personalization_signals.sql
          ! grep -Fq "tg_table_name = 'blocks' or tg_table_name = 'mutes'" supabase/migrations_wyn142_personalization_signals.sql
          grep -Fq "elsif tg_table_name = 'blocks' then" supabase/migrations_wyn150_personalization_trigger_record_safety.sql
          grep -Fq "elsif tg_table_name = 'mutes' then" supabase/migrations_wyn150_personalization_trigger_record_safety.sql
          python3 supabase/check_schema_ordering.py
          git diff --check

      - name: Commit and push database fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations_wyn142_personalization_signals.sql supabase/migrations_wyn150_personalization_trigger_record_safety.sql supabase/schema.sql
          git commit -m 'fix(db): make personalization trigger record-safe'
          git push origin HEAD:fix/beta4-audit-remaining-bugs
