name: Apply Beta5 Profile V2

on:
  push:
    branches:
      - feature/beta5-profile-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta5-profile-v2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Fix generator target
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_beta5_profile_v2.py')
          text = path.read_text()
          old = """replace_once(
              view_path,
              '                    authorId: widget.userId,\\n                    onRefreshHeader: _reload,',
              '                    authorId: widget.userId,\\n                    isOwnProfile: isOwnProfile,\\n                    onRefreshHeader: _reload,',
          )"""
          new = """text = read(view_path)
          posts_call = '                  ProfileDropGridTab(\\n'
          start = text.find(posts_call)
          if start < 0:
              raise SystemExit('ProfileDropGridTab call not found')
          needle = '                    authorId: widget.userId,\\n                    onRefreshHeader: _reload,'
          position = text.find(needle, start)
          if position < 0:
              raise SystemExit('ProfileDropGridTab refresh hook not found')
          replacement = '                    authorId: widget.userId,\\n                    isOwnProfile: isOwnProfile,\\n                    onRefreshHeader: _reload,'
          text = text[:position] + text[position:].replace(needle, replacement, 1)
          write(view_path, text)"""
          if old not in text:
              raise SystemExit('generator target block not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply Profile V2 patch
        run: python3 .github/scripts/apply_beta5_profile_v2.py

      - name: Resolve generated analyzer and responsive issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          grid = Path('app/lib/features/profile/presentation/widgets/profile_drop_grid_tab.dart')
          text = grid.read_text()
          color_import = "import '../../../../core/design/wyn_colors.dart';\n"
          if color_import not in text:
              anchor = "import '../../../../core/design/wyn_spacing.dart';\n"
              if anchor not in text:
                  raise SystemExit('WynSpacing import anchor missing')
              text = text.replace(anchor, anchor + color_import, 1)
          grid.write_text(text)

          likes = Path('app/test/profile_likes_tab_test.dart')
          text = likes.read_text()
          old = '      onRefreshHeader: () => refreshHeaderCalls++,\n'
          new = '      onRefreshHeader: () async {\n        refreshHeaderCalls++;\n      },\n'
          if old not in text:
              raise SystemExit('ProfileLikes refresh callback anchor missing')
          likes.write_text(text.replace(old, new, 1))

          header = Path('app/lib/features/profile/presentation/widgets/profile_v2_header.dart')
          text = header.read_text()
          stats_pattern = re.compile(
              r"Row\(\s*children: \[\s*_ProfileStat\(\s*count: followingCount,\s*label: 'กำลังติดตาม',\s*onTap: onFollowingTap,\s*\),\s*const SizedBox\(width: WynSpacing\.space5\),\s*_ProfileStat\(\s*count: followerCount,\s*label: 'ผู้ติดตาม',\s*onTap: onFollowersTap,\s*\),\s*\],\s*\),",
              re.S,
          )
          stats_replacement = (
              "Row(\n"
              "  children: [\n"
              "    Expanded(\n"
              "      child: _ProfileStat(\n"
              "        count: followingCount,\n"
              "        label: 'กำลังติดตาม',\n"
              "        onTap: onFollowingTap,\n"
              "      ),\n"
              "    ),\n"
              "    const SizedBox(width: WynSpacing.space2),\n"
              "    Expanded(\n"
              "      child: _ProfileStat(\n"
              "        count: followerCount,\n"
              "        label: 'ผู้ติดตาม',\n"
              "        onTap: onFollowersTap,\n"
              "      ),\n"
              "    ),\n"
              "  ],\n"
              "),"
          )
          text, count = stats_pattern.subn(stats_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'ProfileV2 stat row matches={count}')
          label_pattern = re.compile(
              r"Text\(\s*label,\s*style: Theme\.of\(context\)\.textTheme\.bodyMedium\?\.copyWith\(\s*color: WynColors\.mutedNeutral,\s*\),\s*\),",
              re.S,
          )
          label_replacement = (
              "Flexible(\n"
              "  child: Text(\n"
              "    label,\n"
              "    maxLines: 1,\n"
              "    overflow: TextOverflow.ellipsis,\n"
              "    style: Theme.of(context).textTheme.bodyMedium?.copyWith(\n"
              "      color: WynColors.mutedNeutral,\n"
              "    ),\n"
              "  ),\n"
              "),"
          )
          text, count = label_pattern.subn(label_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'ProfileV2 stat label matches={count}')
          header.write_text(text)

          view_test = Path('app/test/view_profile_screen_test.dart')
          text = view_test.read_text()
          dangling = '    expect(followersX, lessThan(buttonRect.right));\n'
          if dangling not in text:
              raise SystemExit('buttonRect dangling assertion missing')
          text = text.replace(
              dangling,
              '    expect(followersX, greaterThan(followingX));\n',
              1,
          )
          obsolete = re.compile(
              r"  testWidgets\(\n      'Beta4 §1: the Edit Profile button spans the identity column, '[\s\S]*?^  \}\);\n\n(?=  testWidgets\('tapping the Followers count)",
              re.M,
          )
          replacement = (
              "  testWidgets('Beta5: own profile exposes compact Edit Profile in the top bar',\n"
              "      (tester) async {\n"
              "    await tester.pumpWidget(buildProfile(\n"
              "      profileRepository: ownProfileRepo,\n"
              "      followRepository: ownFollowRepo,\n"
              "      userId: 'me',\n"
              "    ));\n"
              "    await tester.pumpAndSettle();\n\n"
              "    expect(find.byKey(const Key('profile_edit_button')), findsOneWidget);\n"
              "    expect(find.widgetWithText(OutlinedButton, 'แก้ไขโปรไฟล์'), findsNothing);\n"
              "  });\n\n"
          )
          text, count = obsolete.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'obsolete Beta4 edit-button test matches={count}')
          view_test.write_text(text)

          view = Path('app/lib/features/profile/presentation/view_profile_screen.dart')
          text = view.read_text()
          edit_anchor = "                  icon: const Icon(Icons.edit_outlined),\n"
          if edit_anchor not in text:
              raise SystemExit('compact edit icon anchor missing')
          text = text.replace(
              edit_anchor,
              "                  key: const Key('profile_edit_button'),\n" + edit_anchor,
              1,
          )
          text, count = re.subn(
              r'class _FollowCountTarget[\s\S]*?const _bioTone = WynColors\.inkSoft;\n\n',
              '',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'old profile stat helper block matches={count}')
          if 'compactCountLabel(' not in text:
              text = text.replace("import '../../../core/text_utils.dart';\n", '', 1)
          view.write_text(text)
          PY

      - name: Format Dart
        run: |
          dart format \
            app/lib/features/profile/data/profile.dart \
            app/lib/features/profile/data/profile_repository.dart \
            app/lib/features/drop/data/drop_repository.dart \
            app/lib/features/profile/presentation/view_profile_screen.dart \
            app/lib/features/profile/presentation/profile_cover_editor_screen.dart \
            app/lib/features/profile/presentation/widgets/profile_v2_header.dart \
            app/lib/features/profile/presentation/widgets/profile_pinned_drops_sheet.dart \
            app/lib/features/profile/presentation/widgets/profile_drop_grid_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_redrops_tab.dart \
            app/lib/features/profile/presentation/widgets/profile_likes_tab.dart \
            app/test/support/recording_drop_repository.dart \
            app/test/view_profile_screen_test.dart \
            app/test/profile_likes_tab_test.dart \
            app/test/qa_wyn110_profile_scroll_header_test.dart \
            app/test/beta5_profile_v2_test.dart \
            app/test/audit_remaining_regression_test.dart

      - name: Check schema ordering
        run: python3 supabase/check_schema_ordering.py

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-pub

      - name: Targeted Profile V2 tests
        working-directory: app
        run: |
          flutter test --no-pub \
            test/beta5_profile_v2_test.dart \
            test/view_profile_screen_test.dart \
            test/profile_likes_tab_test.dart \
            test/qa_wyn110_profile_scroll_header_test.dart

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "feat(profile): implement Beta5 Profile V2"
          git push origin HEAD:feature/beta5-profile-v2
