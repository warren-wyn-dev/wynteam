name: Finish and gate all-page web system text migration

on:
  push:
    branches: [feat/web-system-text-all]
    paths: [.github/workflows/cleanup-gate-web-system-text-all.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/web-system-text-all
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1

      - name: Resolve packages
        working-directory: app
        run: flutter pub get

      - name: Migrate remaining framework tooltips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('app/lib')
          owners = ('IconButton', 'FloatingActionButton', 'PopupMenuButton')
          import_line = "import 'package:wyn/core/typography/browser_system_text.dart';"

          def mask_code(source):
              mask = bytearray(b'1' * len(source))
              i = 0; quote = None; triple = False; escape = False
              line = False; block = False
              while i < len(source):
                  ch = source[i]; pair = source[i:i+2]
                  if line:
                      mask[i] = 0
                      if ch == '\n': line = False
                      i += 1; continue
                  if block:
                      mask[i] = 0
                      if pair == '*/': mask[i:i+2] = b'00'; block = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      mask[i] = 0
                      if escape: escape = False; i += 1; continue
                      if ch == '\\': escape = True; i += 1; continue
                      if triple and source.startswith(quote * 3, i): mask[i:i+3] = b'000'; quote = None; triple = False; i += 3; continue
                      if not triple and ch == quote: quote = None; i += 1; continue
                      i += 1; continue
                  if pair == '//': mask[i:i+2] = b'00'; line = True; i += 2; continue
                  if pair == '/*': mask[i:i+2] = b'00'; block = True; i += 2; continue
                  if source.startswith("'''", i): mask[i:i+3] = b'000'; quote = "'"; triple = True; i += 3; continue
                  if source.startswith('"""', i): mask[i:i+3] = b'000'; quote = '"'; triple = True; i += 3; continue
                  if ch in "'\"": mask[i] = 0; quote = ch; i += 1; continue
                  i += 1
              return mask

          def match_close(source, open_index):
              depth = 0; i = open_index
              quote = None; triple = False; escape = False; line = False; block = False
              while i < len(source):
                  ch = source[i]; pair = source[i:i+2]
                  if line:
                      if ch == '\n': line = False
                      i += 1; continue
                  if block:
                      if pair == '*/': block = False; i += 2; continue
                      i += 1; continue
                  if quote:
                      if escape: escape = False; i += 1; continue
                      if ch == '\\': escape = True; i += 1; continue
                      if triple and source.startswith(quote * 3, i): quote = None; triple = False; i += 3; continue
                      if not triple and ch == quote: quote = None; i += 1; continue
                      i += 1; continue
                  if pair == '//': line = True; i += 2; continue
                  if pair == '/*': block = True; i += 2; continue
                  if source.startswith("'''", i): quote = "'"; triple = True; i += 3; continue
                  if source.startswith('"""', i): quote = '"'; triple = True; i += 3; continue
                  if ch in "'\"": quote = ch; i += 1; continue
                  if ch == '(': depth += 1
                  elif ch == ')':
                      depth -= 1
                      if depth == 0: return i
                  i += 1
              return None

          def find_calls(source, token):
              mask = mask_code(source); out = []; i = 0
              while i < len(source):
                  idx = source.find(token, i)
                  if idx < 0: break
                  if not mask[idx] or (idx and (source[idx-1].isalnum() or source[idx-1] == '_')):
                      i = idx + len(token); continue
                  j = idx + len(token)
                  if j < len(source) and source[j] == '.':
                      j += 1
                      while j < len(source) and (source[j].isalnum() or source[j] == '_'): j += 1
                  elif j < len(source) and (source[j].isalnum() or source[j] in '_.'):
                      i = idx + len(token); continue
                  while j < len(source) and source[j].isspace(): j += 1
                  if j < len(source) and source[j] == '<':
                      depth = 0
                      while j < len(source):
                          if source[j] == '<': depth += 1
                          elif source[j] == '>':
                              depth -= 1
                              if depth == 0: j += 1; break
                          j += 1
                      while j < len(source) and source[j].isspace(): j += 1
                  if j >= len(source) or source[j] != '(':
                      i = idx + len(token); continue
                  close = match_close(source, j)
                  if close is None: break
                  out.append((idx, j, close))
                  i = close + 1
              return out

          def split_args(body):
              parts=[]; start=0; i=0; par=br=cur=0
              quote=None; triple=False; escape=False; line=False; block=False
              while i < len(body):
                  ch=body[i]; pair=body[i:i+2]
                  if line:
                      if ch=='\n': line=False
                      i+=1; continue
                  if block:
                      if pair=='*/': block=False; i+=2; continue
                      i+=1; continue
                  if quote:
                      if escape: escape=False; i+=1; continue
                      if ch=='\\': escape=True; i+=1; continue
                      if triple and body.startswith(quote*3,i): quote=None; triple=False; i+=3; continue
                      if not triple and ch==quote: quote=None; i+=1; continue
                      i+=1; continue
                  if pair=='//': line=True; i+=2; continue
                  if pair=='/*': block=True; i+=2; continue
                  if body.startswith("'''",i): quote="'"; triple=True; i+=3; continue
                  if body.startswith('"""',i): quote='"'; triple=True; i+=3; continue
                  if ch in "'\"": quote=ch; i+=1; continue
                  if ch=='(': par+=1
                  elif ch==')': par-=1
                  elif ch=='[': br+=1
                  elif ch==']': br-=1
                  elif ch=='{': cur+=1
                  elif ch=='}': cur-=1
                  elif ch==',' and par==0 and br==0 and cur==0:
                      parts.append(body[start:i]); start=i+1
                  i+=1
              parts.append(body[start:]); return parts

          changed=[]; migrated=0; removed_null=0
          for path in sorted(root.rglob('*.dart')):
              if path.name in {'browser_system_text_stub.dart', 'browser_system_text_web.dart'}:
                  continue
              source=path.read_text(); replacements=[]
              for owner in owners:
                  for idx, open_i, close_i in find_calls(source, owner):
                      body=source[open_i+1:close_i]
                      parts=split_args(body)
                      tip_idx=None; message=None
                      for n, part in enumerate(parts):
                          match=re.match(r'\s*tooltip\s*:\s*(.*)\s*$', part, re.S)
                          if match:
                              tip_idx=n; message=match.group(1).strip(); break
                      if tip_idx is None or not message: continue
                      remaining=[part for n, part in enumerate(parts) if n != tip_idx]
                      child=source[idx:open_i+1] + ','.join(remaining) + ')'
                      if message == 'null':
                          replacement=child
                          removed_null += 1
                      else:
                          replacement=f'BrowserSystemTooltip(message: {message}, child: {child})'
                          migrated += 1
                      replacements.append((idx, close_i + 1, replacement))
              if not replacements: continue
              for start,end,value in sorted(replacements,key=lambda item:item[0],reverse=True):
                  source=source[:start] + value + source[end:]
              if import_line not in source and migrated:
                  first_import=source.find('import ')
                  source=(source[:first_import] + import_line + '\n' + source[first_import:]) if first_import >= 0 else import_line + '\n' + source
              path.write_text(source); changed.append(str(path))

          Path('/tmp/system-tooltip-files.txt').write_text('\n'.join(changed) + ('\n' if changed else ''))
          print(f'Migrated {migrated} real tooltips; removed {removed_null} obsolete tooltip:null arguments across {len(changed)} files.')
          PY

          if [ -s /tmp/system-tooltip-files.txt ]; then
            while IFS= read -r file; do dart format "$file"; done < /tmp/system-tooltip-files.txt
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/lib
          if ! git diff --cached --quiet; then
            git commit -m 'fix(web): finish system tooltip migration'
            git push origin HEAD:feat/web-system-text-all
          fi

      - name: Verify zero framework-owned tooltip surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, sys
          failures=[]
          owners=('IconButton','FloatingActionButton','PopupMenuButton')
          for path in Path('app/lib').rglob('*.dart'):
              if path.name in {'browser_system_text_stub.dart','browser_system_text_web.dart'}: continue
              text=path.read_text()
              for owner in owners:
                  # After the parser-backed migration above, any remaining
                  # tooltip named argument near one of these constructors is a
                  # release blocker. Comments are stripped before this check.
                  stripped=re.sub(r'/\*.*?\*/|//[^\n]*', '', text, flags=re.S)
                  if re.search(rf'\b{owner}(?:\.[A-Za-z_]\w*)?(?:<[^>]+>)?\s*\([^)]*\btooltip\s*:', stripped, re.S):
                      failures.append(f'{path}: {owner} tooltip remains')
          if failures:
              print('\n'.join(failures)); sys.exit(1)
          print('Tooltip gate passed: 0 framework-owned tooltip surfaces remain.')
          PY

      - name: Full Flutter QA
        working-directory: app
        run: |
          flutter analyze
          flutter test
          flutter build web --release
