name: Ops apply remaining Beta4 audit fixes

on:
  push:
    branches:
      - fix/beta4-audit-remaining-bugs
    paths:
      - .github/workflows/ops-apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/beta4-audit-remaining-bugs
      - name: Apply audited fixes
        run: |
          python3 .wyn/ops/apply_remaining_audit_fixes.py
          chmod +x supabase/tests/wyn_149_location_rate_limit_test.sh
          git diff --check
          python3 supabase/check_schema_ordering.py
          bash -n supabase/tests/wyn_149_location_rate_limit_test.sh
      - name: Commit fixes
        run: |
          git config user.name "warren-wyn-dev"
          git config user.email "warren.wyn.dev@gmail.com"
          git add app supabase .github/workflows/ci.yml
          git commit -m "fix: close remaining Beta4 audit findings"
          git push origin HEAD:fix/beta4-audit-remaining-bugs
