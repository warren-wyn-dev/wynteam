name: Beta5 branch repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/beta5-ci-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beta5-profile-v2
          fetch-depth: 0

      - name: Apply targeted Beta5 CI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected_min=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < expected_min:
                  raise SystemExit(f"Expected at least {expected_min} occurrence(s) in {path}, found {count}: {old!r}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          p = Path('app/test/settings_screen_test.dart')
          text = p.read_text()
          text = text.replace("V1.0.0 Beta4", "V1.0.0 Beta5")
          text = text.replace("V1.0.0 Beta5 [พัฒนาอยู่]", "V1.0.0 Beta5")
          p.write_text(text)

          replace(
              'app/test/drop_aspect_ratio_test.dart',
              'source.contains("await _client.rpc(\'publish_drop\'")',
              '''RegExp(\n        r"await\\s+_client\\s*\\.rpc\\(\\s*'publish_drop'",\n        multiLine: true,\n      ).hasMatch(source)''',
          )

          p = Path('app/test/view_profile_screen_scroll_test.dart')
          text = p.read_text()
          text = text.replace(
              "expect(find.text('แก้ไขโปรไฟล์'), findsOneWidget);",
              "expect(find.byKey(const Key('profile_edit_button')), findsOneWidget);",
              1,
          )
          text = text.replace(
              "expect(find.text('แก้ไขโปรไฟล์'), findsNothing);",
              "expect(find.byKey(const Key('profile_v2_compact_identity')), findsOneWidget);",
              1,
          )
          text = text.replace(
              "expect(find.text('แก้ไขโปรไฟล์'), findsNothing);",
              "expect(find.byKey(const Key('profile_v2_compact_identity')), findsOneWidget);",
              1,
          )
          text = text.replace(
              "expect(find.text('แก้ไขโปรไฟล์'), findsOneWidget);",
              "expect(find.byKey(const Key('profile_v2_compact_identity')), findsNothing);\n    expect(find.byKey(const Key('profile_edit_button')), findsOneWidget);",
              1,
          )
          if "find.text('แก้ไขโปรไฟล์')" in text:
              raise SystemExit('stale Edit Profile text finder remains in scroll test')
          p.write_text(text)

          replace(
              'app/lib/features/profile/presentation/view_profile_screen.dart',
              'setState(() => _loadFuture = next);',
              '''setState(() {\n      _loadFuture = next;\n    });''',
          )

          p = Path('app/lib/features/profile/presentation/profile_cover_editor_screen.dart')
          text = p.read_text()
          if 'Colors.red' in text:
              p.write_text(text.replace('Colors.red', 'WynColors.iconLikeActive'))
          PY

      - name: Validate patch
        run: git diff --check && git diff --stat && git diff

      - name: Commit fixes to feature branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/test/settings_screen_test.dart \
                  app/test/drop_aspect_ratio_test.dart \
                  app/test/view_profile_screen_scroll_test.dart \
                  app/lib/features/profile/presentation/view_profile_screen.dart \
                  app/lib/features/profile/presentation/profile_cover_editor_screen.dart
          git commit -m "fix(beta5): repair Flutter CI regressions"
          git push origin HEAD:feature/beta5-profile-v2
