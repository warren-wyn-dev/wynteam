name: Patch Home header follow button

on:
  push:
    branches: [fix/home-header-follow-button]
    paths:
      - .github/workflows/patch-home-header-follow.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-header-follow-button
          fetch-depth: 0

      - name: Apply approved Home header design
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Reuse the real 3-state Follow system inside HomeDropCard.
          path = 'app/lib/features/home/presentation/widgets/home_drop_card.dart'
          replace_once(path,
          """import '../../../drop/presentation/drop_detail_screen.dart' show dropShareLink;
          import '../../../profile/presentation/widgets/avatar_circle.dart';
          """,
          """import '../../../drop/presentation/drop_detail_screen.dart' show dropShareLink;
          import '../../../follow/data/follow_repository.dart';
          import '../../../follow/data/follow_request_repository.dart';
          import '../../../follow/presentation/widgets/follow_action_button.dart';
          import '../../../profile/data/profile.dart';
          import '../../../profile/presentation/widgets/avatar_circle.dart';
          """)

          replace_once(path,
          """    this.onHide,
              this.showViewCount = true,
          """,
          """    this.onHide,
              this.authorProfile,
              this.followRepository,
              this.followRequestRepository,
              this.showHomeFollowButton = false,
              this.showViewCount = true,
          """)

          replace_once(path,
          """  final VoidCallback? onHide;

            /// WYN-088""",
          """  final VoidCallback? onHide;

            /// Home-only author profile and Follow dependencies. They are optional so
            /// Profile/Search/Hashtag surfaces that reuse this card stay byte-for-byte
            /// unchanged unless their caller explicitly opts into the header action.
            final Profile? authorProfile;
            final FollowRepository? followRepository;
            final FollowRequestRepository? followRequestRepository;
            final bool showHomeFollowButton;

            /// WYN-088""")

          replace_once(path,
          """  bool get _isOwnDrop =>
                item.authorId == Supabase.instance.client.auth.currentUser!.id;
          """,
          """  bool get _isOwnDrop =>
                item.authorId == Supabase.instance.client.auth.currentUser!.id;

            bool get _canShowHomeFollowButton =>
                showHomeFollowButton &&
                !_isOwnDrop &&
                authorProfile != null &&
                followRepository != null &&
                followRequestRepository != null;
          """)

          replace_once(path,
          """                              // WYNOSHomeSpec.md 4.6: always shown now,
          """,
          """                              // Founder-approved Home mockup: a compact black
                                      // Follow pill sits on the author row immediately before
                                      // the overflow menu. FollowActionButton owns the real
                                      // public/private/request logic; followed accounts hide
                                      // the pill, matching Instagram's feed behavior.
                                      if (_canShowHomeFollowButton) ...[
                                        const SizedBox(width: WynSpacing.space1),
                                        FollowActionButton(
                                          key: ValueKey<String>(
                                            'home_follow_${item.authorId}',
                                          ),
                                          profile: authorProfile!,
                                          followRepository: followRepository!,
                                          followRequestRepository:
                                              followRequestRepository!,
                                          compact: true,
                                          filled: true,
                                          headerCompact: true,
                                          hideWhenFollowing: true,
                                        ),
                                        const SizedBox(width: WynSpacing.space1),
                                      ],
                                      // WYNOSHomeSpec.md 4.6: always shown now,
          """)

          # 2) Add a true header-sized style without changing the existing
          # compact+filled recommendation button elsewhere in the product.
          path = 'app/lib/features/follow/presentation/widgets/follow_action_button.dart'
          replace_once(path,
          """    this.compact = false,
              this.filled = false,
          """,
          """    this.compact = false,
              this.filled = false,
              this.headerCompact = false,
              this.hideWhenFollowing = false,
          """)

          replace_once(path,
          """  final bool filled;

            @override
          """,
          """  final bool filled;

            /// Extra-small filled pill for an inline post header. Kept separate
            /// from [compact] so existing recommendation surfaces retain their
            /// current 36px button exactly.
            final bool headerCompact;

            /// Instagram-like feed behavior: once the viewer already follows the
            /// author, there is no redundant follow-state pill beside every post.
            final bool hideWhenFollowing;

            @override
          """)

          replace_once(path,
          """  Widget build(BuildContext context) {
                if (_isFollowing == null) return const SizedBox.shrink();

                final primary""",
          """  Widget build(BuildContext context) {
                if (_isFollowing == null ||
                    (widget.hideWhenFollowing && _isFollowing == true)) {
                  return const SizedBox.shrink();
                }

                final primary""")

          replace_once(path,
          """          minimumSize: Size(widget.compact ? 84 : 0, widget.compact ? 36 : 44),
                    padding: EdgeInsets.symmetric(
                      horizontal: widget.compact ? 16 : 20,
                    ),
                    shape: const StadiumBorder(),
                    textStyle: widget.compact
                        ? Theme.of(context).textTheme.labelMedium
                        : Theme.of(context).textTheme.labelLarge,
                    elevation: 0,
          """,
          """          minimumSize: widget.headerCompact
                      ? const Size(0, 28)
                      : Size(widget.compact ? 84 : 0, widget.compact ? 36 : 44),
                    padding: EdgeInsets.symmetric(
                      horizontal: widget.headerCompact
                          ? 12
                          : (widget.compact ? 16 : 20),
                    ),
                    shape: const StadiumBorder(),
                    tapTargetSize: widget.headerCompact
                        ? MaterialTapTargetSize.shrinkWrap
                        : null,
                    textStyle: widget.headerCompact
                        ? Theme.of(context).textTheme.labelSmall?.copyWith(
                            fontWeight: FontWeight.w700,
                          )
                        : (widget.compact
                            ? Theme.of(context).textTheme.labelMedium
                            : Theme.of(context).textTheme.labelLarge),
                    elevation: 0,
          """)

          # 3) Batch-hydrate author Profiles with each feed page so every card
          # has is_private available without one profile request per post.
          path = 'app/lib/features/home/presentation/widgets/mode_feed_page.dart'
          replace_once(path,
          """import '../../../pop/data/pop_repository.dart';
          import '../../../profile/data/profile_repository.dart';
          """,
          """import '../../../pop/data/pop_repository.dart';
          import '../../../profile/data/profile.dart';
          import '../../../profile/data/profile_repository.dart';
          """)

          replace_once(path,
          """  final List<HomeFeedItem> _items = [];

            /// Keys of every row""",
          """  final List<HomeFeedItem> _items = [];
            final Map<String, Profile> _authorProfiles = {};

            /// Keys of every row""")

          replace_once(path,
          """  Future<void> _loadInitial() async {
          """,
          """  Future<Map<String, Profile>> _fetchAuthorProfiles(
                List<HomeFeedItem> items,
              ) async {
                final currentUserId = Supabase.instance.client.auth.currentUser?.id;
                final ids = <String>{
                  for (final item in items)
                    if (item.authorId != currentUserId) item.authorId,
                }.toList();
                if (ids.isEmpty) return const {};
                try {
                  final profiles = await widget.profileRepository.fetchProfilesByIds(ids);
                  return {for (final profile in profiles) profile.id: profile};
                } catch (_) {
                  // The feed itself is more important than this secondary action.
                  // If profile hydration fails, cards render normally without the
                  // Follow pill and the next refresh gets another chance.
                  return const {};
                }
              }

              Future<void> _loadInitial() async {
          """)

          replace_once(path,
          """      final items = await _fetchPage(0);
                if (!mounted) return;
                setState(() {
                  _items
                    ..clear()
                    ..addAll(items);
          """,
          """      final items = await _fetchPage(0);
                final authorProfiles = await _fetchAuthorProfiles(items);
                if (!mounted) return;
                setState(() {
                  _items
                    ..clear()
                    ..addAll(items);
                  _authorProfiles
                    ..clear()
                    ..addAll(authorProfiles);
          """)

          replace_once(path,
          """      final items = await _fetchPage(nextPage);
                if (!mounted) return;
                setState(() {
          """,
          """      final items = await _fetchPage(nextPage);
                final authorProfiles = await _fetchAuthorProfiles(items);
                if (!mounted) return;
                setState(() {
                  _authorProfiles.addAll(authorProfiles);
          """)

          replace_once(path,
          """              onHide: () => _hideItem(index),
                        // WYN-088""",
          """              onHide: () => _hideItem(index),
                        authorProfile: _authorProfiles[item.authorId],
                        followRepository: widget.followRepository,
                        followRequestRepository: _followRequestRepository,
                        showHomeFollowButton: true,
                        // WYN-088""")
          PY

      - name: Verify formatting
        working-directory: app
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/features/home/presentation/widgets/home_drop_card.dart \
            lib/features/home/presentation/widgets/mode_feed_page.dart \
            lib/features/follow/presentation/widgets/follow_action_button.dart || \
          dart format \
            lib/features/home/presentation/widgets/home_drop_card.dart \
            lib/features/home/presentation/widgets/mode_feed_page.dart \
            lib/features/follow/presentation/widgets/follow_action_button.dart

      - name: Commit patch to branch
        run: |
          git config user.name "warren-wyn-dev"
          git config user.email "warren.wyn.dev@gmail.com"
          git add app/lib/features/home/presentation/widgets/home_drop_card.dart \
                  app/lib/features/home/presentation/widgets/mode_feed_page.dart \
                  app/lib/features/follow/presentation/widgets/follow_action_button.dart
          git commit -m "feat(home): add compact follow button to post header"
          git push origin HEAD:fix/home-header-follow-button
