name: Stop Beta2 Auto Deploy

on:
  push:
    branches:
      - feat/admin-merchant-applications
    paths:
      - '.github/workflows/stop-beta2-auto-deploy.yml'

permissions:
  contents: read

jobs:
  disconnect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Disconnect Beta2 staging from Git auto-deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is empty"; exit 1; }

          npx --yes vercel@latest link --yes \
            --project wynos-web-beta2-staging \
            --scope warren14 \
            --token="$VERCEL_TOKEN"

          npx --yes vercel@latest git disconnect --yes \
            --scope warren14 \
            --token="$VERCEL_TOKEN"
