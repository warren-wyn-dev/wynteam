name: Remove Beta2 Staging

on:
  push:
    branches:
      - feat/admin-merchant-applications
    paths:
      - '.github/workflows/stop-beta2-auto-deploy.yml'

permissions:
  contents: read

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Permanently remove WYNOS Web Beta2 staging project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          VERCEL_TOKEN=$(printf '%s' "$VERCEL_TOKEN" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          test -n "$VERCEL_TOKEN" || { echo "::error::VERCEL_TOKEN is empty"; exit 1; }

          body_file=$(mktemp)
          status=$(curl --silent --show-error \
            --output "$body_file" \
            --write-out "%{http_code}" \
            --request DELETE \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_70GIbp0o056AOPsVUAie9CROED7r?teamId=team_Kamt1PUT5XKn9MWrF404re1w")

          if [ "$status" = "200" ] || [ "$status" = "204" ] || [ "$status" = "404" ]; then
            echo "Beta2 staging removed (HTTP $status)."
            cat "$body_file"
            exit 0
          fi

          echo "::error::Failed to remove Beta2 staging (HTTP $status)"
          cat "$body_file"
          exit 1
