name: Web Beta1 Auth Password Policy

on:
  pull_request:
    paths:
      - '.github/scripts/sync-auth-password-policy.sh'
      - '.github/scripts/test-auth-password-policy.sh'
      - '.github/scripts/check-auth-email-readiness.sh'
      - '.github/workflows/web-beta1-auth-password-policy.yml'
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync-auth-password-policy.sh'
      - '.github/scripts/test-auth-password-policy.sh'
      - '.github/scripts/check-auth-email-readiness.sh'
      - '.github/workflows/web-beta1-auth-password-policy.yml'
  workflow_run:
    workflows: ['WYN-158 Production Deploy']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wynos-auth-policy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Auth rollout script and offline regressions
        run: |
          bash -n .github/scripts/sync-auth-password-policy.sh
          bash -n .github/scripts/check-auth-email-readiness.sh
          bash .github/scripts/test-auth-password-policy.sh

  apply:
    needs: validate
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce password policy and allowlist signup/recovery redirects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash .github/scripts/sync-auth-password-policy.sh
      - name: Audit public Auth email readiness without exposing SMTP secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bash .github/scripts/check-auth-email-readiness.sh
