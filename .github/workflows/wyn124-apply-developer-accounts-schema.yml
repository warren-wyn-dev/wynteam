name: WYN-124 -- apply developer accounts schema (table, function, RLS)

# schema.sql changes don't auto-apply to production (this project's own
# established finding -- see chat-enable-conversations-realtime.yml's/
# wyn122-apply-chat-lockdown-schema.yml's own comment). This applies
# WYN-124's developer-account allowlist mechanism: the
# `developer_accounts` table (RLS enabled, zero policies) and the
# `is_developer_account()` function, with EXECUTE explicitly granted to
# `authenticated` (the exact grant WYN-122 Round 1's QA finding proved
# is required, not optional).
#
# Every statement here is copy-paste identical to the corresponding
# section of supabase/schema.sql (the WYN-124 section at the end of the
# file) -- if the two ever drift, schema.sql is wrong, not this file
# (this file is what actually ran), mirroring
# wyn122-apply-chat-lockdown-schema.yml's own convention.
#
# Deliberately does NOT add anyone to the allowlist -- a fresh table is
# empty, matching "no developer accounts yet" as the correct starting
# state (fail-closed for 100% of users until Founder decides
# otherwise). Use wyn124-manage-developer-accounts.yml (action: add) to
# add the first developer account (e.g. Founder's own username) after
# this has run once.
#
# Safe to run more than once (CREATE TABLE IF NOT EXISTS, CREATE OR
# REPLACE FUNCTION, an idempotent GRANT) -- mirrors every other one-off
# migration workflow in this project's convention
# (wyn122-apply-chat-lockdown-schema.yml, setup-database-webhook.yml).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Run
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          SUPABASE_URL=$(clean "$SUPABASE_URL")
          SUPABASE_ACCESS_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          PROJECT_REF=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          API="https://api.supabase.com/v1/projects/$PROJECT_REF/database/query"

          run_sql() {
            local body out code
            body=$(jq -n --arg q "$1" '{query: $q}')
            out=$(mktemp)
            code=$(curl -sS -o "$out" -w '%{http_code}' -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" -d "$body")
            if [ "$code" != "200" ] && [ "$code" != "201" ]; then
              echo "::error::HTTP $code"; cat "$out"; rm -f "$out"; return 1
            fi
            cat "$out"; rm -f "$out"
          }

          echo "=== 1. Create developer_accounts (idempotent) ==="
          run_sql "create table if not exists public.developer_accounts (
                     user_id uuid primary key references public.profiles (id) on delete cascade,
                     label text,
                     added_at timestamptz not null default now()
                   );
                   alter table public.developer_accounts enable row level security;" >/dev/null
          echo "Done."

          echo "=== 2. Create public.is_developer_account() + grant execute ==="
          run_sql "create or replace function public.is_developer_account()
                   returns boolean
                   language sql
                   security definer
                   set search_path = public
                   stable
                   as \$fn\$
                     select coalesce(
                       exists (
                         select 1 from public.developer_accounts where user_id = auth.uid()
                       ),
                       false
                     );
                   \$fn\$;

                   grant execute on function public.is_developer_account() to authenticated;" >/dev/null
          echo "Done."

          echo "=== 3. Verify: table exists (row count), grant is present ==="
          run_sql "select count(*) as developer_account_count from public.developer_accounts;" | jq .
          run_sql "select has_function_privilege('authenticated', 'public.is_developer_account()', 'EXECUTE') as authenticated_can_execute;" | jq .
