name: Dispatch production deploy for iOS image fix once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-web-ios-image-fix-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-web.yml/dispatches" \
            -f ref=main
