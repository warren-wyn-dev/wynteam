name: WYNOS Web Beta 2 Baseline Finalize

on:
  push:
    branches:
      - web-beta2
    paths:
      - '.github/workflows/web-beta2-baseline-finalize.yml'

permissions:
  contents: read

concurrency:
  group: wynos-web-beta2-baseline-finalize
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout exact Beta 2 commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fail closed unless staging is isolated
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          PRODUCTION_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_url=$(clean "$STAGING_SUPABASE_URL"); stage_url=${stage_url%/}
          prod_url=$(clean "$PRODUCTION_SUPABASE_URL"); prod_url=${prod_url%/}
          stage_project=$(clean "$STAGING_VERCEL_PROJECT_ID")
          prod_project=$(clean "$PRODUCTION_VERCEL_PROJECT_ID")
          test "$GITHUB_REF" = "refs/heads/web-beta2"
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"
          test "$prod_url" = "https://kqokpocajhfbidcxpvhh.supabase.co"
          test "$stage_url" != "$prod_url"
          test "$stage_project" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$prod_project" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$stage_project" != "$prod_project"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify baseline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check

      - name: Re-run the only failed full-suite test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx playwright install --with-deps webkit
          npx playwright test tests/browser/home-scroll-chrome.spec.ts --project=webkit-iphone --retries=2

      - name: Deploy exact tested commit to dedicated Beta 2 Staging preview
        id: deploy
        working-directory: .
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          PRODUCTION_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_VAPID_KEY: ${{ secrets.FIREBASE_VAPID_KEY }}
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          stage_url=$(clean "$STAGING_SUPABASE_URL"); stage_url=${stage_url%/}
          stage_project=$(clean "$STAGING_VERCEL_PROJECT_ID")
          prod_project=$(clean "$PRODUCTION_VERCEL_PROJECT_ID")
          org_id=$(clean "$VERCEL_ORG_ID")
          token=$(clean "$VERCEL_TOKEN")
          test "$stage_project" = "prj_70GIbp0o056AOPsVUAie9CROED7r"
          test "$prod_project" = "prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a"
          test "$stage_project" != "$prod_project"
          test "$stage_url" = "https://yydgdapzlrjmlrjgijkj.supabase.co"

          firebase_args=()
          append_public_env() {
            local name="$1" value
            value=$(clean "$2")
            test -n "$value" || { echo "::error::Missing $name"; exit 1; }
            firebase_args+=(--build-env "$name=$value" --env "$name=$value")
          }
          append_public_env NEXT_PUBLIC_FIREBASE_API_KEY "$FIREBASE_WEB_API_KEY"
          append_public_env NEXT_PUBLIC_FIREBASE_APP_ID "$FIREBASE_WEB_APP_ID"
          append_public_env NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID "$FIREBASE_MESSAGING_SENDER_ID"
          append_public_env NEXT_PUBLIC_FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          append_public_env NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN "$FIREBASE_AUTH_DOMAIN"
          append_public_env NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET "$FIREBASE_STORAGE_BUCKET"
          append_public_env NEXT_PUBLIC_FIREBASE_VAPID_KEY "$FIREBASE_VAPID_KEY"

          export VERCEL_PROJECT_ID="$stage_project"
          export VERCEL_ORG_ID="$org_id"
          url=$(npx --yes vercel@60.1.3 deploy --yes \
            --token="$token" \
            --build-env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --build-env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            --env NEXT_PUBLIC_SUPABASE_URL="$stage_url" \
            --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$STAGING_SUPABASE_PUBLISHABLE_KEY" \
            --env VERCEL_PREVIEW_FEEDBACK_ENABLED=0 \
            "${firebase_args[@]}" | tail -n 1)
          case "$url" in https://*.vercel.app) ;; *) echo "::error::Unexpected deployment URL"; exit 1 ;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Beta 2 baseline staging preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Require Vercel Authentication
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          headers=$(mktemp)
          status=$(curl --silent --show-error --max-time 30 --dump-header "$headers" --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL/")
          case "$status" in
            302|303|307|308) grep -Eiq '^location:[[:space:]]*https://vercel[.]com/sso-api' "$headers" ;;
            *) echo "::error::Expected protected Staging preview"; exit 1 ;;
          esac
          rm -f "$headers"

      - name: Create temporary QA bypass
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          bypass=$(openssl rand -hex 16)
          echo "::add-mask::$bypass"
          echo "VERCEL_AUTOMATION_BYPASS_SECRET=$bypass" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"generate\":{\"secret\":\"$bypass\",\"note\":\"WYNOS Web Beta 2 baseline finalize $GITHUB_RUN_ID\"}}" >/dev/null

      - name: Hosted route and environment smoke
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          routes=(/ /search /notifications /chat /settings /profile/me /clubs /bookmarks /login /signup/step-1)
          for route in "${routes[@]}"; do
            code=$(curl --silent --show-error --location --max-time 30 \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              --output /tmp/route.html --write-out '%{http_code}' "$PREVIEW_URL$route")
            test "$code" = "200" || { echo "::error::$route returned HTTP $code"; exit 1; }
          done

          html=$(curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$PREVIEW_URL/")
          grep -q 'yydgdapzlrjmlrjgijkj.supabase.co' <<< "$html"
          if grep -q 'kqokpocajhfbidcxpvhh.supabase.co' <<< "$html"; then
            echo "::error::Production Supabase leaked into Beta 2 Staging"
            exit 1
          fi

          curl --fail --silent --show-error --max-time 30 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            --output /tmp/push.json "$PREVIEW_URL/api/push-config"
          node -e 'const c=require("/tmp/push.json"); if(c.configured!==true) process.exit(1)'

      - name: Revoke temporary QA bypass
        if: always()
        env:
          STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then exit 0; fi
          curl --fail --silent --show-error --request PATCH \
            --url "https://api.vercel.com/v1/projects/$STAGING_VERCEL_PROJECT_ID/protection-bypass?teamId=$VERCEL_ORG_ID" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"revoke\":{\"secret\":\"$VERCEL_AUTOMATION_BYPASS_SECRET\",\"regenerate\":false}}" >/dev/null
