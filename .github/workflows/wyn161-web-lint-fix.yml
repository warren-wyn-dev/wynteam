name: WYN-161 web lint fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/wyn161-web-lint-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch deferred initial Wynii load
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('web/components/wynii-chat.tsx')
          text = path.read_text()
          old = '  useEffect(() => { void load(); }, [load]);'
          new = '''  useEffect(() => {\n    const timer = window.setTimeout(() => { void load(); }, 0);\n    return () => window.clearTimeout(timer);\n  }, [load]);'''
          if old not in text:
              raise SystemExit('expected Wynii load effect not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Validate production web
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run check
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/components/wynii-chat.tsx
          git commit -m "fix(web): defer Wynii initial load for lint"
          git push
