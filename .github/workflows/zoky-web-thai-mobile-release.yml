name: ZOKY store QR LINE add-friend scoped release

# Founder 2026-11-05 ("จัดการให้สำเร็จ พร้อมใช้งานเลย"): store QR visitors
# who are not friends see LINE's native add/unblock prompt before opening
# their store, including guests who have not signed in to ZOKY. When native
# friendship is unavailable (including a missing linked OA), the reviewed
# fallback opens the user-approved @732igmun profile and keeps the original
# store available. No database, Edge Function, dependency or authentication
# change. Base is the live
# automatic-link release (81b6a3a on dpl_J6cmTuDhoWXWr6ks3UuYaT9mPJWK).
# Production reviewers and stage-before-promotion remain required.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Release only the reviewed ZOKY web candidate
        required: true
        type: choice
        default: CANCEL
        options: [CANCEL, ZOKY_QR_LINE_FRIENDSHIP_20261105]

permissions:
  contents: read

concurrency:
  group: zoky-web-thai-mobile-release
  cancel-in-progress: false
  queue: max

env:
  RELEASE_EXPIRES_UTC: "2026-11-14"
  RELEASE_BRANCH: fix/zoky-qr-line-entry-20261105
  RELEASE_SHA: ec3f5f2a5453dd67cb004ee625e2f74177b5d9c2
  PRODUCTION_BASE_SHA: 81b6a3a33a6fb716aa3a670beae9cf327fca220c
  # Confirmed live on all five customer hosts before this release.
  ROLLBACK_DEPLOYMENT: dpl_J6cmTuDhoWXWr6ks3UuYaT9mPJWK
  ROLLBACK_MERCHANT_DEPLOYMENT: dpl_J6cmTuDhoWXWr6ks3UuYaT9mPJWK
  ALLOWED_PATHS: >-
    docs/qa/zoky-store-qr-line-friendship-20261105.md
    web/components/line/line-entry.tsx
    web/lib/i18n/en.ts
    web/lib/line-liff.ts
    web/tests/food-share-links.test.mjs
    web/tests/line-liff.test.mjs
  VERCEL_ORG_ID: team_Kamt1PUT5XKn9MWrF404re1w
  VERCEL_PROJECT_ID: prj_bzoZIUdyxaRvXiSLG1uSfjDsyS5a

jobs:
  guard:
    name: Scope guards (before production review)
    if: github.ref == 'refs/heads/main' && github.repository == 'warren-wyn-dev/wynteam' && inputs.confirmation == 'ZOKY_QR_LINE_FRIENDSHIP_20261105'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          fetch-depth: 0
          persist-credentials: false
      - name: Expiry, pinned SHA, base ancestry and path allowlist
        working-directory: release
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          if [[ "$today" > "$RELEASE_EXPIRES_UTC" ]]; then
            echo "::error::Release expired on $RELEASE_EXPIRES_UTC. A new Founder decision is required."; exit 1
          fi
          tip=$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | cut -f1)
          [ "$tip" = "$RELEASE_SHA" ] || { echo "::error::$RELEASE_BRANCH tip $tip is not the reviewed $RELEASE_SHA"; exit 1; }
          git merge-base --is-ancestor "$PRODUCTION_BASE_SHA" "$RELEASE_SHA" || { echo "::error::Candidate does not contain production base $PRODUCTION_BASE_SHA"; exit 1; }
          changed=$(git diff --name-only "$PRODUCTION_BASE_SHA" "$RELEASE_SHA")
          for path in $changed; do
            case " $ALLOWED_PATHS " in *" $path "*) ;; *) echo "::error::$path is outside the reviewed release"; exit 1 ;; esac
          done
          {
            echo '## Reviewed ZOKY web release'
            echo "- Candidate: $RELEASE_SHA (tip of $RELEASE_BRANCH)"
            echo "- Production base: $PRODUCTION_BASE_SHA"
            echo "- Rollback target: $ROLLBACK_DEPLOYMENT"
            echo "- Expires: $RELEASE_EXPIRES_UTC"
            git diff --stat "$PRODUCTION_BASE_SHA" "$RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  stage:
    name: Stage production artifact (domains unchanged)
    if: github.ref == 'refs/heads/main' && github.repository == 'warren-wyn-dev/wynteam' && inputs.confirmation == 'ZOKY_QR_LINE_FRIENDSHIP_20261105'
    needs: guard
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      url: ${{ steps.stage.outputs.url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_SHA }}
          path: release
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global vercel@63.1.2 --no-audit --no-fund
      - name: Deploy production artifact without assigning domains
        id: stage
        working-directory: release/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::VERCEL_TOKEN is empty'; exit 1; }
          # Upload from the repo root when the project's Root Directory is web/
          # (same rule as tools/merchant_ui_release_ops.mjs upload-root).
          root_dir=$(curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" | jq -r '.rootDirectory // ""')
          if [ "$root_dir" = "web" ]; then cd ..; fi
          # Same runtime flags as the live automatic-link release.
          # A clean build: the cached Flutter SDK from the previous production
          # build has no .git, so build_web.sh's revision check fails on it.
          url=$(vercel deploy --prod --skip-domain --yes --scope warren14 \
            --build-env VERCEL_FORCE_NO_BUILD_CACHE=1 \
            --env ZOKY_MERCHANT_FLUTTER_ENABLED=1 --env ZOKY_LEGACY_FOOD_REDIRECT=0 \
            --meta githubCommitSha="$RELEASE_SHA" --meta githubCommitRef="$RELEASE_BRANCH" \
            --meta githubRepo=wynteam --meta githubOrg=warren-wyn-dev | tail -n1)
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged production artifact (customer domains unchanged): $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify staged artifact over authenticated HTTP
        working-directory: release/web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_URL: ${{ steps.stage.outputs.url }}
        run: |
          set -euo pipefail
          for path in /food /food/login /food/signup /merchant/login /merchant/flutter /maps /line; do
            vercel curl "$path" --deployment "$STAGED_URL" -- --fail --silent --show-error --output /dev/null
          done
          line_assets_dir=$(mktemp -d)
          trap 'rm -rf "$line_assets_dir"' EXIT
          vercel curl /line --deployment "$STAGED_URL" -- --fail --silent --show-error --max-time 30 --output "$line_assets_dir/line.html"
          python3 - "$line_assets_dir" <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path, PurePosixPath
          import re
          import sys

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = set()

              def handle_starttag(self, tag, attrs):
                  src = dict(attrs).get("src") or ""
                  if tag == "script" and re.fullmatch(r"/_next/[A-Za-z0-9_./-]+\.js", src) and ".." not in PurePosixPath(src).parts:
                      self.paths.add(src)

          directory = Path(sys.argv[1])
          parser = Scripts()
          parser.feed((directory / "line.html").read_text())
          if not 1 <= len(parser.paths) <= 64:
              raise SystemExit("::error::Staged /line has no bounded local Next.js script list.")
          (directory / "paths.txt").write_text("\n".join(sorted(parser.paths)) + "\n")
          PY
          line_fallback_found=0
          while IFS= read -r chunk; do
            vercel curl "$chunk" --deployment "$STAGED_URL" -- --fail --silent --show-error --max-time 30 --output "$line_assets_dir/chunk.js"
            if grep -Fq 'https://line.me/R/ti/p/%40732igmun' "$line_assets_dir/chunk.js"; then
              line_fallback_found=1
              break
            fi
          done < "$line_assets_dir/paths.txt"
          [ "$line_fallback_found" = 1 ] || { echo '::error::Staged /line does not contain the approved customer OA fallback'; exit 1; }
          echo '- Staged /line includes the approved @732igmun fallback: PASS' >> "$GITHUB_STEP_SUMMARY"
          vercel curl /merchant/flutter --deployment "$STAGED_URL" -- --fail --silent --show-error --output /tmp/merchant-host.html
          grep -Fq '/merchant/flutter/manifest.webmanifest' /tmp/merchant-host.html
          rm -f /tmp/merchant-host.html
          echo '- /food, /food/login, /food/signup, /merchant/login, /merchant/flutter, /maps, /line: PASS' >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote the verified artifact
    if: github.ref == 'refs/heads/main' && github.repository == 'warren-wyn-dev/wynteam' && inputs.confirmation == 'ZOKY_QR_LINE_FRIENDSHIP_20261105'
    needs: [guard, stage]
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm install --global vercel@63.1.2 --no-audit --no-fund
      - name: Require customer LINE OA configuration before promotion
        run: |
          python3 - <<'PY'
          import base64
          import json
          import sys
          import urllib.request

          liff_id = "2012311758-OEhTuU5V"
          customer_oa_url = "https://line.me/R/ti/p/%40732igmun"
          request = urllib.request.Request(
              f"https://api.line.me/liff/v2/apps/{liff_id}/contextToken",
              headers={"Accept": "application/json", "Content-Type": "application/json", "Origin": "https://zoky.wynos.online"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  token = json.load(response)["contextToken"]
              # Public LIFF configuration only; never log the envelope or token.
              parts = token.split(".")
              if len(parts) != 3:
                  raise ValueError("invalid context token")
              payload = json.loads(base64.urlsafe_b64decode(parts[1] + "=" * (-len(parts[1]) % 4)))
              if payload.get("liffId") != liff_id:
                  raise ValueError("unexpected LIFF app")
              endpoint = payload.get("endpointUrl")
              if endpoint not in ("https://food.wynos.online/line", "https://zoky.wynos.online/line"):
                  raise ValueError("unexpected LIFF endpoint")
              scope = payload.get("scope")
              if not isinstance(scope, list) or not all(isinstance(item, str) for item in scope):
                  raise ValueError("invalid scope")
          except Exception:
              print("::error::Could not verify customer LINE public configuration. Production domains were not changed.")
              sys.exit(1)

          if "profile" not in scope:
              print("::error::Customer LIFF app requires profile scope before promotion.")
              sys.exit(1)
          try:
              with urllib.request.urlopen(urllib.request.Request(customer_oa_url, headers={"Accept": "text/html"}), timeout=20) as response:
                  if response.status != 200:
                      raise ValueError("customer OA URL unavailable")
          except Exception:
              print("::error::Could not verify the approved customer LINE OA URL. Production domains were not changed.")
              sys.exit(1)

          print(json.dumps({"liffId": liff_id, "endpointUrl": endpoint, "hasLinkedBot": payload.get("hasLinkedBot") is True, "scope": scope, "customerOaUrl": customer_oa_url}))
          if payload.get("hasLinkedBot") is not True:
              print("::warning::Customer LINE Login channel has no linked OA. The reviewed @732igmun profile fallback will be used.")
          # External bootstrap does not expose viewType; Full size needs separate verification.
          print("Customer LIFF identity, endpoint, profile scope and approved OA URL: PASS. LIFF Full size is not verified by this check.")
          PY
      - name: Promote and smoke-check public routes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGED_URL: ${{ needs.stage.outputs.url }}
        run: |
          set -euo pipefail
          # Production may have moved (e.g. another release) while this job waited for review.
          # Promote only if every customer host still serves the reviewed rollback target.
          for host in zoky.wynos.online merchant.wynos.online food.wynos.online wynos.online www.wynos.online; do
            expected="$ROLLBACK_DEPLOYMENT"
            [ "$host" = merchant.wynos.online ] && expected="$ROLLBACK_MERCHANT_DEPLOYMENT"
            live=$(curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" | jq -r '.id')
            [ "$live" = "$expected" ] || { echo "::error::$host serves $live, not the reviewed base $expected. Production changed while awaiting review."; exit 1; }
          done
          vercel promote "$STAGED_URL" --yes --scope warren14
          for url in https://zoky.wynos.online/ https://zoky.wynos.online/food/login https://merchant.wynos.online/merchant/login https://merchant.wynos.online/merchant/flutter https://food.wynos.online/ https://wynos.online/ https://food.wynos.online/line https://merchant.wynos.online/line; do
            curl --fail --silent --show-error --location --max-time 30 --output /dev/null "$url"
          done
          # Verify the exact entry that previously displayed the legacy UI.
          entry_headers=$(mktemp)
          entry_status=$(curl --silent --show-error --max-time 30 --dump-header "$entry_headers" --output /dev/null --write-out '%{http_code}' 'https://merchant.wynos.online/merchant?order=entry-probe')
          [ "$entry_status" = "307" ] || { echo '::error::Merchant entry did not redirect to the new UI'; exit 1; }
          tr -d '\r' < "$entry_headers" | grep -Eiq '^location: (https://merchant\.wynos\.online)?/merchant/flutter\?order=entry-probe$' || { echo '::error::Merchant entry lost its new UI destination or query'; exit 1; }
          rm -f "$entry_headers"
          {
            echo '## ZOKY web production release verified'
            echo "- Promoted artifact: $STAGED_URL"
            echo '- Public ZOKY, Merchant, Food, Social and /line routes: HTTP PASS'
            echo '- No database or Edge Function deployment. No automatic rollback.'
            echo "- On regression: Vercel Instant Rollback to $ROLLBACK_DEPLOYMENT (Merchant previously $ROLLBACK_MERCHANT_DEPLOYMENT)."
          } >> "$GITHUB_STEP_SUMMARY"
