name: Dispatch production web deploy now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-web-now.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing production deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --repo "$GITHUB_REPOSITORY" --ref main
