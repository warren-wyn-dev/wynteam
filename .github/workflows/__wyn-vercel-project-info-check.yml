name: TEMP -- check Vercel project analytics/speed-insights status

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Fetch project info
        run: |
          set -euo pipefail
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          TOKEN=$(clean "$VERCEL_TOKEN")
          ORG=$(clean "$VERCEL_ORG_ID")
          PROJECT=$(clean "$VERCEL_PROJECT_ID")

          echo "=== GET project (with teamId) ==="
          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' "https://api.vercel.com/v9/projects/$PROJECT?teamId=$ORG" \
            -H "Authorization: Bearer $TOKEN")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "=== retry without teamId (personal account) ==="
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' "https://api.vercel.com/v9/projects/$PROJECT" \
              -H "Authorization: Bearer $TOKEN")
            echo "HTTP $code"
          fi
          python3 -m json.tool < /tmp/resp.json
