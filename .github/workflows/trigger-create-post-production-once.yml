name: Trigger Create Post production deploy once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-create-post-production-once.yml

permissions:
  contents: write
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Trigger production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref main

      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/trigger-create-post-production-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trigger-create-post-production-once.yml
          git commit -m "chore: remove Create Post deploy trigger"
          git push origin HEAD:main
