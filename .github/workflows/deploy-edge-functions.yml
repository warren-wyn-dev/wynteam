name: Deploy Supabase Edge Function

# Manual-only, same reasoning as deploy-web.yml: shipping server-side
# code is a decision, not something that should ride along with every
# merge to main.
#
# Why this workflow exists at all: until Beta4, Edge Functions were
# deployed by hand with the Supabase CLI from someone's own machine.
# That is how `send-push-notification` came to be changed in Beta4
# (notification_id + per-platform collapse keys, so a webhook retry
# replaces a notification instead of stacking a second copy) and
# shipped nowhere -- the code was merged and deployed to the web, and
# the function running in production stayed the old one. A change that
# can only be deployed from one person's laptop is a change that gets
# forgotten.
#
# `ci.yml` already runs `deno check` + `deno test` on every PR. This
# runs them again immediately before deploying, against the exact ref
# being shipped -- CI proves the code was good when it merged, this
# proves it is good right now.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Which Edge Function to deploy"
        required: true
        default: send-push-notification
        type: choice
        options:
          - send-push-notification
          - location-search

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Gate: never deploy a function whose own tests do not pass.
      # `deno test` is a no-op for a function with no test file
      # (location-search), which is fine -- `deno check` still runs.
      - name: Verify the function before shipping it
        working-directory: supabase/functions/${{ inputs.function }}
        run: |
          deno check index.ts
          if ls ./*.test.ts >/dev/null 2>&1; then
            deno test
          else
            echo "No test file for ${{ inputs.function }} -- deno check only."
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The project ref is the subdomain of SUPABASE_URL
      # (https://<ref>.supabase.co), so the only NEW secret this
      # workflow needs is SUPABASE_ACCESS_TOKEN -- a Supabase personal
      # access token from https://supabase.com/dashboard/account/tokens.
      # Deriving the ref instead of asking for a second secret keeps the
      # one-time setup to a single step, and keeps the ref in exactly
      # one place rather than two that can disagree.
      #
      # Same trailing-newline/whitespace guard deploy-web.yml applies to
      # its own secrets -- a value pasted into the GitHub Secrets UI
      # (especially on mobile) can silently carry a trailing newline.
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\n\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          # Pre-flight, because the Supabase CLI's own message for this
          # ("Access token not provided") says the token is missing but
          # not *why* -- and every reason is a different fix. This turns
          # one generic line into the actual checklist. Learned the hard
          # way: the first two runs of this workflow both died here.
          CLEAN_TOKEN=$(clean "$SUPABASE_ACCESS_TOKEN")
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN resolved to an empty string, so the secret is not reaching this workflow."
            echo "::error::GitHub masks a secret that exists as '***' in the env block above; an empty value means no secret was found under that exact name."
            echo "::error::Check, in this order:"
            echo "::error::  1. Name is exactly SUPABASE_ACCESS_TOKEN (no trailing space, no typo, case-sensitive)."
            echo "::error::  2. It is a *Repository* secret (Settings -> Secrets and variables -> Actions -> Repository secrets)."
            echo "::error::     An *Environment* secret is invisible unless this job declares 'environment:', and this job does not."
            echo "::error::     A *Dependabot* secret is a separate store that Actions never reads."
            echo "::error::  3. It is on warren-wyn-dev/wynteam itself, not another repo or the org with this repo unselected."
            echo "::error::  4. Get the value from https://supabase.com/dashboard/account/tokens -- a personal access token (sbp_...),"
            echo "::error::     NOT the anon/publishable key and NOT the service_role key; neither can deploy a function."
            exit 1
          fi

          CLEAN_URL=$(clean "$SUPABASE_URL")
          PROJECT_REF=$(printf '%s' "$CLEAN_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')

          if [ -z "$PROJECT_REF" ] || [ "$PROJECT_REF" = "$CLEAN_URL" ]; then
            echo "::error::Could not derive the project ref from SUPABASE_URL."
            echo "::error::Expected https://<ref>.supabase.co"
            exit 1
          fi
          echo "Deploying ${{ inputs.function }} to project $PROJECT_REF"

          # Deliberately NOT passing --no-verify-jwt. The default (JWT
          # verification on) is what these functions already run under,
          # and a Supabase Database Webhook created through the
          # Dashboard sends an Authorization header, so it satisfies it.
          # Turning verification off would make the endpoint callable by
          # anyone on the internet -- not a change to make as a side
          # effect of automating a deploy.
          SUPABASE_ACCESS_TOKEN="$CLEAN_TOKEN" \
            supabase functions deploy "${{ inputs.function }}" --project-ref "$PROJECT_REF"
