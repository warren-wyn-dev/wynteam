<!DOCTYPE html>
<html>
<head>
  <!-- Google AdSense site verification -->
  <meta name="google-adsense-account" content="ca-pub-9156145951260801">

  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- viewport-fit=cover is what makes iOS expose safe-area-inset-* to
       the page at all -- without it, Flutter's own SafeArea widgets see
       a zero top inset and page content renders straight under the iOS
       status bar once WYNOS is opened standalone from an "Add to Home
       Screen" icon (manifest.json's own "display": "standalone"). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WYNOS — mobile social app for Gen Z">

  <!--
    Open Graph / Twitter Card (WYN-113): shown by Facebook/LINE/Discord/X
    etc. when someone shares a wynos.online link -- without these tags
    the link renders with no preview card at all. og-image.png is a
    static 1200x630 asset (the standard uncropped ratio for these
    platforms); there is no per-post dynamic OG here, since this is one
    Flutter Web SPA's single static index.html, not server-rendered per
    URL. See .wyn/docs/design/wyn-113-og-share-preview-cards.md.
  -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://wynos.online/">
  <meta property="og:title" content="WYNOS — สร้างชุมชนของคุณเอง">
  <meta property="og:description" content="โพสต์รูป แชร์เรื่องราว และตั้ง Club กับคนที่ชอบเหมือนกัน ทั้งหมดในที่เดียว">
  <meta property="og:image" content="https://wynos.online/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="WYNOS — สร้างชุมชนของคุณเอง">
  <meta name="twitter:description" content="โพสต์รูป แชร์เรื่องราว และตั้ง Club กับคนที่ชอบเหมือนกัน ทั้งหมดในที่เดียว">
  <meta name="twitter:image" content="https://wynos.online/og-image.png">

  <!-- iOS meta tags & icons -->
  <!-- apple-mobile-web-app-capable (not just the generic
       mobile-web-app-capable below, which iOS Safari ignores) is the
       other half of the safe-area fix above -- both are required for
       iOS to treat the home-screen icon as a real standalone app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="WYNOS Beta">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <style>
    html,
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Thonburi", "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
  </style>

  <title>WYNOS Beta</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
