name: wyn
description: WYN — mobile social app for Gen Z (V0.1)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  # Used by PopFeedScreen to remember the user's last mute/unmute choice
  # across app launches (see .wyn/docs/design/wyn-006-pop.md, Screen 1)
  # -- also used directly by test/support/fake_supabase_session.dart to
  # fake a signed-in session.
  shared_preferences: ^2.2.0
  # WYN-016 (Push Notification) -- see PushNotificationService and
  # .wyn/docs/design/wyn-016-push-notifications.md for why adding these
  # here is safe even before Founder provides real Firebase config files:
  # Firebase.initializeApp() is only ever called wrapped in a try/catch
  # in main.dart, and every PushNotificationService method no-ops if
  # initialization didn't succeed. Native platform files (android/,
  # ios/) are deliberately NOT touched in this round -- applying the
  # google-services Gradle plugin without a real google-services.json
  # would break Android builds outright.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # WYN-072 (WYNOS Design Reference Rollout, Screen 01 -- Home Feed):
  # SPEC.md Section 2 requires Fraunces (wordmark/empty-state headline
  # only) and Inter (everywhere else) -- neither ships as a system font
  # on iOS/Android, and neither was already bundled as an asset, so
  # google_fonts is added here rather than silently falling back to the
  # platform system font WynTypography currently uses. Scoped to
  # app/lib/core/design/wynos_home_tokens.dart -- WynTypography/WynTheme
  # (DS-001) are untouched, so every other screen keeps the system font
  # until its own turn in the design-reference rollout.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Used directly by test/support/fake_video_player_platform.dart to fake
  # VideoPlayerController's platform implementation (real platform channel
  # has no handler in the test env) -- was only a transitive dependency of
  # video_player before.
  video_player_platform_interface: ^6.2.0

flutter:
  uses-material-design: true
