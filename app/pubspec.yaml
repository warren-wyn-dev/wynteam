name: wyn
description: WYN — mobile social app for Gen Z (V0.1)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  share_plus: ^13.3.0
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  # Used by PopFeedScreen to remember the user's last mute/unmute choice
  # across app launches (see .wyn/docs/design/wyn-006-pop.md, Screen 1)
  # -- also used directly by test/support/fake_supabase_session.dart to
  # fake a signed-in session.
  shared_preferences: ^2.2.0
  # WYN-016 (Push Notification) -- see PushNotificationService and
  # .wyn/docs/design/wyn-016-push-notifications.md for why adding these
  # here is safe even before Founder provides real Firebase config files:
  # Firebase.initializeApp() is only ever called wrapped in a try/catch
  # in main.dart, and every PushNotificationService method no-ops if
  # initialization didn't succeed. Native platform files (android/,
  # ios/) are deliberately NOT touched in this round -- applying the
  # google-services Gradle plugin without a real google-services.json
  # would break Android builds outright.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Multi-account switching (account_switcher/): stores each added
  # account's Supabase refresh token in the platform Keychain/Keystore --
  # deliberately not shared_preferences (used elsewhere in this app for
  # non-sensitive prefs), since these are real, long-lived credentials.
  flutter_secure_storage: ^11.0.0
  # WYN-098 (Location Check-in) -- "ใช้ตำแหน่งปัจจุบันของฉัน" in the new
  # LocationPickerSheet. Only used for the device's own GPS permission
  # request + one-shot position read; the actual place lookup (search/
  # reverse geocoding) goes through the new `location-search` Edge
  # Function (LocationIQ), never this package directly.
  geolocator: ^13.0.2
  # "Add to Home Screen" banner (AddToHomeScreenBanner) -- only ever
  # imported from pwa_display_mode_web.dart, itself only ever reached
  # via a conditional import guarded on `dart.library.js_interop` (a
  # web-only compile target), so this dependency is inert on
  # Android/iOS builds. Already present transitively (supabase_flutter
  # and others depend on it); declared directly here because
  # pwa_display_mode_web.dart imports it by name, and pub only allows
  # importing a package a pubspec actually lists as a dependency of its
  # own, not merely a transitive one.
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Used directly by test/support/fake_video_player_platform.dart to fake
  # VideoPlayerController's platform implementation (real platform channel
  # has no handler in the test env) -- was only a transitive dependency of
  # video_player before.
  video_player_platform_interface: ^6.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/wynos_logo_mark.png
