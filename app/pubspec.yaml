name: wyn
description: WYN — mobile social app for Gen Z (V0.1)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Used directly by test/support/fake_supabase_session.dart to fake a
  # signed-in session (Supabase.initialize needs it to avoid a
  # MissingPluginException in the test env) -- was only a transitive
  # dependency of supabase_flutter before.
  shared_preferences: ^2.2.0

flutter:
  uses-material-design: true
