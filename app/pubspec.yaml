name: wyn
description: WYN — mobile social app for Gen Z (V0.1)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  cupertino_icons: ^1.0.6
  image_picker: ^1.1.2
  # WYN-025 (Drop Composer Polish, R1) -- dart:ui's ImageByteFormat has no
  # JPEG option (only png/rawRgba/rawStraightRgba/rawUnmodified), so
  # square_crop.dart needs this to re-encode the cropped square as JPEG
  # instead of PNG. See .wyn/docs/design/wyn-025-drop-composer-polish.md.
  image: ^4.9.1
  share_plus: ^13.3.0
  # WYN-024 -- opening a profile's Website link in an external browser.
  # Previously only a transitive dependency of share_plus; declared
  # directly now that app code imports it (view_profile_screen.dart), so
  # its version isn't pinned to share_plus's transitive resolution by
  # coincidence.
  url_launcher: ^6.3.0
  video_player: ^2.9.2
  video_thumbnail: ^0.5.3
  # Used by PopFeedScreen to remember the user's last mute/unmute choice
  # across app launches (see .wyn/docs/design/wyn-006-pop.md, Screen 1)
  # -- also used directly by test/support/fake_supabase_session.dart to
  # fake a signed-in session.
  shared_preferences: ^2.2.0
  # WYN-016 (Push Notification) -- see PushNotificationService and
  # .wyn/docs/design/wyn-016-push-notifications.md for why adding these
  # here is safe even before Founder provides real Firebase config files:
  # Firebase.initializeApp() is only ever called wrapped in a try/catch
  # in main.dart, and every PushNotificationService method no-ops if
  # initialization didn't succeed. Native platform files (android/,
  # ios/) are deliberately NOT touched in this round -- applying the
  # google-services Gradle plugin without a real google-services.json
  # would break Android builds outright.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Used directly by test/support/fake_video_player_platform.dart to fake
  # VideoPlayerController's platform implementation (real platform channel
  # has no handler in the test env) -- was only a transitive dependency of
  # video_player before.
  video_player_platform_interface: ^6.2.0
  # WYN-025 -- used directly by test/support/fake_image_picker_platform.dart
  # to fake ImagePicker.pickImage()'s platform implementation (real
  # platform channel has no handler in the test env, same reason as
  # video_player_platform_interface above) -- was only a transitive
  # dependency of image_picker before.
  image_picker_platform_interface: ^2.11.1

# WYN Debug Engineer (2026-08-17) -- pub.dev's video_thumbnail 0.5.6 (the
# latest published version, matching the `^0.5.3` constraint above) ships
# an android/build.gradle that calls the removed jcenter() repository
# method and applies AGP via the legacy `apply plugin:` syntax, so it
# fails to build under this project's AGP 9.1.0
# (app/android/settings.gradle.kts). No newer release fixes this. Pinned
# to a local vendored copy with only android/build.gradle patched (Dart
# API, Android/iOS native code otherwise byte-for-byte identical) --
# see app/packages/video_thumbnail/NOTICE.md for full details and the
# removal plan once upstream publishes a fix.
dependency_overrides:
  video_thumbnail:
    path: packages/video_thumbnail

flutter:
  uses-material-design: true
