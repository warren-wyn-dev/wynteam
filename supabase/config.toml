[functions.stripe-webhook]
verify_jwt = false

[functions.food-unpaid-timeout]
# Internal pg_cron caller is authenticated by a Vault-backed x-wynos-cron-key,
# verified against a service-role-only RPC. Browser calls always return 401.
verify_jwt = false

[functions.food-stripe-checkout]
verify_jwt = true

[functions.food-stripe-cancel]
verify_jwt = true

[functions.merchant-stripe-connect]
verify_jwt = true

[functions.merchant-stripe-refund]
verify_jwt = true

[functions.food-auto-refund]
# Dedicated Vault key verified through a service-role-only RPC.
verify_jwt = false

[functions.food-finance-refund]
verify_jwt = false

[functions.food-finance-sync]
verify_jwt = false

[functions.food-finance-payout]
# Dedicated Cron key or authenticated finance administrator, checked in handler.
verify_jwt = false

[functions.send-food-promotion]
# Vault-key-authenticated scheduler call (not a browser/JWT request).
# The handler verifies a dedicated long random key using a service-role-only RPC.
verify_jwt = false

# wynos-maps-geocode authenticates callers itself (apikey header); guests send
# the publishable key, which is not a JWT. Matches the live setting (Verify JWT
# OFF, read by the Founder on 2026-10-18); without this entry a CLI deploy
# would turn JWT verification on and break guest geocoding.
[functions.wynos-maps-geocode]
verify_jwt = false
