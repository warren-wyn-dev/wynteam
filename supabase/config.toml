[functions.stripe-webhook]
verify_jwt = false

[functions.food-unpaid-timeout]
# Internal pg_cron caller is authenticated by a Vault-backed x-wynos-cron-key,
# verified against a service-role-only RPC. Browser calls always return 401.
verify_jwt = false

[functions.food-stripe-checkout]
verify_jwt = true

[functions.food-stripe-cancel]
verify_jwt = true

[functions.merchant-stripe-connect]
verify_jwt = true

[functions.merchant-stripe-refund]
verify_jwt = true

[functions.admin-merchant-menu-image]
# Existing user JWT plus live Auth and merchant:edit RPC checks. Only the
# trusted Edge publisher writes immutable, normalized menu images.
verify_jwt = true
# Run tools/prepare_admin_menu_image_vendor.py before local checks/bundling.
# Include only the selected WASM and its license notices, never the npm package.
static_files = ["./functions/admin-merchant-menu-image/_vendor/magick.wasm", "./functions/admin-merchant-menu-image/_vendor/LICENSE", "./functions/admin-merchant-menu-image/_vendor/NOTICE"]

[functions.send-food-promotion]
# Vault-key-authenticated scheduler call (not a browser/JWT request).
# The handler verifies a dedicated long random key using a service-role-only RPC.
verify_jwt = false
