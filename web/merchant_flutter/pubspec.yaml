name: zoky_merchant
description: Zoky Merchant restaurant management app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  url_launcher: 6.3.3
  web: 1.1.1
  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/zoky-logo-pink-transparent.png
    - assets/brand/merchant-tools-3d.webp
  # Founder 2026-11-01: bundle the Thai text font so startup does not wait for
  # a runtime Google Fonts fallback. SIL OFL 1.1, see assets/fonts/NotoSansThai-OFL.txt.
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
