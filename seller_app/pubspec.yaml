name: zoky_seller
description: ZOKY Sellers by WYN — seller app for ZOKY Marketplace (V1)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  cupertino_icons: ^1.0.6
  # Multi-image picker for SellerProductFormScreen -- same version/API
  # `app/`'s CreateClubPostScreen/CreateDropScreen already use.
  image_picker: ^1.1.2
  # Not used for any persistent seller preference yet -- kept only because
  # test/support/fake_supabase_session.dart (mirrored from app/) needs it to
  # fake a signed-in session's local storage. See app/pubspec.yaml for the
  # same comment on the WYN Social side.
  shared_preferences: ^2.2.0
  # WYN-016 (Push Notification) -- see app/pubspec.yaml's identical
  # comment: safe to add before Founder provides real Firebase config
  # files because Firebase.initializeApp() is only ever called wrapped
  # in a try/catch in main.dart, and every PushNotificationService
  # method no-ops if initialization didn't succeed. Native platform
  # files (android/, ios/) are deliberately NOT touched this round.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
