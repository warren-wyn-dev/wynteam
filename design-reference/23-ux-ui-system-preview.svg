<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">WYNOS UX/UI system preview</title>
  <desc id="desc">Mobile and desktop mockups showing the approved Sapphire visual language, reusable controls, feed cards, empty and error states.</desc>
  <rect width="1600" height="1000" fill="#F6F7F9"/>
  <style>
    .t{font-family:Arial,'Noto Sans Thai',sans-serif;fill:#12120F}.muted{fill:#667085}.blue{fill:#1B3A6B}.paper{fill:#FFFFFF}.line{stroke:#D8DCE3;stroke-width:1}.h1{font-size:30px;font-weight:700}.h2{font-size:20px;font-weight:700}.body{font-size:16px}.meta{font-size:13px}.button{font-size:15px;font-weight:700}.shadow{filter:url(#s)}
  </style>
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#101828" flood-opacity=".10"/></filter></defs>
  <text x="70" y="64" class="t h1">WYNOS · UX/UI System Preview</text>
  <text x="70" y="94" class="t body muted">Refinement of the existing Sapphire system — not a new visual direction</text>

  <!-- mobile -->
  <rect x="70" y="130" width="390" height="800" rx="34" class="paper shadow"/>
  <text x="94" y="176" class="t meta">9:41</text><text x="265" y="176" class="t h2" text-anchor="middle">WYNOS</text>
  <circle cx="425" cy="169" r="18" fill="#EEF2F7"/><path d="M418 169h14M425 162v14" stroke="#1B3A6B" stroke-width="2"/>
  <text x="94" y="224" class="t button blue">สำหรับคุณ</text><text x="200" y="224" class="t button muted">ติดตาม</text><text x="292" y="224" class="t button muted">Club</text>
  <rect x="92" y="238" width="76" height="3" rx="2" class="blue"/><line x1="70" y1="250" x2="460" y2="250" class="line"/>
  <circle cx="112" cy="286" r="20" fill="#D7E1EE"/><text x="144" y="282" class="t button">wynos.online</text><text x="144" y="302" class="t meta muted">2 นาที · Public</text>
  <text x="94" y="342" class="t body">พื้นที่ของคนที่ชอบสิ่งเดียวกัน</text><text x="94" y="366" class="t body blue">#WYNOS #community</text>
  <rect x="94" y="390" width="342" height="244" rx="12" fill="#DCE6F1"/>
  <circle cx="265" cy="490" r="44" fill="#1B3A6B" opacity=".9"/><path d="M250 490l22-14v28z" fill="white"/>
  <g class="t meta"><text x="100" y="675">♡ 128</text><text x="187" y="675">○ 24</text><text x="270" y="675">↻ 8</text><text x="410" y="675">•••</text></g>
  <line x1="94" y1="705" x2="436" y2="705" class="line"/>
  <rect x="94" y="730" width="342" height="58" rx="12" fill="#F8FAFC" stroke="#D8DCE3"/><text x="116" y="754" class="t button">โหลดเนื้อหาไม่สำเร็จ</text><text x="116" y="776" class="t meta muted">เนื้อหาเดิมยังอยู่ · ลองอีกครั้ง</text>
  <rect x="70" y="846" width="390" height="84" fill="#FFFFFF"/><line x1="70" y1="846" x2="460" y2="846" class="line"/>
  <g class="t meta" text-anchor="middle"><text x="110" y="890">Home</text><text x="181" y="890">Search</text><text x="349" y="890">Alerts</text><text x="420" y="890">Profile</text></g>
  <circle cx="265" cy="875" r="28" class="blue"/><path d="M255 875h20M265 865v20" stroke="white" stroke-width="3"/>

  <!-- desktop shell -->
  <rect x="510" y="130" width="1020" height="800" rx="22" class="paper shadow"/>
  <rect x="510" y="130" width="210" height="800" rx="22" fill="#F9FAFB"/><text x="546" y="184" class="t h2">WYNOS</text>
  <g class="t body"><text x="550" y="250" class="blue">●  Home</text><text x="550" y="302">⌕  Search</text><text x="550" y="354">◇  Notifications</text><text x="550" y="406">○  Profile</text></g>
  <rect x="542" y="850" width="146" height="48" rx="12" class="blue"/><text x="615" y="880" class="button" fill="white" text-anchor="middle">+ สร้างโพสต์</text>
  <line x1="720" y1="130" x2="720" y2="930" class="line"/>
  <text x="758" y="184" class="t h1">Home</text><text x="758" y="215" class="t body muted">Primary rail 680px · readable and centered</text>
  <rect x="758" y="250" width="580" height="420" rx="16" fill="#FFFFFF" stroke="#D8DCE3"/>
  <circle cx="798" cy="296" r="20" fill="#D7E1EE"/><text x="830" y="292" class="t button">community.th</text><text x="830" y="312" class="t meta muted">เมื่อสักครู่</text>
  <text x="782" y="356" class="t body">ทุกหน้าจอใช้ spacing, typography และ state เดียวกัน</text>
  <rect x="782" y="382" width="532" height="210" rx="12" fill="#E7EDF4"/>
  <g class="t meta"><text x="788" y="632">♡ 48</text><text x="885" y="632">○ 12</text><text x="980" y="632">↻ 3</text><text x="1285" y="632">•••</text></g>

  <!-- component panel -->
  <rect x="1370" y="250" width="128" height="570" rx="16" fill="#F8FAFC" stroke="#D8DCE3"/>
  <text x="1388" y="284" class="t button">States</text>
  <rect x="1388" y="308" width="92" height="44" rx="12" class="blue"/><text x="1434" y="335" class="button" fill="white" text-anchor="middle">Primary</text>
  <rect x="1388" y="368" width="92" height="44" rx="12" fill="white" stroke="#1B3A6B"/><text x="1434" y="395" class="t button blue" text-anchor="middle">Secondary</text>
  <rect x="1388" y="428" width="92" height="52" rx="12" fill="white" stroke="#1B3A6B" stroke-width="2"/><text x="1400" y="450" class="t meta muted">Label</text><text x="1400" y="470" class="t body">Focused</text>
  <rect x="1388" y="500" width="92" height="78" rx="12" fill="white" stroke="#D8DCE3"/><circle cx="1434" cy="528" r="10" fill="none" stroke="#1B3A6B" stroke-width="3" stroke-dasharray="12 7"/><text x="1434" y="558" class="t meta" text-anchor="middle">Loading</text>
  <rect x="1388" y="598" width="92" height="86" rx="12" fill="white" stroke="#D8DCE3"/><text x="1434" y="628" class="t h2" text-anchor="middle">◎</text><text x="1434" y="651" class="t meta" text-anchor="middle">Empty</text><text x="1434" y="670" class="t meta blue" text-anchor="middle">เริ่มต้น</text>
  <rect x="1388" y="704" width="92" height="86" rx="12" fill="#FFF7F6" stroke="#DC2626"/><text x="1434" y="735" class="t h2" text-anchor="middle" fill="#DC2626">!</text><text x="1434" y="758" class="t meta" text-anchor="middle">Error</text><text x="1434" y="777" class="t meta blue" text-anchor="middle">ลองใหม่</text>
  <text x="758" y="722" class="t h2">Responsive principle</text><text x="758" y="752" class="t body muted">Mobile remains focused. Wide screens gain structure, not stretched content.</text>
  <text x="758" y="804" class="t h2">Accessibility principle</text><text x="758" y="834" class="t body muted">44–48px targets · visible focus · text scale resilience · semantic names</text>
  <text x="70" y="974" class="t meta muted">Placeholder media is intentional. No new feature, gradient, color, or backend behavior is proposed.</text>
</svg>
